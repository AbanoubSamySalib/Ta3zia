أَنَّكَ أَنْتَ فَعَلْتَ بِالسِّرِّ وَأَنَا أَفْعَلُ هذَا الأَمْرَ قُدَّامَ جَمِيعِ إِسْرَائِيلَ وَقُدَّامَ الشَّمْسِ».","13":"فَقَالَ دَاوُدُ لِنَاثَانَ: «قَدْ أَخْطَأْتُ إِلَى الرَّبِّ». فَقَالَ نَاثَانُ لِدَاوُدَ: «الرَّبُّ أَيْضًا قَدْ نَقَلَ عَنْكَ خَطِيَّتَكَ. لاَ تَمُوتُ.","15":"وَذَهَبَ نَاثَانُ إِلَى بَيْتِهِ. وَضَرَبَ الرَّبُّ الْوَلَدَ الَّذِي وَلَدَتْهُ امْرَأَةُ أُورِيَّا لِدَاوُدَ فَثَقِلَ.","16":"فَسَأَلَ دَاوُدُ اللهَ مِنْ أَجْلِ الصَّبِيِّ، وَصَامَ دَاوُدُ صَوْمًا، وَدَخَلَ وَبَاتَ مُضْطَجِعًا عَلَى الأَرْضِ.","17":"فَقَامَ شُيُوخُ بَيْتِهِ عَلَيْهِ لِيُقِيمُوهُ عَنِ الأَرْضِ فَلَمْ يَشَأْ، وَلَمْ يَأْكُلْ مَعَهُمْ خُبْزًا.","18":"وَكَانَ فِي الْيَوْمِ السَّابعِ أَنَّ الْوَلَدَ مَاتَ، فَخَافَ عَبِيدُ دَاوُدَ أَنْ يُخْبِرُوهُ بِأَنَّ الْوَلَدَ قَدْ مَاتَ لأَنَّهُمْ قَالُوا: «هُوَذَا لَمَّا كَانَ الْوَلَدُ حَيًّا كَلَّمْنَاهُ فَلَمْ يَسْمَعْ لِصَوْتِنَا. فَكَيْفَ نَقُولُ لَهُ: قَدْ مَاتَ الْوَلَدُ؟ يَعْمَلُ أَشَرَّ!».","19":"وَرَأَى دَاوُدُ عَبِيدَهُ يَتَنَاجَوْنَ، فَفَطِنَ دَاوُدُ أَنَّ الْوَلَدَ قَدْ مَاتَ. فَقَالَ دَاوُدُ لِعَبِيدِهِ: «هَلْ مَاتَ الْوَلَدُ؟» فَقَالُوا: «مَاتَ».","20":"فَقَامَ دَاوُدُ عَنِ الأَرْضِ وَاغْتَسَلَ وَادَّهَنَ وَبَدَّلَ ثِيَابَهُ وَدَخَلَ بَيْتَ الرَّبِّ وَسَجَدَ، ثُمَّ جَاءَ إِلَى بَيْتِهِ وَطَلَبَ فَوَضَعُوا لَهُ خُبْزًا فَأَكَلَ.","21":"فَقَالَ لَهُ عَبِيدُهُ: «مَا هذَا الأَمْرُ الَّذِي فَعَلْتَ؟ لَمَّا كَانَ الْوَلَدُ حَيًّا صُمْتَ وَبَكَيْتَ، وَلَمَّا مَاتَ الْوَلَدُ قُمْتَ وَأَكَلْتَ خُبْزًا».","22":"فَقَالَ: «لَمَّا كَانَ الْوَلَدُ حَيًّا صُمْتُ وَبَكَيْتُ لأَنِّي قُلْتُ: مَنْ يَعْلَمُ؟ رُبَّمَا يَرْحَمُنِي الرَّبُّ وَيَحْيَا الْوَلَدُ.","23":"وَالآنَ قَدْ مَاتَ، فَلِمَاذَا أَصُومُ؟ هَلْ أَقْدِرُ أَنْ أَرُدَّهُ بَعْدُ؟ أَنَا ذَاهِبٌ إِلَيْهِ وَأَمَّا هُوَ فَلاَ يَرْجعُ إِلَيَّ»."},"42.11":{"25":"قَالَ لَهَا يَسُوعُ:«أَنَا هُوَ الْقِيَامَةُ وَالْحَيَاةُ. مَنْ آمَنَ بِي وَلَوْ مَاتَ فَسَيَحْيَا،","26":"وَكُلُّ مَنْ كَانَ حَيًّا وَآمَنَ بِي فَلَنْ يَمُوتَ إِلَى الأَبَدِ. أَتُؤْمِنِينَ بِهذَا؟»","35":"بَكَى يَسُوعُ.","32":"فَمَرْيَمُ لَمَّا أَتَتْ إِلَى حَيْثُ كَانَ يَسُوعُ وَرَأَتْهُ، خَرَّتْ عِنْدَ رِجْلَيْهِ قَائِلَةً لَهُ:«يَا سَيِّدُ، لَوْ كُنْتَ ههُنَا لَمْ يَمُتْ أَخِي!».","33":"فَلَمَّا رَآهَا يَسُوعُ تَبْكِي، وَالْيَهُودُ الَّذِينَ جَاءُوا مَعَهَا يَبْكُونَ، انْزَعَجَ بِالرُّوحِ وَاضْطَرَبَ،","34":"وَقَالَ:«أَيْنَ وَضَعْتُمُوهُ؟» قَالُوا لَهُ:«يَا سَيِّدُ، تَعَالَ وَانْظُرْ».","36":"فَقَالَ الْيَهُودُ:«انْظُرُوا كَيْفَ كَانَ يُحِبُّهُ!».","37":"وَقَالَ بَعْضٌ مِنْهُمْ:«أَلَمْ يَقْدِرْ هذَا الَّذِي فَتَحَ عَيْنَيِ الأَعْمَى أَنْ يَجْعَلَ هذَا أَيْضًا لاَ يَمُوتُ؟».","38":"فَانْزَعَجَ يَسُوعُ أَيْضًا فِي نَفْسِهِ وَجَاءَ إِلَى الْقَبْرِ، وَكَانَ مَغَارَةً وَقَدْ وُضِعَ عَلَيْهِ حَجَرٌ.","39":"قَالَ يَسُوعُ:«ارْفَعُوا الْحَجَرَ!». قَالَتْ لَهُ مَرْثَا، أُخْتُ الْمَيْتِ:«يَاسَيِّدُ، قَدْ أَنْتَنَ لأَنَّ لَهُ أَرْبَعَةَ أَيَّامٍ».","40":"قَالَ لَهَا يَسُوعُ:«أَلَمْ أَقُلْ لَكِ: إِنْ آمَنْتِ تَرَيْنَ مَجْدَ اللهِ؟».","41":"فَرَفَعُوا الْحَجَرَ حَيْثُ كَانَ الْمَيْتُ مَوْضُوعًا، وَرَفَعَ يَسُوعُ عَيْنَيْهِ إِلَى فَوْقُ، وَقَالَ:«أَيُّهَا الآبُ، أَشْكُرُكَ لأَنَّكَ سَمِعْتَ لِي،","42":"وَأَنَا عَلِمْتُ أَنَّكَ فِي كُلِّ حِينٍ تَسْمَعُ لِي. وَلكِنْ لأَجْلِ هذَا الْجَمْعِ الْوَاقِفِ قُلْتُ، لِيُؤْمِنُوا أَنَّكَ أَرْسَلْتَنِي».","43":"وَلَمَّا قَالَ هذَا صَرَخَ بِصَوْتٍ عَظِيمٍ:«لِعَازَرُ، هَلُمَّ خَارِجًا!»","44":"فَخَرَجَ الْمَيْتُ وَيَدَاهُ وَرِجْلاَهُ مَرْبُوطَاتٌ بِأَقْمِطَةٍ، وَوَجْهُهُ مَلْفُوفٌ بِمِنْدِيل. فَقَالَ لَهُمْ يَسُوعُ:«حُلُّوهُ وَدَعُوهُ يَذْهَبْ».","21":"فَقَالَتْ مَرْثَا لِيَسُوعَ:«يَا سَيِّدُ، لَوْ كُنْتَ ههُنَا لَمْ يَمُتْ أَخِي!","22":"لكِنِّي الآنَ أَيْضًا أَعْلَمُ أَنَّ كُلَّ مَا تَطْلُبُ مِنَ اللهِ يُعْطِيكَ اللهُ إِيَّاهُ».","23":"قَالَ لَهَا يَسُوعُ:«سَيَقُومُ أَخُوكِ».","24":"قَالَتْ لَهُ مَرْثَا:«أَنَا أَعْلَمُ أَنَّهُ سَيَقُومُ فِي الْقِيَامَةِ، فِي الْيَوْمِ الأَخِيرِ».","27":"قَالَتْ لَهُ:«نَعَمْ يَا سَيِّدُ. أَنَا قَدْ آمَنْتُ أَنَّكَ أَنْتَ الْمَسِيحُ ابْنُ اللهِ، الآتِي إِلَى الْعَالَمِ».","3":"فَأَرْسَلَتِ الأُخْتَانِ إِلَيْهِ قَائِلَتَيْنِ: «يَاسَيِّدُ، هُوَذَا الَّذِي تُحِبُّهُ مَرِيضٌ».","4":"فَلَمَّا سَمِعَ يَسُوعُ، قَالَ:«هذَا الْمَرَضُ لَيْسَ لِلْمَوْتِ، بَلْ لأَجْلِ مَجْدِ اللهِ، لِيَتَمَجَّدَ ابْنُ اللهِ بِهِ».","5":"وَكَانَ يَسُوعُ يُحِبُّ مَرْثَا وَأُخْتَهَا وَلِعَازَرَ.","6":"فَلَمَّا سَمِعَ أَنَّهُ مَرِيضٌ مَكَثَ حِينَئِذٍ فِي الْمَوْضِعِ الَّذِي كَانَ فِيهِ يَوْمَيْنِ."},"51.4":{"13":"ثُمَّ لاَ أُرِيدُ أَنْ تَجْهَلُوا أَيُّهَا الإِخْوَةُ مِنْ جِهَةِ الرَّاقِدِينَ، لِكَيْ لاَ تَحْزَنُوا كَالْبَاقِينَ الَّذِينَ لاَ رَجَاءَ لَهُمْ.","14":"لأَنَّهُ إِنْ كُنَّا نُؤْمِنُ أَنَّ يَسُوعَ مَاتَ وَقَامَ، فَكَذلِكَ الرَّاقِدُونَ بِيَسُوعَ، سَيُحْضِرُهُمُ اللهُ أَيْضًا مَعَهُ."},"45.15":{"54":"وَمَتَى لَبِسَ هذَا الْفَاسِدُ عَدَمَ فَسَادٍ، وَلَبِسَ هذَا الْمَائِتُ عَدَمَ مَوْتٍ، فَحِينَئِذٍ تَصِيرُ الْكَلِمَةُ الْمَكْتُوبَةُ:«ابْتُلِعَ الْمَوْتُ إِلَى غَلَبَةٍ».","55":"«أَيْنَ شَوْكَتُكَ يَا مَوْتُ؟ أَيْنَ غَلَبَتُكِ يَا هَاوِيَةُ؟»","20":"وَلكِنِ الآنَ قَدْ قَامَ الْمَسِيحُ مِنَ الأَمْوَاتِ وَصَارَ بَاكُورَةَ الرَّاقِدِينَ.","58":"إِذًا يَا إِخْوَتِي الأَحِبَّاءَ، كُونُوا رَاسِخِينَ، غَيْرَ مُتَزَعْزِعِينَ، مُكْثِرِينَ فِي عَمَلِ الرَّبِّ كُلَّ حِينٍ، عَالِمِينَ أَنَّ تَعَبَكُمْ لَيْسَ بَاطِلاً فِي الرَّبِّ.","56":"أَمَّا شَوْكَةُ الْمَوْتِ فَهِيَ الْخَطِيَّةُ، وَقُوَّةُ الْخَطِيَّةِ هِيَ النَّامُوسُ.","57":"وَلكِنْ شُكْرًاِ للهِ الَّذِي يُعْطِينَا الْغَلَبَةَ بِرَبِّنَا يَسُوعَ الْمَسِيحِ."},"46.5":{"1":"لأَنَّنَا نَعْلَمُ أَنَّهُ إِنْ نُقِضَ بَيْتُ خَيْمَتِنَا الأَرْضِيُّ، فَلَنَا فِي السَّمَاوَاتِ بِنَاءٌ مِنَ اللهِ، بَيْتٌ غَيْرُ مَصْنُوعٍ بِيَدٍ، أَبَدِيٌّ.","7":"لأَنَّنَا بِالإِيمَانِ نَسْلُكُ لاَ بِالْعِيَانِ.","2":"فَإِنَّنَا فِي هذِهِ أَيْضًا نَئِنُّ مُشْتَاقِينَ إِلَى أَنْ نَلْبَسَ فَوْقَهَا مَسْكَنَنَا الَّذِي مِنَ السَّمَاءِ.","3":"وَإِنْ كُنَّا لاَبِسِينَ لاَ نُوجَدُ عُرَاةً.","4":"فَإِنَّنَا نَحْنُ الَّذِينَ فِي الْخَيْمَةِ نَئِنُّ مُثْقَلِينَ، إِذْ لَسْنَا نُرِيدُ أَنْ نَخْلَعَهَا بَلْ أَنْ نَلْبَسَ فَوْقَهَا، لِكَيْ يُبْتَلَعَ الْمَائِتُ مِنَ الْحَيَاةِ.","5":"وَلكِنَّ الَّذِي صَنَعَنَا لِهذَا عَيْنِهِ هُوَ اللهُ، الَّذِي أَعْطَانَا أَيْضًا عَرْبُونَ الرُّوحِ.","6":"فَإِذًا نَحْنُ وَاثِقُونَ كُلَّ حِينٍ وَعَالِمُونَ أَنَّنَا وَنَحْنُ مُسْتَوْطِنُونَ فِي الْجَسَدِ، فَنَحْنُ مُتَغَرِّبُونَ عَنِ الرَّبِّ.","8":"فَنَثِقُ وَنُسَرُّ بِالأَوْلَى أَنْ نَتَغَرَّبَ عَنِ الْجَسَدِ وَنَسْتَوْطِنَ عِنْدَ الرَّبِّ.","17":"إِذًا إِنْ كَانَ أَحَدٌ فِي الْمَسِيحِ فَهُوَ خَلِيقَةٌ جَدِيدَةٌ: الأَشْيَاءُ الْعَتِيقَةُ قَدْ مَضَتْ، هُوَذَا الْكُلُّ قَدْ صَارَ جَدِيدًا."},"49.1":{"21":"لأَنَّ لِيَ الْحَيَاةَ هِيَ الْمَسِيحُ وَالْمَوْتُ هُوَ رِبْحٌ.","6":"وَاثِقًا بِهذَا عَيْنِهِ أَنَّ الَّذِي ابْتَدَأَ فِيكُمْ عَمَلاً صَالِحًا يُكَمِّلُ إِلَى يَوْمِ يَسُوعَ الْمَسِيحِ.","22":"وَلكِنْ إِنْ كَانَتِ الْحَيَاةُ فِي الْجَسَدِ هِيَ لِي ثَمَرُ عَمَلِي، فَمَاذَا أَخْتَارُ؟ لَسْتُ أَدْرِي!","23":"فَإِنِّي مَحْصُورٌ مِنْ الاثْنَيْنِ: لِيَ اشْتِهَاءٌ أَنْ أَنْطَلِقَ وَأَكُونَ مَعَ الْمَسِيحِ، ذَاكَ أَفْضَلُ جِدًّا."},"42.19":{"25":"وَكَانَتْ وَاقِفَاتٍ عِنْدَ صَلِيبِ يَسُوعَ، أُمُّهُ، وَأُخْتُ أُمِّهِ مَرْيَمُ زَوْجَةُ كِلُوبَا، وَمَرْيَمُ الْمَجْدَلِيَّةُ.","26":"فَلَمَّا رَأَى يَسُوعُ أُمَّهُ، وَالتِّلْمِيذَ الَّذِي كَانَ يُحِبُّهُ وَاقِفًا، قَالَ لأُمِّهِ:«يَا امْرَأَةُ، هُوَذَا ابْنُكِ».","27":"ثُمَّ قَالَ لِلتِّلْمِيذِ:«هُوَذَا أُمُّكَ». وَمِنْ تِلْكَ السَّاعَةِ أَخَذَهَا التِّلْمِيذُ إِلَى خَاصَّتِهِ."},"0.23":{"1":"وَكَانَتْ حَيَاةُ سَارَةَ مِئَةً وَسَبْعًا وَعِشْرِينَ سَنَةً، سِنِي حَيَاةِ سَارَةَ.","2":"وَمَاتَتْ سَارَةُ فِي قَرْيَةِ أَرْبَعَ، الَّتِي هِيَ حَبْرُونُ، فِي أَرْضِ كَنْعَانَ. فَأَتَى إِبْرَاهِيمُ لِيَنْدُبَ سَارَةَ وَيَبْكِيَ عَلَيْهَا.","3":"وَقَامَ إِبْرَاهِيمُ مِنْ أَمَامِ مَيِّتِهِ وَكَلَّمَ بَنِي حِثَّ قَائِلاً:","4":"«أَنَا غَرِيبٌ وَنَزِيلٌ عِنْدَكُمْ. أَعْطُونِي مُلْكَ قَبْرٍ مَعَكُمْ لأَدْفِنَ مَيْتِي مِنْ أَمَامِي»."},"46.12":{"9":"فَقَالَ لِي:«تَكْفِيكَ نِعْمَتِي، لأَنَّ قُوَّتِي فِي الضَّعْفِ تُكْمَلُ». فَبِكُلِّ سُرُورٍ أَفْتَخِرُ بِالْحَرِيِّ فِي ضَعَفَاتِي، لِكَيْ تَحِلَّ عَلَيَّ قُوَّةُ الْمَسِيحِ.","10":"لِذلِكَ أُسَرُّ بِالضَّعَفَاتِ وَالشَّتَائِمِ وَالضَّرُورَاتِ وَالاضْطِهَادَاتِ وَالضِّيقَاتِ لأَجْلِ الْمَسِيحِ. لأَنِّي حِينَمَا أَنَا ضَعِيفٌ فَحِينَئِذٍ أَنَا قَوِيٌّ."},"37.4":{"6":"فَأَجَابَ وَكَلَّمَنِي قَائِلاً: «هذِهِ كَلِمَةُ الرَّبِّ إِلَى زَرُبَّابِلَ قَائِلاً: لاَ بِالْقُدْرَةِ وَلاَ بِالْقُوَّةِ، بَلْ بِرُوحِي قَالَ رَبُّ الْجُنُودِ."},"18.18":{"32":"الإِلهُ الَّذِي يُمَنْطِقُنِي بِالْقُوَّةِ وَيُصَيِّرُ طَرِيقِي كَامِلاً.","2":"الرَّبُّ صَخْرَتِي وَحِصْنِي وَمُنْقِذِي. إِلهِي صَخْرَتِي بِهِ أَحْتَمِي. تُرْسِي وَقَرْنُ خَلاَصِي وَمَلْجَإِي."},"18.28":{"7":"الرَّبُّ عِزِّي وَتُرْسِي. عَلَيْهِ اتَّكَلَ قَلْبِي، فَانْتَصَرْتُ. وَيَبْتَهِجُ قَلْبِي وَبِأُغْنِيَتِي أَحْمَدُهُ."},"15.8":{"10":"فَقَالَ لَهُمُ: «اذْهَبُوا كُلُوا السَّمِينَ، وَاشْرَبُوا الْحُلْوَ، وَابْعَثُوا أَنْصِبَةً لِمَنْ لَمْ يُعَدَّ لَهُ، لأَنَّ الْيَوْمَ إِنَّمَا هُوَ مُقَدَّسٌ لِسَيِّدِنَا. وَلاَ تَحْزَنُوا، لأَنَّ فَرَحَ الرَّبِّ هُوَ قُوَّتُكُمْ»."},"48.3":{"16":"لِكَيْ يُعْطِيَكُمْ بِحَسَبِ غِنَى مَجْدِهِ، أَنْ تَتَأَيَّدُوا بِالْقُوَّةِ بِرُوحِهِ فِي الإِنْسَانِ الْبَاطِنِ،","17":"لِيَحِلَّ الْمَسِيحُ بِالإِيمَانِ فِي قُلُوبِكُمْ،","18":"وَأَنْتُمْ مُتَأَصِّلُونَ وَمُتَأَسِّسُونَ فِي الْمَحَبَّةِ، حَتَّى تَسْتَطِيعُوا أَنْ تُدْرِكُوا مَعَ جَمِيعِ الْقِدِّيسِينَ، مَا هُوَ الْعَرْضُ وَالطُّولُ وَالْعُمْقُ وَالْعُلْوُ،","19":"وَتَعْرِفُوا مَحَبَّةَ الْمَسِيحِ الْفَائِقَةَ الْمَعْرِفَةِ، لِكَيْ تَمْتَلِئُوا إِلَى كُلِّ مِلْءِ اللهِ."},"18.29":{"11":"الرَّبُّ يُعْطِي عِزًّا لِشَعْبِهِ. الرَّبُّ يُبَارِكُ شَعْبَهُ بِالسَّلاَمِ."},"34.3":{"19":"اَلرَّبُّ السَّيِّدُ قُوَّتِي، وَيَجْعَلُ قَدَمَيَّ كَالأَيَائِلِ، وَيُمَشِّينِي عَلَى مُرْتَفَعَاتِي. لِرَئِيسِ الْمُغَنِّينَ عَلَى آلاَتِي ذَوَاتِ الأَوْتَارِ.","17":"فَمَعَ أَنَّهُ لاَ يُزْهِرُ التِّينُ، وَلاَ يَكُونُ حَمْلٌ فِي الْكُرُومِ. يَكْذِبُ عَمَلُ الزَّيْتُونَةِ، وَالْحُقُولُ لاَ تَصْنَعُ طَعَامًا. يَنْقَطِعُ الْغَنَمُ مِنَ الْحَظِيرَةِ، وَلاَ بَقَرَ فِي الْمَذَاوِدِ،","18":"فَإِنِّي أَبْتَهِجُ بِالرَّبِّ وَأَفْرَحُ بِإِلهِ خَلاَصِي."},"50.1":{"11":"مُتَقَوِّينَ بِكُلِّ قُوَّةٍ بِحَسَبِ قُدْرَةِ مَجْدِهِ، لِكُلِّ صَبْرٍ وَطُولِ أَنَاةٍ بِفَرَحٍ،"},"45.1":{"27":"بَلِ اخْتَارَ اللهُ جُهَّالَ الْعَالَمِ لِيُخْزِيَ الْحُكَمَاءَ. وَاخْتَارَ اللهُ ضُعَفَاءَ الْعَالَمِ لِيُخْزِيَ الأَقْوِيَاءَ.","26":"فَانْظُرُوا دَعْوَتَكُمْ أَيُّهَا الإِخْوَةُ، أَنْ لَيْسَ كَثِيرُونَ حُكَمَاءَ حَسَبَ الْجَسَدِ، لَيْسَ كَثِيرُونَ أَقْوِيَاءَ، لَيْسَ كَثِيرُونَ شُرَفَاءَ،","28":"وَاخْتَارَ اللهُ أَدْنِيَاءَ الْعَالَمِ وَالْمُزْدَرَى وَغَيْرَ الْمَوْجُودِ لِيُبْطِلَ الْمَوْجُودَ،","29":"لِكَيْ لاَ يَفْتَخِرَ كُلُّ ذِي جَسَدٍ أَمَامَهُ."},"54.2":{"1":"فَتَقَوَّ أَنْتَ يَا ابْنِي بِالنِّعْمَةِ الَّتِي فِي الْمَسِيحِ يَسُوعَ.","22":"أَمَّا الشَّهَوَاتُ الشَّبَابِيَّةُ فَاهْرُبْ مِنْهَا، وَاتْبَعِ الْبِرَّ وَالإِيمَانَ وَالْمَحَبَّةَ وَالسَّلاَمَ مَعَ الَّذِينَ يَدْعُونَ الرَّبَّ مِنْ قَلْبٍ نَقِيٍّ.","15":"اجْتَهِدْ أَنْ تُقِيمَ نَفْسَكَ للهِِ مُزَكُى، عَامِلاً لاَ يُخْزَى، مُفَصِّلاً كَلِمَةَ الْحَقِّ بِالاسْتِقَامَةِ."},"6.6":{"11":"وَأَتَى مَلاَكُ الرَّبِّ وَجَلَسَ تَحْتَ الْبُطْمَةِ الَّتِي فِي عَفْرَةَ الَّتِي لِيُوآشَ الأَبِيعَزَرِيِّ. وَابْنُهُ جِدْعُونُ كَانَ يَخْبِطُ حِنْطَةً فِي الْمِعْصَرَةِ لِكَيْ يُهَرِّبَهَا مِنَ الْمِدْيَانِيِّينَ.","12":"فَظَهَرَ لَهُ مَلاَكُ الرَّبِّ وَقَالَ لَهُ: «الرَّبُّ مَعَكَ يَا جَبَّارَ الْبَأْسِ».","13":"فَقَالَ لَهُ جِدْعُونُ: «أَسْأَلُكَ يَا سَيِّدِي، إِذَا كَانَ الرَّبُّ مَعَنَا فَلِمَاذَا أَصَابَتْنَا كُلُّ هذِهِ؟ وَأَيْنَ كُلُّ عَجَائِبِهِ الَّتِي أَخْبَرَنَا بِهَا آبَاؤُنَا قَائِلِينَ: أَلَمْ يُصْعِدْنَا الرَّبُّ مِنْ مِصْرَ؟ وَالآنَ قَدْ رَفَضَنَا الرَّبُّ وَجَعَلَنَا فِي كَفِّ مِدْيَانَ».","14":"فَالْتَفَتَ إِلَيْهِ الرَّبُّ وَقَالَ: «اذْهَبْ بِقُوَّتِكَ هذِهِ وَخَلِّصْ إِسْرَائِيلَ مِنْ كَفِّ مِدْيَانَ. أَمَا أَرْسَلْتُكَ؟»","15":"فَقَالَ لَهُ: «أَسْأَلُكَ يَا سَيِّدِي، بِمَاذَا أُخَلِّصُ إِسْرَائِيلَ؟ هَا عَشِيرَتِي هِيَ الذُّلَّى فِي مَنَسَّى، وَأَنَا الأَصْغَرُ فِي بَيْتِ أَبِي».","16":"فَقَالَ لَهُ الرَّبُّ: «إِنِّي أَكُونُ مَعَكَ، وَسَتَضْرِبُ الْمِدْيَانِيِّينَ كَرَجُل وَاحِدٍ»."},"1.4":{"10":"فَقَالَ مُوسَى لِلرَّبِّ: «اسْتَمِعْ أَيُّهَا السَّيِّدُ، لَسْتُ أَنَا صَاحِبَ كَلاَمٍ مُنْذُ أَمْسِ وَلاَ أَوَّلِ مِنْ أَمْسِ، وَلاَ مِنْ حِينِ كَلَّمْتَ عَبْدَكَ، بَلْ أَنَا ثَقِيلُ الْفَمِ وَاللِّسَانِ».","11":"فَقَالَ لَهُ الرَّبُّ: «مَنْ صَنَعَ لِلإِنْسَانِ فَمًا؟ أَوْ مَنْ يَصْنَعُ أَخْرَسَ أَوْ أَصَمَّ أَوْ بَصِيرًا أَوْ أَعْمَى؟ أَمَا هُوَ أَنَا الرَّبُّ؟","12":"فَالآنَ اذْهَبْ وَأَنَا أَكُونُ مَعَ فَمِكَ وَأُعَلِّمُكَ مَا تَتَكَلَّمُ بِهِ»."},"8.17":{"40":"وَأَخَذَ عَصَاهُ بِيَدِهِ، وَانْتَخَبَ لَهُ خَمْسَةَ حِجَارَةٍ مُلْسٍ مِنَ الْوَادِي وَجَعَلَهَا فِي كِنْفِ الرُّعَاةِ الَّذِي لَهُ، أَيْ فِي الْجِرَابِ، وَمِقْلاَعَهُ بِيَدِهِ وَتَقَدَّمَ نَحْوَ الْفِلِسْطِينِيِّ.","41":"وَذَهَبَ الْفِلِسْطِينِيُّ ذِاهِبًا وَاقْتَرَبَ إِلَى دَاوُدَ الْرَّجُلُ وَحَامِلُ التُّرْسِ أَمَامَهُ.","42":"وَلَمَّا نَظَرَ الْفِلِسْطِينِيُّ وَرَأَى دَاوُدَ اسْتَحْقَرَهُ لأَنَّهُ كَانَ غُلاَمًا وَأَشْقَرَ جَمِيلَ الْمَنْظَرِ.","43":"فَقَالَ الْفِلِسْطِينِيُّ لِدَاوُدَ: «أَلَعَلِّي أَنَا كَلْبٌ حَتَّى أَنَّكَ تَأْتِي إِلَيَّ بِعِصِيٍّ؟». وَلَعَنَ الْفِلِسْطِينِيُّ دَاوُدَ بِآلِهَتِهِ.","44":"وَقَالَ الْفِلِسْطِينِيُّ لِدَاوُدَ: «تَعَالَ إِلَيَّ فَأُعْطِيَ لَحْمَكَ لِطُيُورِ السَّمَاءِ وَوُحُوشِ الْبَرِّيَّةِ».","45":"فَقَالَ دَاوُدُ لِلْفِلِسْطِينِيِّ: «أَنْتَ تَأْتِي إِلَيَّ بِسَيْفٍ وَبِرُمْحٍ وَبِتُرْسٍ، وَأَنَا آتِي إِلَيْكَ بِاسْمِ رَبِّ الْجُنُودِ إِلهِ صُفُوفِ إِسْرَائِيلَ الَّذِينَ عَيَّرْتَهُمْ.","46":"هذَا الْيَوْمَ يَحْبِسُكَ الرَّبُّ فِي يَدِي، فَأَقْتُلُكَ وَأَقْطَعُ رَأْسَكَ. وَأُعْطِي جُثَثَ جَيْشِ الْفِلِسْطِينِيِّينَ هذَا الْيَوْمَ لِطُيُورِ السَّمَاءِ وَحَيَوَانَاتِ الأَرْضِ، فَتَعْلَمُ كُلُّ الأَرْضِ أَنَّهُ يُوجَدُ إِلهٌ لإِسْرَائِيلَ.","47":"وَتَعْلَمُ هذِهِ الْجَمَاعَةُ كُلُّهَا أَنَّهُ لَيْسَ بِسَيْفٍ وَلاَ بِرُمْحٍ يُخَلِّصُ الرَّبُّ، لأَنَّ الْحَرْبَ لِلرَّبِّ وَهُوَ يَدْفَعُكُمْ لِيَدِنَا».","48":"وَكَانَ لَمَّا قَامَ الْفِلِسْطِينِيُّ وَذَهَبَ وَتَقدَّمَ لِلِقَاءِ دَاودَ أَنَّ دَاوُدَ أَسْرَعَ وَرَكَضَ نَحْوَ الصَّفِّ لِلِقَاءِ الْفِلِسْطِينِيِّ.","49":"وَمَدَّ دَاوُدُ يَدَهُ إِلَى الْكِنْفِ وَأَخَذَ مِنْهُ حَجَرًا وَرَمَاهُ بِالْمِقْلاَعِ، وَضَرَبَ الْفِلِسْطِينِيَّ فِي جِبْهَتِهِ، فَارْتَزَّ الْحَجَرُ فِي جِبْهَتِهِ، وَسَقَطَ عَلَى وَجْهِهِ إِلَى الأَرْضِ.","50":"فَتَمَكَّنَ دَاوُدُ مِنَ الْفِلِسْطِينِيِّ بِالْمِقْلاَعِ وَالْحَجَرِ، وَضَرَبَ الْفِلِسْطِينِيَّ وَقَتَلَهُ. وَلَمْ يَكُنْ سَيْفٌ بِيَدِ دَاوُدَ."},"41.13":{"10":"وَكَانَ يُعَلِّمُ فِي أَحَدِ الْمَجَامِعِ فِي السَّبْتِ،","11":"وَإِذَا امْرَأَةٌ كَانَ بِهَا رُوحُ ضَعْفٍ ثَمَانِيَ عَشْرَةَ سَنَةً، وَكَانَتْ مُنْحَنِيَةً وَلَمْ تَقْدِرْ أَنْ تَنْتَصِبَ الْبَتَّةَ.","12":"فَلَمَّا رَآهَا يَسُوعُ دَعَاهَا وَقَالَ لَهَا:«يَا امْرَأَةُ، إِنَّكِ مَحْلُولَةٌ مِنْ ضَعْفِكِ!».","13":"وَوَضَعَ عَلَيْهَا يَدَيْهِ، فَفِي الْحَالِ اسْتَقَامَتْ وَمَجَّدَتِ اللهَ."},"23.1":{"4":"فَكَانَتْ كَلِمَةُ الرَّبِّ إِلَيَّ قَائِلاً:","5":"«قَبْلَمَا صَوَّرْتُكَ فِي الْبَطْنِ عَرَفْتُكَ، وَقَبْلَمَا خَرَجْتَ مِنَ الرَّحِمِ قَدَّسْتُكَ. جَعَلْتُكَ نَبِيًّا لِلشُّعُوبِ».","6":"فَقُلْتُ: «آهِ، يَا سَيِّدُ الرَّبُّ، إِنِّي لاَ أَعْرِفُ أَنْ أَتَكَلَّمَ لأَنِّي وَلَدٌ».","7":"فَقَالَ الرَّبُّ لِي: «لاَ تَقُلْ إِنِّي وَلَدٌ، لأَنَّكَ إِلَى كُلِّ مَنْ أُرْسِلُكَ إِلَيْهِ تَذْهَبُ وَتَتَكَلَّمُ بِكُلِّ مَا آمُرُكَ بِهِ.","8":"لاَ تَخَفْ مِنْ وُجُوهِهِمْ، لأَنِّي أَنَا مَعَكَ لأُنْقِذَكَ، يَقُولُ الرَّبُّ».","9":"وَمَدَّ الرَّبُّ يَدَهُ وَلَمَسَ فَمِي، وَقَالَ الرَّبُّ لِي: «هَا قَدْ جَعَلْتُ كَلاَمِي فِي فَمِكَ.","10":"اُنْظُرْ! قَدْ وَكَّلْتُكَ هذَا الْيَوْمَ عَلَى الشُّعُوبِ وَعَلَى الْمَمَالِكِ، لِتَقْلَعَ وَتَهْدِمَ وَتُهْلِكَ وَتَنْقُضَ وَتَبْنِيَ وَتَغْرِسَ»."},"1.15":{"26":"فَقَالَ: «إِنْ كُنْتَ تَسْمَعُ لِصَوْتِ الرَّبِّ إِلهِكَ، وَتَصْنَعُ الْحَقَّ فِي عَيْنَيْهِ، وَتَصْغَى إِلَى وَصَايَاهُ وَتَحْفَظُ جَمِيعَ فَرَائِضِهِ، فَمَرَضًا مَا مِمَّا وَضَعْتُهُ عَلَى الْمِصْرِيِّينَ لاَ أَضَعُ عَلَيْكَ. فَإِنِّي أَنَا الرَّبُّ شَافِيكَ».","1":"حِينَئِذٍ رَنَّمَ مُوسَى وَبَنُو إِسْرَائِيلَ هذِهِ التَّسْبِيحَةَ لِلرَّبِّ وَقَالُوا: «أُرَنِّمُ لِلرَّبِّ فَإِنَّهُ قَدْ تَعَظَّمَ. الْفَرَسَ وَرَاكِبَهُ طَرَحَهُمَا فِي الْبَحْرِ.","2":"الرَّبُّ قُوَّتِي وَنَشِيدِي، وَقَدْ صَارَ خَلاَصِي. هذَا إِلهِي فَأُمَجِّدُهُ، إِلهُ أَبِي فَأُرَفِّعُهُ.","3":"الرَّبُّ رَجُلُ الْحَرْبِ. الرَّبُّ اسْمُهُ.","4":"مَرْكَبَاتُ فِرْعَوْنَ وَجَيْشُهُ أَلْقَاهُمَا فِي الْبَحْرِ، فَغَرِقَ أَفْضَلُ جُنُودِهِ الْمَرْكَبِيَّةِ فِي بَحْرِ سُوفَ،","5":"تُغَطِّيهِمُ اللُّجَجُ. قَدْ هَبَطُوا فِي الأَعْمَاقِ كَحَجَرٍ.","6":"يَمِينُكَ يَا رَبُّ مُعْتَزَّةٌ بِالْقُدْرَةِ. يَمِينُكَ يَا رَبُّ تُحَطِّمُ الْعَدُوَّ.","7":"وَبِكَثْرَةِ عَظَمَتِكَ تَهْدِمُ مُقَاوِمِيكَ. تُرْسِلُ سَخَطَكَ فَيَأْكُلُهُمْ كَالْقَشِّ،","8":"وَبِرِيحِ أَنْفِكَ تَرَاكَمَتِ الْمِيَاهُ. انْتَصَبَتِ الْمَجَارِيَ كَرَابِيَةٍ. تَجَمَّدَتِ اللُّجَجُ فِي قَلْبِ الْبَحْرِ.","9":"قَالَ الْعَدُوُّ: أَتْبَعُ، أُدْرِكُ، أُقَسِّمُ غَنِيمَةً. تَمْتَلِئُ مِنْهُمْ نَفْسِي. أُجَرِّدُ سَيْفِي. تُفْنِيهِمْ يَدِي.","10":"نَفَخْتَ بِرِيحِكَ فَغَطَّاهُمُ الْبَحْرُ. غَاصُوا كَالرَّصَاصِ فِي مِيَاهٍ غَامِرَةٍ.","11":"مَنْ مِثْلُكَ بَيْنَ الآلِهَةِ يَا رَبُّ؟ مَنْ مِثْلُكَ مُعْتَزًّا فِي الْقَدَاسَةِ، مَخُوفًا بِالتَّسَابِيحِ، صَانِعًا عَجَائِبَ؟","12":"تَمُدُّ يَمِينَكَ فَتَبْتَلِعُهُمُ الأَرْضُ.","13":"تُرْشِدُ بِرَأْفَتِكَ الشَّعْبَ الَّذِي فَدَيْتَهُ. تَهْدِيهِ بِقُوَّتِكَ إِلَى مَسْكَنِ قُدْسِكَ.","19":"فَإِنَّ خَيْلَ فِرْعَوْنَ دَخَلَتْ بِمَرْكَبَاتِهِ وَفُرْسَانِهِ إِلَى الْبَحْرِ، وَرَدَّ الرَّبُّ عَلَيْهِمْ مَاءَ الْبَحْرِ. وَأَمَّا بَنُو إِسْرَائِيلَ فَمَشَوْا عَلَى الْيَابِسَةِ فِي وَسَطِ الْبَحْرِ.","20":"فَأَخَذَتْ مَرْيَمُ النَّبِيَّةُ أُخْتُ هَارُونَ الدُّفَّ بِيَدِهَا، وَخَرَجَتْ جَمِيعُ النِّسَاءِ وَرَاءَهَا بِدُفُوفٍ وَرَقْصٍ.","21":"وَأَجَابَتْهُمْ مَرْيَمُ: «رَنِّمُوا لِلرَّبِّ فَإِنَّهُ قَدْ تَعَظَّمَ. الْفَرَسَ وَرَاكِبَهُ طَرَحَهُمَا فِي الْبَحْرِ»."},"18.107":{"19":"فَصَرَخُوا إِلَى الرَّبِّ فِي ضِيقِهِمْ، فَخَلَّصَهُمْ مِنْ شَدَائِدِهِمْ.","20":"أَرْسَلَ كَلِمَتَهُ فَشَفَاهُمْ، وَنَجَّاهُمْ مِنْ تَهْلُكَاتِهِمْ.","21":"فَلْيَحْمَدُوا الرَّبَّ عَلَى رَحْمَتِهِ وَعَجَائِبِهِ لِبَنِي آدَمَ.","1":"اِحْمَدُوا الرَّبَّ لأَنَّهُ صَالِحٌ، لأَنَّ إِلَى الأَبَدِ رَحْمَتَهُ.","8":"فَلْيَحْمَدُوا الرَّبَّ عَلَى رَحْمَتِهِ وَعَجَائِبِهِ لِبَنِي آدَمَ.","9":"لأَنَّهُ أَشْبَعَ نَفْسًا مُشْتَهِيَةً وَمَلأَ نَفْسًا جَائِعَةً خُبْزًا،"},"58.5":{"14":"أَمَرِيضٌ أَحَدٌ بَيْنَكُمْ؟ فَلْيَدْعُ شُيُوخَ الْكَنِيسَةِ فَيُصَلُّوا عَلَيْهِ وَيَدْهَنُوهُ بِزَيْتٍ بِاسْمِ الرَّبِّ،","15":"وَصَلاَةُ الإِيمَانِ تَشْفِي الْمَرِيضَ، وَالرَّبُّ يُقِيمُهُ، وَإِنْ كَانَ قَدْ فَعَلَ خَطِيَّةً تُغْفَرُ لَهْ.","7":"فَتَأَنَّوْا أَيُّهَا الإِخْوَةُ إِلَى مَجِيءِ الرَّبِّ. هُوَذَا الْفَّلاَحُ يَنْتَظِرُ ثَمَرَ الأَرْضِ الثَّمِينَ، مُتَأَنِّيًا عَلَيْهِ حَتَّى يَنَالَ الْمَطَرَ الْمُبَكِّرَ وَالْمُتَأَخِّرَ.","8":"فَتَأَنَّوْا أَنْتُمْ وَثَبِّتُوا قُلُوبَكُمْ، لأَنَّ مَجِيءَ الرَّبِّ قَدِ اقْتَرَبَ."},"18.41":{"3":"الرَّبُّ يَعْضُدُهُ وَهُوَ عَلَى فِرَاشِ الضُّعْفِ. مَهَّدْتَ مَضْجَعَهُ كُلَّهُ فِي مَرَضِهِ.","9":"أَيْضًا رَجُلُ سَلاَمَتِي، الَّذِي وَثِقْتُ بِهِ، آكِلُ خُبْزِي، رَفَعَ عَلَيَّ عَقِبَهُ!"},"18.6":{"2":"ارْحَمْنِي يَا رَبُّ لأَنِّي ضَعِيفٌ. اشْفِنِي يَا رَبُّ لأَنَّ عِظَامِي قَدْ رَجَفَتْ،"},"63.1":{"2":"أَيُّهَا الْحَبِيبُ، فِي كُلِّ شَيْءٍ أَرُومُ أَنْ تَكُونَ نَاجِحًا وَصَحِيحًا، كَمَا أَنَّ نَفْسَكَ نَاجِحَةٌ.","4":"لَيْسَ لِي فَرَحٌ أَعْظَمُ مِنْ هذَا: أَنْ أَسْمَعَ عَنْ أَوْلاَدِي أَنَّهُمْ يَسْلُكُونَ بِالْحَقِّ."},"38.4":{"2":"«وَلَكُمْ أَيُّهَا الْمُتَّقُونَ اسْمِي تُشْرِقُ شَمْسُ الْبِرِّ وَالشِّفَاءُ فِي أَجْنِحَتِهَا، فَتَخْرُجُونَ وَتَنْشَأُونَ كَعُجُولِ الصِّيرَةِ."},"19.4":{"20":"يَا ابْنِي، أَصْغِ إِلَى كَلاَمِي. أَمِلْ أُذُنَكَ إِلَى أَقْوَالِي.","21":"لاَ تَبْرَحْ عَنْ عَيْنَيْكَ. اِحْفَظْهَا فِي وَسَطِ قَلْبِكَ.","22":"لأَنَّهَا هِيَ حَيَاةٌ لِلَّذِينَ يَجِدُونَهَا، وَدَوَاءٌ لِكُلِّ الْجَسَدِ.","23":"فَوْقَ كُلِّ تَحَفُّظٍ احْفَظْ قَلْبَكَ، لأَنَّ مِنْهُ مَخَارِجَ الْحَيَاةِ.","5":"اِقْتَنِ الْحِكْمَةَ. اقْتَنِ الْفَهْمَ. لاَ تَنْسَ وَلاَ تُعْرِضْ عَنْ كَلِمَاتِ فَمِي.","6":"لاَ تَتْرُكْهَا فَتَحْفَظَكَ. أَحْبِبْهَا فَتَصُونَكَ.","7":"الْحِكْمَةُ هِيَ الرَّأْسُ. فَاقْتَنِ الْحِكْمَةَ، وَبِكُلِّ مُقْتَنَاكَ اقْتَنِ الْفَهْمَ."},"40.2":{"1":"ثُمَّ دَخَلَ كَفْرَنَاحُومَ أَيْضًا بَعْدَ أَيَّامٍ، فَسُمِعَ أَنَّهُ فِي بَيْتٍ.","2":"وَلِلْوَقْتِ اجْتَمَعَ كَثِيرُونَ حَتَّى لَمْ يَعُدْ يَسَعُ وَلاَ مَا حَوْلَ الْبَابِ. فَكَانَ يُخَاطِبُهُمْ بِالْكَلِمَةِ.","3":"وَجَاءُوا إِلَيْهِ مُقَدِّمِينَ مَفْلُوجًا يَحْمِلُهُ أَرْبَعَةٌ.","4":"وَإِذْ لَمْ يَقْدِرُوا أَنْ يَقْتَرِبُوا إِلَيْهِ مِنْ أَجْلِ الْجَمْعِ، كَشَفُوا السَّقْفَ حَيْثُ كَانَ. وَبَعْدَ مَا نَقَبُوهُ دَلَّوُا السَّرِيرَ الَّذِي كَانَ الْمَفْلُوجُ مُضْطَجِعًا عَلَيْهِ.","5":"فَلَمَّا رَأَى يَسُوعُ إِيمَانَهُمْ، قَالَ لِلْمَفْلُوجِ: «يَا بُنَيَّ، مَغْفُورَةٌ لَكَ خَطَايَاكَ».","6":"وَكَانَ قَوْمٌ مِنَ الْكَتَبَةِ هُنَاكَ جَالِسِينَ يُفَكِّرُونَ فِي قُلُوبِهِمْ:","7":"«لِمَاذَا يَتَكَلَّمُ هذَا هكَذَا بِتَجَادِيفَ؟ مَنْ يَقْدِرُ أَنْ يَغْفِرَ خَطَايَا إِلاَّ اللهُ وَحْدَهُ؟»","8":"فَلِلْوَقْتِ شَعَرَ يَسُوعُ بِرُوحِهِ أَنَّهُمْ يُفَكِّرُونَ هكَذَا فِي أَنْفُسِهِمْ، فَقَالَ لَهُمْ:«لِمَاذَا تُفَكِّرُونَ بِهذَا فِي قُلُوبِكُمْ؟","9":"أَيُّمَا أَيْسَرُ، أَنْ يُقَالَ لِلْمَفْلُوجِ: مَغْفُورَةٌ لَكَ خَطَايَاكَ، أَمْ أَنْ يُقَالَ: قُمْ وَاحْمِلْ سَرِيرَكَ وَامْشِ؟","10":"وَلكِنْ لِكَيْ تَعْلَمُوا أَنَّ لابْنِ الإِنْسَانِ سُلْطَانًا عَلَى الأَرْضِ أَنْ يَغْفِرَ الْخَطَايَا». قَالَ لِلْمَفْلُوجِ:","11":"«لَكَ أَقُولُ: قُمْ وَاحْمِلْ سَرِيرَكَ وَاذْهَبْ إِلَى بَيْتِكَ!».","12":"فَقَامَ لِلْوَقْتِ وَحَمَلَ السَّرِيرَ وَخَرَجَ قُدَّامَ الْكُلِّ، حَتَّى بُهِتَ الْجَمِيعُ وَمَجَّدُوا اللهَ قَائِلِينَ:«مَا رَأَيْنَا مِثْلَ هذَا قَطُّ!»."},"40.1":{"29":"وَلَمَّا خَرَجُوا مِنَ الْمَجْمَعِ جَاءُوا لِلْوَقْتِ إِلَى بَيْتِ سِمْعَانَ وَأَنْدَرَاوُسَ مَعَ يَعْقُوبَ وَيُوحَنَّا،","30":"وَكَانَتْ حَمَاةُ سِمْعَانَ مُضْطَجِعَةً مَحْمُومَةً، فَلِلْوَقْتِ أَخْبَرُوهُ عَنْهَا.","31":"فَتَقَدَّمَ وَأَقَامَهَا مَاسِكًا بِيَدِهَا، فَتَرَكَتْهَا الْحُمَّى حَالاً وَصَارَتْ تَخْدِمُهُمْ.","16":"وَفِيمَا هُوَ يَمْشِي عِنْدَ بَحْرِ الْجَلِيلِ أَبْصَرَ سِمْعَانَ وَأَنْدَرَاوُسَ أَخَاهُ يُلْقِيَانِ شَبَكَةً فِي الْبَحْرِ، فَإِنَّهُمَا كَانَا صَيَّادَيْنِ.","17":"فَقَالَ لَهُمَا يَسُوعُ:«هَلُمَّ وَرَائِي فَأَجْعَلُكُمَا تَصِيرَانِ صَيَّادَيِ النَّاسِ».","18":"فَلِلْوَقْتِ تَرَكَا شِبَاكَهُمَا وَتَبِعَاهُ.","19":"ثُمَّ اجْتَازَ مِنْ هُنَاكَ قَلِيلاً فَرَأَى يَعْقُوبَ بْنَ زَبْدِي وَيُوحَنَّا أَخَاهُ، وَهُمَا فِي السَّفِينَةِ يُصْلِحَانِ الشِّبَاكَ.","20":"فَدَعَاهُمَا لِلْوَقْتِ. فَتَرَكَا أَبَاهُمَا زَبْدِي فِي السَّفِينَةِ مَعَ الأَجْرَى وَذَهَبَا وَرَاءَهُ."},"41.17":{"11":"وَفِي ذَهَابِهِ إِلَى أُورُشَلِيمَ اجْتَازَ فِي وَسْطِ السَّامِرَةِ وَالْجَلِيلِ.","12":"وَفِيمَا هُوَ دَاخِلٌ إِلَى قَرْيَةٍ اسْتَقْبَلَهُ عَشَرَةُ رِجَال بُرْصٍ، فَوَقَفُوا مِنْ بَعِيدٍ","13":"وَرَفَعوُا صَوْتًا قَائِلِينَ:«يَا يَسُوعُ، يَا مُعَلِّمُ، ارْحَمْنَا!».","14":"فَنَظَرَ وَقَالَ لَهُمُ:«اذْهَبُوا وَأَرُوا أَنْفُسَكُمْ لِلْكَهَنَةِ». وَفِيمَا هُمْ مُنْطَلِقُونَ طَهَرُوا.","15":"فَوَاحِدٌ مِنْهُمْ لَمَّا رَأَى أَنَّهُ شُفِيَ، رَجَعَ يُمَجِّدُ اللهَ بِصَوْتٍ عَظِيمٍ،","16":"وَخَرَّ عَلَى وَجْهِهِ عِنْدَ رِجْلَيْهِ شَاكِرًا لَهُ، وَكَانَ سَامِرِيًّا.","17":"فَأجَابَ يَسُوعُ وَقَالَ:«أَلَيْسَ الْعَشَرَةُ قَدْ طَهَرُوا؟ فَأَيْنَ التِّسْعَةُ؟","18":"أَلَمْ يُوجَدْ مَنْ يَرْجِعُ لِيُعْطِيَ مَجْدًا للهِِ غَيْرُ هذَا الْغَرِيبِ الْجِنْسِ؟»","19":"ثُمَّ قَالَ لَهُ:«قُمْ وَامْضِ، إِيمَانُكَ خَلَّصَكَ».","5":"فَقَالَ الرُّسُلُ لِلرَّبِّ:«زِدْ إِيمَانَنَا!».","6":"فَقَالَ الرَّبُّ:«لَوْ كَانَ لَكُمْ إِيمَانٌ مِثْلُ حَبَّةِ خَرْدَل، لَكُنْتُمْ تَقُولُونَ لِهذِهِ الْجُمَّيْزَةِ: انْقَلِعِي وَانْغَرِسِي فِي الْبَحْرِ فَتُطِيعُكُمْ.","3":"اِحْتَرِزُوا لأَنْفُسِكُمْ. وَإِنْ أَخْطَأَ إِلَيْكَ أَخُوكَ فَوَبِّخْهُ، وَإِنْ تَابَ فَاغْفِرْ لَهُ.","4":"وَإِنْ أَخْطَأَ إِلَيْكَ سَبْعَ مَرَّاتٍ فِي الْيَوْمِ، وَرَجَعَ إِلَيْكَ سَبْعَ مَرَّاتٍ فِي الْيَوْمِ قَائِلاً: أَنَا تَائِبٌ، فَاغْفِرْ لَهُ»."},"11.20":{"1":"فِي تِلْكَ الأَيَّامِ مَرِضَ حَزَقِيَّا لِلْمَوْتِ، فَجَاءَ إِلَيْهِ إِشَعْيَا بْنُ آمُوصَ النَّبِيُّ وَقَالَ لَهُ: «هكَذَا قَالَ الرَّبُّ: أَوْصِ بَيْتَكَ لأَنَّكَ تَمُوتُ وَلاَ تَعِيشُ».","2":"فَوَجَّهَ وَجْهَهُ إِلَى الْحَائِطِ وَصَلَّى إِلَى الرَّبِّ قَائِلاً:","3":"«آهِ يَا رَبُّ، اذْكُرْ كَيْفَ سِرْتُ أَمَامَكَ بِالأَمَانَةِ وَبِقَلْبٍ سَلِيمٍ، وَفَعَلْتُ الْحَسَنَ فِي عَيْنَيْكَ». وَبَكَى حَزَقِيَّا بُكَاءً عَظِيمًا.","4":"وَلَمْ يَخْرُجْ إِشَعْيَا إِلَى الْمَدِينَةِ الْوُسْطَى حَتَّى كَانَ كَلاَمُ الرَّبِّ إِلَيْهِ قَائِلاً:","5":"«ارْجعْ وَقُلْ لِحَزَقِيَّا رَئِيسِ شَعْبِي: هكَذَا قَالَ الرَّبُّ إِلهُ دَاوُدَ أَبِيكَ: قَدْ سَمِعْتُ صَلاَتَكَ. قَدْ رَأَيْتُ دُمُوعَكَ. هأَنَذَا أَشْفِيكَ. فِي الْيَوْمِ الثَّالِثِ تَصْعَدُ إِلَى بَيْتِ الرَّبِّ.","6":"وَأَزِيدُ عَلَى أَيَّامِكَ خَمْسَ عَشَرَةَ سَنَةً، وَأُنْقِذُكَ مِنْ يَدِ مَلِكِ أَشُّورَ مَعَ هذِهِ الْمَدِينَةِ، وَأُحَامِي عَنْ هذِهِ الْمَدِينَةِ مِنْ أَجْلِ نَفْسِي، وَمِنْ أَجْلِ دَاوُدَ عَبْدِي»."},"42.9":{"1":"وَفِيمَا هُوَ مُجْتَازٌ رَأَى إِنْسَانًا أَعْمَى مُنْذُ وِلاَدَتِهِ،","2":"فَسَأَلَهُ تَلاَمِيذُهُ قَائِلِينَ:«يَا مُعَلِّمُ، مَنْ أَخْطَأَ: هذَا أَمْ أَبَوَاهُ حَتَّى وُلِدَ أَعْمَى؟».","3":"أَجَابَ يَسُوعُ:«لاَ هذَا أَخْطَأَ وَلاَأَبَوَاهُ، لكِنْ لِتَظْهَرَ أَعْمَالُ اللهِ فِيهِ.","4":"يَنْبَغِي أَنْ أَعْمَلَ أَعْمَالَ الَّذِي أَرْسَلَنِي مَا دَامَ نَهَارٌ. يَأْتِي لَيْلٌ حِينَ لاَ يَسْتَطِيعُ أَحَدٌ أَنْ يَعْمَلَ.","5":"مَا دُمْتُ فِي الْعَالَمِ فَأَنَا نُورُ الْعَالَمِ».","6":"قَالَ هذَا وَتَفَلَ عَلَى الأَرْضِ وَصَنَعَ مِنَ التُّفْلِ طِينًا وَطَلَى بِالطِّينِ عَيْنَيِ الأَعْمَى.","7":"وَقَالَ لَهُ: «اذْهَبِ اغْتَسِلْ فِي بِرْكَةِ سِلْوَامَ» الَّذِي تَفْسِيرُهُ: مُرْسَلٌ، فَمَضَى وَاغْتَسَلَ وَأَتَى بَصِيرًا.","24":"فَدَعَوْا ثَانِيَةً الإِنْسَانَ الَّذِي كَانَ أَعْمَى، وَقَالُوا لَهُ:«أَعْطِ مَجْدًاِ للهِ. نَحْنُ نَعْلَمُ أَنَّ هذَا الإِنْسَانَ خَاطِئٌ».","25":"فَأَجَابَ ذَاكَ وَقَالَ:«أَخَاطِئٌ هُوَ؟ لَسْتُ أَعْلَمُ. إِنَّمَا أَعْلَمُ شَيْئًا وَاحِدًا: أَنِّي كُنْتُ أَعْمَى وَالآنَ أُبْصِرُ».","26":"فَقَالُوا لَهُ أَيْضًا:«مَاذَا صَنَعَ بِكَ؟ كَيْفَ فَتَحَ عَيْنَيْكَ؟»","27":"أَجَابَهُمْ:«قَدْ قُلْتُ لَكُمْ وَلَمْ تَسْمَعُوا. لِمَاذَا تُرِيدُونَ أَنْ تَسْمَعُوا أَيْضًا؟ أَلَعَلَّكُمْ أَنْتُمْ تُرِيدُونَ أَنْ تَصِيرُوا لَهُ تَلاَمِيذَ؟»","28":"فَشَتَمُوهُ وَقَالُوا:«أَنْتَ تِلْمِيذُ ذَاكَ، وَأَمَّا نَحْنُ فَإِنَّنَا تَلاَمِيذُ مُوسَى.","29":"نَحْنُ نَعْلَمُ أَنَّ مُوسَى كَلَّمَهُ اللهُ، وَأَمَّا هذَا فَمَا نَعْلَمُ مِنْ أَيْنَ هُوَ».","30":"أَجَابَ الرَّجُلُ وَقَالَ لَهُمْ:«إِنَّ فِي هذَا عَجَبًا! إِنَّكُمْ لَسْتُمْ تَعْلَمُونَ مِنْ أَيْنَ هُوَ، وَقَدْ فَتَحَ عَيْنَيَّ.","31":"وَنَعْلَمُ أَنَّ اللهَ لاَ يَسْمَعُ لِلْخُطَاةِ. وَلكِنْ إِنْ كَانَ أَحَدٌ يَتَّقِي اللهَ وَيَفْعَلُ مَشِيئَتَهُ، فَلِهذَا يَسْمَعُ.","32":"مُنْذُ الدَّهْرِ لَمْ يُسْمَعْ أَنَّ أَحَدًا فَتَحَ عَيْنَيْ مَوْلُودٍ أَعْمَى.","33":"لَوْ لَمْ يَكُنْ هذَا مِنَ اللهِ لَمْ يَقْدِرْ أَنْ يَفْعَلَ شَيْئًا».","34":"أجَابُوا وَقَالُوا لَهُ:«فِي الْخَطَايَا وُلِدْتَ أَنْتَ بِجُمْلَتِكَ، وَأَنْتَ تُعَلِّمُنَا!» فَأَخْرَجُوهُ خَارِجًا.","35":"فَسَمِعَ يَسُوعُ أَنَّهُمْ أَخْرَجُوهُ خَارِجًا، فَوَجَدَهُ وَقَالَ لَهُ:«أَتُؤْمِنُ بِابْنِ اللهِ؟»","36":"أَجَابَ ذَاكَ وَقَالَ: «مَنْ هُوَ يَا سَيِّدُ لأُومِنَ بِهِ؟»","37":"فَقَالَ لَهُ يَسُوعُ: «قَدْ رَأَيْتَهُ، وَالَّذِي يَتَكَلَّمُ مَعَكَ هُوَ هُوَ!».","38":"فَقَالَ: «أُومِنُ يَا سَيِّدُ!». وَسَجَدَ لَهُ."},"19.20":{"22":"لاَ تَقُلْ: «إِنِّي أُجَازِي شَرًّا». انْتَظِرِ الرَّبَّ فَيُخَلِّصَكَ.","7":"اَلصِّدِّيقُ يَسْلُكُ بِكَمَالِهِ. طُوبَى لِبَنِيهِ بَعْدَهُ."},"18.12":{"5":"«مِنِ اغْتِصَابِ الْمَسَاكِينِ، مِنْ صَرْخَةِ الْبَائِسِينَ، الآنَ أَقُومُ، يَقُولُ الرَّبُّ، أَجْعَلُ فِي وُسْعٍ الَّذِي يُنْفَثُ فِيهِ»."},"59.2":{"23":"الَّذِي إِذْ شُتِمَ لَمْ يَكُنْ يَشْتِمُ عِوَضًا، وَإِذْ تَأَلَّمَ لَمْ يَكُنْ يُهَدِّدُ بَلْ كَانَ يُسَلِّمُ لِمَنْ يَقْضِي بِعَدْل.","9":"وَأَمَّا أَنْتُمْ فَجِنْسٌ مُخْتَارٌ، وَكَهَنُوتٌ مُلُوكِيٌّ، أُمَّةٌ مُقَدَّسَةٌ، شَعْبُ اقْتِنَاءٍ، لِكَيْ تُخْبِرُوا بِفَضَائِلِ الَّذِي دَعَاكُمْ مِنَ الظُّلْمَةِ إِلَى نُورِهِ الْعَجِيبِ.","10":"الَّذِينَ قَبْلاً لَمْ تَكُونُوا شَعْبًا، وَأَمَّا الآنَ فَأَنْتُمْ شَعْبُ اللهِ. الَّذِينَ كُنْتُمْ غَيْرَ مَرْحُومِينَ، وَأَمَّا الآنَ فَمَرْحُومُونَ.","6":"لِذلِكَ يُتَضَمَّنُ أَيْضًا فِي الْكِتَابِ:«هنَذَا أَضَعُ فِي صِهْيَوْنَ حَجَرَ زَاوِيَةٍ مُخْتَارًا كَرِيمًا، وَالَّذِي يُؤْمِنُ بِهِ لَنْ يُخْزَى».","1":"فَاطْرَحُوا كُلَّ خُبْثٍ وَكُلَّ مَكْرٍ وَالرِّيَاءَ وَالْحَسَدَ وَكُلَّ مَذَمَّةٍ،"},"18.9":{"9":"وَيَكُونُ الرَّبُّ مَلْجَأً لِلْمُنْسَحِقِ. مَلْجَأً فِي أَزْمِنَةِ الضِّيقِ.","1":"أَحْمَدُ الرَّبَّ بِكُلِّ قَلْبِي. أُحَدِّثُ بِجَمِيعِ عَجَائِبِكَ."},"18.146":{"7":"الْمُجْرِي حُكْمًا لِلْمَظْلُومِينَ، الْمُعْطِي خُبْزًا لِلْجِيَاعِ. الرَّبُّ يُطْلِقُ الأَسْرَى."},"18.10":{"17":"تَأَوُّهَ الْوُدَعَاءِ قَدْ سَمِعْتَ يَا رَبُّ. تُثَبِّتُ قُلُوبَهُمْ. تُمِيلُ أُذُنَكَ","18":"لِحَقِّ الْيَتِيمِ وَالْمُنْسَحِقِ، لِكَيْ لاَ يَعُودَ أَيْضًا يَرْعَبُهُمْ إِنْسَانٌ مِنَ الأَرْضِ.","1":"يَا رَبُّ، لِمَاذَا تَقِفُ بَعِيدًا؟ لِمَاذَا تَخْتَفِي فِي أَزْمِنَةِ الضِّيقِ؟"},"19.22":{"22":"لاَ تَسْلُبِ الْفَقِيرَ لِكَوْنِهِ فَقِيرًا، وَلاَ تَسْحَقِ الْمِسْكِينَ فِي الْبَابِ،","23":"لأَنَّ الرَّبَّ يُقِيمُ دَعْوَاهُمْ، وَيَسْلُبُ سَالِبِي أَنْفُسِهِمْ.","6":"رَبِّ الْوَلَدَ فِي طَرِيقِهِ، فَمَتَى شَاخَ أَيْضًا لاَ يَحِيدُ عَنْهُ."},"59.3":{"9":"غَيْرَ مُجَازِينَ عَنْ شَرّ بِشَرّ أَوْ عَنْ شَتِيمَةٍ بِشَتِيمَةٍ، بَلْ بِالْعَكْسِ مُبَارِكِينَ، عَالِمِينَ أَنَّكُمْ لِهذَا دُعِيتُمْ لِكَيْ تَرِثُوا بَرَكَةً."},"18.35":{"1":"خَاصِمْ يَا رَبُّ مُخَاصِمِيَّ. قَاتِلْ مُقَاتِلِيَّ."},"8.24":{"3":"وَجَاءَ إِلَى صِيَرِ الْغَنَمِ الَّتِي فِي الطَّرِيقِ. وَكَانَ هُنَاكَ كَهْفٌ فَدَخَلَ شَاوُلُ لِكَيْ يُغَطِّيَ رِجْلَيْهِ، وَدَاوُدُ وَرِجَالُهُ كَانُوا جُلُوسًا فِي مَغَابِنِ الْكَهْفِ.","4":"فَقَالَ رِجَالُ دَاوُدَ لَهُ: «هُوَذَا الْيَوْمُ الَّذِي قَالَ لَكَ عَنْهُ الرَّبُّ: هأَنَذَا أَدْفَعُ عَدُوَّكَ لِيَدِكَ فَتَفْعَلُ بِهِ مَا يَحْسُنُ فِي عَيْنَيْكَ». فَقَامَ دَاوُدُ وَقَطَعَ طَرَفَ جُبَّةِ شَاوُلَ سِرًّا.","5":"وَكَانَ بَعْدَ ذلِكَ أَنَّ قَلْبَ دَاوُدَ ضَرَبَهُ عَلَى قَطْعِهِ طَرَفَ جُبَّةِ شَاوُلَ،","6":"فَقَالَ لِرِجَالِهِ: «حَاشَا لِي مِنْ قِبَلِ الرَّبِّ أَنْ أَعْمَلَ هذَا الأَمْرَ بِسَيِّدِي، بِمَسِيحِ الرَّبِّ، فَأَمُدَّ يَدِي إِلَيْهِ، لأَنَّهُ مَسِيحُ الرَّبِّ هُوَ».","7":"فَوَبَّخَ دَاوُدُ رِجَالَهُ بِالْكَلاَمِ، وَلَمْ يَدَعْهُمْ يَقُومُونَ عَلَى شَاوُلَ. وَأَمَّا شَاوُلُ فَقَامَ مِنَ الْكَهْفِ وَذَهَبَ فِي طَرِيقِهِ.","8":"ثُمَّ قَامَ دَاوُدُ بَعْدَ ذلِكَ وَخَرَجَ مِنَ الْكَهْفِ وَنَادَى وَرَاءَ شَاوُلَ قَائِلاً: «يَا سَيِّدِي الْمَلِكُ». وَلَمَّا الْتَفَتَ شَاوُلُ إِلَى وَرَائِهِ، خَرَّ دَاوُدُ عَلَى وَجْهِهِ إِلَى الأَرْضِ وَسَجَدَ.","9":"وَقَالَ دَاوُدُ لِشَاوُلَ: «لِمَاذَا تَسْمَعُ كَلاَمَ النَّاسِ الْقَائِلِينَ: هُوَذَا دَاوُدُ يَطْلُبُ أَذِيَّتَكَ؟","10":"هُوَذَا قَدْ رَأَتْ عَيْنَاكَ الْيَوْمَ هذَا كَيْفَ دَفَعَكَ الرَّبُّ اليَومَ لِيَدِي فِي الْكَهْفِ، وَقِيلَ لِي أَنْ أَقْتُلَكَ، وَلكِنَّنِي أَشْفَقْتُ عَلَيْكَ وَقُلْتُ: لاَ أَمُدُّ يَدِي إِلَى سَيِّدِي، لأَنَّهُ مَسِيحُ الرَّبِّ هُوَ.","11":"فَانْظُرْ يَا أَبِي، انْظُرْ أَيْضًا طَرَفَ جُبَّتِكَ بِيَدِي. فَمِنْ قَطْعِي طَرَفَ جُبَّتِكَ وَعَدَمِ قَتْلِي إِيَّاكَ اعْلَمْ وَانْظُرْ أَنَّهُ لَيْسَ فِي يَدِي شَرٌّ وَلاَ جُرْمٌ، وَلَمْ أُخْطِئْ إِلَيْكَ، وَأَنْتَ تَصِيدُ نَفْسِي لِتَأْخُذَهَا.","12":"يَقْضِي الرَّبُّ بَيْنِي وَبَيْنَكَ وَيَنْتَقِمُ لِي الرَّبُّ مِنْكَ، وَلكِنْ يَدِي لاَ تَكُونُ عَلَيْكَ."},"43.7":{"54":"فَلَمَّا سَمِعُوا هذَا حَنِقُوا بِقُلُوبِهِمْ وَصَرُّوا بِأَسْنَانِهِمْ عَلَيْهِ.","55":"وَأَمَّا هُوَ فَشَخَصَ إِلَى السَّمَاءِ وَهُوَ مُمْتَلِئٌ مِنَ الرُّوحِ الْقُدُسِ، فَرَأَى مَجْدَ اللهِ، وَيَسُوعَ قَائِمًا عَنْ يَمِينِ اللهِ.","56":"فَقَالَ:«هَا أَنَا أَنْظُرُ السَّمَاوَاتِ مَفْتُوحَةً، وَابْنَ الإِنْسَانِ قَائِمًا عَنْ يَمِينِ اللهِ».","57":"فَصَاحُوا بِصَوْتٍ عَظِيمٍ وَسَدُّوا آذَانَهُمْ، وَهَجَمُوا عَلَيْهِ بِنَفْسٍ وَاحِدَةٍ،","58":"وَأَخْرَجُوهُ خَارِجَ الْمَدِينَةِ وَرَجَمُوهُ. وَالشُّهُودُ خَلَعُوا ثِيَابَهُمْ عِنْدَ رِجْلَيْ شَابٍّ يُقَالُ لَهُ شَاوُلُ.","59":"فَكَانُوا يَرْجُمُونَ اسْتِفَانُوسَ وَهُوَ يَدْعُو وَيَقُولُ:«أَيُّهَا الرَّبُّ يَسُوعُ اقْبَلْ رُوحِي».","60":"ثُمَّ جَثَا عَلَى رُكْبَتَيْهِ وَصَرَخَ بِصَوْتٍ عَظِيمٍ:«يَارَبُّ، لاَ تُقِمْ لَهُمْ هذِهِ الْخَطِيَّةَ». وَإِذْ قَالَ هذَا رَقَدَ."},"39.27":{"11":"فَوَقَفَ يَسُوعُ أَمَامَ الْوَالِي. فَسَأَلَهُ الْوَالِي قِائِلاً:«أَأَنْتَ مَلِكُ الْيَهُودِ؟» فَقَالَ لَهُ يَسُوعُ:«أَنْتَ تَقُولُ».","12":"وَبَيْنَمَا كَانَ رُؤَسَاءُ الْكَهَنَةِ وَالشُّيُوخُ يَشْتَكُونَ عَلَيْهِ لَمْ يُجِبْ بِشَيْءٍ.","13":"فَقَالَ لَهُ بِيلاَطُسُ:«أَمَا تَسْمَعُ كَمْ يَشْهَدُونَ عَلَيْكَ؟»","14":"فَلَمْ يُجِبْهُ وَلاَ عَنْ كَلِمَةٍ وَاحِدَةٍ، حَتَّى تَعَجَّبَ الْوَالِي جِدًّا."},"0.50":{"15":"وَلَمَّا رَأَى إِخْوَةُ يُوسُفَ أَنَّ أَبَاهُمْ قَدْ مَاتَ، قَالُوا: «لَعَلَّ يُوسُفَ يَضْطَهِدُنَا وَيَرُدُّ عَلَيْنَا جَمِيعَ الشَّرِّ الَّذِي صَنَعْنَا بِهِ».","16":"فَأَوَصَوْا إِلَى يُوسُفَ قَائِلِينَ: «أَبُوكَ أَوْصَى قَبْلَ مَوْتِهِ قَائِلاً:","17":"هكَذَا تَقُولُونَ لِيُوسُفَ: آهِ! اصْفَحْ عَنْ ذَنْبِ إِخْوَتِكَ وَخَطِيَّتِهِمْ، فَإِنَّهُمْ صَنَعُوا بِكَ شَرًّا. فَالآنَ اصْفَحْ عَنْ ذَنْبِ عَبِيدِ إِلهِ أَبِيكَ». فَبَكَى يُوسُفُ حِينَ كَلَّمُوهُ.","18":"وَأَتَى إِخْوَتُهُ أَيْضًا وَوَقَعُوا أَمَامَهُ وَقَالُوا: «هَا نَحْنُ عَبِيدُكَ».","19":"فَقَالَ لَهُمْ يُوسُفُ: «لاَ تَخَافُوا. لأَنَّهُ هَلْ أَنَا مَكَانَ اللهِ؟","20":"أَنْتُمْ قَصَدْتُمْ لِي شَرًّا، أَمَّا اللهُ فَقَصَدَ بِهِ خَيْرًا، لِكَيْ يَفْعَلَ كَمَا الْيَوْمَ، لِيُحْيِيَ شَعْبًا كَثِيرًا.","21":"فَالآنَ لاَ تَخَافُوا. أَنَا أَعُولُكُمْ وَأَوْلاَدَكُمْ». فَعَزَّاهُمْ وَطَيَّبَ قُلُوبَهُمْ."},"40.9":{"24":"فَلِلْوَقْتِ صَرَخَ أَبُو الْوَلَدِ بِدُمُوعٍ وَقَالَ:«أُومِنُ يَا سَيِّدُ، فَأَعِنْ عَدَمَ إِيمَانِي».","14":"وَلَمَّا جَاءَ إِلَى التَّلاَمِيذِ رَأَى جَمْعًا كَثِيرًا حَوْلَهُمْ وَكَتَبَةً يُحَاوِرُونَهُمْ.","15":"وَلِلْوَقْتِ كُلُّ الْجَمْعِ لَمَّا رَأَوْهُ تَحَيَّرُوا، وَرَكَضُوا وَسَلَّمُوا عَلَيْهِ.","16":"فَسَأَلَ الْكَتَبَةَ:«بِمَاذَا تُحَاوِرُونَهُمْ؟»","17":"فَأَجَابَ وَاحِدٌ مِنَ الْجَمْعِ وَقَالَ :«يَا مُعَلِّمُ، قَدْ قَدَّمْتُ إِلَيْكَ ابْنِي بِهِ رُوحٌ أَخْرَسُ،","18":"وَحَيْثُمَا أَدْرَكَهُ يُمَزِّقْهُ فَيُزْبِدُ وَيَصِرُّ بِأَسْنَانِهِ وَيَيْبَسُ. فَقُلْتُ لِتَلاَمِيذِكَ أَنْ يُخْرِجُوهُ فَلَمْ يَقْدِرُوا».","19":"فَأَجَابَ وَقَالَ لَهُمْ:«أَيُّهَا الْجِيلُ غَيْرُ الْمُؤْمِنِ، إِلَى مَتَى أَكُونُ مَعَكُمْ؟ إِلَى مَتَى أَحْتَمِلُكُمْ؟ قَدِّمُوهُ إِلَيَّ!».","20":"فَقَدَّمُوهُ إِلَيْهِ. فَلَمَّا رَآهُ لِلْوَقْتِ صَرَعَهُ الرُّوحُ، فَوَقَعَ عَلَى الأَرْضِ يَتَمَرَّغُ وَيُزْبِدُ.","21":"فَسَأَلَ أَبَاهُ:«كَمْ مِنَ الزَّمَانِ مُنْذُ أَصَابَهُ هذَا؟» فَقَالَ: «مُنْذُ صِبَاهُ.","22":"وَكَثِيرًا مَا أَلْقَاهُ فِي النَّارِ وَفِي الْمَاءِ لِيُهْلِكَهُ. لكِنْ إِنْ كُنْتَ تَسْتَطِيعُ شَيْئًا فَتَحَنَّنْ عَلَيْنَا وَأَعِنَّا».","23":"فَقَالَ لَهُ يَسُوعُ:«إِنْ كُنْتَ تَسْتَطِيعُ أَنْ تُؤْمِنَ. كُلُّ شَيْءٍ مُسْتَطَاعٌ لِلْمُؤْمِنِ».","25":"فَلَمَّا رَأَى يَسُوعُ أَنَّ الْجَمْعَ يَتَرَاكَضُونَ، انْتَهَرَ الرُّوحَ النَّجِسَ قَائِلاً لَهُ:«أَيُّهَا الرُّوحُ الأَخْرَسُ الأَصَمُّ، أَنَا آمُرُكَ: اخْرُجْ مِنْهُ وَلاَ تَدْخُلْهُ أَيْضًا!»","26":"فَصَرَخَ وَصَرَعَهُ شَدِيدًا وَخَرَجَ. فَصَارَ كَمَيْتٍ، حَتَّى قَالَ كَثِيرُونَ: «إِنَّهُ مَاتَ!».","27":"فَأَمْسَكَهُ يَسُوعُ بِيَدِهِ وَأَقَامَهُ، فَقَامَ.","28":"وَلَمَّا دَخَلَ بَيْتًا سَأَلَهُ تَلاَمِيذُهُ عَلَى انْفِرَادٍ:«لِمَاذَا لَمْ نَقْدِرْ نَحْنُ أَنْ نُخْرِجَهُ؟»","29":"فَقَالَ لَهُمْ:«هذَا الْجِنْسُ لاَ يُمْكِنُ أَنْ يَخْرُجَ بِشَيْءٍ إِلاَّ بِالصَّلاَةِ وَالصَّوْمِ»."},"57.11":{"1":"وَأَمَّا الإِيمَانُ فَهُوَ الثِّقَةُ بِمَا يُرْجَى وَالإِيقَانُ بِأُمُورٍ لاَ تُرَى."},"41.11":{"9":"وَأَنَا أَقُولُ لَكُمُ: اسْأَلُوا تُعْطَوْا، اُطْلُبُوا تَجِدُوا، اِقْرَعُوا يُفْتَحْ لَكُمْ.","10":"لأَنَّ كُلَّ مَنْ يَسْأَلُ يَأْخُذُ، وَمَنْ يَطْلُبُ يَجِدُ، وَمَنْ يَقْرَعُ يُفْتَحُ لَهُ."},"40.11":{"24":"لِذلِكَ أَقُولُ لَكُمْ: كُلُّ مَا تَطْلُبُونَهُ حِينَمَا تُصَلُّونَ، فَآمِنُوا أَنْ تَنَالُوهُ، فَيَكُونَ لَكُمْ.","25":"وَمَتَى وَقَفْتُمْ تُصَلُّونَ، فَاغْفِرُوا إِنْ كَانَ لَكُمْ عَلَى أَحَدٍ شَيْءٌ، لِكَيْ يَغْفِرَ لَكُمْ أَيْضًا أَبُوكُمُ الَّذِي فِي السَّمَاوَاتِ زَّلاَتِكُمْ."},"39.17":{"20":"فَقَالَ لَهُمْ يَسُوعُ:«لِعَدَمِ إِيمَانِكُمْ. فَالْحَقَّ أَقُولُ لَكُمْ: لَوْ كَانَ لَكُمْ إِيمَانٌ مِثْلُ حَبَّةِ خَرْدَل لَكُنْتُمْ تَقُولُونَ لِهذَا الْجَبَلِ: انْتَقِلْ مِنْ هُنَا إِلَى هُنَاكَ فَيَنْتَقِلُ، وَلاَ يَكُونُ شَيْءٌ غَيْرَ مُمْكِنٍ لَدَيْكُمْ."},"44.10":{"17":"إِذًا الإِيمَانُ بِالْخَبَرِ، وَالْخَبَرُ بِكَلِمَةِ اللهِ.","11":"لأَنَّ الْكِتَابَ يَقُولُ:«كُلُّ مَنْ يُؤْمِنُ بِهِ لاَ يُخْزَى»."},"42.7":{"17":"إِنْ شَاءَ أَحَدٌ أَنْ يَعْمَلَ مَشِيئَتَهُ يَعْرِفُ التَّعْلِيمَ، هَلْ هُوَ مِنَ اللهِ، أَمْ أَتَكَلَّمُ أَنَا مِنْ نَفْسِي.","37":"وَفِي الْيَوْمِ الأَخِيرِ الْعَظِيمِ مِنَ الْعِيدِ وَقَفَ يَسُوعُ وَنَادَى قِائِلاً:«إِنْ عَطِشَ أَحَدٌ فَلْيُقْبِلْ إِلَيَّ وَيَشْرَبْ.","38":"مَنْ آمَنَ بِي، كَمَا قَالَ الْكِتَابُ، تَجْرِي مِنْ بَطْنِهِ أَنْهَارُ مَاءٍ حَيٍّ»."},"4.4":{"29":"ثُمَّ إِنْ طَلَبْتَ مِنْ هُنَاكَ الرَّبَّ إِلهَكَ تَجِدْهُ إِذَا الْتَمَسْتَهُ بِكُلِّ قَلْبِكَ وَبِكُلِّ نَفْسِكَ."},"64.1":{"22":"وَارْحَمُوا الْبَعْضَ مُمَيِّزِينَ،"},"42.1":{"45":"فِيلُبُّسُ وَجَدَ نَثَنَائِيلَ وَقَالَ لَهُ:«وَجَدْنَا الَّذِي كَتَبَ عَنْهُ مُوسَى فِي النَّامُوسِ وَالأَنْبِيَاءُ يَسُوعَ ابْنَ يُوسُفَ الَّذِي مِنَ النَّاصِرَةِ».","46":"فَقَالَ لَهُ نَثَنَائِيلُ:«أَمِنَ النَّاصِرَةِ يُمْكِنُ أَنْ يَكُونَ شَيْءٌ صَالِحٌ؟» قَالَ لَهُ فِيلُبُّسُ:«تَعَالَ وَانْظُرْ».","47":"وَرَأَى يَسُوعُ نَثَنَائِيلَ مُقْبِلاً إِلَيْهِ، فَقَالَ عَنْهُ:«هُوَذَا إِسْرَائِيلِيٌّ حَقًّا لاَ غِشَّ فِيهِ».","48":"قَالَ لَهُ نَثَنَائِيلُ:«مِنْ أَيْنَ تَعْرِفُنِي؟» أَجَابَ يَسُوعُ وَقَالَ لَهُ:«قَبْلَ أَنْ دَعَاكَ فِيلُبُّسُ وَأَنْتَ تَحْتَ التِّينَةِ، رَأَيْتُكَ».","49":"أَجَابَ نَثَنَائِيلُ وَقَالَ لَهُ:«يَا مُعَلِّمُ، أَنْتَ ابْنُ اللهِ! أَنْتَ مَلِكُ إِسْرَائِيلَ!»","12":"وَأَمَّا كُلُّ الَّذِينَ قَبِلُوهُ فَأَعْطَاهُمْ سُلْطَانًا أَنْ يَصِيرُوا أَوْلاَدَ اللهِ، أَيِ الْمُؤْمِنُونَ بِاسْمِهِ."},"51.5":{"16":"افْرَحُوا كُلَّ حِينٍ.","17":"صَلُّوا بِلاَ انْقِطَاعٍ.","18":"اشْكُرُوا فِي كُلِّ شَيْءٍ، لأَنَّ هذِهِ هِيَ مَشِيئَةُ اللهِ فِي الْمَسِيحِ يَسُوعَ مِنْ جِهَتِكُمْ."},"18.100":{"4":"ادْخُلُوا أَبْوَابَهُ بِحَمْدٍ، دِيَارَهُ بِالتَّسْبِيحِ. احْمَدُوهُ، بَارِكُوا اسْمَهُ.","5":"لأَنَّ الرَّبَّ صَالِحٌ، إِلَى الأَبَدِ رَحْمَتُهُ، وَإِلَى دَوْرٍ فَدَوْرٍ أَمَانَتُهُ.","3":"اعْلَمُوا أَنَّ الرَّبَّ هُوَ اللهُ. هُوَ صَنَعَنَا، وَلَهُ نَحْنُ شَعْبُهُ وَغَنَمُ مَرْعَاهُ.","1":"اِهْتِفِي لِلرَّبِّ يَا كُلَّ الأَرْضِ.","2":"اعْبُدُوا الرَّبَّ بِفَرَحٍ. ادْخُلُوا إِلَى حَضْرَتِهِ بِتَرَنُّمٍ."},"18.92":{"1":"حَسَنٌ هُوَ الْحَمْدُ لِلرَّبِّ وَالتَّرَنُّمُ لاسْمِكَ أَيُّهَا الْعَلِيُّ.","12":"اَلصِّدِّيقُ كَالنَّخْلَةِ يَزْهُو، كَالأَرْزِ فِي لُبْنَانَ يَنْمُو.","13":"مَغْرُوسِينَ فِي بَيْتِ الرَّبِّ، فِي دِيَارِ إِلهِنَا يُزْهِرُونَ.","14":"أَيْضًا يُثْمِرُونَ فِي الشَّيْبَةِ. يَكُونُونَ دِسَامًا وَخُضْرًا،"},"18.136":{"1":"اِحْمَدُوا الرَّبَّ لأَنَّهُ صَالِحٌ، لأَنَّ إِلَى الأَبَدِ رَحْمَتَهُ."},"48.5":{"20":"شَاكِرِينَ كُلَّ حِينٍ عَلَى كُلِّ شَيْءٍ فِي اسْمِ رَبِّنَا يَسُوعَ الْمَسِيحِ، للهِِ وَالآبِ."},"12.16":{"34":"احْمَدُوا الرَّبَّ لأَنَّهُ صَالِحٌ، لأَنَّ إِلَى الأَبَدِ رَحْمَتَهُ."},"50.4":{"2":"وَاظِبُوا عَلَى الصَّلاَةِ سَاهِرِينَ فِيهَا بِالشُّكْرِ،"},"18.95":{"2":"نَتَقَدَّمُ أَمَامَهُ بِحَمْدٍ، وَبِتَرْنِيمَاتٍ نَهْتِفُ لَهُ."},"8.2":{"1":"فَصَلَّتْ حَنَّةُ وَقَالَتْ: «فَرِحَ قَلْبِي بِالرَّبِّ. ارْتَفَعَ قَرْنِي بِالرَّبِّ. اتَّسَعَ فَمِي عَلَى أَعْدَائِي، لأَنِّي قَدِ ابْتَهَجْتُ بِخَلاَصِكَ.","2":"لَيْسَ قُدُّوسٌ مِثْلَ الرَّبِّ، لأَنَّهُ لَيْسَ غَيْرَكَ، وَلَيْسَ صَخْرَةٌ مِثْلَ إِلهِنَا.","3":"لاَ تُكَثِّرُوا الْكَلاَمَ الْعَالِيَ الْمُسْتَعْلِيَ، وَلْتَبْرَحْ وَقَاحَةٌ مِنْ أَفْوَاهِكُمْ. لأَنَّ الرَّبَّ إِلهٌ عَلِيمٌ، وَبِهِ تُوزَنُ الأَعْمَالُ.","4":"قِسِيُّ الْجَبَابِرَةِ انْحَطَمَتْ، وَالضُّعَفَاءُ تَمَنْطَقُوا بِالْبَأْسِ.","5":"الشَّبَاعَى آجَرُوا أَنْفُسَهُمْ بِالْخُبْزِ، وَالْجِيَاعُ كَفُّوا. حَتَّى أَنَّ الْعَاقِرَ وَلَدَتْ سَبْعَةً، وَكَثِيرَةَ الْبَنِينَ ذَبُلَتْ.","6":"الرَّبُّ يُمِيتُ وَيُحْيِي. يُهْبِطُ إِلَى الْهَاوِيَةِ وَيُصْعِدُ.","7":"الرَّبُّ يُفْقِرُ وَيُغْنِي. يَضَعُ وَيَرْفَعُ.","8":"يُقِيمُ الْمِسْكِينَ مِنَ التُّرَابِ. يَرْفَعُ الْفَقِيرَ مِنَ الْمَزْبَلَةِ لِلْجُلُوسِ مَعَ الشُّرَفَاءِ وَيُمَلِّكُهُمْ كُرْسِيَّ الْمَجْدِ. لأَنَّ لِلرَّبِّ أَعْمِدَةَ الأَرْضِ، وَقَدْ وَضَعَ عَلَيْهَا الْمَسْكُونَةَ.","9":"أَرْجُلَ أَتْقِيَائِهِ يَحْرُسُ، وَالأَشْرَارُ فِي الظَّلاَمِ يَصْمُتُونَ. لأَنَّهُ لَيْسَ بِالْقُوَّةِ يَغْلِبُ إِنْسَانٌ.","10":"مُخَاصِمُو الرَّبِّ يَنْكَسِرُونَ. مِنَ السَّمَاءِ يُرْعِدُ عَلَيْهِمْ. الرَّبُّ يَدِينُ أَقَاصِيَ الأَرْضِ، وَيُعْطِي عِزًّا لِمَلِكِهِ، وَيَرْفَعُ قَرْنَ مَسِيحِهِ»."},"41.2":{"25":"وَكَانَ رَجُلٌ فِي أُورُشَلِيمَ اسْمُهُ سِمْعَانُ، وَهَذَا الرَّجُلُ كَانَ بَارًّا تَقِيًّا يَنْتَظِرُ تَعْزِيَةَ إِسْرَائِيلَ، وَالرُّوحُ الْقُدُسُ كَانَ عَلَيْهِ.","26":"وَكَانَ قَدْ أُوحِيَ إِلَيْهِ بِالرُّوحِ الْقُدُسِ أَنَّهُ لاَ يَرَى الْمَوْتَ قَبْلَ أَنْ يَرَى مَسِيحَ الرَّبِّ.","27":"فَأَتَى بِالرُّوحِ إِلَى الْهَيْكَلِ. وَعِنْدَمَا دَخَلَ بِالصَّبِيِّ يَسُوعَ أَبَوَاهُ، لِيَصْنَعَا لَهُ حَسَبَ عَادَةِ النَّامُوسِ،","28":"أَخَذَهُ عَلَى ذِرَاعَيْهِ وَبَارَكَ اللهَ وَقَالَ:","29":"«الآنَ تُطْلِقُ عَبْدَكَ يَا سَيِّدُ حَسَبَ قَوْلِكَ بِسَلاَمٍ،","30":"لأَنَّ عَيْنَيَّ قَدْ أَبْصَرَتَا خَلاَصَكَ،","31":"الَّذِي أَعْدَدْتَهُ قُدَّامَ وَجْهِ جَمِيعِ الشُّعُوبِ.","32":"نُورَ إِعْلاَنٍ لِلأُمَمِ، وَمَجْدًا لِشَعْبِكَ إِسْرَائِيلَ».","33":"وَكَانَ يُوسُفُ وَأُمُّهُ يَتَعَجَّبَانِ مِمَّا قِيلَ فِيهِ.","34":"وَبَارَكَهُمَا سِمْعَانُ، وَقَالَ لِمَرْيَمَ أُمِّهِ:«هَا إِنَّ هذَا قَدْ وُضِعَ لِسُقُوطِ وَقِيَامِ كَثِيرِينَ فِي إِسْرَائِيلَ، وَلِعَلاَمَةٍ تُقَاوَمُ.","35":"وَأَنْتِ أَيْضًا يَجُوزُ فِي نَفْسِكِ سَيْفٌ، لِتُعْلَنَ أَفْكَارٌ مِنْ قُلُوبٍ كَثِيرَةٍ».","36":"وَكَانَتْ نَبِيَّةٌ، حَنَّةُ بِنْتُ فَنُوئِيلَ مِنْ سِبْطِ أَشِيرَ، وَهِيَ مُتَقدِّمَةٌ فِي أَيَّامٍ كَثِيرَةٍ، قَدْ عَاشَتْ مَعَ زَوْجٍ سَبْعَ سِنِينَ بَعْدَ بُكُورِيَّتِهَا.","37":"وَهِيَ أَرْمَلَةٌ نَحْوَ أَرْبَعٍ وَثَمَانِينَ سَنَةً، لاَ تُفَارِقُ الْهَيْكَلَ، عَابِدَةً بِأَصْوَامٍ وَطَلِبَاتٍ لَيْلاً وَنَهَارًا.","38":"فَهِيَ فِي تِلْكَ السَّاعَةِ وَقَفَتْ تُسَبِّحُ الرَّبَّ، وَتَكَلَّمَتْ عَنْهُ مَعَ جَمِيعِ الْمُنْتَظِرِينَ فِدَاءً فِي أُورُشَلِيمَ.","41":"وَكَانَ أَبَوَاهُ يَذْهَبَانِ كُلَّ سَنَةٍ إِلَى أُورُشَلِيمَ فِي عِيدِ الْفِصْحِ.","42":"وَلَمَّا كَانَتْ لَهُ اثْنَتَا عَشْرَةَ سَنَةً صَعِدُوا إِلَى أُورُشَلِيمَ كَعَادَةِ الْعِيدِ.","43":"وَبَعْدَمَا أَكْمَلُوا الأَيَّامَ بَقِيَ عِنْدَ رُجُوعِهِمَا الصَّبِيُّ يَسُوعُ فِي أُورُشَلِيمَ، وَيُوسُفُ وَأُمُّهُ لَمْ يَعْلَمَا.","44":"وَإِذْ ظَنَّاهُ بَيْنَ الرُّفْقَةِ، ذَهَبَا مَسِيرَةَ يَوْمٍ، وَكَانَا يَطْلُبَانِهِ بَيْنَ الأَقْرِبَاءِ وَالْمَعَارِفِ.","45":"وَلَمَّا لَمْ يَجِدَاهُ رَجَعَا إِلَى أُورُشَلِيمَ يَطْلُبَانِهِ.","46":"وَبَعْدَ ثَلاَثَةِ أَيَّامٍ وَجَدَاهُ فِي الْهَيْكَلِ، جَالِسًا فِي وَسْطِ الْمُعَلِّمِينَ، يَسْمَعُهُمْ وَيَسْأَلُهُمْ.","47":"وَكُلُّ الَّذِينَ سَمِعُوهُ بُهِتُوا مِنْ فَهْمِهِ وَأَجْوِبَتِهِ.","48":"فَلَمَّا أَبْصَرَاهُ انْدَهَشَا. وَقَالَتْ لَهُ أُمُّهُ:«يَا بُنَيَّ، لِمَاذَا فَعَلْتَ بِنَا هكَذَا؟ هُوَذَا أَبُوكَ وَأَنَا كُنَّا نَطْلُبُكَ مُعَذَّبَيْنِ!»","49":"فَقَالَ لَهُمَا:«لِمَاذَا كُنْتُمَا تَطْلُبَانِنِي؟ أَلَمْ تَعْلَمَا أَنَّهُ يَنْبَغِي أَنْ أَكُونَ فِي مَا لأَبِي؟».","50":"فَلَمْ يَفْهَمَا الْكَلاَمَ الَّذِي قَالَهُ لَهُمَا.","51":"ثُمَّ نَزَلَ مَعَهُمَا وَجَاءَ إِلَى النَّاصِرَةِ وَكَانَ خَاضِعًا لَهُمَا. وَكَانَتْ أُمُّهُ تَحْفَظُ جَمِيعَ هذِهِ الأُمُورِ فِي قَلْبِهَا.","52":"وَأَمَّا يَسُوعُ فَكَانَ يَتَقَدَّمُ فِي الْحِكْمَةِ وَالْقَامَةِ وَالنِّعْمَةِ، عِنْدَ اللهِ وَالنَّاسِ.","8":"وَكَانَ فِي تِلْكَ الْكُورَةِ رُعَاةٌ مُتَبَدِّينَ يَحْرُسُونَ حِرَاسَاتِ اللَّيْلِ عَلَى رَعِيَّتِهِمْ،","9":"وَإِذَا مَلاَكُ الرَّبِّ وَقَفَ بِهِمْ، وَمَجْدُ الرَّبِّ أَضَاءَ حَوْلَهُمْ، فَخَافُوا خَوْفًا عَظِيمًا.","10":"فَقَالَ لَهُمُ الْمَلاَكُ:«لاَ تَخَافُوا! فَهَا أَنَا أُبَشِّرُكُمْ بِفَرَحٍ عَظِيمٍ يَكُونُ لِجَمِيعِ الشَّعْبِ:","11":"أَنَّهُ وُلِدَ لَكُمُ الْيَوْمَ فِي مَدِينَةِ دَاوُدَ مُخَلِّصٌ هُوَ الْمَسِيحُ الرَّبُّ.","12":"وَهذِهِ لَكُمُ الْعَلاَمَةُ: تَجِدُونَ طِفْلاً مُقَمَّطًا مُضْجَعًا فِي مِذْوَدٍ».","13":"وَظَهَرَ بَغْتَةً مَعَ الْمَلاَكِ جُمْهُورٌ مِنَ الْجُنْدِ السَّمَاوِيِّ مُسَبِّحِينَ اللهَ وَقَائِلِينَ:","14":"«الْمَجْدُ للهِ فِي الأَعَالِي، وَعَلَى الأَرْضِ السَّلاَمُ، وَبِالنَّاسِ الْمَسَرَّةُ».","15":"وَلَمَّا مَضَتْ عَنْهُمُ الْمَلاَئِكَةُ إِلَى السَّمَاءِ، قَالَ الرجال الرُّعَاةُ بَعْضُهُمْ لِبَعْضٍ:«لِنَذْهَبِ الآنَ إِلَى بَيْتِ لَحْمٍ وَنَنْظُرْ هذَا الأَمْرَ الْوَاقِعَ الَّذِي أَعْلَمَنَا بِهِ الرَّبُّ».","16":"فَجَاءُوا مُسْرِعِينَ، وَوَجَدُوا مَرْيَمَ وَيُوسُفَ وَالطِّفْلَ مُضْجَعًا فِي الْمِذْوَدِ.","17":"فَلَمَّا رَأَوْهُ أَخْبَرُوا بِالْكَلاَمِ الَّذِي قِيلَ لَهُمْ عَنْ هذَا الصَّبِيِّ.","18":"وَكُلُّ الَّذِينَ سَمِعُوا تَعَجَّبُوا مِمَّا قِيلَ لَهُمْ مِنَ الرُّعَاةِ.","19":"وَأَمَّا مَرْيَمُ فَكَانَتْ تَحْفَظُ جَمِيعَ هذَا الْكَلاَمِ مُتَفَكِّرَةً بِهِ فِي قَلْبِهَا.","20":"ثُمَّ رَجَعَ الرُّعَاةُ وَهُمْ يُمَجِّدُونَ اللهَ وَيُسَبِّحُونَهُ عَلَى كُلِّ مَا سَمِعُوهُ وَرَأَوْهُ كَمَا قِيلَ لَهُمْ."},"19.24":{"16":"لأَنَّ الصِّدِّيقَ يَسْقُطُ سَبْعَ مَرَّاتٍ وَيَقُومُ، أَمَّا الأَشْرَارُ فَيَعْثُرُونَ بِالشَّرِّ.","3":"بِالْحِكْمَةِ يُبْنَى الْبَيْتُ وَبِالْفَهْمِ يُثَبَّتُ،","4":"وَبِالْمَعْرِفَةِ تَمْتَلِئُ الْمَخَادِعُ مِنْ كُلِّ ثَرْوَةٍ كَرِيمَةٍ وَنَفِيسَةٍ."},"49.3":{"13":"أَيُّهَا الإِخْوَةُ، أَنَا لَسْتُ أَحْسِبُ نَفْسِي أَنِّي قَدْ أَدْرَكْتُ. وَلكِنِّي أَفْعَلُ شَيْئًا وَاحِدًا: إِذْ أَنَا أَنْسَى مَا هُوَ وَرَاءُ وَأَمْتَدُّ إِلَى مَا هُوَ قُدَّامُ،","14":"أَسْعَى نَحْوَ الْغَرَضِ لأَجْلِ جَعَالَةِ دَعْوَةِ اللهِ الْعُلْيَا فِي الْمَسِيحِ يَسُوعَ.","8":"بَلْ إِنِّي أَحْسِبُ كُلَّ شَيْءٍ أَيْضًا خَسَارَةً مِنْ أَجْلِ فَضْلِ مَعْرِفَةِ الْمَسِيحِ يَسُوعَ رَبِّي، الَّذِي مِنْ أَجْلِهِ خَسِرْتُ كُلَّ الأَشْيَاءِ، وَأَنَا أَحْسِبُهَا نُفَايَةً لِكَيْ أَرْبَحَ الْمَسِيحَ،"},"57.12":{"1":"لِذلِكَ نَحْنُ أَيْضًا إِذْ لَنَا سَحَابَةٌ مِنَ الشُّهُودِ مِقْدَارُ هذِهِ مُحِيطَةٌ بِنَا، لِنَطْرَحْ كُلَّ ثِقْل، وَالْخَطِيَّةَ الْمُحِيطَةَ بِنَا بِسُهُولَةٍ، وَلْنُحَاضِرْ بِالصَّبْرِ فِي الْجِهَادِ الْمَوْضُوعِ أَمَامَنَا،","15":"مُلاَحِظِينَ لِئَلاَّ يَخِيبَ أَحَدٌ مِنْ نِعْمَةِ اللهِ. لِئَلاَّ يَطْلُعَ أَصْلُ مَرَارَةٍ وَيَصْنَعَ انْزِعَاجًا، فَيَتَنَجَّسَ بِهِ كَثِيرُونَ.","2":"نَاظِرِينَ إِلَى رَئِيسِ الإِيمَانِ وَمُكَمِّلِهِ يَسُوعَ، الَّذِي مِنْ أَجْلِ السُّرُورِ الْمَوْضُوعِ أَمَامَهُ، احْتَمَلَ الصَّلِيبَ مُسْتَهِينًا بِالْخِزْيِ، فَجَلَسَ فِي يَمِينِ عَرْشِ اللهِ."},"31.3":{"1":"ثُمَّ صَارَ قَوْلُ الرَّبِّ إِلَى يُونَانَ ثَانِيَةً قَائِلاً:","2":"«قُمِ اذْهَبْ إِلَى نِينَوَى الْمَدِينَةِ الْعَظِيمَةِ، وَنَادِ لَهَا الْمُنَادَاةَ الَّتِي أَنَا مُكَلِّمُكَ بِهَا».","3":"فَقَامَ يُونَانُ وَذَهَبَ إِلَى نِينَوَى بِحَسَبِ قَوْلِ الرَّبِّ. أَمَّا نِينَوَى فَكَانَتْ مَدِينَةً عَظِيمَةً للهِِ مَسِيرَةَ ثَلاَثَةِ أَيَّامٍ.","4":"فَابْتَدَأَ يُونَانُ يَدْخُلُ الْمَدِينَةَ مَسِيرَةَ يَوْمٍ وَاحِدٍ، وَنَادَى وَقَالَ: «بَعْدَ أَرْبَعِينَ يَوْمًا تَنْقَلِبُ نِينَوَى».","5":"فَآمَنَ أَهْلُ نِينَوَى بِاللهِ وَنَادَوْا بِصَوْمٍ وَلَبِسُوا مُسُوحًا مِنْ كَبِيرِهِمْ إِلَى صَغِيرِهِمْ.","6":"وَبَلَغَ الأَمْرُ مَلِكَ نِينَوَى، فَقَامَ عَنْ كُرْسِيِّهِ وَخَلَعَ رِدَاءَهُ عَنْهُ، وَتَغَطَّى بِمِسْحٍ وَجَلَسَ عَلَى الرَّمَادِ.","7":"وَنُودِيَ وَقِيلَ فِي نِينَوَى عَنْ أَمْرِ الْمَلِكِ وَعُظَمَائِهِ قَائِلاً: «لاَ تَذُقِ النَّاسُ وَلاَ الْبَهَائِمُ وَلاَ الْبَقَرُ وَلاَ الْغَنَمُ شَيْئًا. لاَ تَرْعَ وَلاَ تَشْرَبْ مَاءً.","8":"وَلْيَتَغَطَّ بِمُسُوحٍ النَّاسُ وَالْبَهَائِمُ، وَيَصْرُخُوا إِلَى اللهِ بِشِدَّةٍ، وَيَرْجِعُوا كُلُّ وَاحِدٍ عَنْ طَرِيقِهِ الرَّدِيئَةِ وَعَنِ الظُّلْمِ الَّذِي فِي أَيْدِيهِمْ،","9":"لَعَلَّ اللهَ يَعُودُ وَيَنْدَمُ وَيَرْجعُ عَنْ حُمُوِّ غَضَبِهِ فَلاَ نَهْلِكَ».","10":"فَلَمَّا رَأَى اللهُ أَعْمَالَهُمْ أَنَّهُمْ رَجَعُوا عَنْ طَرِيقِهِمِ الرَّدِيئَةِ، نَدِمَ اللهُ عَلَى الشَّرِّ الَّذِي تَكَلَّمَ أَنْ يَصْنَعَهُ بِهِمْ، فَلَمْ يَصْنَعْهُ."},"43.15":{"36":"ثُمَّ بَعْدَ أَيَّامٍ قَالَ بُولُسُ لِبَرْنَابَا:«لِنَرْجِعْ وَنَفْتَقِدْ إِخْوَتَنَا فِي كُلِّ مَدِينَةٍ نَادَيْنَا فِيهَا بِكَلِمَةِ الرَّبِّ، كَيْفَ هُمْ».","37":"فَأَشَارَ بَرْنَابَا أَنْ يَأْخُذَا مَعَهُمَا أَيْضًا يُوحَنَّا الَّذِي يُدْعَى مَرْقُسَ،","38":"وَأَمَّا بُولُسُ فَكَانَ يَسْتَحْسِنُ أَنَّ الَّذِي فَارَقَهُمَا مِنْ بَمْفِيلِيَّةَ وَلَمْ يَذْهَبْ مَعَهُمَا لِلْعَمَلِ، لاَ يَأْخُذَانِهِ مَعَهُمَا.","39":"فَحَصَلَ بَيْنَهُمَا مُشَاجَرَةٌ حَتَّى فَارَقَ أَحَدُهُمَا الآخَرَ. وَبَرْنَابَا أَخَذَ مَرْقُسَ وَسَافَرَ فِي الْبَحْرِ إِلَى قُبْرُسَ.","40":"وَأَمَّا بُولُسُ فَاخْتَارَ سِيلاَ وَخَرَجَ مُسْتَوْدَعًا مِنَ الإِخْوَةِ إِلَى نِعْمَةِ اللهِ.","41":"فَاجْتَازَ فِي سُورِيَّةَ وَكِيلِيكِيَّةَ يُشَدِّدُ الْكَنَائِسَ."},"1.2":{"11":"وَحَدَثَ فِي تِلْكَ الأَيَّامِ لَمَّا كَبِرَ مُوسَى أَنَّهُ خَرَجَ إِلَى إِخْوَتِهِ لِيَنْظُرَ فِي أَثْقَالِهِمْ، فَرَأَى رَجُلاً مِصْرِيًّا يَضْرِبُ رَجُلاً عِبْرَانِيًّا مِنْ إِخْوَتِهِ،","12":"فَالْتَفَتَ إِلَى هُنَا وَهُنَاكَ وَرَأَى أَنْ لَيْسَ أَحَدٌ، فَقَتَلَ الْمِصْرِيَّ وَطَمَرَهُ فِي الرَّمْلِ.","13":"ثُمَّ خَرَجَ فِي الْيَوْمِ الثَّانِي وَإِذَا رَجُلاَنِ عِبْرَانِيَّانِ يَتَخَاصَمَانِ، فَقَالَ لِلْمُذْنِبِ: «لِمَاذَا تَضْرِبُ صَاحِبَكَ؟»","14":"فَقَالَ: «مَنْ جَعَلَكَ رَئِيسًا وَقَاضِيًا عَلَيْنَا؟ أَمُفْتَكِرٌ أَنْتَ بِقَتْلِي كَمَا قَتَلْتَ الْمِصْرِيَّ؟». فَخَافَ مُوسَى وَقَالَ: «حَقًّا قَدْ عُرِفَ الأَمْرُ».","15":"فَسَمِعَ فِرْعَوْنُ هذَا الأَمْرَ، فَطَلَبَ أَنْ يَقْتُلَ مُوسَى. فَهَرَبَ مُوسَى مِنْ وَجْهِ فِرْعَوْنَ وَسَكَنَ فِي أَرْضِ مِدْيَانَ، وَجَلَسَ عِنْدَ الْبِئْرِ.","1":"وَذَهَبَ رَجُلٌ مِنْ بَيْتِ لاَوِي وَأَخَذَ بِنْتَ لاَوِي،","2":"فَحَبِلَتِ الْمَرْأَةُ وَوَلَدَتِ ابْنًا. وَلَمَّا رَأَتْهُ أَنَّهُ حَسَنٌ، خَبَّأَتْهُ ثَلاَثَةَ أَشْهُرٍ.","3":"وَلَمَّا لَمْ يُمْكِنْهَا أَنْ تُخَبِّئَهُ بَعْدُ، أَخَذَتْ لَهُ سَفَطًا مِنَ الْبَرْدِيِّ وَطَلَتْهُ بِالْحُمَرِ وَالزِّفْتِ، وَوَضَعَتِ الْوَلَدَ فِيهِ، وَوَضَعَتْهُ بَيْنَ الْحَلْفَاءِ عَلَى حَافَةِ النَّهْرِ.","4":"وَوَقَفَتْ أُخْتُهُ مِنْ بَعِيدٍ لِتَعْرِفَ مَاذَا يُفْعَلُ بِهِ.","5":"فَنَزَلَتِ ابْنَةُ فِرْعَوْنَ إِلَى النَّهْرِ لِتَغْتَسِلَ، وَكَانَتْ جَوَارِيهَا مَاشِيَاتٍ عَلَى جَانِبِ النَّهْرِ. فَرَأَتِ السَّفَطَ بَيْنَ الْحَلْفَاءِ، فَأَرْسَلَتْ أَمَتَهَا وَأَخَذَتْهُ.","6":"وَلَمَّا فَتَحَتْهُ رَأَتِ الْوَلَدَ، وَإِذَا هُوَ صَبِيٌّ يَبْكِي. فَرَقَّتْ لَهُ وَقَالَتْ: «هذَا مِنْ أَوْلاَدِ الْعِبْرَانِيِّينَ».","7":"فَقَالَتْ أُخْتُهُ لابْنَةِ فِرْعَوْنَ: «هَلْ أَذْهَبُ وَأَدْعُو لَكِ امْرَأَةً مُرْضِعَةً مِنَ الْعِبْرَانِيَّاتِ لِتُرْضِعَ لَكِ الْوَلَدَ؟»","8":"فَقَالَتْ لَهَا ابْنَةُ فِرْعَوْنَ: «اذْهَبِي». فَذَهَبَتِ الْفَتَاةُ وَدَعَتْ أُمَّ الْوَلَدِ.","9":"فَقَالَتْ لَهَا ابْنَةُ فِرْعَوْنَ: «اذْهَبِي بِهذَا الْوَلَدِ وَأَرْضِعِيهِ لِي وَأَنَا أُعْطِي أُجْرَتَكِ». فَأَخَذَتِ الْمَرْأَةُ الْوَلَدَ وَأَرْضَعَتْهُ.","10":"وَلَمَّا كَبِرَ الْوَلَدُ جَاءَتْ بِهِ إِلَى ابْنَةِ فِرْعَوْنَ فَصَارَ لَهَا ابْنًا، وَدَعَتِ اسْمَهُ «مُوسَى» وَقَالَتْ: «إِنِّي انْتَشَلْتُهُ مِنَ الْمَاءِ»."},"42.15":{"16":"لَيْسَ أَنْتُمُ اخْتَرْتُمُونِي بَلْ أَنَا اخْتَرْتُكُمْ، وَأَقَمْتُكُمْ لِتَذْهَبُوا وَتَأْتُوا بِثَمَرٍ، وَيَدُومَ ثَمَرُكُمْ، لِكَيْ يُعْطِيَكُمُ الآبُ كُلَّ مَا طَلَبْتُمْ بِاسْمِي.","11":"كَلَّمْتُكُمْ بِهذَا لِكَيْ يَثْبُتَ فَرَحِي فِيكُمْ وَيُكْمَلَ فَرَحُكُمْ.","12":"«هذِهِ هِيَ وَصِيَّتِي أَنْ تُحِبُّوا بَعْضُكُمْ بَعْضًا كَمَا أَحْبَبْتُكُمْ.","13":"لَيْسَ لأَحَدٍ حُبٌّ أَعْظَمُ مِنْ هذَا: أَنْ يَضَعَ أَحَدٌ نَفْسَهُ لأَجْلِ أَحِبَّائِهِ."},"61.3":{"1":"اُنْظُرُوا أَيَّةَ مَحَبَّةٍ أَعْطَانَا الآبُ حَتَّى نُدْعَى أَوْلاَدَ اللهِ! مِنْ أَجْلِ هذَا لاَ يَعْرِفُنَا الْعَالَمُ، لأَنَّهُ لاَ يَعْرِفُهُ.","18":"يَا أَوْلاَدِي، لاَ نُحِبَّ بِالْكَلاَمِ وَلاَ بِاللِّسَانِ، بَلْ بِالْعَمَلِ وَالْحَقِّ!"},"35.3":{"17":"الرَّبُّ إِلهُكِ فِي وَسَطِكِ جَبَّارٌ. يُخَلِّصُ. يَبْتَهِجُ بِكِ فَرَحًا. يَسْكُتُ فِي مَحَبَّتِهِ. يَبْتَهِجُ بِكِ بِتَرَنُّمٍ».","19":"هأَنَذَا فِي ذلِكَ الْيَوْمِ أُعَامِلُ كُلَّ مُذَلِّلِيكِ، وَأُخَلِّصُ الظَّالِعَةَ، وَأَجْمَعُ الْمَنْفِيَّةَ، وَأَجْعَلُهُمْ تَسْبِيحَةً وَاسْمًا فِي كُلِّ أَرْضِ خِزْيِهِمْ،","20":"فِي الْوَقْتِ الَّذِي فِيهِ آتِي بِكُمْ وَفِي وَقْتِ جَمْعِي إِيَّاكُمْ. لأَنِّي أُصَيِّرُكُمُ اسْمًا وَتَسْبِيحَةً فِي شُعُوبِ الأَرْضِ كُلِّهَا، حِينَ أَرُدُّ مَسْبِيِّيكُمْ قُدَّامَ أَعْيُنِكُمْ، قَالَ الرَّبُّ»."},"0.29":{"31":"وَرَأَى الرَّبُّ أَنَّ لَيْئَةَ مَكْرُوهَةٌ فَفَتَحَ رَحِمَهَا، وَأَمَّا رَاحِيلُ فَكَانَتْ عَاقِرًا.","32":"فَحَبِلَتْ لَيْئَةُ وَوَلَدَتِ ابْنًا وَدَعَتِ اسْمَهُ «رَأُوبَيْنَ»، لأَنَّهَا قَالَتْ: «إِنَّ الرَّبَّ قَدْ نَظَرَ إِلَى مَذَلَّتِي. إِنَّهُ الآنَ يُحِبُّنِي رَجُلِي».","33":"وَحَبِلَتْ أَيْضًا وَوَلَدَتِ ابْنًا، وَقَالَتْ: «إِنَّ الرَّبَّ قَدْ سَمِعَ أَنِّي مَكْرُوهَةٌ فَأَعْطَانِي هذَا أَيْضًا». فَدَعَتِ اسْمَهُ «شِمْعُونَ».","34":"وَحَبِلَتْ أَيْضًا وَوَلَدَتِ ابْنًا، وَقَالَتِ: «الآنَ هذِهِ الْمَرَّةَ يَقْتَرِنُ بِي رَجُلِي، لأَنِّي وَلَدْتُ لَهُ ثَلاَثَةَ بَنِينَ». لِذلِكَ دُعِيَ اسْمُهُ «لاَوِيَ».","35":"وَحَبِلَتْ أَيْضًا وَوَلَدَتِ ابْنًا وَقَالَتْ: «هذِهِ الْمَرَّةَ أَحْمَدُ الرَّبَّ». لِذلِكَ دَعَتِ اسْمَهُ «يَهُوذَا». ثُمَّ تَوَقَّفَتْ عَنِ الْوِلاَدَةِ.","16":"وَكَانَ لِلاَبَانَ ابْنَتَانِ، اسْمُ الْكُبْرَى لَيْئَةُ وَاسْمُ الصُّغْرَى رَاحِيلُ.","17":"وَكَانَتْ عَيْنَا لَيْئَةَ ضَعِيفَتَيْنِ، وَأَمَّا رَاحِيلُ فَكَانَتْ حَسَنَةَ الصُّورَةِ وَحَسَنَةَ الْمَنْظَرِ.","18":"وَأَحَبَّ يَعْقُوبُ رَاحِيلَ، فَقَالَ: «أَخْدِمُكَ سَبْعَ سِنِينٍ بِرَاحِيلَ ابْنَتِكَ الصُّغْرَى».","19":"فَقَالَ لاَبَانُ: «أَنْ أُعْطِيَكَ إِيَّاهَا أَحْسَنُ مِنْ أَنْ أُعْطِيَهَا لِرَجُل آخَرَ. أَقِمْ عِنْدِي».","20":"فَخَدَمَ يَعْقُوبُ بِرَاحِيلَ سَبْعَ سِنِينٍ، وَكَانَتْ فِي عَيْنَيْهِ كَأَيَّامٍ قَلِيلَةٍ بِسَبَبِ مَحَبَّتِهِ لَهَا."},"8.16":{"1":"فَقَالَ الرَّبُّ لِصَمُوئِيلَ: «حَتَّى مَتَى تَنُوحُ عَلَى شَاوُلَ، وَأَنَا قَدْ رَفَضْتُهُ عَنْ أَنْ يَمْلِكَ عَلَى إِسْرَائِيلَ؟ اِمْلأْ قَرْنَكَ دُهْنًا وَتَعَالَ أُرْسِلْكَ إِلَى يَسَّى الْبَيْتَلَحْمِيِّ، لأَنِّي قَدْ رَأَيْتُ لِي فِي بَنِيهِ مَلِكًا».","2":"فَقَالَ صَمُوئِيلُ: «كَيْفَ أَذْهَبُ؟ إِنْ سَمِعَ شَاوُلُ يَقْتُلْنِي». فَقَالَ الرَّبُّ: «خُذْ بِيَدِكَ عِجْلَةً مِنَ الْبَقَرِ وَقُلْ: قَدْ جِئْتُ لأَذْبَحَ لِلرَّبِّ.","3":"وَادْعُ يَسَّى إِلَى الذَّبِيحَةِ، وَأَنَا أُعَلِّمُكَ مَاذَا تَصْنَعُ. وَامْسَحْ لِيَ الَّذِي أَقُولُ لَكَ عَنْهُ».","4":"فَفَعَلَ صَمُوئِيلُ كَمَا تَكَلَّمَ الرَّبُّ وَجَاءَ إِلَى بَيْتِ لَحْمٍ. فَارْتَعَدَ شُيُوخُ الْمَدِينَةِ عِنْدَ اسْتِقْبَالِهِ وَقَالُوا: «أَسَلاَمٌ مَجِيئُكَ؟»","5":"فَقَالَ: «سَلاَمٌ. قَدْ جِئْتُ لأَذْبَحَ لِلرَّبِّ. تَقَدَّسُوا وَتَعَالَوْا مَعِي إِلَى الذَّبِيحَةِ». وَقَدَّسَ يَسَّى وَبَنِيهِ وَدَعَاهُمْ إِلَى الذَّبِيحَةِ.","6":"وَكَانَ لَمَّا جَاءُوا أَنَّهُ رَأَى أَلِيآبَ، فَقَالَ: «إِنَّ أَمَامَ الرَّبِّ مَسِيحَهُ».","7":"فَقَالَ الرَّبُّ لِصَمُوئِيلَ: «لاَ تَنْظُرْ إِلَى مَنْظَرِهِ وَطُولِ قَامَتِهِ لأَنِّي قَدْ رَفَضْتُهُ. لأَنَّهُ لَيْسَ كَمَا يَنْظُرُ الإِنْسَانُ. لأَنَّ الإِنْسَانَ يَنْظُرُ إِلَى الْعَيْنَيْنِ، وَأَمَّا الرَّبُّ فَإِنَّهُ يَنْظُرُ إِلَى الْقَلْبِ».","8":"فَدَعَا يَسَّى أَبِينَادَابَ وَعَبَّرَهُ أَمَامَ صَمُوئِيلَ، فَقَالَ: «وَهذَا أَيْضًا لَمْ يَخْتَرْهُ الرَّبُّ».","9":"وَعَبَّرَ يَسَّى شَمَّةَ، فَقَالَ: «وَهذَا أَيْضًا لَمْ يَخْتَرْهُ الرَّبُّ».","10":"وَعَبَّرَ يَسَّى بَنِيهِ السَّبْعَةَ أَمَامَ صَمُوئِيلَ، فَقَالَ صَمُوئِيلُ لِيَسَّى: «الرَّبُّ لَمْ يَخْتَرْ هؤُلاَءِ».","11":"وَقَالَ صَمُوئِيلُ لِيَسَّى: «هَلْ كَمُلُوا الْغِلْمَانُ؟» فَقَالَ: «بَقِيَ بَعْدُ الصَّغِيرُ وَهُوَذَا يَرْعَى الْغَنَمَ». فَقَالَ صَمُوئِيلُ لِيَسَّى: «أَرْسِلْ وَأْتِ بِهِ، لأَنَّنَا لاَ نَجْلِسُ حَتَّى يَأْتِيَ إِلَى ههُنَا».","12":"فَأَرْسَلَ وَأَتَى بِهِ. وَكَانَ أَشْقَرَ مَعَ حَلاَوَةِ الْعَيْنَيْنِ وَحَسَنَ الْمَنْظَرِ. فَقَالَ الرَّبُّ: «قُمِ امْسَحْهُ، لأَنَّ هذَا هُوَ».","13":"فَأَخَذَ صَمُوئِيلُ قَرْنَ الدُّهْنِ وَمَسَحَهُ فِي وَسَطِ إِخْوَتِهِ. وَحَلَّ رُوحُ الرَّبِّ عَلَى دَاوُدَ مِنْ ذلِكَ الْيَوْمِ فَصَاعِدًا. ثُمَّ قَامَ صَمُوئِيلُ وَذَهَبَ إِلَى الرَّامَةِ."},"19.18":{"24":"اَلْمُكْثِرُ الأَصْحَابِ يُخْرِبُ نَفْسَهُ، وَلكِنْ يُوجَدْ مُحِبٌّ أَلْزَقُ مِنَ الأَخِ.","10":"اِسْمُ الرَّبِّ بُرْجٌ حَصِينٌ، يَرْكُضُ إِلَيْهِ الصِّدِّيقُ وَيَتَمَنَّعُ.","15":"قَلْبُ الْفَهِيمِ يَقْتَنِي مَعْرِفَةً، وَأُذُنُ الْحُكَمَاءِ تَطْلُبُ عِلْمًا."},"54.4":{"16":"فِي احْتِجَاجِي الأَوَّلِ لَمْ يَحْضُرْ أَحَدٌ مَعِي، بَلِ الْجَمِيعُ تَرَكُونِي. لاَ يُحْسَبْ عَلَيْهِمْ.","17":"وَلكِنَّ الرَّبَّ وَقَفَ مَعِي وَقَوَّانِي، لِكَيْ تُتَمَّ بِي الْكِرَازَةُ، وَيَسْمَعَ جَمِيعُ الأُمَمِ، فَأُنْقِذْتُ مِنْ فَمِ الأَسَدِ.","18":"وَسَيُنْقِذُنِي الرَّبُّ مِنْ كُلِّ عَمَل رَدِيءٍ وَيُخَلِّصُنِي لِمَلَكُوتِهِ السَّمَاوِيِّ. الَّذِي لَهُ الْمَجْدُ إِلَى دَهْرِ الدُّهُورِ. آمِينَ."},"18.109":{"4":"بَدَلَ مَحَبَّتِي يُخَاصِمُونَنِي. أَمَّا أَنَا فَصَلاَةٌ.","5":"وَضَعُوا عَلَيَّ شَرًّا بَدَلَ خَيْرٍ، وَبُغْضًا بَدَلَ حُبِّي."},"19.25":{"19":"سِنٌّ مَهْتُومَةٌ وَرِجْلٌ مُخَلَّعَةٌ، الثِّقَةُ بِالْخَائِنِ فِي يَوْمِ الضِّيقِ."},"0.37":{"23":"فَكَانَ لَمَّا جَاءَ يُوسُفُ إِلَى إِخْوَتِهِ أَنَّهُمْ خَلَعُوا عَنْ يُوسُفَ قَمِيصَهُ، الْقَمِيصَ الْمُلَوَّنَ الَّذِي عَلَيْهِ،","24":"وَأَخَذُوهُ وَطَرَحُوهُ فِي الْبِئْرِ. وَأَمَّا الْبِئْرُ فَكَانَتْ فَارِغَةً لَيْسَ فِيهَا مَاءٌ.","25":"ثُمَّ جَلَسُوا لِيَأْكُلُوا طَعَامًا. فَرَفَعُوا عُيُونَهُمْ وَنَظَرُوا وَإِذَا قَافِلَةُ إِسْمَاعِيلِيِّينَ مُقْبِلَةٌ مِنْ جِلْعَادَ، وَجِمَالُهُمْ حَامِلَةٌ كَثِيرَاءَ وَبَلَسَانًا وَلاَذَنًا، ذَاهِبِينَ لِيَنْزِلُوا بِهَا إِلَى مِصْرَ.","26":"فَقَالَ يَهُوذَا لإِخْوَتِهِ: «مَا الْفَائِدَةُ أَنْ نَقْتُلَ أَخَانَا وَنُخْفِيَ دَمَهُ؟","27":"تَعَالَوْا فَنَبِيعَهُ لِلإِسْمَاعِيلِيِّينَ، وَلاَ تَكُنْ أَيْدِينَا عَلَيْهِ لأَنَّهُ أَخُونَا وَلَحْمُنَا». فَسَمِعَ لَهُ إِخْوَتُهُ.","28":"وَاجْتَازَ رِجَالٌ مِدْيَانِيُّونَ تُجَّارٌ، فَسَحَبُوا يُوسُفَ وَأَصْعَدُوهُ مِنَ الْبِئْرِ، وَبَاعُوا يُوسُفَ لِلإِسْمَاعِيلِيِّينَ بِعِشْرِينَ مِنَ الْفِضَّةِ. فَأَتَوْا بِيُوسُفَ إِلَى مِصْرَ.","1":"وَسَكَنَ يَعْقُوبُ فِي أَرْضِ غُرْبَةِ أَبِيهِ، فِي أَرْضِ كَنْعَانَ.","2":"هذِهِ مَوَالِيدُ يَعْقُوبَ: يُوسُفُ إِذْ كَانَ ابْنَ سَبْعَ عَشَرَةَ سَنَةً، كَانَ يَرْعَى مَعَ إِخْوَتِهِ الْغَنَمَ وَهُوَ غُلاَمٌ عِنْدَ بَنِي بِلْهَةَ وَبَنِي زِلْفَةَ امْرَأَتَيْ أَبِيهِ، وَأَتَى يُوسُفُ بِنَمِيمَتِهِمِ الرَّدِيئَةِ إِلَى أَبِيهِمْ.","3":"وَأَمَّا إِسْرَائِيلُ فَأَحَبَّ يُوسُفَ أَكْثَرَ مِنْ سَائِرِ بَنِيهِ لأَنَّهُ ابْنُ شَيْخُوخَتِهِ، فَصَنَعَ لَهُ قَمِيصًا مُلَوَّنًا.","4":"فَلَمَّا رَأَى إِخْوَتُهُ أَنَّ أَبَاهُمْ أَحَبَّهُ أَكْثَرَ مِنْ جَمِيعِ إِخْوَتِهِ أَبْغَضُوهُ، وَلَمْ يَسْتَطِيعُوا أَنْ يُكَلِّمُوهُ بِسَلاَمٍ.","5":"وَحَلُمَ يُوسُفُ حُلْمًا وَأَخْبَرَ إِخْوَتَهُ، فَازْدَادُوا أَيْضًا بُغْضًا لَهُ.","6":"فَقَالَ لَهُمُ: «اسْمَعُوا هذَا الْحُلْمَ الَّذِي حَلُمْتُ:","7":"فَهَا نَحْنُ حَازِمُونَ حُزَمًا فِي الْحَقْلِ، وَإِذَا حُزْمَتِي قَامَتْ وَانْتَصَبَتْ، فَاحْتَاطَتْ حُزَمُكُمْ وَسَجَدَتْ لِحُزْمَتِي».","8":"فَقَالَ لَهُ إِخْوَتُهُ: «أَلَعَلَّكَ تَمْلِكُ عَلَيْنَا مُلْكًا أَمْ تَتَسَلَّطُ عَلَيْنَا تَسَلُّطًا؟» وَازْدَادُوا أَيْضًا بُغْضًا لَهُ مِنْ أَجْلِ أَحْلاَمِهِ وَمِنْ أَجْلِ كَلاَمِهِ.","9":"ثُمَّ حَلُمَ أَيْضًا حُلْمًا آخَرَ وَقَصَّهُ عَلَى إِخْوَتِهِ، فَقَالَ: «إِنِّي قَدْ حَلُمْتُ؟ حُلْمًا أَيْضًا، وَإِذَا الشَّمْسُ وَالْقَمَرُ وَأَحَدَ عَشَرَ كَوْكَبًا سَاجِدَةٌ لِي».","10":"وَقَصَّهُ عَلَى أَبِيهِ وَعَلَى إِخْوَتِهِ، فَانْتَهَرَهُ أَبُوهُ وَقَالَ لَهُ: «مَا هذَا الْحُلْمُ الَّذِي حَلُمْتَ؟ هَلْ نَأْتِي أَنَا وَأُمُّكَ وَإِخْوَتُكَ لِنَسْجُدَ لَكَ إِلَى الأَرْضِ؟»","11":"فَحَسَدَهُ إِخْوَتُهُ، وَأَمَّا أَبُوهُ فَحَفِظَ الأَمْرَ."},"39.26":{"47":"وَفِيمَا هُوَ يَتَكَلَّمُ، إِذَا يَهُوذَا أَحَدُ الاثْنَيْ عَشَرَ قَدْ جَاءَ وَمَعَهُ جَمْعٌ كَثِيرٌ بِسُيُوفٍ وَعِصِيٍّ مِنْ عِنْدِ رُؤَسَاءِ الْكَهَنَةِ وَشُيُوخِ الشَّعْبِ.","48":"وَالَّذِي أَسْلَمَهُ أَعْطَاهُمْ عَلاَمَةً قَائِلاً:«الَّذِي أُقَبِّلُهُ هُوَ هُوَ. أَمْسِكُوهُ».","49":"فَلِلْوَقْتِ تَقَدَّمَ إِلَى يَسُوعَ وَقَالَ: «السَّلاَمُ يَا سَيِّدِي!» وَقَبَّلَهُ.","50":"فَقَالَ لَهُ يَسُوعُ: «يَا صَاحِبُ، لِمَاذَا جِئْتَ؟» حِينَئِذٍ تَقَدَّمُوا وَأَلْقَوْا الأَيَادِيَ عَلَى يَسُوعَ وَأَمْسَكُوهُ.","41":"اِسْهَرُوا وَصَلُّوا لِئَلاَّ تَدْخُلُوا فِي تَجْرِبَةٍ. أَمَّا الرُّوحُ فَنَشِيطٌ وَأَمَّا الْجَسَدُ فَضَعِيفٌ».","36":"حِينَئِذٍ جَاءَ مَعَهُمْ يَسُوعُ إِلَى ضَيْعَةٍ يُقَالُ لَهَا جَثْسَيْمَانِي، فَقَالَ لِلتَّلاَمِيذِ:«اجْلِسُوا ههُنَا حَتَّى أَمْضِيَ وَأُصَلِّيَ هُنَاكَ».","37":"ثُمَّ أَخَذَ مَعَهُ بُطْرُسَ وَابْنَيْ زَبْدِي، وَابْتَدَأَ يَحْزَنُ وَيَكْتَئِبُ.","38":"فَقَالَ لَهُمْ:«نَفْسِي حَزِينَةٌ جِدًّا حَتَّى الْمَوْتِ. اُمْكُثُوا ههُنَا وَاسْهَرُوا مَعِي».","39":"ثُمَّ تَقَدَّمَ قَلِيلاً وَخَرَّ عَلَى وَجْهِهِ، وَكَانَ يُصَلِّي قَائِلاً:«يَا أَبَتَاهُ، إِنْ أَمْكَنَ فَلْتَعْبُرْ عَنِّي هذِهِ الْكَأْسُ، وَلكِنْ لَيْسَ كَمَا أُرِيدُ أَنَا بَلْ كَمَا تُرِيدُ أَنْتَ».","40":"ثُمَّ جَاءَ إِلَى التَّلاَمِيذِ فَوَجَدَهُمْ نِيَامًا، فَقَالَ لِبُطْرُسَ: «أَهكَذَا مَا قَدَرْتُمْ أَنْ تَسْهَرُوا مَعِي سَاعَةً وَاحِدَةً؟"},"39.18":{"21":"حِينَئِذٍ تَقَدَّمَ إِلَيْهِ بُطْرُسُ وَقَالَ:«يَارَبُّ، كَمْ مَرَّةً يُخْطِئُ إِلَيَّ أَخِي وَأَنَا أَغْفِرُ لَهُ؟ هَلْ إِلَى سَبْعِ مَرَّاتٍ؟»","22":"قَالَ لَهُ يَسُوعُ:«لاَ أَقُولُ لَكَ إِلَى سَبْعِ مَرَّاتٍ، بَلْ إِلَى سَبْعِينَ مَرَّةً سَبْعَ مَرَّاتٍ.","23":"لِذلِكَ يُشْبِهُ مَلَكُوتُ السَّمَاوَاتِ إِنْسَانًا مَلِكًا أَرَادَ أَنْ يُحَاسِبَ عَبِيدَهُ.","24":"فَلَمَّا ابْتَدَأَ فِي الْمُحَاسَبَةِ قُدِّمَ إِلَيْهِ وَاحِدٌ مَدْيُونٌ بِعَشْرَةِ آلاَفِ وَزْنَةٍ.","25":"وَإِذْ لَمْ يَكُنْ لَهُ مَا يُوفِي أَمَرَ سَيِّدُهُ أَنْ يُبَاعَ هُوَ وَامْرَأَتُهُ وَأَوْلاَدُهُ وَكُلُّ مَا لَهُ، وَيُوفَي الدَّيْنُ.","26":"فَخَرَّ الْعَبْدُ وَسَجَدَ لَهُ قَائِلاً: يَا سَيِّدُ، تَمَهَّلْ عَلَيَّ فَأُوفِيَكَ الْجَمِيعَ.","27":"فَتَحَنَّنَ سَيِّدُ ذلِكَ الْعَبْدِ وَأَطْلَقَهُ، وَتَرَكَ لَهُ الدَّيْنَ.","28":"وَلَمَّا خَرَجَ ذلِكَ الْعَبْدُ وَجَدَ وَاحِدًا مِنَ الْعَبِيدِ رُفَقَائِهِ، كَانَ مَدْيُونًا لَهُ بِمِئَةِ دِينَارٍ، فَأَمْسَكَهُ وَأَخَذَ بِعُنُقِهِ قَائِلاً: أَوْفِني مَا لِي عَلَيْكَ.","29":"فَخَرَّ الْعَبْدُ رَفِيقُهُ عَلَى قَدَمَيْهِ وَطَلَبَ إِلَيْهِ قَائِلاً: تَمَهَّلْ عَلَيَّ فَأُوفِيَكَ الْجَمِيعَ.","30":"فَلَمْ يُرِدْ بَلْ مَضَى وَأَلْقَاهُ فِي سِجْنٍ حَتَّى يُوفِيَ الدَّيْنَ.","31":"فَلَمَّا رَأَى الْعَبِيدُ رُفَقَاؤُهُ مَا كَانَ، حَزِنُوا جِدًّا. وَأَتَوْا وَقَصُّوا عَلَى سَيِّدِهِمْ كُلَّ مَا جَرَى.","32":"فَدَعَاهُ حِينَئِذٍ سَيِّدُهُ وَقَالَ لَهُ: أَيُّهَا الْعَبْدُ الشِّرِّيرُ، كُلُّ ذلِكَ الدَّيْنِ تَرَكْتُهُ لَكَ لأَنَّكَ طَلَبْتَ إِلَيَّ.","33":"أَفَمَا كَانَ يَنْبَغِي أَنَّكَ أَنْتَ أَيْضًا تَرْحَمُ الْعَبْدَ رَفِيقَكَ كَمَا رَحِمْتُكَ أَنَا؟.","34":"وَغَضِبَ سَيِّدُهُ وَسَلَّمَهُ إِلَى الْمُعَذِّبِينَ حَتَّى يُوفِيَ كُلَّ مَا كَانَ لَهُ عَلَيْهِ.","35":"فَهكَذَا أَبِي السَّمَاوِيُّ يَفْعَلُ بِكُمْ إِنْ لَمْ تَتْرُكُوا مِنْ قُلُوبِكُمْ كُلُّ وَاحِدٍ لأَخِيهِ زَّلاَتِهِ»."},"19.10":{"12":"اَلْبُغْضَةُ تُهَيِّجُ خُصُومَاتٍ، وَالْمَحَبَّةُ تَسْتُرُ كُلَّ الذُّنُوبِ.","22":"بَرَكَةُ الرَّبِّ هِيَ تُغْنِي، وَلاَ يَزِيدُ مَعَهَا تَعَبًا."},"45.10":{"13":"لَمْ تُصِبْكُمْ تَجْرِبَةٌ إِلاَّ بَشَرِيَّةٌ. وَلكِنَّ اللهَ أَمِينٌ، الَّذِي لاَ يَدَعُكُمْ تُجَرَّبُونَ فَوْقَ مَا تَسْتَطِيعُونَ، بَلْ سَيَجْعَلُ مَعَ التَّجْرِبَةِ أَيْضًا الْمَنْفَذَ، لِتَسْتَطِيعُوا أَنْ تَحْتَمِلُوا."},"57.2":{"18":"لأَنَّهُ فِي مَا هُوَ قَدْ تَأَلَّمَ مُجَرَّبًا يَقْدِرُ أَنْ يُعِينَ الْمُجَرَّبِينَ.","14":"فَإِذْ قَدْ تَشَارَكَ الأَوْلاَدُ فِي اللَّحْمِ وَالدَّمِ اشْتَرَكَ هُوَ أَيْضًا كَذلِكَ فِيهِمَا، لِكَيْ يُبِيدَ بِالْمَوْتِ ذَاكَ الَّذِي لَهُ سُلْطَانُ الْمَوْتِ، أَيْ إِبْلِيسَ،","15":"وَيُعْتِقَ أُولئِكَ الَّذِينَ- خَوْفًا مِنَ الْمَوْتِ- كَانُوا جَمِيعًا كُلَّ حَيَاتِهِمْ تَحْتَ الْعُبُودِيَّةِ."},"58.4":{"7":"فَاخْضَعُوا للهِِ. قَاوِمُوا إِبْلِيسَ فَيَهْرُبَ مِنْكُمْ.","8":"اِقْتَرِبُوا إِلَى اللهِ فَيَقْتَرِبَ إِلَيْكُمْ. نَقُّوا أَيْدِيَكُمْ أَيُّهَا الْخُطَاةُ، وَطَهِّرُوا قُلُوبَكُمْ يَا ذَوِي الرَّأْيَيْنِ.","1":"مِنْ أَيْنَ الْحُرُوبُ وَالْخُصُومَاتُ بَيْنَكُمْ؟ أَلَيْسَتْ مِنْ هُنَا: مِنْ لَذَّاتِكُمُ الْمُحَارِبَةِ فِي أَعْضَائِكُمْ؟","2":"تَشْتَهُونَ وَلَسْتُمْ تَمْتَلِكُونَ. تَقْتُلُونَ وَتَحْسِدُونَ وَلَسْتُمْ تَقْدِرُونَ أَنْ تَنَالُوا. تُخَاصِمُونَ وَتُحَارِبُونَ وَلَسْتُمْ تَمْتَلِكُونَ، لأَنَّكُمْ لاَ تَطْلُبُونَ."},"60.2":{"9":"يَعْلَمُ الرَّبُّ أَنْ يُنْقِذَ الأَتْقِيَاءَ مِنَ التَّجْرِبَةِ، وَيَحْفَظَ الأَثَمَةَ إِلَى يَوْمِ الدِّينِ مُعَاقَبِينَ،"},"45.6":{"18":"اُهْرُبُوا مِنَ الزِّنَا. كُلُّ خَطِيَّةٍ يَفْعَلُهَا الإِنْسَانُ هِيَ خَارِجَةٌ عَنِ الْجَسَدِ، لكِنَّ الَّذِي يَزْنِي يُخْطِئُ إِلَى جَسَدِهِ.","19":"أَمْ لَسْتُمْ تَعْلَمُونَ أَنَّ جَسَدَكُمْ هُوَ هَيْكَلٌ لِلرُّوحِ الْقُدُسِ الَّذِي فِيكُمُ، الَّذِي لَكُمْ مِنَ اللهِ، وَأَنَّكُمْ لَسْتُمْ لأَنْفُسِكُمْ؟","20":"لأَنَّكُمْ قَدِ اشْتُرِيتُمْ بِثَمَنٍ. فَمَجِّدُوا اللهَ فِي أَجْسَادِكُمْ وَفِي أَرْوَاحِكُمُ الَّتِي هِيَِللهِ."},"47.5":{"16":"وَإِنَّمَا أَقُولُ: اسْلُكُوا بِالرُّوحِ فَلاَ تُكَمِّلُوا شَهْوَةَ الْجَسَدِ.","26":"لاَ نَكُنْ مُعْجِبِينَ نُغَاضِبُ بَعْضُنَا بَعْضًا، وَنَحْسِدُ بَعْضُنَا بَعْضًا.","22":"وَأَمَّا ثَمَرُ الرُّوحِ فَهُوَ: مَحَبَّةٌ فَرَحٌ سَلاَمٌ، طُولُ أَنَاةٍ لُطْفٌ صَلاَحٌ، إِيمَانٌ","13":"فَإِنَّكُمْ إِنَّمَا دُعِيتُمْ لِلْحُرِّيَّةِ أَيُّهَا الإِخْوَةُ. غَيْرَ أَنَّهُ لاَ تُصَيِّرُوا الْحُرِّيَّةَ فُرْصَةً لِلْجَسَدِ، بَلْ بِالْمَحَبَّةِ اخْدِمُوا بَعْضُكُمْ بَعْضًا.","14":"لأَنَّ كُلَّ النَّامُوسِ فِي كَلِمَةٍ وَاحِدَةٍ يُكْمَلُ:«تُحِبُّ قَرِيبَكَ كَنَفْسِكَ»."},"44.6":{"12":"إِذًا لاَ تَمْلِكَنَّ الْخَطِيَّةُ فِي جَسَدِكُمُ الْمَائِتِ لِكَيْ تُطِيعُوهَا فِي شَهَوَاتِهِ،","13":"وَلاَ تُقَدِّمُوا أَعْضَاءَكُمْ آلاَتِ إِثْمٍ لِلْخَطِيَّةِ، بَلْ قَدِّمُوا ذَوَاتِكُمْ للهِ كَأَحْيَاءٍ مِنَ الأَمْوَاتِ وَأَعْضَاءَكُمْ آلاَتِ بِرّ للهِِ.","14":"فَإِنَّ الْخَطِيَّةَ لَنْ تَسُودَكُمْ، لأَنَّكُمْ لَسْتُمْ تَحْتَ النَّامُوسِ بَلْ تَحْتَ النِّعْمَةِ.","4":"فَدُفِنَّا مَعَهُ بِالْمَعْمُودِيَّةِ لِلْمَوْتِ، حَتَّى كَمَا أُقِيمَ الْمَسِيحُ مِنَ الأَمْوَاتِ، بِمَجْدِ الآبِ، هكَذَا نَسْلُكُ نَحْنُ أَيْضًا فِي جِدَّةِ الْحَيَاةِ؟"},"48.6":{"10":"أَخِيرًا يَا إِخْوَتِي تَقَوُّوْا فِي الرَّبِّ وَفِي شِدَّةِ قُوَّتِهِ.","11":"الْبَسُوا سِلاَحَ اللهِ الْكَامِلَ لِكَيْ تَقْدِرُوا أَنْ تَثْبُتُوا ضِدَّ مَكَايِدِ إِبْلِيسَ."},"44.13":{"14":"بَلِ الْبَسُوا الرَّبَّ يَسُوعَ الْمَسِيحَ، وَلاَ تَصْنَعُوا تَدْبِيرًا لِلْجَسَدِ لأَجْلِ الشَّهَوَاتِ."},"18.141":{"3":"اجْعَلْ يَا رَبُّ حَارِسًا لِفَمِي. احْفَظْ بَابَ شَفَتَيَّ.","4":"لاَ تُمِلْ قَلْبِي إِلَى أَمْرٍ رَدِيءٍ، لأَتَعَلَّلَ بِعِلَلِ الشَّرِّ مَعَ أُنَاسٍ فَاعِلِي إِثْمٍ، وَلاَ آكُلْ مِنْ نَفَائِسِهِمْ."},"17.31":{"1":"«عَهْدًا قَطَعْتُ لِعَيْنَيَّ، فَكَيْفَ أَتَطَلَّعُ فِي عَذْرَاءَ؟"},"39.4":{"1":"ثُمَّ أُصْعِدَ يَسُوعُ إِلَى الْبَرِّيَّةِ مِنَ الرُّوحِ لِيُجَرَّبَ مِنْ إِبْلِيسَ.","2":"فَبَعْدَ مَا صَامَ أَرْبَعِينَ نَهَارًا وَأَرْبَعِينَ لَيْلَةً، جَاعَ أَخِيرًا.","3":"فَتَقَدَّمَ إِلَيْهِ الْمُجَرِّبُ وَقَالَ لَهُ:«إِنْ كُنْتَ ابْنَ اللهِ فَقُلْ أَنْ تَصِيرَ هذِهِ الْحِجَارَةُ خُبْزًا».","4":"فَأَجَابَ وَقَالَ:«مَكْتُوبٌ: لَيْسَ بِالْخُبْزِ وَحْدَهُ يَحْيَا الإِنْسَانُ، بَلْ بِكُلِّ كَلِمَةٍ تَخْرُجُ مِنْ فَمِ اللهِ».","5":"ثُمَّ أَخَذَهُ إِبْلِيسُ إِلَى الْمَدِينَةِ الْمُقَدَّسَةِ، وَأَوْقَفَهُ عَلَى جَنَاحِ الْهَيْكَلِ،","6":"وَقَالَ لَهُ:«إِنْ كُنْتَ ابْنَ اللهِ فَاطْرَحْ نَفْسَكَ إِلَى أَسْفَلُ، لأَنَّهُ مَكْتُوبٌ: أَنَّهُ يُوصِي مَلاَئِكَتَهُ بِكَ، فَعَلَى أيَادِيهِمْ يَحْمِلُونَكَ لِكَيْ لاَ تَصْدِمَ بِحَجَرٍ رِجْلَكَ».","7":"قَالَ لَهُ يَسُوعُ:«مَكْتُوبٌ أَيْضًا: لاَ تُجَرِّب الرَّبَّ إِلهَكَ».","8":"ثُمَّ أَخَذَهُ أَيْضًا إِبْلِيسُ إِلَى جَبَل عَال جِدًّا، وَأَرَاهُ جَمِيعَ مَمَالِكِ الْعَالَمِ وَمَجْدَهَا،","9":"وَقَالَ لَهُ: «أُعْطِيكَ هذِهِ جَمِيعَهَا إِنْ خَرَرْتَ وَسَجَدْتَ لِي».","10":"حِينَئِذٍ قَالَ لَهُ يَسُوعُ:«اذْهَبْ يَا شَيْطَانُ! لأَنَّهُ مَكْتُوبٌ: لِلرَّبِّ إِلهِكَ تَسْجُدُ وَإِيَّاهُ وَحْدَهُ تَعْبُدُ».","11":"ثُمَّ تَرَكَهُ إِبْلِيسُ، وَإِذَا مَلاَئِكَةٌ قَدْ جَاءَتْ فَصَارَتْ تَخْدِمُهُ."},"26.1":{"8":"أَمَّا دَانِيآلُ فَجَعَلَ فِي قَلْبِهِ أَنَّهُ لاَ يَتَنَجَّسُ بِأَطَايِبِ الْمَلِكِ وَلاَ بِخَمْرِ مَشْرُوبِهِ، فَطَلَبَ مِنْ رَئِيسِ الْخِصْيَانِ أَنْ لاَ يَتَنَجَّسَ.","9":"وَأَعْطَى اللهُ دَانِيآلَ نِعْمَةً وَرَحْمَةً عِنْدَ رَئِيسِ الْخِصْيَانِ.","10":"فَقَالَ رَئِيسُ الْخِصْيَانِ لِدَانِيآلَ: «إِنِّي أَخَافُ سَيِّدِي الْمَلِكَ الَّذِي عَيَّنَ طَعَامَكُمْ وَشَرَابَكُمْ. فَلِمَاذَا يَرَى وُجُوهَكُمْ أَهْزَلَ مِنَ الْفِتْيَانِ الَّذِينَ مِنْ جِيلِكُمْ، فَتُدَيِّنُونَ رَأْسِي لِلْمَلِكِ؟».","11":"فَقَالَ دَانِيآلُ لِرَئِيسِ السُّقَاةِ الَّذِي وَلاَّهُ رَئِيسُ الْخِصْيَانِ عَلَى دَانِيآلَ وَحَنَنْيَا وَمِيشَائِيلَ وَعَزَرْيَا:","12":"«جَرِّبْ عَبِيدَكَ عَشَرَةَ أَيَّامٍ. فَلْيُعْطُونَا الْقَطَانِيَّ لِنَأْكُلَ وَمَاءً لِنَشْرَبَ.","13":"وَلْيَنْظُرُوا إِلَى مَنَاظِرِنَا أَمَامَكَ وَإِلَى مَنَاظِرِ الْفِتْيَانِ الَّذِينَ يَأْكُلُونَ مِنْ أَطَايِبِ الْمَلِكِ. ثُمَّ اصْنَعْ بِعَبِيدِكَ كَمَا تَرَى».","14":"فَسَمِعَ لَهُمْ هذَا الْكَلاَمَ وَجَرَّبَهُمْ عَشَرَةَ أَيَّامٍ.","15":"وَعِنْدَ نِهَايَةِ الْعَشَرَةِ الأَيَّامِ ظَهَرَتْ مَنَاظِرُهُمْ أَحْسَنَ وَأَسْمَنَ لَحْمًا مِنْ كُلِّ الْفِتْيَانِ الآكِلِينَ مِنْ أَطَايِبِ الْمَلِكِ.","16":"فَكَانَ رَئِيسُ السُّقَاةِ يَرْفَعُ أَطَايِبَهُمْ وَخَمْرَ مَشْرُوبِهِمْ وَيُعْطِيهِمْ قَطَانِيَّ.","17":"أَمَّا هؤُلاَءِ الْفِتْيَانُ الأَرْبَعَةُ فَأَعْطَاهُمُ اللهُ مَعْرِفَةً وَعَقْلاً فِي كُلِّ كِتَابَةٍ وَحِكْمَةٍ، وَكَانَ دَانِيآلُ فَهِيمًا بِكُلِّ الرُّؤَى وَالأَحْلاَمِ.","18":"وَعِنْدَ نِهَايَةِ الأَيَّامِ الَّتِي قَالَ الْمَلِكُ أَنْ يُدْخِلُوهُمْ بَعْدَهَا، أَتَى بِهِمْ رَئِيسُ الْخِصْيَانِ إِلَى أَمَامِ نَبُوخَذْنَاصَّرَ،","19":"وَكَلَّمَهُمُ الْمَلِكُ فَلَمْ يُوجَدْ بَيْنَهُمْ كُلِّهِمْ مِثْلُ دَانِيآلَ وَحَنَنْيَا وَمِيشَائِيلَ وَعَزَرْيَا. فَوَقَفُوا أَمَامَ الْمَلِكِ.","20":"وَفِي كُلِّ أَمْرِ حِكْمَةِ فَهْمٍ الَّذِي سَأَلَهُمْ عَنْهُ الْمَلِكُ وَجَدَهُمْ عَشَرَةَ أَضْعَافٍ فَوْقَ كُلِّ الْمَجُوسِ وَالسَّحَرَةِ الَّذِينَ فِي كُلِّ مَمْلَكَتِهِ.","21":"وَكَانَ دَانِيآلُ إِلَى السَّنَةِ الأُولَى لِكُورَشَ الْمَلِكِ."},"34.2":{"3":"لأَنَّ الرُّؤْيَا بَعْدُ إِلَى الْمِيعَادِ، وَفِي النِّهَايَةِ تَتَكَلَّمُ وَلاَ تَكْذِبُ. إِنْ تَوَانَتْ فَانْتَظِرْهَا لأَنَّهَا سَتَأْتِي إِتْيَانًا وَلاَ تَتَأَخَّرُ."},"18.33":{"20":"أَنْفُسُنَا انْتَظَرَتِ الرَّبَّ. مَعُونَتُنَا وَتُرْسُنَا هُوَ."},"22.64":{"4":"وَمُنْذُ الأَزَلِ لَمْ يَسْمَعُوا وَلَمْ يَصْغَوْا. لَمْ تَرَ عَيْنٌ إِلهًا غَيْرَكَ يَصْنَعُ لِمَنْ يَنْتَظِرُهُ."},"20.3":{"11":"صَنَعَ الْكُلَّ حَسَنًا فِي وَقْتِهِ، وَأَيْضًا جَعَلَ الأَبَدِيَّةَ فِي قَلْبِهِمِ، الَّتِي بِلاَهَا لاَ يُدْرِكُ الإِنْسَانُ الْعَمَلَ الَّذِي يَعْمَلُهُ اللهُ مِنَ الْبِدَايَةِ إِلَى النِّهَايَةِ."},"0.21":{"1":"وَافْتَقَدَ الرَّبُّ سَارَةَ كَمَا قَالَ، وَفَعَلَ الرَّبُّ لِسَارَةَ كَمَا تَكَلَّمَ.","2":"فَحَبِلَتْ سَارَةُ وَوَلَدَتْ لإِبْرَاهِيمَ ابْنًا فِي شَيْخُوخَتِهِ، فِي الْوَقْتِ الَّذِي تَكَلَّمَ اللهُ عَنْهُ.","3":"وَدَعَا إِبْرَاهِيمُ اسْمَ ابْنِهِ الْمَوْلُودِ لَهُ، الَّذِي وَلَدَتْهُ لَهُ سَارَةُ «إِسْحَاقَ».","4":"وَخَتَنَ إِبْرَاهِيمُ إِسْحَاقَ ابْنَهُ وَهُوَ ابْنُ ثَمَانِيَةِ أَيَّامٍ كَمَا أَمَرَهُ اللهُ.","5":"وَكَانَ إِبْرَاهِيمُ ابْنَ مِئَةِ سَنَةٍ حِينَ وُلِدَ لَهُ إِسْحَاقُ ابْنُهُ.","6":"وَقَالَتْ سَارَةُ: «قَدْ صَنَعَ إِلَيَّ اللهُ ضِحْكًا. كُلُّ مَنْ يَسْمَعُ يَضْحَكُ لِي».","7":"وَقَالَتْ: «مَنْ قَالَ لإِبْرَاهِيمَ: سَارَةُ تُرْضِعُ بَنِينَ؟ حَتَّى وَلَدْتُ ابْنًا فِي شَيْخُوخَتِهِ!»."},"43.1":{"12":"حِينَئِذٍ رَجَعُوا إِلَى أُورُشَلِيمَ مِنَ الْجَبَلِ الَّذِي يُدْعَى جَبَلَ الزَّيْتُونِ، الَّذِي هُوَ بِالْقُرْبِ مِنْ أُورُشَلِيمَ عَلَى سَفَرِ سَبْتٍ.","13":"وَلَمَّا دَخَلُوا صَعِدُوا إِلَى الْعِلِّيَّةِ الَّتِي كَانُوا يُقِيمُونَ فِيهَا: بُطْرُسُ وَيَعْقُوبُ وَيُوحَنَّا وَأَنْدَرَاوُسُ وَفِيلُبُّسُ وَتُومَا وَبَرْثُولَمَاوُسُ وَمَتَّى وَيَعْقُوبُ بْنُ حَلْفَى وَسِمْعَانُ الْغَيُورُ وَيَهُوذَا أَخُو يَعْقُوبَ.","14":"هؤُلاَءِ كُلُّهُمْ كَانُوا يُواظِبُونَ بِنَفْسٍ وَاحِدَةٍ عَلَى الصَّلاَةِ وَالطِّلْبَةِ، مَعَ النِّسَاءِ، وَمَرْيَمَ أُمِّ يَسُوعَ، وَمَعَ إِخْوَتِهِ."},"0.8":{"6":"وَحَدَثَ مِنْ بَعْدِ أَرْبَعِينَ يَوْمًا أَنَّ نُوحًا فَتَحَ طَاقَةَ الْفُلْكِ الَّتِي كَانَ قَدْ عَمِلَهَا","7":"وَأَرْسَلَ الْغُرَابَ، فَخَرَجَ مُتَرَدِّدًا حَتَّى نَشِفَتِ الْمِيَاهُ عَنِ الأَرْضِ.","8":"ثُمَّ أَرْسَلَ الْحَمَامَةَ مِنْ عِنْدِهِ لِيَرَى هَلْ قَلَّتِ الْمِيَاهُ عَنْ وَجْهِ الأَرْضِ،","9":"فَلَمْ تَجِدِ الْحَمَامَةُ مَقَرًّا لِرِجْلِهَا، فَرَجَعَتْ إِلَيْهِ إِلَى الْفُلْكِ لأَنَّ مِيَاهًا كَانَتْ عَلَى وَجْهِ كُلِّ الأَرْضِ. فَمَدَّ يَدَهُ وَأَخَذَهَا وَأَدْخَلَهَا عِنْدَهُ إِلَى الْفُلْكِ.","10":"فَلَبِثَ أَيْضًا سَبْعَةَ أَيَّامٍ أُخَرَ وَعَادَ فَأَرْسَلَ الْحَمَامَةَ مِنَ الْفُلْكِ،","11":"فَأَتَتْ إِلَيْهِ الْحَمَامَةُ عِنْدَ الْمَسَاءِ، وَإِذَا وَرَقَةُ زَيْتُونٍ خَضْرَاءُ فِي فَمِهَا. فَعَلِمَ نُوحٌ أَنَّ الْمِيَاهَ قَدْ قَلَّتْ عَنِ الأَرْضِ.","12":"فَلَبِثَ أَيْضًا سَبْعَةَ أَيَّامٍ أُخَرَ وَأَرْسَلَ الْحَمَامَةَ فَلَمْ تَعُدْ تَرْجعُ إِلَيْهِ أَيْضًا.","15":"وَكَلَّمَ اللهُ نُوحًا قَائِلاً:","16":"«اخْرُجْ مِنَ الْفُلْكِ أَنْتَ وَامْرَأَتُكَ وَبَنُوكَ وَنِسَاءُ بَنِيكَ مَعَكَ.","17":"وَكُلَّ الْحَيَوَانَاتِ الَّتِي مَعَكَ مِنْ كُلِّ ذِي جَسَدٍ: الطُّيُورِ، وَالْبَهَائِمِ، وَكُلَّ الدَّبَّابَاتِ الَّتِي تَدِبُّ عَلَى الأَرْضِ، أَخْرِجْهَا مَعَكَ. وَلْتَتَوَالَدْ فِي الأَرْضِ وَتُثْمِرْ وَتَكْثُرْ عَلَى الأَرْضِ».","18":"فَخَرَجَ نُوحٌ وَبَنُوهُ وَامْرَأَتُهُ وَنِسَاءُ بَنِيهِ مَعَهُ.","19":"وَكُلُّ الْحَيَوَانَاتِ، كُلُّ الدَّبَّابَاتِ، وَكُلُّ الطُّيُورِ، كُلُّ مَا يَدِبُّ عَلَى الأَرْضِ، كَأَنْوَاعِهَا خَرَجَتْ مِنَ الْفُلْكِ.","20":"وَبَنَى نُوحٌ مَذْبَحًا لِلرَّبِّ. وَأَخَذَ مِنْ كُلِّ الْبَهَائِمِ الطَّاهِرَةِ وَمِنْ كُلِّ الطُّيُورِ الطَّاهِرَةِ وَأَصْعَدَ مُحْرَقَاتٍ عَلَى الْمَذْبَحِ،","21":"فَتَنَسَّمَ الرَّبُّ رَائِحَةَ الرِّضَا. وَقَالَ الرَّبُّ فِي قَلْبِهِ: «لاَ أَعُودُ أَلْعَنُ الأَرْضَ أَيْضًا مِنْ أَجْلِ الإِنْسَانِ، لأَنَّ تَصَوُّرَ قَلْبِ الإِنْسَانِ شِرِّيرٌ مُنْذُ حَدَاثَتِهِ. وَلاَ أَعُودُ أَيْضًا أُمِيتُ كُلَّ حَيٍّ كَمَا فَعَلْتُ.","22":"مُدَّةَ كُلِّ أَيَّامِ الأَرْضِ: زَرْعٌ وَحَصَادٌ، وَبَرْدٌ وَحَرٌّ، وَصَيْفٌ وَشِتَاءٌ، وَنَهَارٌ وَلَيْلٌ، لاَ تَزَالُ»."},"18.111":{"10":"رَأْسُ الْحِكْمَةِ مَخَافَةُ الرَّبِّ. فِطْنَةٌ جَيِّدَةٌ لِكُلِّ عَامِلِيهَا. تَسْبِيحُهُ قَائِمٌ إِلَى الأَبَدِ."},"19.9":{"10":"بَدْءُ الْحِكْمَةِ مَخَافَةُ الرَّبِّ، وَمَعْرِفَةُ الْقُدُّوسِ فَهْمٌ."},"18.90":{"12":"إِحْصَاءَ أَيَّامِنَا هكَذَا عَلِّمْنَا فَنُؤْتَى قَلْبَ حِكْمَةٍ.","17":"وَلْتَكُنْ نِعْمَةُ الرَّبِّ إِلهِنَا عَلَيْنَا، وَعَمَلَ أَيْدِينَا ثَبِّتْ عَلَيْنَا، وَعَمَلَ أَيْدِينَا ثَبِّتْهُ.","10":"أَيَّامُ سِنِينَا هِيَ سَبْعُونَ سَنَةً، وَإِنْ كَانَتْ مَعَ الْقُوَّةِ فَثَمَانُونَ سَنَةً، وَأَفْخَرُهَا تَعَبٌ وَبَلِيَّةٌ، لأَنَّهَا تُقْرَضُ سَرِيعًا فَنَطِيرُ.","11":"مَنْ يَعْرِفُ قُوَّةَ غَضِبَكَ؟ وَكَخَوْفِكَ سَخَطُكَ."},"19.1":{"7":"مَخَافَةُ الرَّبِّ رَأْسُ الْمَعْرِفَةِ، أَمَّا الْجَاهِلُونَ فَيَحْتَقِرُونَ الْحِكْمَةَ وَالأَدَبَ."},"19.11":{"14":"حَيْثُ لاَ تَدْبِيرٌ يَسْقُطُ الشَّعْبُ، أَمَّا الْخَلاَصُ فَبِكَثْرَةِ الْمُشِيرِينَ.","25":"النَّفْسُ السَّخِيَّةُ تُسَمَّنُ، وَالْمُرْوِي هُوَ أَيْضًا يُرْوَى."},"26.2":{"20":"أَجَابَ دَانِيآلُ وَقَالَ: «لِيَكُنِ اسْمُ اللهِ مُبَارَكًا مِنَ الأَزَلِ وَإِلَى الأَبَدِ، لأَنَّ لَهُ الْحِكْمَةَ وَالْجَبَرُوتَ.","21":"وَهُوَ يُغَيِّرُ الأَوْقَاتَ وَالأَزْمِنَةَ. يَعْزِلُ مُلُوكًا وَيُنَصِّبُ مُلُوكًا. يُعْطِي الْحُكَمَاءَ حِكْمَةً، وَيُعَلِّمُ الْعَارِفِينَ فَهْمًا."},"58.3":{"17":"وَأَمَّا الْحِكْمَةُ الَّتِي مِنْ فَوْقُ فَهِيَ أَوَّلاً طَاهِرَةٌ، ثُمَّ مُسَالِمَةٌ، مُتَرَفِّقَةٌ، مُذْعِنَةٌ، مَمْلُوَّةٌ رَحْمَةً وَأَثْمَارًا صَالِحَةً، عَدِيمَةُ الرَّيْبِ وَالرِّيَاءِ.","14":"وَلكِنْ إِنْ كَانَ لَكُمْ غَيْرَةٌ مُرَّةٌ وَتَحَزُّبٌ فِي قُلُوبِكُمْ، فَلاَ تَفْتَخِرُوا وَتَكْذِبُوا عَلَى الْحَقِّ.","15":"لَيْسَتْ هذِهِ الْحِكْمَةُ نَازِلَةً مِنْ فَوْقُ، بَلْ هِيَ أَرْضِيَّةٌ نَفْسَانِيَّةٌ شَيْطَانِيَّةٌ.","16":"لأَنَّهُ حَيْثُ الْغَيْرَةُ وَالتَّحَزُّبُ، هُنَاكَ التَّشْوِيشُ وَكُلُّ أَمْرٍ رَدِيءٍ."},"19.8":{"11":"لأَنَّ الْحِكْمَةَ خَيْرٌ مِنَ الَّلآلِئِ، وَكُلُّ الْجَوَاهِرِ لاَ تُسَاوِيهَا."},"19.13":{"20":"اَلْمُسَايِرُ الْحُكَمَاءَ يَصِيرُ حَكِيمًا، وَرَفِيقُ الْجُهَّالِ يُضَرُّ."},"0.41":{"14":"فَأَرْسَلَ فِرْعَوْنُ وَدَعَا يُوسُفَ، فَأَسْرَعُوا بِهِ مِنَ السِّجْنِ. فَحَلَقَ وَأَبْدَلَ ثِيَابَهُ وَدَخَلَ عَلَى فِرْعَوْنَ.","15":"فَقَالَ فِرْعَوْنُ لِيُوسُفَ: «حَلُمْتُ حُلْمًا وَلَيْسَ مَنْ يُعَبِّرُهُ. وَأَنَا سَمِعْتُ عَنْكَ قَوْلاً، إِنَّكَ تَسْمَعُ أَحْلاَمًا لِتُعَبِّرَهَا».","16":"فَأَجَابَ يُوسُفُ فِرْعَوْنَ: «لَيْسَ لِي. اَللهُ يُجِيبُ بِسَلاَمَةٍ فِرْعَوْنَ»."},"43.6":{"1":"وَفِي تِلْكَ الأَيَّامِ إِذْ تَكَاثَرَ التَّلاَمِيذُ، حَدَثَ تَذَمُّرٌ مِنَ الْيُونَانِيِّينَ عَلَى الْعِبْرَانِيِّينَ أَنَّ أَرَامِلَهُمْ كُنَّ يُغْفَلُ عَنْهُنَّ فِي الْخِدْمَةِ الْيَوْمِيَّةِ.","2":"فَدَعَا الاثْنَا عَشَرَ جُمْهُورَ التَّلاَمِيذِ وَقَالُوا:«لاَ يُرْضِي أَنْ نَتْرُكَ نَحْنُ كَلِمَةَ اللهِ وَنَخْدِمَ مَوَائِدَ.","3":"فَانْتَخِبُوا أَيُّهَا الإِخْوَةُ سَبْعَةَ رِجَال مِنْكُمْ، مَشْهُودًا لَهُمْ وَمَمْلُوِّينَ مِنَ الرُّوحِ الْقُدُسِ وَحِكْمَةٍ، فَنُقِيمَهُمْ عَلَى هذِهِ الْحَاجَةِ.","4":"وَأَمَّا نَحْنُ فَنُواظِبُ عَلَى الصَّلاَةِ وَخِدْمَةِ الْكَلِمَةِ».","5":"فَحَسُنَ هذَا الْقَوْلُ أَمَامَ كُلِّ الْجُمْهُورِ، فَاخْتَارُوا اسْتِفَانُوسَ، رَجُلاً مَمْلُوًّا مِنَ الإِيمَانِ وَالرُّوحِ الْقُدُسِ، وَفِيلُبُّسَ، وَبُرُوخُورُسَ، وَنِيكَانُورَ، وَتِيمُونَ، وَبَرْمِينَاسَ، وَنِيقُولاَوُسَ دَخِيلاً أَنْطَاكِيًّا.","6":"اَلَّذِينَ أَقَامُوهُمْ أَمَامَ الرُّسُلِ، فَصَلُّوا وَوَضَعُوا عَلَيْهِمِ الأَيَادِيَ.","7":"وَكَانَتْ كَلِمَةُ اللهِ تَنْمُو، وَعَدَدُ التَّلاَمِيذِ يَتَكَاثَرُ جِدًّا فِي أُورُشَلِيمَ، وَجُمْهُورٌ كَثِيرٌ مِنَ الْكَهَنَةِ يُطِيعُونَ الإِيمَانَ."},"1.18":{"13":"وَحَدَثَ فِي الْغَدِ أَنَّ مُوسَى جَلَسَ لِيَقْضِيَ لِلشَّعْبِ. فَوَقَفَ الشَّعْبُ عِنْدَ مُوسَى مِنَ الصَّبَاحِ إِلَى الْمَسَاءِ.","14":"فَلَمَّا رَأَى حَمُو مُوسَى كُلَّ مَا هُوَ صَانِعٌ لِلشَّعْبِ، قَالَ: «مَا هذَا الأَمْرُ الَّذِي أَنْتَ صَانِعٌ لِلشَّعْبِ؟ مَا بَالُكَ جَالِسًا وَحْدَكَ وَجَمِيعُ الشَّعْبِ وَاقِفٌ عِنْدَكَ مِنَ الصَّبَاحِ إِلَى الْمَسَاءِ؟»","15":"فَقَالَ مُوسَى لِحَمِيهِ: «إِنَّ الشَّعْبَ يَأْتِي إِلَيَّ لِيَسْأَلَ اللهَ.","16":"إِذَا كَانَ لَهُمْ دَعْوَى يَأْتُونَ إِلَيَّ فَأَقْضِي بَيْنَ الرَّجُلِ وَصَاحِبِهِ، وَأُعَرِّفُهُمْ فَرَائِضَ اللهِ وَشَرَائِعَهُ».","17":"فَقَالَ حَمُو مُوسَى لَهُ: «لَيْسَ جَيِّدًا الأَمْرُ الَّذِي أَنْتَ صَانِعٌ.","18":"إِنَّكَ تَكِلُّ أَنْتَ وَهذَا الشَّعْبُ الَّذِي مَعَكَ جَمِيعًا، لأَنَّ الأَمْرَ أَعْظَمُ مِنْكَ. لاَ تَسْتَطِيعُ أَنْ تَصْنَعَهُ وَحْدَكَ.","19":"اَلآنَ اسْمَعْ لِصَوْتِي فَأَنْصَحَكَ. فَلْيَكُنِ اللهُ مَعَكَ. كُنْ أَنْتَ لِلشَّعْبِ أَمَامَ اللهِ، وَقَدِّمْ أَنْتَ الدَّعَاوِيَ إِلَى اللهِ،","20":"وَعَلِّمْهُمُ الْفَرَائِضَ وَالشَّرَائِعَ، وَعَرِّفْهُمُ الطَّرِيقَ الَّذِي يَسْلُكُونَهُ، وَالْعَمَلَ الَّذِي يَعْمَلُونَهُ.","21":"وَأَنْتَ تَنْظُرُ مِنْ جَمِيعِ الشَّعْبِ ذَوِي قُدْرَةٍ خَائِفِينَ اللهَ، أُمَنَاءَ مُبْغِضِينَ الرَّشْوَةَ، وَتُقِيمُهُمْ عَلَيْهِمْ رُؤَسَاءَ أُلُوفٍ، وَرُؤَسَاءَ مِئَاتٍ، وَرُؤَسَاءَ خَمَاسِينَ، وَرُؤَسَاءَ عَشَرَاتٍ،","22":"فَيَقْضُونَ لِلشَّعْبِ كُلَّ حِينٍ. وَيَكُونُ أَنَّ كُلَّ الدَّعَاوِي الْكَبِيرَةِ يَجِيئُونَ بِهَا إِلَيْكَ، وَكُلَّ الدَّعَاوِي الصَّغِيرَةِ يَقْضُونَ هُمْ فِيهَا. وَخَفِّفْ عَنْ نَفْسِكَ، فَهُمْ يَحْمِلُونَ مَعَكَ.","23":"إِنْ فَعَلْتَ هذَا الأَمْرَ وَأَوْصَاكَ اللهُ تَسْتَطِيعُ الْقِيَامَ. وَكُلُّ هذَا الشَّعْبِ أَيْضًا يَأْتِي إِلَى مَكَانِهِ بِالسَّلاَمِ».","24":"فَسَمِعَ مُوسَى لِصَوْتِ حَمِيهِ وَفَعَلَ كُلَّ مَا قَالَ."},"46.9":{"8":"وَاللهُ قَادِرٌ أَنْ يَزِيدَكُمْ كُلَّ نِعْمَةٍ، لِكَيْ تَكُونُوا وَلَكُمْ كُلُّ اكْتِفَاءٍ كُلَّ حِينٍ فِي كُلِّ شَيْءٍ، تَزْدَادُونَ فِي كُلِّ عَمَل صَالِحٍ.","10":"وَالَّذِي يُقَدِّمُ بِذَارًا لِلزَّارِعِ وَخُبْزًا لِلأَكْلِ، سَيُقَدِّمُ وَيُكَثِّرُ بِذَارَكُمْ وَيُنْمِي غَّلاَتِ بِرِّكُمْ."},"4.8":{"18":"بَلِ اذْكُرِ الرَّبَّ إِلهَكَ، أَنَّهُ هُوَ الَّذِي يُعْطِيكَ قُوَّةً لاصْطِنَاعِ الثَّرْوَةِ، لِكَيْ يَفِيَ بِعَهْدِهِ الَّذِي أَقْسَمَ لآبَائِكَ كَمَا فِي هذَا الْيَوْمِ."},"39.7":{"9":"أَمْ أَيُّ إِنْسَانٍ مِنْكُمْ إِذَا سَأَلَهُ ابْنُهُ خُبْزًا، يُعْطِيهِ حَجَرًا؟","10":"وَإِنْ سَأَلَهُ سَمَكَةً، يُعْطِيهِ حَيَّةً؟","11":"فَإِنْ كُنْتُمْ وَأَنْتُمْ أَشْرَارٌ تَعْرِفُونَ أَنْ تُعْطُوا أَوْلاَدَكُمْ عَطَايَا جَيِّدَةً، فَكَمْ بِالْحَرِيِّ أَبُوكُمُ الَّذِي فِي السَّمَاوَاتِ، يَهَبُ خَيْرَاتٍ لِلَّذِينَ يَسْأَلُونَهُ!"},"53.6":{"6":"وَأَمَّا التَّقْوَى مَعَ الْقَنَاعَةِ فَهِيَ تِجَارَةٌ عَظِيمَةٌ.","7":"لأَنَّنَا لَمْ نَدْخُلِ الْعَالَمَ بِشَيْءٍ، وَوَاضِحٌ أَنَّنَا لاَ نَقْدِرُ أَنْ نَخْرُجَ مِنْهُ بِشَيْءٍ.","8":"فَإِنْ كَانَ لَنَا قُوتٌ وَكِسْوَةٌ، فَلْنَكْتَفِ بِهِمَا."},"18.81":{"10":"أَنَا الرَّبُّ إِلهُكَ، الَّذِي أَصْعَدَكَ مِنْ أَرْضِ مِصْرَ. أَفْغِرْ فَاكَ فَأَمْلأَهُ."},"1.16":{"11":"فَكَلَّمَ الرَّبُّ مُوسَى قَائِلاً:","12":"«سَمِعْتُ تَذَمُّرَ بَنِي إِسْرَائِيلَ. كَلِّمْهُمْ قَائِلاً: فِي الْعَشِيَّةِ تَأْكُلُونَ لَحْمًا، وَفِي الصَّبَاحِ تَشْبَعُونَ خُبْزًا، وَتَعْلَمُونَ أَنِّي أَنَا الرَّبُّ إِلهُكُمْ».","13":"فَكَانَ فِي الْمَسَاءِ أَنَّ السَّلْوَى صَعِدَتْ وَغَطَّتِ الْمَحَلَّةَ. وَفِي الصَّبَاحِ كَانَ سَقِيطُ النَّدَى حَوَالَيِ الْمَحَلَّةِ.","14":"وَلَمَّا ارْتَفَعَ سَقِيطُ النَّدَى إِذَا عَلَى وَجْهِ الْبَرِّيَّةِ شَيْءٌ دَقِيقٌ مِثْلُ قُشُورٍ. دَقِيقٌ كَالْجَلِيدِ عَلَى الأَرْضِ.","15":"فَلَمَّا رَأَى بَنُو إِسْرَائِيلَ قَالُوا بَعْضُهُمْ لِبَعْضٍ: «مَنْ هُوَ؟» لأَنَّهُمْ لَمْ يَعْرِفُوا مَا هُوَ. فَقَالَ
