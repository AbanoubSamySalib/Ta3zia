<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كلمة تعزية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: a single calm column. Feeling chips on top, the chosen feeling's verses set large as plain text, then one gospel scene and a short reflection. */
:root {
  --bg: #EDF0F3;
  --surface: #F8FAFB;
  --ink: #1B2733;
  --muted: #566574;
  --line: #CDD5DC;
  --accent: #2A6B70;
  --accent-ink: #FFFFFF;
  --soft: #DDE8EA;
  --font-verse: "Amiri", "Noto Naskh Arabic", "Traditional Arabic", serif;
  --font-ui: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111920; --surface: #18222B; --ink: #E4EAEF; --muted: #9AA9B6;
    --line: #2B3946; --accent: #7DB9B6; --accent-ink: #0E1A1F; --soft: #1E2D33;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111920; --surface: #18222B; --ink: #E4EAEF; --muted: #9AA9B6;
  --line: #2B3946; --accent: #7DB9B6; --accent-ink: #0E1A1F; --soft: #1E2D33;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.7;
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3, p, blockquote { margin: 0; }

.head { display: flex; flex-direction: column; gap: 8px; }
.head h1 { font-family: var(--font-verse); font-size: 2.6rem; font-weight: 700; line-height: 1.2; color: var(--accent); }
.head p { color: var(--muted); font-size: 1rem; max-width: 34em; }

.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.chip {
  font: inherit; font-size: 0.95rem; font-weight: 500;
  color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 9px 10px; cursor: pointer; min-width: 0;
  transition: background-color .15s, border-color .15s, color .15s;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip:focus-visible, .copy:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.result { display: flex; flex-direction: column; gap: 26px; scroll-margin-top: 16px; }
.result.in { animation: rise .35s ease-out; }
@keyframes rise { from { opacity: .35; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .result.in { animation: none; } }


.verses { display: flex; flex-direction: column; }
.verse { padding-block: 20px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.verse:last-child { border-bottom: 1px solid var(--line); }
.verse blockquote { font-family: var(--font-verse); font-size: 1.45rem; line-height: 1.95; }
.verse .meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ref { color: var(--accent); font-weight: 600; font-size: 0.9rem; letter-spacing: .02em; }
.copy {
  font: inherit; font-size: 0.85rem; color: var(--muted); background: none;
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; cursor: pointer;
}
.copy:hover { color: var(--ink); border-color: var(--muted); }

.scene { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.label { font-size: 0.8rem; color: var(--muted); font-weight: 600; letter-spacing: .06em; }
.scene h2 { font-family: var(--font-verse); font-size: 1.45rem; line-height: 1.4; }
.scene p { max-width: 36em; }
.scene .ref { align-self: flex-start; }

.reflect { background: var(--soft); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; }

.again {
  font: inherit; font-weight: 600; font-size: 1rem; align-self: stretch;
  color: var(--accent-ink); background: var(--accent);
  border: 0; border-radius: 999px; padding: 12px 20px; cursor: pointer;
}
.again:hover { filter: brightness(1.08); }
.again:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.foot { color: var(--muted); font-size: 0.85rem; display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
.story{font-family:var(--font-verse);font-size:1.3rem;line-height:2;max-width:none}
.vn{font-family:var(--font-ui);font-size:.6em;color:var(--accent);font-weight:600;margin-inline:2px 3px;vertical-align:super;line-height:0}
.verse blockquote .vn{margin-inline:2px 3px}
</style>

</head>
<body>
<main dir="rtl" lang="ar">
  <header class="head">
    <h1>كلمة تعزية</h1>
    <p>اختار الإحساس اللي جواك دلوقتي، وهتلاقي آيات وموقف من الإنجيل يناسبه.</p>
  </header>
  <nav class="chips" id="chips" aria-label="اختار إحساسك"></nav>
  <section class="result" id="result" aria-live="polite"></section>
  <footer class="foot">
    <p>لو حاسس إنك في خطر أو بتفكر تأذي نفسك، كلم حد قريب منك دلوقتي، أو اتصل بالإسعاف أو بخط الدعم النفسي في بلدك.</p>
  </footer>
</main>
<script>
const D = {"N":["تكوين","خروج","لاويين","عدد","تثنية","يشوع","قضاة","راعوث","١ صموئيل","٢ صموئيل","١ ملوك","٢ ملوك","١ أخبار الأيام","٢ أخبار الأيام","عزرا","نحميا","أستير","أيوب","مزمور","أمثال","جامعة","نشيد الأنشاد","إشعياء","إرميا","مراثي إرميا","حزقيال","دانيال","هوشع","يوئيل","عاموس","عوبديا","يونان","ميخا","ناحوم","حبقوق","صفنيا","حجي","زكريا","ملاخي","متى","مرقس","لوقا","يوحنا","أعمال الرسل","رومية","١ كورنثوس","٢ كورنثوس","غلاطية","أفسس","فيلبي","كولوسي","١ تسالونيكي","٢ تسالونيكي","١ تيموثاوس","٢ تيموثاوس","تيطس","فليمون","عبرانيين","يعقوب","١ بطرس","٢ بطرس","١ يوحنا","٢ يوحنا","٣ يوحنا","يهوذا","رؤيا يوحنا"],"V":{"18.34":{"18":"قَرِيبٌ هُوَ الرَّبُّ مِنَ الْمُنْكَسِرِي الْقُلُوبِ، وَيُخَلِّصُ الْمُنْسَحِقِي الرُّوحِ.","17":"أُولئِكَ صَرَخُوا، وَالرَّبُّ سَمِعَ، وَمِنْ كُلِّ شَدَائِدِهِمْ أَنْقَذَهُمْ.","4":"طَلَبْتُ إِلَى الرَّبِّ فَاسْتَجَابَ لِي، وَمِنْ كُلِّ مَخَاوِفِي أَنْقَذَنِي.","19":"كَثِيرَةٌ هِيَ بَلاَيَا الصِّدِّيقِ، وَمِنْ جَمِيعِهَا يُنَجِّيهِ الرَّبُّ.","8":"ذُوقُوا وَانْظُرُوا مَا أَطْيَبَ الرَّبَّ! طُوبَى لِلرَّجُلِ الْمُتَوَكِّلِ عَلَيْهِ.","1":"أُبَارِكُ الرَّبَّ فِي كُلِّ حِينٍ. دَائِمًا تَسْبِيحُهُ فِي فَمِي.","10":"الأَشْبَالُ احْتَاجَتْ وَجَاعَتْ، وَأَمَّا طَالِبُو الرَّبِّ فَلاَ يُعْوِزُهُمْ شَيْءٌ مِنَ الْخَيْرِ.","7":"مَلاَكُ الرَّبِّ حَالٌّ حَوْلَ خَائِفِيهِ، وَيُنَجِّيهِمْ.","5":"نَظَرُوا إِلَيْهِ وَاسْتَنَارُوا، وَوُجُوهُهُمْ لَمْ تَخْجَلْ.","14":"حِدْ عَنِ الشَّرِّ، وَاصْنَعِ الْخَيْرَ. اطْلُبِ السَّلاَمَةَ، وَاسْعَ وَرَاءَهَا."},"18.30":{"5":"لأَنَّ لِلَحْظَةٍ غَضَبَهُ. حَيَاةٌ فِي رِضَاهُ. عِنْدَ الْمَسَاءِ يَبِيتُ الْبُكَاءُ، وَفِي الصَّبَاحِ تَرَنُّمٌ.","11":"حَوَّلْتَ نَوْحِي إِلَى رَقْصٍ لِي. حَلَلْتَ مِسْحِي وَمَنْطَقْتَنِي فَرَحًا،","12":"لِكَيْ تَتَرَنَّمَ لَكَ رُوحِي وَلاَ تَسْكُتَ. يَا رَبُّ إِلهِي، إِلَى الأَبَدِ أَحْمَدُكَ.","2":"يَا رَبُّ إِلهِي، اسْتَغَثْتُ بِكَ فَشَفَيْتَنِي."},"39.5":{"4":"طُوبَى لِلْحَزَانَى، لأَنَّهُمْ يَتَعَزَّوْنَ.","22":"وَأَمَّا أَنَا فَأَقُولُ لَكُمْ: إِنَّ كُلَّ مَنْ يَغْضَبُ عَلَى أَخِيهِ بَاطِلاً يَكُونُ مُسْتَوْجِبَ الْحُكْمِ، وَمَنْ قَالَ لأَخِيهِ: رَقَا، يَكُونُ مُسْتَوْجِبَ الْمَجْمَعِ، وَمَنْ قَالَ: يَا أَحْمَقُ، يَكُونُ مُسْتَوْجِبَ نَارِ جَهَنَّمَ.","11":"طُوبَى لَكُمْ إِذَا عَيَّرُوكُمْ وَطَرَدُوكُمْ وَقَالُوا عَلَيْكُمْ كُلَّ كَلِمَةٍ شِرِّيرَةٍ، مِنْ أَجْلِي، كَاذِبِينَ.","12":"اِفْرَحُوا وَتَهَلَّلُوا، لأَنَّ أَجْرَكُمْ عَظِيمٌ فِي السَّمَاوَاتِ، فَإِنَّهُمْ هكَذَا طَرَدُوا الأَنْبِيَاءَ الَّذِينَ قَبْلَكُمْ.","44":"وَأَمَّا أَنَا فَأَقُولُ لَكُمْ: أَحِبُّوا أَعْدَاءَكُمْ. بَارِكُوا لاَعِنِيكُمْ. أَحْسِنُوا إِلَى مُبْغِضِيكُمْ، وَصَلُّوا لأَجْلِ الَّذِينَ يُسِيئُونَ إِلَيْكُمْ وَيَطْرُدُونَكُمْ،","45":"لِكَيْ تَكُونُوا أَبْنَاءَ أَبِيكُمُ الَّذِي فِي السَّمَاوَاتِ، فَإِنَّهُ يُشْرِقُ شَمْسَهُ عَلَى الأَشْرَارِ وَالصَّالِحِينَ، وَيُمْطِرُ عَلَى الأَبْرَارِ وَالظَّالِمِينَ.","14":"أَنْتُمْ نُورُ الْعَالَمِ. لاَ يُمْكِنُ أَنْ تُخْفَى مَدِينَةٌ مَوْضُوعَةٌ عَلَى جَبَل،","15":"وَلاَ يُوقِدُونَ سِرَاجًا وَيَضَعُونَهُ تَحْتَ الْمِكْيَالِ، بَلْ عَلَى الْمَنَارَةِ فَيُضِيءُ لِجَمِيعِ الَّذِينَ فِي الْبَيْتِ.","16":"فَلْيُضِئْ نُورُكُمْ هكَذَا قُدَّامَ النَّاسِ، لِكَيْ يَرَوْا أَعْمَالَكُمُ الْحَسَنَةَ، وَيُمَجِّدُوا أَبَاكُمُ الَّذِي فِي السَّمَاوَاتِ.","6":"طُوبَى لِلْجِيَاعِ وَالْعِطَاشِ إِلَى الْبِرِّ، لأَنَّهُمْ يُشْبَعُونَ."},"18.126":{"5":"الَّذِينَ يَزْرَعُونَ بِالدُّمُوعِ يَحْصُدُونَ بِالابْتِهَاجِ.","6":"الذَّاهِبُ ذَهَابًا بِالْبُكَاءِ حَامِلاً مِبْذَرَ الزَّرْعِ، مَجِيئًا يَجِيءُ بِالتَّرَنُّمِ حَامِلاً حُزَمَهُ.","1":"عِنْدَمَا رَدَّ الرَّبُّ سَبْيَ صِهْيَوْنَ، صِرْنَا مِثْلَ الْحَالِمِينَ.","2":"حِينَئِذٍ امْتَلأَتْ أَفْوَاهُنَا ضِحْكًا، وَأَلْسِنَتُنَا تَرَنُّمًا. حِينَئِذٍ قَالُوا بَيْنَ الأُمَمِ: «إِنَّ الرَّبَّ قَدْ عَظَّمَ الْعَمَلَ مَعَ هؤُلاَءِ».","3":"عَظَّمَ الرَّبُّ الْعَمَلَ مَعَنَا، وَصِرْنَا فَرِحِينَ."},"18.42":{"11":"لِمَاذَا أَنْتِ مُنْحَنِيَةٌ يَا نَفْسِي؟ وَلِمَاذَا تَئِنِّينَ فِيَّ؟ تَرَجَّيِاللهَ، لأَنِّي بَعْدُ أَحْمَدُهُ، خَلاَصَ وَجْهِي وَإِلهِي.","5":"لِمَاذَا أَنْتِ مُنْحَنِيَةٌ يَا نَفْسِي؟ وَلِمَاذَا تَئِنِّينَ فِيَّ؟ ارْتَجِي اللهَ، لأَنِّي بَعْدُ أَحْمَدُهُ، لأَجْلِ خَلاَصِ وَجْهِهِ.","1":"كَمَا يَشْتَاقُ الإِيَّلُ إِلَى جَدَاوِلِ الْمِيَاهِ، هكَذَا تَشْتَاقُ نَفْسِي إِلَيْكَ يَا اللهُ.","2":"عَطِشَتْ نَفْسِي إِلَى اللهِ، إِلَى الإِلهِ الْحَيِّ. مَتَى أَجِيءُ وَأَتَرَاءَى قُدَّامَ اللهِ ؟"},"18.147":{"3":"يَشْفِي الْمُنْكَسِرِي الْقُلُوبِ، وَيَجْبُرُ كَسْرَهُمْ."},"22.61":{"3":"لأَجْعَلَ لِنَائِحِي صِهْيَوْنَ، لأُعْطِيَهُمْ جَمَالاً عِوَضًا عَنِ الرَّمَادِ، وَدُهْنَ فَرَحٍ عِوَضًا عَنِ النَّوْحِ، وَرِدَاءَ تَسْبِيحٍ عِوَضًا عَنِ الرُّوحِ الْيَائِسَةِ، فَيُدْعَوْنَ أَشْجَارَ الْبِرِّ، غَرْسَ الرَّبِّ لِلتَّمْجِيدِ.","1":"رُوحُ السَّيِّدِ الرَّبِّ عَلَيَّ، لأَنَّ الرَّبَّ مَسَحَنِي لأُبَشِّرَ الْمَسَاكِينَ، أَرْسَلَنِي لأَعْصِبَ مُنْكَسِرِي الْقَلْبِ، لأُنَادِيَ لِلْمَسْبِيِّينَ بِالْعِتْقِ، وَلِلْمَأْسُورِينَ بِالإِطْلاَقِ.","8":"«لأَنِّي أَنَا الرَّبُّ مُحِبُّ الْعَدْلِ، مُبْغِضُ الْمُخْتَلِسِ بِالظُّلْمِ. وَأَجْعَلُ أُجْرَتَهُمْ أَمِينَةً، وَأَقْطَعُ لَهُمْ عَهْدًا أَبَدِيًّا.","7":"عِوَضًا عَنْ خِزْيِكُمْ ضِعْفَانِ، وَعِوَضًا عَنِ الْخَجَلِ يَبْتَهِجُونَ بِنَصِيبِهِمْ. لِذلِكَ يَرِثُونَ فِي أَرْضِهِمْ ضِعْفَيْنِ. بَهْجَةٌ أَبَدِيَّةٌ تَكُونُ لَهُمْ."},"46.1":{"3":"مُبَارَكٌ اللهُ أَبُو رَبِّنَا يَسُوعَ الْمَسِيحِ، أَبُو الرَّأْفَةِ وَإِلهُ كُلِّ تَعْزِيَةٍ،","4":"الَّذِي يُعَزِّينَا فِي كُلِّ ضِيقَتِنَا، حَتَّى نَسْتَطِيعَ أَنْ نُعَزِّيَ الَّذِينَ هُمْ فِي كُلِّ ضِيقَةٍ بِالتَّعْزِيَةِ الَّتِي نَتَعَزَّى نَحْنُ بِهَا مِنَ اللهِ."},"65.21":{"4":"وَسَيَمْسَحُ اللهُ كُلَّ دَمْعَةٍ مِنْ عُيُونِهِمْ، وَالْمَوْتُ لاَ يَكُونُ فِي مَا بَعْدُ، وَلاَ يَكُونُ حُزْنٌ وَلاَ صُرَاخٌ وَلاَ وَجَعٌ فِي مَا بَعْدُ، لأَنَّ الأُمُورَ الأُولَى قَدْ مَضَتْ».","5":"وَقَالَ الْجَالِسُ عَلَى الْعَرْشِ:«هَا أَنَا أَصْنَعُ كُلَّ شَيْءٍ جَدِيدًا!». وَقَالَ لِيَ: «اكْتُبْ: فَإِنَّ هذِهِ الأَقْوَالَ صَادِقَةٌ وَأَمِينَةٌ»."},"18.56":{"8":"تَيَهَانِي رَاقَبْتَ. اجْعَلْ أَنْتَ دُمُوعِي فِي زِقِّكَ. أَمَا هِيَ فِي سِفْرِكَ؟","3":"فِي يَوْمِ خَوْفِي، أَنَا عَلَيْكَ أَتَّكِلُ.","4":"اَللهُ أَفْتَخِرُ بِكَلاَمِهِ. عَلَى اللهِ تَوَكَّلْتُ فَلاَ أَخَافُ. مَاذَا يَصْنَعُهُ بِي الْبَشَرُ؟"},"24.3":{"31":"لأَنَّ السَّيِّدَ لاَ يَرْفُضُ إِلَى الأَبَدِ.","32":"فَإِنَّهُ وَلَوْ أَحْزَنَ يَرْحَمُ حَسَبَ كَثْرَةِ مَرَاحِمِهِ.","33":"لأَنَّهُ لاَ يُذِلُّ مِنْ قَلْبِهِ، وَلاَ يُحْزِنُ بَنِي الإِنْسَانِ.","22":"إِنَّهُ مِنْ إِحْسَانَاتِ الرَّبِّ أَنَّنَا لَمْ نَفْنَ، لأَنَّ مَرَاحِمَهُ لاَ تَزُولُ.","23":"هِيَ جَدِيدَةٌ فِي كُلِّ صَبَاحٍ. كَثِيرَةٌ أَمَانَتُكَ.","25":"طَيِّبٌ هُوَ الرَّبُّ لِلَّذِينَ يَتَرَجَّوْنَهُ، لِلنَّفْسِ الَّتِي تَطْلُبُهُ.","26":"جَيِّدٌ أَنْ يَنْتَظِرَ الإِنْسَانُ وَيَتَوَقَّعَ بِسُكُوتٍ خَلاَصَ الرَّبِّ.","19":"ذِكْرُ مَذَلَّتِي وَتَيَهَانِي أَفْسَنْتِينٌ وَعَلْقَمٌ.","20":"ذِكْرًا تَذْكُرُ نَفْسِي وَتَنْحَنِي فِيَّ.","21":"أُرَدِّدُ هذَا فِي قَلْبِي، مِنْ أَجْلِ ذلِكَ أَرْجُو:","24":"نَصِيبِي هُوَ الرَّبُّ، قَالَتْ نَفْسِي، مِنْ أَجْلِ ذلِكَ أَرْجُوهُ."},"42.14":{"18":"لاَ أَتْرُكُكُمْ يَتَامَى. إِنِّي آتِي إِلَيْكُمْ.","27":"«سَلاَمًا أَتْرُكُ لَكُمْ. سَلاَمِي أُعْطِيكُمْ. لَيْسَ كَمَا يُعْطِي الْعَالَمُ أُعْطِيكُمْ أَنَا. لاَ تَضْطَرِبْ قُلُوبُكُمْ وَلاَ تَرْهَبْ.","1":"«لاَ تَضْطَرِبْ قُلُوبُكُمْ. أَنْتُمْ تُؤْمِنُونَ بِاللهِ فَآمِنُوا بِي.","2":"فِي بَيْتِ أَبِي مَنَازِلُ كَثِيرَةٌ، وَإِلاَّ فَإِنِّي كُنْتُ قَدْ قُلْتُ لَكُمْ. أَنَا أَمْضِي لأُعِدَّ لَكُمْ مَكَانًا،","3":"وَإِنْ مَضَيْتُ وَأَعْدَدْتُ لَكُمْ مَكَانًا آتِي أَيْضًا وَآخُذُكُمْ إِلَيَّ، حَتَّى حَيْثُ أَكُونُ أَنَا تَكُونُونَ أَنْتُمْ أَيْضًا،","26":"وَأَمَّا الْمُعَزِّي، الرُّوحُ الْقُدُسُ، الَّذِي سَيُرْسِلُهُ الآبُ بِاسْمِي، فَهُوَ يُعَلِّمُكُمْ كُلَّ شَيْءٍ، وَيُذَكِّرُكُمْ بِكُلِّ مَا قُلْتُهُ لَكُمْ."},"41.6":{"21":"طُوبَاكُمْ أَيُّهَا الْجِيَاعُ الآنَ، لأَنَّكُمْ تُشْبَعُونَ. طُوبَاكُمْ أَيُّهَا الْبَاكُونَ الآنَ، لأَنَّكُمْ سَتَضْحَكُونَ.","27":"«لكِنِّي أَقُولُ لَكُمْ أَيُّهَا السَّامِعُونَ: أَحِبُّوا أَعْدَاءَكُمْ، أَحْسِنُوا إِلَى مُبْغِضِيكُمْ،","28":"بَارِكُوا لاَعِنِيكُمْ، وَصَلُّوا لأَجْلِ الَّذِينَ يُسِيئُونَ إِلَيْكُمْ.","37":"«وَلاَ تَدِينُوا فَلاَ تُدَانُوا. لاَ تَقْضُوا عَلَى أَحَدٍ فَلاَ يُقْضَى عَلَيْكُمْ. اِغْفِرُوا يُغْفَرْ لَكُمْ."},"42.16":{"22":"فَأَنْتُمْ كَذلِكَ، عِنْدَكُمُ الآنَ حُزْنٌ. وَلكِنِّي سَأَرَاكُمْ أَيْضًا فَتَفْرَحُ قُلُوبُكُمْ، وَلاَ يَنْزِعُ أَحَدٌ فَرَحَكُمْ مِنْكُمْ","32":"هُوَذَا تَأْتِي سَاعَةٌ، وَقَدْ أَتَتِ الآنَ، تَتَفَرَّقُونَ فِيهَا كُلُّ وَاحِدٍ إِلَى خَاصَّتِهِ، وَتَتْرُكُونَنِي وَحْدِي. وَأَنَا لَسْتُ وَحْدِي لأَنَّ الآبَ مَعِي.","33":"قَدْ كَلَّمْتُكُمْ بِهذَا لِيَكُونَ لَكُمْ فِيَّ سَلاَمٌ. فِي الْعَالَمِ سَيَكُونُ لَكُمْ ضِيقٌ، وَلكِنْ ثِقُوا: أَنَا قَدْ غَلَبْتُ الْعَالَمَ».","24":"إِلَى الآنَ لَمْ تَطْلُبُوا شَيْئًا بِاسْمِي. اُطْلُبُوا تَأْخُذُوا، لِيَكُونَ فَرَحُكُمْ كَامِلاً."},"22.25":{"8":"يَبْلَعُ الْمَوْتَ إِلَى الأَبَدِ، وَيَمْسَحُ السَّيِّدُ الرَّبُّ الدُّمُوعَ عَنْ كُلِّ الْوُجُوهِ، وَيَنْزِعُ عَارَ شَعْبِهِ عَنْ كُلِّ الأَرْضِ، لأَنَّ الرَّبَّ قَدْ تَكَلَّمَ."},"18.119":{"50":"هذِهِ هِيَ تَعْزِيَتِي فِي مَذَلَّتِي، لأَنَّ قَوْلَكَ أَحْيَانِي.","105":"سِرَاجٌ لِرِجْلِي كَلاَمُكَ وَنُورٌ لِسَبِيلِي.","130":"فَتْحُ كَلاَمِكَ يُنِيرُ، يُعَقِّلُ الْجُهَّالَ.","28":"قَطَرَتْ نَفْسِي مِنَ الْحُزْنِ. أَقِمْنِي حَسَبَ كَلاَمِكَ.","9":"بِمَ يُزَكِّي الشَّابُّ طَرِيقَهُ؟ بِحِفْظِهِ إِيَّاهُ حَسَبَ كَلاَمِكَ.","10":"بِكُلِّ قَلْبِي طَلَبْتُكَ. لاَ تُضِلَّنِي عَنْ وَصَايَاكَ.","11":"خَبَأْتُ كَلاَمَكَ فِي قَلْبِي لِكَيْلاَ أُخْطِئَ إِلَيْكَ.","37":"حَوِّلْ عَيْنَيَّ عَنِ النَّظَرِ إِلَى الْبَاطِلِ. فِي طَرِيقِكَ أَحْيِنِي.","6":"حِينَئِذٍ لاَ أَخْزَى إِذَا نَظَرْتُ إِلَى كُلِّ وَصَايَاكَ.","165":"سَلاَمَةٌ جَزِيلَةٌ لِمُحِبِّي شَرِيعَتِكَ، وَلَيْسَ لَهُمْ مَعْثَرَةٌ.","71":"خَيْرٌ لِي أَنِّي تَذَلَّلْتُ لِكَيْ أَتَعَلَّمَ فَرَائِضَكَ.","75":"قَدْ عَلِمْتُ يَا رَبُّ أَنَّ أَحْكَامَكَ عَدْلٌ، وَبِالْحَقِّ أَذْلَلْتَنِي."},"52.2":{"16":"وَرَبُّنَا نَفْسُهُ يَسُوعُ الْمَسِيحُ، وَاللهُ أَبُونَا الَّذِي أَحَبَّنَا وَأَعْطَانَا عَزَاءً أَبَدِيًّا وَرَجَاءً صَالِحًا بِالنِّعْمَةِ،","17":"يُعَزِّي قُلُوبَكُمْ وَيُثَبِّتُكُمْ فِي كُلِّ كَلاَمٍ وَعَمَل صَالِحٍ."},"18.31":{"7":"أَبْتَهِجُ وَأَفْرَحُ بِرَحْمَتِكَ، لأَنَّكَ نَظَرْتَ إِلَى مَذَلَّتِي، وَعَرَفْتَ فِي الشَّدَائِدِ نَفْسِي،","24":"لِتَتَشَدَّدْ وَلْتَتَشَجَّعْ قُلُوبُكُمْ، يَا جَمِيعَ الْمُنْتَظِرِينَ الرَّبَّ.","14":"أَمَّا أَنَا فَعَلَيْكَ تَوَكَّلْتُ يَا رَبُّ. قُلْتُ: «إِلهِي أَنْتَ».","15":"فِي يَدِكَ آجَالِي. نَجِّنِي مِنْ يَدِ أَعْدَائِي وَمِنَ الَّذِينَ يَطْرُدُونَنِي.","1":"عَلَيْكَ يَا رَبُّ تَوَكَّلْتُ. لاَ تَدَعْنِي أَخْزَى مَدَى الدَّهْرِ. بِعَدْلِكَ نَجِّنِي."},"41.7":{"11":"وَفِي الْيَوْمِ التَّالِي ذَهَبَ إِلَى مَدِينَةٍ تُدْعَى نَايِينَ، وَذَهَبَ مَعَهُ كَثِيرُونَ مِنْ تَلاَمِيذِهِ وَجَمْعٌ كَثِيرٌ.","12":"فَلَمَّا اقْتَرَبَ إِلَى بَابِ الْمَدِينَةِ، إِذَا مَيْتٌ مَحْمُولٌ، ابْنٌ وَحِيدٌ لأُمِّهِ، وَهِيَ أَرْمَلَةٌ وَمَعَهَا جَمْعٌ كَثِيرٌ مِنَ الْمَدِينَةِ.","13":"فَلَمَّا رَآهَا الرَّبُّ تَحَنَّنَ عَلَيْهَا، وَقَالَ لَهَا:«لاَ تَبْكِي».","14":"ثُمَّ تَقَدَّمَ وَلَمَسَ النَّعْشَ، فَوَقَفَ الْحَامِلُونَ. فَقَالَ: «أَيُّهَا الشَّابُّ، لَكَ أَقُولُ: قُمْ!».","15":"فَجَلَسَ الْمَيْتُ وَابْتَدَأَ يَتَكَلَّمُ، فَدَفَعَهُ إِلَى أُمِّهِ.","16":"فَأَخَذَ الْجَمِيعَ خَوْفٌ، وَمَجَّدُوا اللهَ قَائِلِينَ:«قَدْ قَامَ فِينَا نَبِيٌّ عَظِيمٌ، وَافْتَقَدَ اللهُ شَعْبَهُ».","17":"وَخَرَجَ هذَا الْخَبَرُ عَنْهُ فِي كُلِّ الْيَهُودِيَّةِ وَفِي جَمِيعِ الْكُورَةِ الْمُحِيطَةِ.","36":"وَسَأَلَهُ وَاحِدٌ مِنَ الْفَرِّيسِيِّينَ أَنْ يَأْكُلَ مَعَهُ، فَدَخَلَ بَيْتَ الْفَرِّيسِيِّ وَاتَّكَأَ.","37":"وَإِذَا امْرَأَةٌ فِي الْمَدِينَةِ كَانَتْ خَاطِئَةً، إِذْ عَلِمَتْ أَنَّهُ مُتَّكِئٌ فِي بَيْتِ الْفَرِّيسِيِّ، جَاءَتْ بِقَارُورَةِ طِيبٍ","38":"وَوَقَفَتْ عِنْدَ قَدَمَيْهِ مِنْ وَرَائِهِ بَاكِيَةً، وَابْتَدَأَتْ تَبُلُّ قَدَمَيْهِ بِالدُّمُوعِ، وَكَانَتْ تَمْسَحُهُمَا بِشَعْرِ رَأْسِهَا، وَتُقَبِّلُ قَدَمَيْهِ وَتَدْهَنُهُمَا بِالطِّيبِ.","39":"فَلَمَّا رَأَى الْفَرِّيسِيُّ الَّذِي دَعَاهُ ذلِكَ، تَكَلَّمَ فِي نَفْسِهِ قِائِلاً:«لَوْ كَانَ هذَا نَبِيًّا، لَعَلِمَ مَنْ هذِهِ الامَرْأَةُ الَّتِي تَلْمِسُهُ وَمَا هِيَ! إِنَّهَا خَاطِئَةٌ».","40":"فَأَجَابَ يَسُوعُ وَقَالَ لَهُ:«يَاسِمْعَانُ، عِنْدِي شَيْءٌ أَقُولُهُ لَكَ». فَقَالَ:«قُلْ، يَامُعَلِّمُ».","41":"«كَانَ لِمُدَايِنٍ مَدْيُونَانِ. عَلَى الْوَاحِدِ خَمْسُمِئَةِ دِينَارٍ وَعَلَى الآخَرِ خَمْسُونَ.","42":"وَإِذْ لَمْ يَكُنْ لَهُمَا مَا يُوفِيَانِ سَامَحَهُمَا جَمِيعًا. فَقُلْ: أَيُّهُمَا يَكُونُ أَكْثَرَ حُبًّا لَهُ؟»","43":"فَأَجَابَ سِمْعَانُ وَقَالَ:«أَظُنُّ الَّذِي سَامَحَهُ بِالأَكْثَرِ». فَقَالَ لَهُ:«بِالصَّوَابِ حَكَمْتَ».","44":"ثُمَّ الْتَفَتَ إِلَى الْمَرْأَةِ وَقَالَ لِسِمْعَانَ:«أَتَنْظُرُ هذِهِ الْمَرْأَةَ؟ إِنِّي دَخَلْتُ بَيْتَكَ، وَمَاءً لأَجْلِ رِجْلَيَّ لَمْ تُعْطِ. وَأَمَّا هِيَ فَقَدْ غَسَلَتْ رِجْلَيَّ بِالدُّمُوعِ وَمَسَحَتْهُمَا بِشَعْرِ رَأْسِهَا.","45":"قُبْلَةً لَمْ تُقَبِّلْنِي، وَأَمَّا هِيَ فَمُنْذُ دَخَلْتُ لَمْ تَكُفَّ عَنْ تَقْبِيلِ رِجْلَيَّ.","46":"بِزَيْتٍ لَمْ تَدْهُنْ رَأْسِي، وَأَمَّا هِيَ فَقَدْ دَهَنَتْ بِالطِّيبِ رِجْلَيَّ.","47":"مِنْ أَجْلِ ذلِكَ أَقُولُ لَكَ: قَدْ غُفِرَتْ خَطَايَاهَا الْكَثِيرَةُ، لأَنَّهَا أَحَبَّتْ كَثِيرًا. وَالَّذِي يُغْفَرُ لَهُ قَلِيلٌ يُحِبُّ قَلِيلاً».","48":"ثُمَّ قَالَ لَهَا:«مَغْفُورَةٌ لَكِ خَطَايَاكِ».","49":"فَابْتَدَأَ الْمُتَّكِئُونَ مَعَهُ يَقُولُونَ فِي أَنْفُسِهِمْ:«مَنْ هذَا الَّذِي يَغْفِرُ خَطَايَا أَيْضًا؟».","50":"فَقَالَ لِلْمَرْأَةِ:«إِيمَانُكِ قَدْ خَلَّصَكِ، اِذْهَبِي بِسَلاَمٍ».","1":"وَلَمَّا أَكْمَلَ أَقْوَالَهُ كُلَّهَا فِي مَسَامِعِ الشَّعْبِ دَخَلَ كَفْرَنَاحُومَ.","2":"وَكَانَ عَبْدٌ لِقَائِدِ مِئَةٍ، مَرِيضًا مُشْرِفًا عَلَى الْمَوْتِ، وَكَانَ عَزِيزًا عِنْدَهُ.","3":"فَلَمَّا سَمِعَ عَنْ يَسُوعَ، أَرْسَلَ إِلَيْهِ شُيُوخَ الْيَهُودِ يَسْأَلُهُ أَنْ يَأْتِيَ وَيَشْفِيَ عَبْدَهُ.","4":"فَلَمَّا جَاءُوا إِلَى يَسُوعَ طَلَبُوا إِلَيْهِ بِاجْتِهَادٍ قَائِلِينَ:«إِنَّهُ مُسْتَحِقٌّ أَنْ يُفْعَلَ لَهُ هذَا،","5":"لأَنَّهُ يُحِبُّ أُمَّتَنَا، وَهُوَ بَنَى لَنَا الْمَجْمَعَ».","6":"فَذَهَبَ يَسُوعُ مَعَهُمْ. وَإِذْ كَانَ غَيْرَ بَعِيدٍ عَنِ الْبَيْتِ، أَرْسَلَ إِلَيْهِ قَائِدُ الْمِئَةِ أَصْدِقَاءَ يَقُولُ لَهُ:«يَا سَيِّدُ، لاَ تَتْعَبْ. لأَنِّي لَسْتُ مُسْتَحِقًّا أَنْ تَدْخُلَ تَحْتَ سَقْفِي.","7":"لِذلِكَ لَمْ أَحْسِبْ نَفْسِي أَهْلاً أَنْ آتِيَ إِلَيْكَ. لكِنْ قُلْ كَلِمَةً فَيَبْرَأَ غُلاَمِي.","8":"لأَنِّي أَنَا أَيْضًا إِنْسَانٌ مُرَتَّبٌ تَحْتَ سُلْطَانٍ، لِي جُنْدٌ تَحْتَ يَدِي. وَأَقُولُ لِهذَا: اذْهَبْ! فَيَذْهَبُ، وَلآخَرَ: ائْتِ! فَيَأْتِي، وَلِعَبْدِي: افْعَلْ هذَا! فَيَفْعَلُ».","9":"وَلَمَّا سَمِعَ يَسُوعُ هذَا تَعَجَّبَ مِنْهُ، وَالْتَفَتَ إِلَى الْجَمْعِ الَّذِي يَتْبَعُهُ وَقَالَ:«أَقُولُ لَكُمْ: لَمْ أَجِدْ وَلاَ فِي إِسْرَائِيلَ إِيمَانًا بِمِقْدَارِ هذَا!».","10":"وَرَجَعَ الْمُرْسَلُونَ إِلَى الْبَيْتِ، فَوَجَدُوا الْعَبْدَ الْمَرِيضَ قَدْ صَحَّ."},"42.20":{"11":"أَمَّا مَرْيَمُ فَكَانَتْ وَاقِفَةً عِنْدَ الْقَبْرِ خَارِجًا تَبْكِي. وَفِيمَا هِيَ تَبْكِي انْحَنَتْ إِلَى الْقَبْرِ،","12":"فَنَظَرَتْ مَلاَكَيْنِ بِثِيَابٍ بِيضٍ جَالِسَيْنِ وَاحِدًا عِنْدَ الرَّأْسِ وَالآخَرَ عِنْدَ الرِّجْلَيْنِ، حَيْثُ كَانَ جَسَدُ يَسُوعَ مَوْضُوعًا.","13":"فَقَالاَ لَهَا:«يَا امْرَأَةُ، لِمَاذَا تَبْكِينَ؟» قَالَتْ لَهُمَا:«إِنَّهُمْ أَخَذُوا سَيِّدِي، وَلَسْتُ أَعْلَمُ أَيْنَ وَضَعُوهُ!».","14":"وَلَمَّا قَالَتْ هذَا الْتَفَتَتْ إِلَى الْوَرَاءِ، فَنَظَرَتْ يَسُوعَ وَاقِفًا، وَلَمْ تَعْلَمْ أَنَّهُ يَسُوعُ.","15":"قَالَ لَهَا يَسُوعُ:«يَا امْرَأَةُ، لِمَاذَا تَبْكِينَ؟ مَنْ تَطْلُبِينَ؟» فَظَنَّتْ تِلْكَ أَنَّهُ الْبُسْتَانِيُّ، فَقَالَتْ لَهُ:«يَا سَيِّدُ، إِنْ كُنْتَ أَنْتَ قَدْ حَمَلْتَهُ فَقُلْ لِي أَيْنَ وَضَعْتَهُ، وَأَنَا آخُذُهُ».","16":"قَالَ لَهَا يَسُوعُ:«يَا مَرْيَمُ» فَالْتَفَتَتْ تِلْكَ وَقَالَتْ لَهُ: «رَبُّونِي!» الَّذِي تَفْسِيرُهُ: يَا مُعَلِّمُ.","17":"قَالَ لَهَا يَسُوعُ:«لاَ تَلْمِسِينِي لأَنِّي لَمْ أَصْعَدْ بَعْدُ إِلَى أَبِي. وَلكِنِ اذْهَبِي إِلَى إِخْوَتِي وَقُولِي لَهُمْ:إِنِّي أَصْعَدُ إِلَى أَبِي وَأَبِيكُمْ وَإِلهِي وَإِلهِكُمْ».","18":"فَجَاءَتْ مَرْيَمُ الْمَجْدَلِيَّةُ وَأَخْبَرَتِ التَّلاَمِيذَ أَنَّهَا رَأَتِ الرَّبَّ، وَأَنَّهُ قَالَ لَهَا هذَا.","29":"قَالَ لَهُ يَسُوعُ:«لأَنَّكَ رَأَيْتَنِي يَا تُومَا آمَنْتَ! طُوبَى لِلَّذِينَ آمَنُوا وَلَمْ يَرَوْا».","31":"وَأَمَّا هذِهِ فَقَدْ كُتِبَتْ لِتُؤْمِنُوا أَنَّ يَسُوعَ هُوَ الْمَسِيحُ ابْنُ اللهِ، وَلِكَيْ تَكُونَ لَكُمْ إِذَا آمَنْتُمْ حَيَاةٌ بِاسْمِهِ.","24":"أَمَّا تُومَا، أَحَدُ الاثْنَيْ عَشَرَ، الَّذِي يُقَالُ لَهُ التَّوْأَمُ، فَلَمْ يَكُنْ مَعَهُمْ حِينَ جَاءَ يَسُوعُ.","25":"فَقَالَ لَهُ التَّلاَمِيذُ الآخَرُونَ:«قَدْ رَأَيْنَا الرَّبَّ!». فَقَالَ لَهُمْ:«إِنْ لَمْ أُبْصِرْ فِي يَدَيْهِ أَثَرَ الْمَسَامِيرِ، وَأَضَعْ إِصْبِعِي فِي أَثَرِ الْمَسَامِيرِ، وَأَضَعْ يَدِي فِي جَنْبِهِ، لاَ أُومِنْ».","26":"وَبَعْدَ ثَمَانِيَةِ أَيَّامٍ كَانَ تَلاَمِيذُهُ أَيْضًا دَاخِلاً وَتُومَا مَعَهُمْ. فَجَاءَ يَسُوعُ وَالأَبْوَابُ مُغَلَّقَةٌ، وَوَقَفَ فِي الْوَسْطِ وَقَالَ:«سَلاَمٌ لَكُمْ!».","27":"ثُمَّ قَالَ لِتُومَا:«هَاتِ إِصْبِعَكَ إِلَى هُنَا وَأَبْصِرْ يَدَيَّ، وَهَاتِ يَدَكَ وَضَعْهَا فِي جَنْبِي، وَلاَ تَكُنْ غَيْرَ مُؤْمِنٍ بَلْ مُؤْمِنًا».","28":"أَجَابَ تُومَا وَقَالَ لَهُ:«رَبِّي وَإِلهِي!».","19":"وَلَمَّا كَانَتْ عَشِيَّةُ ذلِكَ الْيَوْمِ، وَهُوَ أَوَّلُ الأُسْبُوعِ، وَكَانَتِ الأَبْوَابُ مُغَلَّقَةً حَيْثُ كَانَ التَّلاَمِيذُ مُجْتَمِعِينَ لِسَبَبِ الْخَوْفِ مِنَ الْيَهُودِ، جَاءَ يَسُوعُ وَوَقَفَ فِي الْوَسْطِ، وَقَالَ لَهُمْ:«سَلاَمٌ لَكُمْ!»","20":"وَلَمَّا قَالَ هذَا أَرَاهُمْ يَدَيْهِ وَجَنْبَهُ، فَفَرِحَ التَّلاَمِيذُ إِذْ رَأَوْا الرَّبَّ.","21":"فَقَالَ لَهُمْ يَسُوعُ أَيْضًا:«سَلاَمٌ لَكُمْ! كَمَا أَرْسَلَنِي الآبُ أُرْسِلُكُمْ أَنَا».","22":"وَلَمَّا قَالَ هذَا نَفَخَ وَقَالَ لَهُمُ:«اقْبَلُوا الرُّوحَ الْقُدُسَ.","23":"مَنْ غَفَرْتُمْ خَطَايَاهُ تُغْفَرُ لَهُ، وَمَنْ أَمْسَكْتُمْ خَطَايَاهُ أُمْسِكَتْ»."},"41.22":{"39":"وَخَرَجَ وَمَضَى كَالْعَادَةِ إِلَى جَبَلِ الزَّيْتُونِ، وَتَبِعَهُ أَيْضًا تَلاَمِيذُهُ.","40":"وَلَمَّا صَارَ إِلَى الْمَكَانِ قَالَ لَهُمْ:«صَلُّوا لِكَيْ لاَ تَدْخُلُوا فِي تَجْرِبَةٍ».","41":"وَانْفَصَلَ عَنْهُمْ نَحْوَ رَمْيَةِ حَجَرٍ وَجَثَا عَلَى رُكْبَتَيْهِ وَصَلَّى","42":"قَائِلاً:«يَا أَبَتَاهُ، إِنْ شِئْتَ أَنْ تُجِيزَ عَنِّي هذِهِ الْكَأْسَ. وَلكِنْ لِتَكُنْ لاَ إِرَادَتِي بَلْ إِرَادَتُكَ».","43":"وَظَهَرَ لَهُ مَلاَكٌ مِنَ السَّمَاءِ يُقَوِّيهِ.","44":"وَإِذْ كَانَ فِي جِهَادٍ كَانَ يُصَلِّي بِأَشَدِّ لَجَاجَةٍ، وَصَارَ عَرَقُهُ كَقَطَرَاتِ دَمٍ نَازِلَةٍ عَلَى الأَرْضِ.","45":"ثُمَّ قَامَ مِنَ الصَّلاَةِ وَجَاءَ إِلَى تَلاَمِيذِهِ، فَوَجَدَهُمْ نِيَامًا مِنَ الْحُزْنِ.","46":"فَقَالَ لَهُمْ:«لِمَاذَا أَنْتُمْ نِيَامٌ؟ قُومُوا وَصَلُّوا لِئَلاَّ تَدْخُلُوا فِي تَجْرِبَةٍ».","54":"فَأَخَذُوهُ وَسَاقُوهُ وَأَدْخَلُوهُ إِلَى بَيْتِ رَئِيسِ الْكَهَنَةِ. وَأَمَّا بُطْرُسُ فَتَبِعَهُ مِنْ بَعِيدٍ.","55":"وَلَمَّا أَضْرَمُوا نَارًا فِي وَسْطِ الدَّارِ وَجَلَسُوا مَعًا، جَلَسَ بُطْرُسُ بَيْنَهُمْ.","56":"فَرَأَتْهُ جَارِيَةٌ جَالِسًا عِنْدَ النَّارِ فَتَفَرَّسَتْ فيهِ وَقَالَتْ:«وَهذَا كَانَ مَعَهُ!».","57":"فَأَنْكَرَهُ قَائِلاً:«لَسْتُ أَعْرِفُهُ يَا امْرَأَةُ!»","58":"وَبَعْدَ قَلِيل رَآهُ آخَرُ وَقَالَ:«وَأَنْتَ مِنْهُمْ!» فَقَالَ بُطْرُسُ: «يَا إِنْسَانُ، لَسْتُ أَنَا!»","59":"وَلَمَّا مَضَى نَحْوُ سَاعَةٍ وَاحِدَةٍ أَكَّدَ آخَرُ قَائِلاً:«بِالْحَقِّ إِنَّ هذَا أَيْضًا كَانَ مَعَهُ، لأَنَّهُ جَلِيلِيٌّ أَيْضًا!».","60":"فَقَالَ بُطْرُسُ:«يَا إِنْسَانُ، لَسْتُ أَعْرِفُ مَا تَقُولُ!». وَفِي الْحَالِ بَيْنَمَا هُوَ يَتَكَلَّمُ صَاحَ الدِّيكُ.","61":"فَالْتَفَتَ الرَّبُّ وَنَظَرَ إِلَى بُطْرُسَ، فَتَذَكَّرَ بُطْرُسُ كَلاَمَ الرَّبِّ، كَيْفَ قَالَ لَهُ:«إِنَّكَ قَبْلَ أَنْ يَصِيحَ الدِّيكُ تُنْكِرُنِي ثَلاَثَ مَرَّاتٍ».","62":"فَخَرَجَ بُطْرُسُ إِلَى خَارِجٍ وَبَكَى بُكَاءً مُرًّا.","31":"وَقَالَ الرَّبُّ:«سِمْعَانُ، سِمْعَانُ، هُوَذَا الشَّيْطَانُ طَلَبَكُمْ لِكَيْ يُغَرْبِلَكُمْ كَالْحِنْطَةِ!","32":"وَلكِنِّي طَلَبْتُ مِنْ أَجْلِكَ لِكَيْ لاَ يَفْنَى إِيمَانُكَ. وَأَنْتَ مَتَى رَجَعْتَ ثَبِّتْ إِخْوَتَكَ».","33":"فَقَالَ لَهُ:«يَارَبُّ، إِنِّي مُسْتَعِدٌّ أَنْ أَمْضِيَ مَعَكَ حَتَّى إِلَى السِّجْنِ وَإِلَى الْمَوْتِ!».","34":"فَقَالَ:«أَقُولُ لَكَ يَابُطْرُسُ: لاَ يَصِيحُ الدِّيكُ الْيَوْمَ قَبْلَ أَنْ تُنْكِرَ ثَلاَثَ مَرَّاتٍ أَنَّكَ تَعْرِفُنِي»."},"8.1":{"9":"فَقَامَتْ حَنَّةُ بَعْدَمَا أَكَلُوا فِي شِيلُوهَ وَبَعْدَمَا شَرِبُوا، وَعَالِي الْكَاهِنُ جَالِسٌ عَلَى الْكُرْسِيِّ عِنْدَ قَائِمَةِ هَيْكَلِ الرَّبِّ،","10":"وَهِيَ مُرَّةُ النَّفْسِ. فَصَلَّتْ إِلَى الرَّبِّ، وَبَكَتْ بُكَاءً،","11":"وَنَذَرَتْ نَذْرًا وَقَالَتْ: «يَا رَبَّ الْجُنُودِ، إِنْ نَظَرْتَ نَظَرًا إِلَى مَذَلَّةِ أَمَتِكَ، وَذَكَرْتَنِي وَلَمْ تَنْسَ أَمَتَكَ بَلْ أَعْطَيْتَ أَمَتَكَ زَرْعَ بَشَرٍ، فَإِنِّي أُعْطِيهِ لِلرَّبِّ كُلَّ أَيَّامِ حَيَاتِهِ، وَلاَ يَعْلُو رَأْسَهُ مُوسَى».","12":"وَكَانَ إِذْ أَكْثَرَتِ الصَّلاَةَ أَمَامَ الرَّبِّ وَعَالِي يُلاَحِظُ فَاهَا.","13":"فَإِنَّ حَنَّةَ كَانَتْ تَتَكَلَّمُ فِي قَلْبِهَا، وَشَفَتَاهَا فَقَطْ تَتَحَرَّكَانِ، وَصَوْتُهَا لَمْ يُسْمَعْ، أَنَّ عَالِيَ ظَنَّهَا سَكْرَى.","14":"فَقَالَ لَهَا عَالِي: «حَتَّى مَتَى تَسْكَرِينَ؟ انْزِعِي خَمْرَكِ عَنْكِ».","15":"فَأَجَابَتْ حَنَّةُ وَقَالت: «لاَ يَا سَيِّدِي. إِنِّي امْرَأَةٌ حَزِينَةُ الرُّوحِ وَلَمْ أَشْرَبْ خَمْرًا وَلاَ مُسْكِرًا، بَلْ أَسْكُبُ نَفْسِي أَمَامَ الرَّبِّ.","16":"لاَ تَحْسِبْ أَمَتَكَ ابْنَةَ بَلِيَّعَالَ، لأَنِّي مِنْ كَثْرَةِ كُرْبَتِي وَغَيْظِي قَدْ تَكَلَّمْتُ إِلَى الآنَ».","17":"فَأجَابَ عَالِي وَقَالَ: «اذْهَبِي بِسَلاَمٍ، وَإِلهُ إِسْرَائِيلَ يُعْطِيكِ سُؤْلَكِ الَّذِي سَأَلْتِهِ مِنْ لَدُنْهُ».","18":"فَقَالَتْ: «لِتَجِدْ جَارِيَتُكَ نِعْمَةً فِي عَيْنَيْكَ». ثُمَّ مَضَتِ الْمَرْأَةُ فِي طَرِيقِهَا وَأَكَلَتْ، وَلَمْ يَكُنْ وَجْهُهَا بَعْدُ مُغَيَّرًا.","19":"وَبَكَّرُوا فِي الصَّبَاحِ وَسَجَدُوا أَمَامَ الرَّبِّ، وَرَجَعُوا وَجَاءُوا إِلَى بَيْتِهِمْ فِي الرَّامَةِ. وَعَرَفَ أَلْقَانَةُ امْرَأَتَهُ حَنَّةَ، وَالرَّبُّ ذَكَرَهَا.","20":"وَكَانَ فِي مَدَارِ السَّنَةِ أَنَّ حَنَّةَ حَبِلَتْ وَوَلَدَتِ ابْنًا وَدَعَتِ اسْمَهُ صَمُوئِيلَ قَائِلَةً: «لأَنِّي مِنَ الرَّبِّ سَأَلْتُهُ».","27":"لأَجْلِ هذَا الصَّبِيِّ صَلَّيْتُ فَأَعْطَانِيَ الرَّبُّ سُؤْلِيَ الَّذِي سَأَلْتُهُ مِنْ لَدُنْهُ.","28":"وَأَنَا أَيْضًا قَدْ أَعَرْتُهُ لِلرَّبِّ. جَمِيعَ أَيَّامِ حَيَاتِهِ هُوَ عَارِيَّةٌ لِلرَّبِّ». وَسَجَدُوا هُنَاكَ لِلرَّبِّ.","21":"وَصَعِدَ الرَّجُلُ أَلْقَانَةُ وَجَمِيعُ بَيْتِهِ لِيَذْبَحَ لِلرَّبِّ الذَّبِيحَةَ السَّنَوِيَّةَ، وَنَذْرَهُ.","22":"وَلكِنَّ حَنَّةَ لَمْ تَصْعَدْ لأَنَّهَا قَالَتْ لِرَجُلِهَا: «مَتَى فُطِمَ الصَّبِيُّ آتِي بِهِ لِيَتَرَاءَى أَمَامَ الرَّبِّ وَيُقِيمَ هُنَاكَ إِلَى الأَبَدِ».","23":"فَقَالَ لَهَا أَلْقَانَةُ رَجُلُهَا: «اعْمَلِي مَا يَحْسُنُ فِي عَيْنَيْكِ. امْكُثِي حَتَّى تَفْطِمِيهِ. إِنَّمَا الرَّبُّ يُقِيمُ كَلاَمَهُ». فَمَكَثَتِ الْمَرْأَةُ وَأَرْضَعَتِ ابْنَهَا حَتَّى فَطَمَتْهُ.","24":"ثُمَّ حِينَ فَطَمَتْهُ أَصْعَدَتْهُ مَعَهَا بِثَلاَثَةِ ثِيرَانٍ وَإِيفَةِ دَقِيق وَزِقِّ خَمْرٍ، وَأَتَتْ بِهِ إِلَى الرَّبِّ فِي شِيلُوهَ وَالصَّبِيُّ صَغِيرٌ.","25":"فَذَبَحُوا الثَّوْرَ وَجَاءُوا بِالصَّبِيِّ إِلَى عَالِي.","26":"وَقَالَتْ: «أَسْأَلُكَ يَا سَيِّدِي. حَيَّةٌ هِيَ نَفْسُكَ يَا سَيِّدِي، أَنَا الْمَرْأَةُ الَّتِي وَقَفَتْ لَدَيْكَ هُنَا تُصَلِّي إِلَى الرَّبِّ."},"41.24":{"13":"وَإِذَا اثْنَانِ مِنْهُمْ كَانَا مُنْطَلِقَيْنِ فِي ذلِكَ الْيَوْمِ إِلَى قَرْيَةٍ بَعِيدَةٍ عَنْ أُورُشَلِيمَ سِتِّينَ غَلْوَةً، اسْمُهَا «عِمْوَاسُ».","14":"وَكَانَا يَتَكَلَّمَانِ بَعْضُهُمَا مَعَ بَعْضٍ عَنْ جَمِيعِ هذِهِ الْحَوَادِثِ.","15":"وَفِيمَا هُمَا يَتَكَلَّمَانِ وَيَتَحَاوَرَانِ، اقْتَرَبَ إِلَيْهِمَا يَسُوعُ نَفْسُهُ وَكَانَ يَمْشِي مَعَهُمَا.","16":"وَلكِنْ أُمْسِكَتْ أَعْيُنُهُمَا عَنْ مَعْرِفَتِهِ.","17":"فَقَالَ لَهُمَا:«مَا هذَا الْكَلاَمُ الَّذِي تَتَطَارَحَانِ بِهِ وَأَنْتُمَا مَاشِيَانِ عَابِسَيْنِ؟»","18":"فَأَجَابَ أَحَدُهُمَا، الَّذِي اسْمُهُ كَِلْيُوبَاسُ وَقَالَ لَهُ:«هَلْ أَنْتَ مُتَغَرِّبٌ وَحْدَكَ فِي أُورُشَلِيمَ وَلَمْ تَعْلَمِ الأُمُورَ الَّتِي حَدَثَتْ فِيهَا فِي هذِهِ الأَيَّامِ؟»","19":"فَقَالَ لَهُمَا:«وَمَا هِيَ؟» فَقَالاَ:«الْمُخْتَصَّةُ بِيَسُوعَ النَّاصِرِيِّ، الَّذِي كَانَ إِنْسَانًا نَبِيًّا مُقْتَدِرًا فِي الْفِعْلِ وَالْقَوْلِ أَمَامَ اللهِ وَجَمِيعِ الشَّعْبِ.","20":"كَيْفَ أَسْلَمَهُ رُؤَسَاءُ الْكَهَنَةِ وَحُكَّامُنَا لِقَضَاءِ الْمَوْتِ وَصَلَبُوهُ.","21":"وَنَحْنُ كُنَّا نَرْجُو أَنَّهُ هُوَ الْمُزْمِعُ أَنْ يَفْدِيَ إِسْرَائِيلَ. وَلكِنْ، مَعَ هذَا كُلِّهِ، الْيَوْمَ لَهُ ثَلاَثَةُ أَيَّامٍ مُنْذُ حَدَثَ ذلِكَ.","22":"بَلْ بَعْضُ النِّسَاءِ مِنَّا حَيَّرْنَنَا إِذْ كُنَّ بَاكِرًا عِنْدَ الْقَبْرِ،","23":"وَلَمَّا لَمْ يَجِدْنَ جَسَدَهُ أَتَيْنَ قَائِلاَتٍ: إِنَّهُنَّ رَأَيْنَ مَنْظَرَ مَلاَئِكَةٍ قَالُوا إِنَّهُ حَيٌّ.","24":"وَمَضَى قَوْمٌ مِنَ الَّذِينَ مَعَنَا إِلَى الْقَبْرِ، فَوَجَدُوا هكَذَا كَمَا قَالَتْ أَيْضًا النِّسَاءُ، وَأَمَّا هُوَ فَلَمْ يَرَوْهُ».","25":"فَقَالَ لَهُمَا:«أَيُّهَا الْغَبِيَّانِ وَالْبَطِيئَا الْقُلُوبِ فِي الإِيمَانِ بِجَمِيعِ مَا تَكَلَّمَ بِهِ الأَنْبِيَاءُ!","26":"أَمَا كَانَ يَنْبَغِي أَنَّ الْمَسِيحَ يَتَأَلَّمُ بِهذَا وَيَدْخُلُ إِلَى مَجْدِهِ؟»","27":"ثُمَّ ابْتَدَأَ مِنْ مُوسَى وَمِنْ جَمِيعِ الأَنْبِيَاءِ يُفَسِّرُ لَهُمَا الأُمُورَ الْمُخْتَصَّةَ بِهِ فِي جَمِيعِ الْكُتُبِ.","1":"ثُمَّ فِي أَوَّلِ الأُسْبُوعِ، أَوَّلَ الْفَجْرِ، أَتَيْنَ إِلَى الْقَبْرِ حَامِلاَتٍ الْحَنُوطَ الَّذِي أَعْدَدْنَهُ، وَمَعَهُنَّ أُنَاسٌ.","2":"فَوَجَدْنَ الْحَجَرَ مُدَحْرَجًا عَنِ الْقَبْرِ،","3":"فَدَخَلْنَ وَلَمْ يَجِدْنَ جَسَدَ الرَّبِّ يَسُوعَ.","4":"وَفِيمَا هُنَّ مُحْتَارَاتٌ فِي ذلِكَ، إِذَا رَجُلاَنِ وَقَفَا بِهِنَّ بِثِيَابٍ بَرَّاقَةٍ.","5":"وَإِذْ كُنَّ خَائِفَاتٍ وَمُنَكِّسَاتٍ وُجُوهَهُنَّ إِلَى الأَرْضِ، قَالاَ لَهُنَّ:«لِمَاذَا تَطْلُبْنَ الْحَيَّ بَيْنَ الأَمْوَاتِ؟","6":"لَيْسَ هُوَ ههُنَا، لكِنَّهُ قَامَ! اُذْكُرْنَ كَيْفَ كَلَّمَكُنَّ وَهُوَ بَعْدُ فِي الْجَلِيلِ","7":"قَائِلاً: إِنَّهُ يَنْبَغِي أَنْ يُسَلَّمَ ابْنُ الإِنْسَانِ فِي أَيْدِي أُنَاسٍ خُطَاةٍ، وَيُصْلَبَ، وَفِي الْيَوْمِ الثَّالِثِ يَقُومُ».","8":"فَتَذَكَّرْنَ كَلاَمَهُ،","28":"ثُمَّ اقْتَرَبُوا إِلَى الْقَرْيَةِ الَّتِي كَانَا مُنْطَلِقَيْنِ إِلَيْهَا، وَهُوَ تَظَاهَرَ كَأَنَّهُ مُنْطَلِقٌ إِلَى مَكَانٍ أَبْعَدَ.","29":"فَأَلْزَمَاهُ قَائِلَيْنِ:«امْكُثْ مَعَنَا، لأَنَّهُ نَحْوُ الْمَسَاءِ وَقَدْ مَالَ النَّهَارُ». فَدَخَلَ لِيَمْكُثَ مَعَهُمَا.","30":"فَلَمَّا اتَّكَأَ مَعَهُمَا، أَخَذَ خُبْزًا وَبَارَكَ وَكَسَّرَ وَنَاوَلَهُمَا،","31":"فَانْفَتَحَتْ أَعْيُنُهُمَا وَعَرَفَاهُ ثُمَّ اخْتَفَى عَنْهُمَا،","32":"فَقَالَ بَعْضُهُمَا لِبَعْضٍ:«أَلَمْ يَكُنْ قَلْبُنَا مُلْتَهِبًا فِينَا إِذْ كَانَ يُكَلِّمُنَا فِي الطَّرِيقِ وَيُوضِحُ لَنَا الْكُتُبَ؟»"},"41.19":{"41":"وَفِيمَا هُوَ يَقْتَرِبُ نَظَرَ إِلَى الْمَدِينَةِ وَبَكَى عَلَيْهَا","42":"قَائِلاً:«إِنَّكِ لَوْ عَلِمْتِ أَنْتِ أَيْضًا، حَتَّى فِي يَوْمِكِ هذَا، مَا هُوَ لِسَلاَمِكِ! وَلكِنِ الآنَ قَدْ أُخْفِيَ عَنْ عَيْنَيْكِ.","43":"فَإِنَّهُ سَتَأْتِي أَيَّامٌ وَيُحِيطُ بِكِ أَعْدَاؤُكِ بِمِتْرَسَةٍ، وَيُحْدِقُونَ بِكِ وَيُحَاصِرُونَكِ مِنْ كُلِّ جِهَةٍ،","44":"وَيَهْدِمُونَكِ وَبَنِيكِ فِيكِ، وَلاَ يَتْرُكُونَ فِيكِ حَجَرًا عَلَى حَجَرٍ، لأَنَّكِ لَمْ تَعْرِفِي زَمَانَ افْتِقَادِكِ».","1":"ثُمَّ دَخَلَ وَاجْتَازَ فِي أَرِيحَا.","2":"وَإِذَا رَجُلٌ اسْمُهُ زَكَّا، وَهُوَ رَئِيسٌ لِلْعَشَّارِينَ وَكَانَ غَنِيًّا،","3":"وَطَلَبَ أَنْ يَرَى يَسُوعَ مَنْ هُوَ، وَلَمْ يَقْدِرْ مِنَ الْجَمْعِ، لأَنَّهُ كَانَ قَصِيرَ الْقَامَةِ.","4":"فَرَكَضَ مُتَقَدِّمًا وَصَعِدَ إِلَى جُمَّيْزَةٍ لِكَيْ يَرَاهُ، لأَنَّهُ كَانَ مُزْمِعًا أَنْ يَمُرَّ مِنْ هُنَاكَ.","5":"فَلَمَّا جَاءَ يَسُوعُ إِلَى الْمَكَانِ، نَظَرَ إِلَى فَوْقُ فَرَآهُ، وَقَالَ لَهُ:«يَا زَكَّا، أَسْرِعْ وَانْزِلْ، لأَنَّهُ يَنْبَغِي أَنْ أَمْكُثَ الْيَوْمَ فِي بَيْتِكَ».","6":"فَأَسْرَعَ وَنَزَلَ وَقَبِلَهُ فَرِحًا.","7":"فَلَمَّا رَأَى الْجَمِيعُ ذلِكَ تَذَمَّرُوا قَائِلِينَ: «إِنَّهُ دَخَلَ لِيَبِيتَ عِنْدَ رَجُل خَاطِئٍ».","8":"فَوَقَفَ زَكَّا وَقَالَ لِلرَّبِّ:«هَا أَنَا يَارَبُّ أُعْطِي نِصْفَ أَمْوَالِي لِلْمَسَاكِينِ، وَإِنْ كُنْتُ قَدْ وَشَيْتُ بِأَحَدٍ أَرُدُّ أَرْبَعَةَ أَضْعَافٍ».","9":"فَقَالَ لَهُ يَسُوعُ:«الْيَوْمَ حَصَلَ خَلاَصٌ لِهذَا الْبَيْتِ، إِذْ هُوَ أَيْضًا ابْنُ إِبْرَاهِيمَ،","10":"لأَنَّ ابْنَ الإِنْسَانِ قَدْ جَاءَ لِكَيْ يَطْلُبَ وَيُخَلِّصَ مَا قَدْ هَلَكَ»."},"49.4":{"6":"لاَ تَهْتَمُّوا بِشَيْءٍ، بَلْ فِي كُلِّ شَيْءٍ بِالصَّلاَةِ وَالدُّعَاءِ مَعَ الشُّكْرِ، لِتُعْلَمْ طِلْبَاتُكُمْ لَدَى اللهِ.","7":"وَسَلاَمُ اللهِ الَّذِي يَفُوقُ كُلَّ عَقْل، يَحْفَظُ قُلُوبَكُمْ وَأَفْكَارَكُمْ فِي الْمَسِيحِ يَسُوعَ.","19":"فَيَمْلأُ إِلهِي كُلَّ احْتِيَاجِكُمْ بِحَسَبِ غِنَاهُ فِي الْمَجْدِ فِي الْمَسِيحِ يَسُوعَ.","13":"أَسْتَطِيعُ كُلَّ شَيْءٍ فِي الْمَسِيحِ الَّذِي يُقَوِّينِي.","4":"اِفْرَحُوا فِي الرَّبِّ كُلَّ حِينٍ، وَأَقُولُ أَيْضًا: افْرَحُوا.","11":"لَيْسَ أَنِّي أَقُولُ مِنْ جِهَةِ احْتِيَاجٍ، فَإِنِّي قَدْ تَعَلَّمْتُ أَنْ أَكُونَ مُكْتَفِيًا بِمَا أَنَا فِيهِ.","12":"أَعْرِفُ أَنْ أَتَّضِعَ وَأَعْرِفُ أَيْضًا أَنْ أَسْتَفْضِلَ. فِي كُلِّ شَيْءٍ وَفِي جَمِيعِ الأَشْيَاءِ قَدْ تَدَرَّبْتُ أَنْ أَشْبَعَ وَأَنْ أَجُوعَ، وَأَنْ أَسْتَفْضِلَ وَأَنْ أَنْقُصَ."},"59.5":{"7":"مُلْقِينَ كُلَّ هَمِّكُمْ عَلَيْهِ، لأَنَّهُ هُوَ يَعْتَنِي بِكُمْ.","10":"وَإِلهُ كُلِّ نِعْمَةٍ الَّذِي دَعَانَا إِلَى مَجْدِهِ الأَبَدِيِّ فِي الْمَسِيحِ يَسُوعَ، بَعْدَمَا تَأَلَّمْتُمْ يَسِيرًا، هُوَ يُكَمِّلُكُمْ، وَيُثَبِّتُكُمْ، وَيُقَوِّيكُمْ، وَيُمَكِّنُكُمْ."},"39.6":{"34":"فَلاَ تَهْتَمُّوا لِلْغَدِ، لأَنَّ الْغَدَ يَهْتَمُّ بِمَا لِنَفْسِهِ. يَكْفِي الْيَوْمَ شَرُّهُ.","33":"لكِنِ اطْلُبُوا أَوَّلاً مَلَكُوتَ اللهِ وَبِرَّهُ، وَهذِهِ كُلُّهَا تُزَادُ لَكُمْ.","25":"«لِذلِكَ أَقُولُ لَكُمْ: لاَ تَهْتَمُّوا لِحَيَاتِكُمْ بِمَا تَأْكُلُونَ وَبِمَا تَشْرَبُونَ، وَلاَ لأَجْسَادِكُمْ بِمَا تَلْبَسُونَ. أَلَيْسَتِ الْحَيَاةُ أَفْضَلَ مِنَ الطَّعَامِ، وَالْجَسَدُ أَفْضَلَ مِنَ اللِّبَاسِ؟","26":"اُنْظُرُوا إِلَى طُيُورِ السَّمَاءِ: إِنَّهَا لاَ تَزْرَعُ وَلاَ تَحْصُدُ وَلاَ تَجْمَعُ إِلَى مَخَازِنَ، وَأَبُوكُمُ السَّمَاوِيُّ يَقُوتُهَا. أَلَسْتُمْ أَنْتُمْ بِالْحَرِيِّ أَفْضَلَ مِنْهَا؟","27":"وَمَنْ مِنْكُمْ إِذَا اهْتَمَّ يَقْدِرُ أَنْ يَزِيدَ عَلَى قَامَتِهِ ذِرَاعًا وَاحِدَةً؟","28":"وَلِمَاذَا تَهْتَمُّونَ بِاللِّبَاسِ؟ تَأَمَّلُوا زَنَابِقَ الْحَقْلِ كَيْفَ تَنْمُو! لاَ تَتْعَبُ وَلاَ تَغْزِلُ.","29":"وَلكِنْ أَقُولُ لَكُمْ: إِنَّهُ وَلاَ سُلَيْمَانُ فِي كُلِّ مَجْدِهِ كَانَ يَلْبَسُ كَوَاحِدَةٍ مِنْهَا.","30":"فَإِنْ كَانَ عُشْبُ الْحَقْلِ الَّذِي يُوجَدُ الْيَوْمَ وَيُطْرَحُ غَدًا فِي التَّنُّورِ، يُلْبِسُهُ اللهُ هكَذَا، أَفَلَيْسَ بِالْحَرِيِّ جِدًّا يُلْبِسُكُمْ أَنْتُمْ يَا قَلِيلِي الإِيمَانِ؟","31":"فَلاَ تَهْتَمُّوا قَائِلِينَ: مَاذَا نَأْكُلُ؟ أَوْ مَاذَا نَشْرَبُ؟ أَوْ مَاذَا نَلْبَسُ؟","32":"فَإِنَّ هذِهِ كُلَّهَا تَطْلُبُهَا الأُمَمُ. لأَنَّ أَبَاكُمُ السَّمَاوِيَّ يَعْلَمُ أَنَّكُمْ تَحْتَاجُونَ إِلَى هذِهِ كُلِّهَا.","14":"فَإِنَّهُ إِنْ غَفَرْتُمْ لِلنَّاسِ زَّلاَتِهِمْ، يَغْفِرْ لَكُمْ أَيْضًا أَبُوكُمُ السَّمَاوِيُّ.","15":"وَإِنْ لَمْ تَغْفِرُوا لِلنَّاسِ زَّلاَتِهِمْ، لاَ يَغْفِرْ لَكُمْ أَبُوكُمْ أَيْضًا زَّلاَتِكُمْ.","13":"وَلاَ تُدْخِلْنَا فِي تَجْرِبَةٍ، لكِنْ نَجِّنَا مِنَ الشِّرِّيرِ. لأَنَّ لَكَ الْمُلْكَ، وَالْقُوَّةَ، وَالْمَجْدَ، إِلَى الأَبَدِ. آمِينَ."},"18.55":{"22":"أَلْقِ عَلَى الرَّبِّ هَمَّكَ فَهُوَ يَعُولُكَ. لاَ يَدَعُ الصِّدِّيقَ يَتَزَعْزَعُ إِلَى الأَبَدِ.","12":"لأَنَّهُ لَيْسَ عَدُوٌّ يُعَيِّرُنِي فَأَحْتَمِلَ. لَيْسَ مُبْغِضِي تَعَظَّمَ عَلَيَّ فَأَخْتَبِئَ مِنْهُ.","13":"بَلْ أَنْتَ إِنْسَانٌ عَدِيلِي، إِلْفِي وَصَدِيقِي،","14":"الَّذِي مَعَهُ كَانَتْ تَحْلُو لَنَا الْعِشْرَةُ. إِلَى بَيْتِ اللهِ كُنَّا نَذْهَبُ فِي الْجُمْهُورِ."},"22.26":{"3":"ذُو الرَّأْيِ الْمُمَكَّنِ تَحْفَظُهُ سَالِمًا سَالِمًا، لأَنَّهُ عَلَيْكَ مُتَوَكِّلٌ.","9":"بِنَفْسِي اشْتَهَيْتُكَ فِي اللَّيْلِ. أَيْضًا بِرُوحِي فِي دَاخِلِي إِلَيْكَ أَبْتَكِرُ. لأَنَّهُ حِينَمَا تَكُونُ أَحْكَامُكَ فِي الأَرْضِ يَتَعَلَّمُ سُكَّانُ الْمَسْكُونَةِ الْعَدْلَ."},"18.94":{"19":"عِنْدَ كَثْرَةِ هُمُومِي فِي دَاخِلِي، تَعْزِيَاتُكَ تُلَذِّذُ نَفْسِي.","18":"إِذْ قُلْتُ: «قَدْ زَلَّتْ قَدَمِي» فَرَحْمَتُكَ يَا رَبُّ تَعْضُدُنِي."},"18.46":{"10":"كُفُّوا وَاعْلَمُوا أَنِّي أَنَا اللهُ. أَتَعَالَى بَيْنَ الأُمَمِ، أَتَعَالَى فِي الأَرْضِ.","1":"اَللهُ لَنَا مَلْجَأٌ وَقُوَّةٌ. عَوْنًا فِي الضِّيْقَاتِ وُجِدَ شَدِيدًا.","2":"لِذلِكَ لاَ نَخْشَى وَلَوْ تَزَحْزَحَتِ الأَرْضُ، وَلَوِ انْقَلَبَتِ الْجِبَالُ إِلَى قَلْبِ الْبِحَارِ.","3":"تَعِجُّ وَتَجِيشُ مِيَاهُهَا. تَتَزَعْزَعُ الْجِبَالُ بِطُمُوِّهَا. سِلاَهْ."},"18.62":{"8":"تَوَكَّلُوا عَلَيْهِ فِي كُلِّ حِينٍ يَا قَوْمُ. اسْكُبُوا قُدَّامَهُ قُلُوبَكُمْ. اَللهُ مَلْجَأٌ لَنَا. سِلاَهْ.","1":"إِنَّمَا للهِِ انْتَظَرَتْ نَفْسِي. مِنْ قِبَلِهِ خَلاَصِي.","5":"إِنَّمَا للهِِ انْتَظِرِي يَا نَفْسِي، لأَنَّ مِنْ قِبَلِهِ رَجَائِي.","6":"إِنَّمَا هُوَ صَخْرَتِي وَخَلاَصِي، مَلْجَإِي فَلاَ أَتَزَعْزَعُ.","7":"عَلَى اللهِ خَلاَصِي وَمَجْدِي، صَخْرَةُ قُوَّتِي مُحْتَمَايَ فِي اللهِ."},"41.12":{"6":"أَلَيْسَتْ خَمْسَةُ عَصَافِيرَ تُبَاعُ بِفَلْسَيْنِ، وَوَاحِدٌ مِنْهَا لَيْسَ مَنْسِيًّا أَمَامَ اللهِ؟","7":"بَلْ شُعُورُ رُؤُوسِكُمْ أَيْضًا جَمِيعُهَا مُحْصَاةٌ. فَلاَ تَخَافُوا! أَنْتُمْ أَفْضَلُ مِنْ عَصَافِيرَ كَثِيرَةٍ!","24":"تَأَمَّلُوا الْغِرْبَانَ: أَنَّهَا لاَ تَزْرَعُ وَلاَ تَحْصُدُ، وَلَيْسَ لَهَا مَخْدَعٌ وَلاَ مَخْزَنٌ، وَاللهُ يُقِيتُهَا. كَمْ أَنْتُمْ بِالْحَرِيِّ أَفْضَلُ مِنَ الطُّيُورِ!","32":"«لاَ تَخَفْ، أَيُّهَا الْقَطِيعُ الصَّغِيرُ، لأَنَّ أَبَاكُمْ قَدْ سُرَّ أَنْ يُعْطِيَكُمُ الْمَلَكُوتَ."},"19.12":{"25":"الْغَمُّ فِي قَلْبِ الرَّجُلِ يُحْنِيهِ، وَالْكَلِمَةُ الطَّيِّبَةُ تُفَرِّحُهُ.","1":"مَنْ يُحِبُّ التَّأْدِيبَ يُحِبُّ الْمَعْرِفَةَ، وَمَنْ يُبْغِضُ التَّوْبِيخَ فَهُوَ بَلِيدٌ."},"18.37":{"5":"سَلِّمْ لِلرَّبِّ طَرِيقَكَ وَاتَّكِلْ عَلَيْهِ وَهُوَ يُجْرِي،","8":"كُفَّ عَنِ الْغَضَبِ، وَاتْرُكِ السَّخَطَ، وَلاَ تَغَرْ لِفِعْلِ الشَّرِّ،","6":"وَيُخْرِجُ مِثْلَ النُّورِ بِرَّكَ، وَحَقَّكَ مِثْلَ الظَّهِيرَةِ.","1":"لاَ تَغَرْ مِنَ الأَشْرَارِ، وَلاَ تَحْسِدْ عُمَّالَ الإِثْمِ،","2":"فَإِنَّهُمْ مِثْلَ الْحَشِيشِ سَرِيعًا يُقْطَعُونَ، وَمِثْلَ الْعُشْبِ الأَخْضَرِ يَذْبُلُونَ.","23":"مِنْ قِبَلِ الرَّبِّ تَََثَبَّتُ خَطَوَاتُ الإِنْسَانِ وَفِي طَرِيقِهِ يُسَرُّ.","24":"إِذَا سَقَطَ لاَ يَنْطَرِحُ، لأَنَّ الرَّبَّ مُسْنِدٌ يَدَهُ.","7":"انْتَظِرِ الرَّبَّ وَاصْبِرْ لَهُ، وَلاَ تَغَرْ مِنَ الَّذِي يَنْجَحُ فِي طَرِيقِهِ، مِنَ الرَّجُلِ الْمُجْرِي مَكَايِدَ.","25":"أَيْضًا كُنْتُ فَتىً وَقَدْ شِخْتُ، وَلَمْ أَرَ صِدِّيقًا تُخُلِّيَ عَنْهُ، وَلاَ ذُرِّيَّةً لَهُ تَلْتَمِسُ خُبْزًا.","4":"وَتَلَذَّذْ بِالرَّبِّ فَيُعْطِيَكَ سُؤْلَ قَلْبِكَ.","3":"اتَّكِلْ عَلَى الرَّبِّ وَافْعَلِ الْخَيْرَ. اسْكُنِ الأَرْضَ وَارْعَ الأَمَانَةَ.","26":"الْيَوْمَ كُلَّهُ يَتَرَأَّفُ وَيُقْرِضُ، وَنَسْلُهُ لِلْبَرَكَةِ.","11":"أَمَّا الْوُدَعَاءُ فَيَرِثُونَ الأَرْضَ، وَيَتَلَذَّذُونَ فِي كَثْرَةِ السَّلاَمَةِ."},"19.3":{"5":"تَوَكَّلْ عَلَى الرَّبِّ بِكُلِّ قَلْبِكَ، وَعَلَى فَهْمِكَ لاَ تَعْتَمِدْ.","6":"فِي كُلِّ طُرُقِكَ اعْرِفْهُ، وَهُوَ يُقَوِّمُ سُبُلَكَ.","24":"إِذَا اضْطَجَعْتَ فَلاَ تَخَافُ، بَلْ تَضْطَجعُ وَيَلُذُّ نَوْمُكَ.","13":"طُوبَى لِلإِنْسَانِ الَّذِي يَجِدُ الْحِكْمَةَ، وَلِلرَّجُلِ الَّذِي يَنَالُ الْفَهْمَ،","14":"لأَنَّ تِجَارَتَهَا خَيْرٌ مِنْ تِجَارَةِ الْفِضَّةِ، وَرِبْحَهَا خَيْرٌ مِنَ الذَّهَبِ الْخَالِصِ.","15":"هِيَ أَثْمَنُ مِنَ الَّلآلِئِ، وَكُلُّ جَوَاهِرِكَ لاَ تُسَاوِيهَا.","16":"فِي يَمِينِهَا طُولُ أَيَّامٍ، وَفِي يَسَارِهَا الْغِنَى وَالْمَجْدُ.","17":"طُرُقُهَا طُرُقُ نِعَمٍ، وَكُلُّ مَسَالِكِهَا سَلاَمٌ.","18":"هِيَ شَجَرَةُ حَيَاةٍ لِمُمْسِكِيهَا، وَالْمُتَمَسِّكُ بِهَا مَغْبُوطٌ.","9":"أَكْرِمِ الرَّبَّ مِنْ مَالِكَ وَمِنْ كُلِّ بَاكُورَاتِ غَلَّتِكَ،","10":"فَتَمْتَلِئَ خَزَائِنُكَ شِبْعًا، وَتَفِيضَ مَعَاصِرُكَ مِسْطَارًا.","31":"لاَ تَحْسِدِ الظَّالِمَ وَلاَ تَخْتَرْ شَيْئًا مِنْ طُرُقِهِ،"},"22.41":{"13":"لأَنِّي أَنَا الرَّبُّ إِلهُكَ الْمُمْسِكُ بِيَمِينِكَ، الْقَائِلُ لَكَ: لاَ تَخَفْ. أَنَا أُعِينُكَ.","10":"لاَ تَخَفْ لأَنِّي مَعَكَ. لاَ تَتَلَفَّتْ لأَنِّي إِلهُكَ. قَدْ أَيَّدْتُكَ وَأَعَنْتُكَ وَعَضَدْتُكَ بِيَمِينِ بِرِّي.","9":"الَّذِي أَمْسَكْتُهُ مِنْ أَطْرَافِ الأَرْضِ، وَمِنْ أَقْطَارِهَا دَعَوْتُهُ، وَقُلْتُ لَكَ: أَنْتَ عَبْدِيَ. اخْتَرْتُكَ وَلَمْ أَرْفُضْكَ."},"18.16":{"8":"جَعَلْتُ الرَّبَّ أَمَامِي فِي كُلِّ حِينٍ، لأَنَّهُ عَنْ يَمِينِي فَلاَ أَتَزَعْزَعُ.","7":"أُبَارِكُ الرَّبَّ الَّذِي نَصَحَنِي، وَأَيْضًا بِاللَّيْلِ تُنْذِرُنِي كُلْيَتَايَ.","5":"الرَّبُّ نَصِيبُ قِسْمَتِي وَكَأْسِي. أَنْتَ قَابِضُ قُرْعَتِي.","6":"حِبَالٌ وَقَعَتْ لِيفِي النُّعَمَاءِ، فَالْمِيرَاثُ حَسَنٌ عِنْدِي.","11":"تُعَرِّفُنِي سَبِيلَ الْحَيَاةِ. أَمَامَكَ شِبَعُ سُرُورٍ. فِي يَمِينِكَ نِعَمٌ إِلَى الأَبَدِ."},"10.17":{"8":"وَكَانَ لَهُ كَلاَمُ الرَّبِّ قَائِلاً:","9":"«قُمِ اذْهَبْ إِلَى صِرْفَةَ الَّتِي لِصِيدُونَ وَأَقِمْ هُنَاكَ. هُوَذَا قَدْ أَمَرْتُ هُنَاكَ أَرْمَلَةً أَنْ تَعُولَكَ».","10":"فَقَامَ وَذَهَبَ إِلَى صِرْفَةَ. وَجَاءَ إِلَى بَابِ الْمَدِينَةِ، وَإِذَا بِامْرَأَةٍ أَرْمَلَةٍ هُنَاكَ تَقُشُّ عِيدَانًا، فَنَادَاهَا وَقَالَ: «هَاتِي لِي قَلِيلَ مَاءٍ فِي إِنَاءٍ فَأَشْرَبَ».","11":"وَفِيمَا هِيَ ذَاهِبَةٌ لِتَأْتِيَ بِهِ، نَادَاهَا وَقَالَ: «هَاتِي لِي كِسْرَةَ خُبْزٍ فِي يَدِكِ».","12":"فَقَالَتْ: «حَيٌّ هُوَ الرَّبُّ إِلهُكَ، إِنَّهُ لَيْسَتْ عِنْدِي كَعْكَةٌ، وَلكِنْ مِلْءُ كَفّ مِنَ الدَّقِيقِ فِي الْكُوَّارِ، وَقَلِيلٌ مِنَ الزَّيْتِ فِي الْكُوزِ، وَهأَنَذَا أَقُشُّ عُودَيْنِ لآتِيَ وَأَعْمَلَهُ لِي وَلابْنِي لِنَأْكُلَهُ ثُمَّ نَمُوتُ».","13":"فَقَالَ لَهَا إِيلِيَّا: «لاَ تَخَافِي. ادْخُلِي وَاعْمَلِي كَقَوْلِكِ، وَلكِنِ اعْمَلِي لِي مِنْهَا كَعْكَةً صَغِيرَةً أَوَّلاً وَاخْرُجِي بِهَا إِلَيَّ، ثُمَّ اعْمَلِي لَكِ وَلابْنِكِ أَخِيرًا.","14":"لأَنَّهُ هكَذَا قَالَ الرَّبُّ إِلهُ إِسْرَائِيلَ: إِنَّ كُوَّارَ الدَّقِيقِ لاَ يَفْرُغُ، وَكُوزَ الزَّيْتِ لاَ يَنْقُصُ، إِلَى الْيَوْمِ الَّذِي فِيهِ يُعْطِي الرَّبُّ مَطَرًا عَلَى وَجْهِ الأَرْضِ».","15":"فَذَهَبَتْ وَفَعَلَتْ حَسَبَ قَوْلِ إِيلِيَّا، وَأَكَلَتْ هِيَ وَهُوَ وَبَيْتُهَا أَيَّامًا.","16":"كُوَّارُ الدَّقِيقِ لَمْ يَفْرُغْ، وَكُوزُ الزَّيْتِ لَمْ يَنْقُصْ، حَسَبَ قَوْلِ الرَّبِّ الَّذِي تَكَلَّمَ بِهِ عَنْ يَدِ إِيلِيَّا.","1":"وَقَالَ إِيلِيَّا التِّشْبِيُّ مِنْ مُسْتَوْطِنِي جِلْعَادَ لأَخْآبَ: «حَيٌّ هُوَ الرَّبُّ إِلهُ إِسْرَائِيلَ الَّذِي وَقَفْتُ أَمَامَهُ، إِنَّهُ لاَ يَكُونُ طَلٌّ وَلاَ مَطَرٌ فِي هذِهِ السِّنِينَ إِلاَّ عِنْدَ قَوْلِي».","2":"وَكَانَ كَلاَمُ الرَّبِّ لَهُ قَائِلاً:","3":"«انْطَلِقْ مِنْ هُنَا وَاتَّجِهْ نَحْوَ الْمَشْرِقِ، وَاخْتَبِئْ عِنْدَ نَهْرِ كَرِيثَ الَّذِي هُوَ مُقَابِلُ الأُرْدُنِّ،","4":"فَتَشْرَبَ مِنَ النَّهْرِ. وَقَدْ أَمَرْتُ الْغِرْبَانَ أَنْ تَعُولَكَ هُنَاكَ».","5":"فَانْطَلَقَ وَعَمِلَ حَسَبَ كَلاَمِ الرَّبِّ، وَذَهَبَ فَأَقَامَ عِنْدَ نَهْرِ كَرِيثَ الَّذِي هُوَ مُقَابِلُ الأُرْدُنِّ.","6":"وَكَانَتِ الْغِرْبَانُ تَأْتِي إِلَيْهِ بِخُبْزٍ وَلَحْمٍ صَبَاحًا، وَبِخُبْزٍ وَلَحْمٍ مَسَاءً، وَكَانَ يَشْرَبُ مِنَ النَّهْرِ.","17":"وَبَعْدَ هذِهِ الأُمُورِ مَرِضَ ابْنُ الْمَرْأَةِ صَاحِبَةِ الْبَيْتِ وَاشْتَدَّ مَرَضُهُ جِدًّا حَتَّى لَمْ تَبْقَ فِيهِ نَسَمَةٌ.","18":"فَقَالَتْ لإِيلِيَّا: «مَا لِي وَلَكَ يَا رَجُلَ اللهِ! هَلْ جِئْتَ إِلَيَّ لِتَذْكِيرِ إِثْمِي وَإِمَاتَةِ ابْنِي؟».","19":"فَقَالَ لَهَا: «أَعْطِينِي ابْنَكِ». وَأَخَذَهُ مِنْ حِضْنِهَا وَصَعِدَ بِهِ إِلَى الْعُلِّيَّةِ الَّتِي كَانَ مُقِيمًا بِهَا، وَأَضْجَعَهُ عَلَى سَرِيرِهِ،","20":"وَصَرَخَ إِلَى الرَّبِّ وَقَالَ: «أَيُّهَا الرَّبُّ إِلهِي، أَأَيْضًا إِلَى الأَرْمَلَةِ الَّتِي أَنَا نَازِلٌ عِنْدَهَا قَدْ أَسَأْتَ بِإِمَاتَتِكَ ابْنَهَا؟»","21":"فَتَمَدَّدَ عَلَى الْوَلَدِ ثَلاَثَ مَرَّاتٍ، وَصَرَخَ إِلَى الرَّبِّ وَقَالَ: «يَا رَبُّ إِلهِي، لِتَرْجعْ نَفْسُ هذَا الْوَلَدِ إِلَى جَوْفِهِ».","22":"فَسَمِعَ الرَّبُّ لِصَوْتِ إِيلِيَّا، فَرَجَعَتْ نَفْسُ الْوَلَدِ إِلَى جَوْفِهِ فَعَاشَ.","23":"فَأَخَذَ إِيلِيَّا الْوَلَدَ وَنَزَلَ بِهِ مِنَ الْعُلِّيَّةِ إِلَى الْبَيْتِ وَدَفَعَهُ لأُمِّهِ، وَقَالَ إِيلِيَّا: «انْظُرِي، ابْنُكِ حَيٌّ»","24":"فَقَالَتِ الْمَرْأَةُ لإِيلِيَّا: «هذَا الْوَقْتَ عَلِمْتُ أَنَّكَ رَجُلُ اللهِ، وَأَنَّ كَلاَمَ الرَّبِّ فِي فَمِكَ حَقٌّ»."},"41.10":{"38":"وَفِيمَا هُمْ سَائِرُونَ دَخَلَ قَرْيَةً، فَقَبِلَتْهُ امْرَأَةٌ اسْمُهَا مَرْثَا فِي بَيْتِهَا.","39":"وَكَانَتْ لِهذِهِ أُخْتٌ تُدْعَى مَرْيَمَ، الَّتِي جَلَسَتْ عِنْدَ قَدَمَيْ يَسُوعَ وَكَانَتْ تَسْمَعُ كَلاَمَهُ.","40":"وَأَمَّا مَرْثَا فَكَانَتْ مُرْتَبِكَةً فِي خِدْمَةٍ كَثِيرَةٍ. فَوَقَفَتْ وَقَالَتْ: «يَارَبُّ، أَمَا تُبَالِي بِأَنَّ أُخْتِي قَدْ تَرَكَتْنِي أَخْدُمُ وَحْدِي؟ فَقُلْ لَهَا أَنْ تُعِينَنِي!»","41":"فَأَجَابَ يَسُوعُ وَقَالَ لَها:«مَرْثَا، مَرْثَا، أَنْتِ تَهْتَمِّينَ وَتَضْطَرِبِينَ لأَجْلِ أُمُورٍ كَثِيرَةٍ،","42":"وَلكِنَّ الْحَاجَةَ إِلَى وَاحِدٍ. فَاخْتَارَتْ مَرْيَمُ النَّصِيبَ الصَّالِحَ الَّذِي لَنْ يُنْزَعَ مِنْهَا».","25":"وَإِذَا نَامُوسِيٌّ قَامَ يُجَرِّبُهُ قَائِلاً:«يَا مُعَلِّمُ، مَاذَا أَعْمَلُ لأَرِثَ الْحَيَاةَ الأَبَدِيَّةَ؟»","26":"فَقَالَ لَهُ:«مَا هُوَ مَكْتُوبٌ فِي النَّامُوسِ. كَيْفَ تَقْرَأُ؟»","27":"فَأَجَابَ وَقَالَ:«تُحِبُّ الرَّبَّ إِلهَكَ مِنْ كُلِّ قَلْبِكَ، وَمِنْ كُلِّ نَفْسِكَ، وَمِنْ كُلِّ قُدْرَتِكَ، وَمِنْ كُلِّ فِكْرِكَ، وَقَرِيبَكَ مِثْلَ نَفْسِكَ».","28":"فَقَالَ لَهُ:«بِالصَّوَابِ أَجَبْتَ. اِفْعَلْ هذَا فَتَحْيَا».","29":"وَأَمَّا هُوَ فَإِذْ أَرَادَ أَنْ يُبَرِّرَ نَفْسَهُ، قَاَلَ لِيَسُوعَ: «وَمَنْ هُوَ قَرِيبِي؟»","30":"فَأَجَابَ يَسُوعُ وَقَالَ: «إِنْسَانٌ كَانَ نَازِلاً مِنْ أُورُشَلِيمَ إِلَى أَرِيحَا، فَوَقَعَ بَيْنَ لُصُوصٍ، فَعَرَّوْهُ وَجَرَّحُوهُ، وَمَضَوْا وَتَرَكُوهُ بَيْنَ حَيٍّ وَمَيْتٍ.","31":"فَعَرَضَ أَنَّ كَاهِنًا نَزَلَ فِي تِلْكَ الطَّرِيقِ، فَرَآهُ وَجَازَ مُقَابِلَهُ.","32":"وَكَذلِكَ لاَوِيٌّ أَيْضًا، إِذْ صَارَ عِنْدَ الْمَكَانِ جَاءَ وَنَظَرَ وَجَازَ مُقَابِلَهُ.","33":"وَلكِنَّ سَامِرِيًّا مُسَافِرًا جَاءَ إِلَيْهِ، وَلَمَّا رَآهُ تَحَنَّنَ،","34":"فَتَقَدَّمَ وَضَمَدَ جِرَاحَاتِهِ، وَصَبَّ عَلَيْهَا زَيْتًا وَخَمْرًا، وَأَرْكَبَهُ عَلَى دَابَّتِهِ، وَأَتَى بِهِ إِلَى فُنْدُق وَاعْتَنَى بِهِ.","35":"وَفِي الْغَدِ لَمَّا مَضَى أَخْرَجَ دِينَارَيْنِ وَأَعْطَاهُمَا لِصَاحِبِ الْفُنْدُقِ، وَقَالَ لَهُ: اعْتَنِ بِهِ، وَمَهْمَا أَنْفَقْتَ أَكْثَرَ فَعِنْدَ رُجُوعِي أُوفِيكَ.","36":"فَأَيَّ هؤُلاَءِ الثَّلاَثَةِ تَرَى صَارَ قَرِيبًا لِلَّذِي وَقَعَ بَيْنَ اللُّصُوصِ؟»","37":"فَقَالَ: «الَّذِي صَنَعَ مَعَهُ الرَّحْمَةَ». فَقَالَ لَهُ يَسُوعُ: «اذْهَبْ أَنْتَ أَيْضًا وَاصْنَعْ هكَذَا»."},"42.6":{"5":"فَرَفَعَ يَسُوعُ عَيْنَيْهِ وَنَظَرَ أَنَّ جَمْعًا كَثِيرًا مُقْبِلٌ إِلَيْهِ، فَقَالَ لِفِيلُبُّسَ:«مِنْ أَيْنَ نَبْتَاعُ خُبْزًا لِيَأْكُلَ هؤُلاَءِ؟»","6":"وَإِنَّمَا قَالَ هذَا لِيَمْتَحِنَهُ، لأَنَّهُ هُوَ عَلِمَ مَا هُوَ مُزْمِعٌ أَنْ يَفْعَلَ.","7":"أَجَابَهُ فِيلُبُّسُ:«لاَ يَكْفِيهِمْ خُبْزٌ بِمِئَتَيْ دِينَارٍ لِيَأْخُذَ كُلُّ وَاحِدٍ مِنْهُمْ شَيْئًا يَسِيرًا».","8":"قَالَ لَهُ وَاحِدٌ مِنْ تَلاَمِيذِهِ، وَهُوَ أَنْدَرَاوُسُ أَخُو سِمْعَانَ بُطْرُسَ:","9":"«هُنَا غُلاَمٌ مَعَهُ خَمْسَةُ أَرْغِفَةِ شَعِيرٍ وَسَمَكَتَانِ، وَلكِنْ مَا هذَا لِمِثْلِ هؤُلاَءِ؟»","10":"فَقَالَ يَسُوعُ:«اجْعَلُوا النَّاسَ يَتَّكِئُونَ». وَكَانَ فِي الْمَكَانِ عُشْبٌ كَثِيرٌ، فَاتَّكَأَ الرِّجَالُ وَعَدَدُهُمْ نَحْوُ خَمْسَةِ آلاَفٍ.","11":"وَأَخَذَ يَسُوعُ الأَرْغِفَةَ وَشَكَرَ، وَوَزَّعَ عَلَى التَّلاَمِيذِ، وَالتَّلاَمِيذُ أَعْطَوُا الْمُتَّكِئِينَ. وَكَذلِكَ مِنَ السَّمَكَتَيْنِ بِقَدْرِ مَا شَاءُوا.","12":"فَلَمَّا شَبِعُوا، قَالَ لِتَلاَمِيذِهِ:«اجْمَعُوا الْكِسَرَ الْفَاضِلَةَ لِكَيْ لاَ يَضِيعَ شَيْءٌ».","13":"فَجَمَعُوا وَمَلأُوا اثْنَتَيْ عَشْرَةَ قُفَّةً مِنَ الْكِسَرِ، مِنْ خَمْسَةِ أَرْغِفَةِ الشَّعِيرِ، الَّتِي فَضَلَتْ عَنِ الآكِلِينَ.","68":"فَأَجَابَهُ سِمْعَانُ بُطْرُسُ:«يَارَبُّ، إِلَى مَنْ نَذْهَبُ؟ كَلاَمُ الْحَيَاةِ الأَبَدِيَّةِ عِنْدَكَ،","37":"كُلُّ مَا يُعْطِينِي الآبُ فَإِلَيَّ يُقْبِلُ، وَمَنْ يُقْبِلْ إِلَيَّ لاَ أُخْرِجْهُ خَارِجًا.","40":"لأَنَّ هذِهِ هِيَ مَشِيئَةُ الَّذِي أَرْسَلَنِي: أَنَّ كُلَّ مَنْ يَرَى الابْنَ وَيُؤْمِنُ بِهِ تَكُونُ لَهُ حَيَاةٌ أَبَدِيَّةٌ، وَأَنَا أُقِيمُهُ فِي الْيَوْمِ الأَخِيرِ».","16":"وَلَمَّا كَانَ الْمَسَاءُ نَزَلَ تَلاَمِيذُهُ إِلَى الْبَحْرِ،","17":"فَدَخَلُوا السَّفِينَةَ وَكَانُوا يَذْهَبُونَ إِلَى عَبْرِ الْبَحْرِ إِلَى كَفْرِنَاحُومَ. وَكَانَ الظَّلاَمُ قَدْ أَقْبَلَ، وَلَمْ يَكُنْ يَسُوعُ قَدْ أَتَى إِلَيْهِمْ.","18":"وَهَاجَ الْبَحْرُ مِنْ رِيحٍ عَظِيمَةٍ تَهُبُّ.","19":"فَلَمَّا كَانُوا قَدْ جَذَّفُوا نَحْوَ خَمْسٍ وَعِشْرِينَ أَوْ ثَلاَثِينَ غَلْوَةً، نَظَرُوا يَسُوعَ مَاشِيًا عَلَى الْبَحْرِ مُقْتَرِبًا مِنَ السَّفِينَةِ، فَخَافُوا.","20":"فَقَالَ لَهُمْ:«أَنَا هُوَ، لاَ تَخَافُوا!».","21":"فَرَضُوا أَنْ يَقْبَلُوهُ فِي السَّفِينَةِ. وَلِلْوَقْتِ صَارَتِ السَّفِينَةُ إِلَى الأَرْضِ الَّتِي كَانُوا ذَاهِبِينَ إِلَيْهَا."},"41.5":{"1":"وَإِذْ كَانَ الْجَمْعُ يَزْدَحِمُ عَلَيْهِ لِيَسْمَعَ كَلِمَةَ اللهِ، كَانَ وَاقِفًا عِنْدَ بُحَيْرَةِ جَنِّيسَارَتَ.","2":"فَرَأَى سَفِينَتَيْنِ وَاقِفَتَيْنِ عِنْدَ الْبُحَيْرَةِ، وَالصَّيَّادُونَ قَدْ خَرَجُوا مِنْهُمَا وَغَسَلُوا الشِّبَاكَ.","3":"فَدَخَلَ إِحْدَى السَّفِينَتَيْنِ الَّتِي كَانَتْ لِسِمْعَانَ، وَسَأَلَهُ أَنْ يُبْعِدَ قَلِيلاً عَنِ الْبَرِّ. ثُمَّ جَلَسَ وَصَارَ يُعَلِّمُ الْجُمُوعَ مِنَ السَّفِينَةِ.","4":"وَلَمَّا فَرَغَ مِنَ الْكَلاَمِ قَالَ لِسِمْعَانَ:«ابْعُدْ إِلَى الْعُمْقِ وَأَلْقُوا شِبَاكَكُمْ لِلصَّيْدِ».","5":"فَأَجَابَ سِمْعَانُ وَقَالَ لَهُ:«يَا مُعَلِّمُ، قَدْ تَعِبْنَا اللَّيْلَ كُلَّهُ وَلَمْ نَأْخُذْ شَيْئًا. وَلكِنْ عَلَى كَلِمَتِكَ أُلْقِي الشَّبَكَةَ».","6":"وَلَمَّا فَعَلُوا ذلِكَ أَمْسَكُوا سَمَكًا كَثِيرًا جِدًّا، فَصَارَتْ شَبَكَتُهُمْ تَتَخَرَّقُ.","7":"فَأَشَارُوا إِلَى شُرَكَائِهِمُِ الَّذِينَ فِي السَّفِينَةِ الأُخْرَى أَنْ يَأْتُوا وَيُسَاعِدُوهُمْ. فَأَتَوْا وَمَلأُوا السَّفِينَتَيْنِ حَتَّى أَخَذَتَا فِي الْغَرَقِ.","8":"فَلَمَّا رَأَى سِمْعَانُ بُطْرُسُ ذلِكَ خَرَّ عِنْدَ رُكْبَتَيْ يَسُوعَ قَائِلاً:«اخْرُجْ مِنْ سَفِينَتِي يَارَبُّ، لأَنِّي رَجُلٌ خَاطِئٌ!».","9":"إِذِ اعْتَرَتْهُ وَجمِيعَ الَّذِينَ مَعَهُ دَهْشَةٌ عَلَى صَيْدِ السَّمَكِ الَّذِي أَخَذُوهُ.","10":"وَكَذلِكَ أَيْضًا يَعْقُوبُ وَيُوحَنَّا ابْنَا زَبَدِي اللَّذَانِ كَانَا شَرِيكَيْ سِمْعَانَ. فَقَالَ يَسُوعُ لِسِمْعَانَ: «لاَتَخَفْ! مِنَ الآنَ تَكُونُ تَصْطَادُ النَّاسَ!»","11":"وَلَمَّا جَاءُوا بِالسَّفِينَتَيْنِ إِلَى الْبَرِّ تَرَكُوا كُلَّ شَيْءٍ وَتَبِعُوهُ.","15":"فَذَاعَ الْخَبَرُ عَنْهُ أَكْثَرَ. فَاجْتَمَعَ جُمُوعٌ كَثِيرَةٌ لِكَيْ يَسْمَعُوا وَيُشْفَوْا بِهِ مِنْ أَمْرَاضِهِمْ.","16":"وَأَمَّا هُوَ فَكَانَ يَعْتَزِلُ فِي الْبَرَارِي وَيُصَلِّي.","27":"وَبَعْدَ هذَا خَرَجَ فَنَظَرَ عَشَّارًا اسْمُهُ لاَوِي جَالِسًا عِنْدَ مَكَانِ الْجِبَايَةِ، فَقَالَ لَهُ:«اتْبَعْنِي».","28":"فَتَرَكَ كُلَّ شَيْءٍ وَقَامَ وَتَبِعَهُ.","29":"وَصَنَعَ لَهُ لاَوِي ضِيَافَةً كَبِيرَةً فِي بَيْتِهِ. وَالَّذِينَ كَانُوا مُتَّكِئِينَ مَعَهُمْ كَانُوا جَمْعًا كَثِيرًا مِنْ عَشَّارِينَ وَآخَرِينَ.","30":"فَتَذَمَّرَ كَتَبَتُهُمْ وَالْفَرِّيسِيُّونَ عَلَى تَلاَمِيذِهِ قَائِلِينَ:«لِمَاذَا تَأْكُلُونَ وَتَشْرَبُونَ مَعَ عَشَّارِينَ وَخُطَاةٍ؟»","31":"فَأَجَابَ يَسُوعُ وَقَالَ لَهُمْ: «لاَ يَحْتَاجُ الأَصِحَّاءُ إِلَى طَبِيبٍ، بَلِ الْمَرْضَى.","32":"لَمْ آتِ لأَدْعُوَ أَبْرَارًا بَلْ خُطَاةً إِلَى التَّوْبَةِ»."},"11.4":{"1":"وَصَرَخَتْ إِلَى أَلِيشَعَ امْرَأَةٌ مِنْ نِسَاءِ بَنِي الأَنْبِيَاءِ قَائِلَةً: «إِنَّ عَبْدَكَ زَوْجِي قَدْ مَاتَ، وَأَنْتَ تَعْلَمُ أَنَّ عَبْدَكَ كَانَ يَخَافُ الرَّبَّ. فَأَتَى الْمُرَابِي لِيَأْخُذَ وَلَدَيَّ لَهُ عَبْدَيْنِ».","2":"فَقَالَ لَهَا أَلِيشَعُ: «مَاذَا أَصْنَعُ لَكِ؟ أَخْبِرِينِي مَاذَا لَكِ فِي الْبَيْتِ؟». فَقَالَتْ: «لَيْسَ لِجَارِيَتِكَ شَيْءٌ فِي الْبَيْتِ إِلاَّ دُهْنَةَ زَيْتٍ».","3":"فَقَالَ: «اذْهَبِي اسْتَعِيرِي لِنَفْسِكِ أَوْعِيَةً مِنْ خَارِجٍ، مِنْ عِنْدِ جَمِيعِ جِيرَانِكِ، أَوْعِيَةً فَارِغَةً. لاَ تُقَلِّلِي.","4":"ثُمَّ ادْخُلِي وَأَغْلِقِي الْبَابَ عَلَى نَفْسِكِ وَعَلَى بَنِيكِ، وَصُبِّي فِي جَمِيعِ هذِهِ الأَوْعِيَةِ، وَمَا امْتَلأَ انْقُلِيهِ».","5":"فَذَهَبَتْ مِنْ عِنْدِهِ وَأَغْلَقَتِ الْبَابَ عَلَى نَفْسِهَا وَعَلَى بَنِيهَا. فَكَانُوا هُمْ يُقَدِّمُونَ لَهَا الأَوْعِيَةَ وَهِيَ تَصُبُّ.","6":"وَلَمَّا امْتَلأَتِ الأَوْعِيَةُ قَالَتْ لابْنِهَا: «قَدِّمْ لِي أَيْضًا وِعَاءً». فَقَالَ لَهَا: «لاَ يُوجَدُ بَعْدُ وِعَاءٌ». فَوَقَفَ الزَّيْتُ.","7":"فَأَتَتْ وَأَخْبَرَتْ رَجُلَ اللهِ فَقَالَ: «اذْهَبِي بِيعِي الزَّيْتَ وَأَوْفِي دَيْنَكِ، وَعِيشِي أَنْتِ وَبَنُوكِ بِمَا بَقِيَ».","42":"وَجَاءَ رَجُلٌ مِنْ بَعْلِ شَلِيشَةَ وَأَحْضَرَ لِرَجُلِ اللهِ خُبْزَ بَاكُورَةٍ عِشْرِينَ رَغِيفًا مِنْ شَعِيرٍ، وَسَوِيقًا فِي جِرَابِهِ. فَقَالَ: «أَعْطِ الشَّعْبَ لِيَأْكُلُوا».","43":"فَقَالَ خَادِمُهُ: «مَاذَا؟ هَلْ أَجْعَلُ هذَا أَمَامَ مِئَةِ رَجُل؟» فَقَالَ: «أَعْطِ الشَّعْبَ فَيَأْكُلُوا، لأَنَّهُ هكَذَا قَالَ الرَّبُّ: يَأْكُلُونَ وَيَفْضُلُ عَنْهُمْ».","44":"فَجَعَلَ أَمَامَهُمْ فَأَكَلُوا، وَفَضَلَ عَنْهُمْ حَسَبَ قَوْلِ الرَّبِّ."},"18.27":{"1":"اَلرَّبُّ نُورِي وَخَلاَصِي، مِمَّنْ أَخَافُ؟ الرَّبُّ حِصْنُ حَيَاتِي، مِمَّنْ أَرْتَعِبُ؟","10":"إِنَّ أَبِي وَأُمِّي قَدْ تَرَكَانِي وَالرَّبُّ يَضُمُّنِي.","13":"لَوْلاَ أَنَّنِي آمَنْتُ بِأَنْ أَرَى جُودَ الرَّبِّفِي أَرْضِ الأَحْيَاءِ.","14":"انْتَظِرِ الرَّبَّ. لِيَتَشَدَّدْ وَلْيَتَشَجَّعْ قَلْبُكَ، وَانْتَظِرِ الرَّبَّ.","5":"لأَنَّهُ يُخَبِّئُنِي فِي مَظَلَّتِهِ فِي يَوْمِ الشَّرِّ. يَسْتُرُنِي بِسِتْرِ خَيْمَتِهِ. عَلَى صَخْرَةٍ يَرْفَعُنِي.","8":"لَكَ قَالَ قَلْبِي: «قُلْتَ: اطْلُبُوا وَجْهِي». وَجْهَكَ يَا رَبُّ أَطْلُبُ."},"54.1":{"7":"لأَنَّ اللهَ لَمْ يُعْطِنَا رُوحَ الْفَشَلِ، بَلْ رُوحَ الْقُوَّةِ وَالْمَحَبَّةِ وَالنُّصْحِ.","10":"وَإِنَّمَا أُظْهِرَتِ الآنَ بِظُهُورِ مُخَلِّصِنَا يَسُوعَ الْمَسِيحِ، الَّذِي أَبْطَلَ الْمَوْتَ وَأَنَارَ الْحَيَاةَ وَالْخُلُودَ بِوَاسِطَةِ الإِنْجِيلِ.","9":"الَّذِي خَلَّصَنَا وَدَعَانَا دَعْوَةً مُقَدَّسَةً، لاَ بِمُقْتَضَى أَعْمَالِنَا، بَلْ بِمُقْتَضَى الْقَصْدِ وَالنِّعْمَةِ الَّتِي أُعْطِيَتْ لَنَا فِي الْمَسِيحِ يَسُوعَ قَبْلَ الأَزْمِنَةِ الأَزَلِيَّةِ،"},"5.1":{"9":"أَمَا أَمَرْتُكَ؟ تَشَدَّدْ وَتَشَجَّعْ! لاَ تَرْهَبْ وَلاَ تَرْتَعِبْ لأَنَّ الرَّبَّ إِلهَكَ مَعَكَ حَيْثُمَا تَذْهَبُ».","5":"لاَ يَقِفُ إِنْسَانٌ فِي وَجْهِكَ كُلَّ أَيَّامِ حَيَاتِكَ. كَمَا كُنْتُ مَعَ مُوسَى أَكُونُ مَعَكَ. لاَ أُهْمِلُكَ وَلاَ أَتْرُكُكَ.","1":"وَكَانَ بَعْدَ مَوْتِ مُوسَى عَبْدِ الرَّبِّ أَنَّ الرَّبَّ كَلَّمَ يَشُوعَ بْنِ نُونٍ خَادِمَ مُوسَى قَائِلاً:","2":"«مُوسَى عَبْدِي قَدْ مَاتَ. فَالآنَ قُمُِ اعْبُرْ هذَا الأُرْدُنَّ أَنْتَ وَكُلُّ هذَا الشَّعْبِ إِلَى الأَرْضِ الَّتِي أَنَا مُعْطِيهَا لَهُمْ أَيْ لِبَنِي إِسْرَائِيلَ.","3":"كُلَّ مَوْضِعٍ تَدُوسُهُ بُطُونُ أَقْدَامِكُمْ لَكُمْ أَعْطَيْتُهُ، كَمَا كَلَّمْتُ مُوسَى.","4":"مِنَ الْبَرِّيَّةِ وَلُبْنَانَ هذَا إِلَى النَّهْرِ الْكَبِيرِ نَهْرِ الْفُرَاتِ، جَمِيعِ أَرْضِ الْحِثِّيِّينَ، وَإِلَى الْبَحْرِ الْكَبِيرِ نَحْوَ مَغْرِبِ الشَّمْسِ يَكُونُ تُخْمُكُمْ.","6":"تَشَدَّدْ وَتَشَجَّعْ، لأَنَّكَ أَنْتَ تَقْسِمُ لِهذَا الشَّعْبِ الأَرْضَ الَّتِي حَلَفْتُ لآبَائِهِمْ أَنْ أُعْطِيَهُمْ.","7":"إِنَّمَا كُنْ مُتَشَدِّدًا، وَتَشَجَّعْ جِدًّا لِكَيْ تَتَحَفَّظَ لِلْعَمَلِ حَسَبَ كُلِّ الشَّرِيعَةِ الَّتِي أَمَرَكَ بِهَا مُوسَى عَبْدِي. لاَ تَمِلْ عَنْهَا يَمِينًا وَلاَ شِمَالاً لِكَيْ تُفْلِحَ حَيْثُمَا تَذْهَبُ.","8":"لاَ يَبْرَحْ سِفْرُ هذِهِ الشَّرِيعَةِ مِنْ فَمِكَ، بَلْ تَلْهَجُ فِيهِ نَهَارًا وَلَيْلاً، لِكَيْ تَتَحَفَّظَ لِلْعَمَلِ حَسَبَ كُلِّ مَا هُوَ مَكْتُوبٌ فِيهِ. لأَنَّكَ حِينَئِذٍ تُصْلِحُ طَرِيقَكَ وَحِينَئِذٍ تُفْلِحُ."},"18.118":{"6":"الرَّبُّ لِي فَلاَ أَخَافُ. مَاذَا يَصْنَعُ بِي الإِنْسَانُ؟","17":"لاَ أَمُوتُ بَلْ أَحْيَا وَأُحَدِّثُ بِأَعْمَالِ الرَّبِّ.","24":"هذَا هُوَ الْيَوْمُ الَّذِي صَنَعُهُ الرَّبُّ، نَبْتَهِجُ وَنَفْرَحُ فِيهِ.","22":"الْحَجَرُ الَّذِي رَفَضَهُ الْبَنَّاؤُونَ قَدْ صَارَ رَأْسَ الزَّاوِيَةِ.","8":"الاحْتِمَاءُ بِالرَّبِّ خَيْرٌ مِنَ التَّوَكُّلِ عَلَى إِنْسَانٍ.","9":"الاحْتِمَاءُ بِالرَّبِّ خَيْرٌ مِنَ التَّوَكُّلِ عَلَى الرُّؤَسَاءِ."},"22.43":{"1":"وَالآنَ هكَذَا يَقُولُ الرَّبُّ، خَالِقُكَ يَا يَعْقُوبُ وَجَابِلُكَ يَا إِسْرَائِيلُ: «لاَ تَخَفْ لأَنِّي فَدَيْتُكَ. دَعَوْتُكَ بِاسْمِكَ. أَنْتَ لِي.","2":"إِذَا اجْتَزْتَ فِي الْمِيَاهِ فَأَنَا مَعَكَ، وَفِي الأَنْهَارِ فَلاَ تَغْمُرُكَ. إِذَا مَشَيْتَ فِي النَّارِ فَلاَ تُلْذَعُ، وَاللَّهِيبُ لاَ يُحْرِقُكَ.","19":"هأَنَذَا صَانِعٌ أَمْرًا جَدِيدًا. الآنَ يَنْبُتُ. أَلاَ تَعْرِفُونَهُ؟ أَجْعَلُ فِي الْبَرِّيَّةِ طَرِيقًا، فِي الْقَفْرِ أَنْهَارًا.","25":"أَنَا أَنَا هُوَ الْمَاحِي ذُنُوبَكَ لأَجْلِ نَفْسِي، وَخَطَايَاكَ لاَ أَذْكُرُهَا».","18":"«لاَ تَذْكُرُوا الأَوَّلِيَّاتِ، وَالْقَدِيمَاتُ لاَ تَتَأَمَّلُوا بِهَا.","4":"إِذْ صِرْتَ عَزِيزًا فِي عَيْنَيَّ مُكَرَّمًا، وَأَنَا قَدْ أَحْبَبْتُكَ. أُعْطِي أُنَاسًا عِوَضَكَ وَشُعُوبًا عِوَضَ نَفْسِكَ.","3":"لأَنِّي أَنَا الرَّبُّ إِلهُكَ قُدُّوسُ إِسْرَائِيلَ، مُخَلِّصُكَ. جَعَلْتُ مِصْرَ فِدْيَتَكَ، كُوشَ وَسَبَا عِوَضَكَ."},"4.31":{"6":"تَشَدَّدُوا وَتَشَجَّعُوا. لاَ تَخَافُوا وَلاَ تَرْهَبُوا وُجُوهَهُمْ، لأَنَّ الرَّبَّ إِلهَكَ سَائِرٌ مَعَكَ. لاَ يُهْمِلُكَ وَلاَ يَتْرُكُكَ».","8":"وَالرَّبُّ سَائِرٌ أَمَامَكَ. هُوَ يَكُونُ مَعَكَ. لاَ يُهْمِلُكَ وَلاَ يَتْرُكُكَ. لاَ تَخَفْ وَلاَ تَرْتَعِبْ»."},"18.91":{"1":"اَلسَّاكِنُ فِي سِتْرِ الْعَلِيِّ، فِي ظِلِّ الْقَدِيرِ يَبِيتُ.","2":"أَقُولُ لِلرَّبِّ: «مَلْجَإِي وَحِصْنِي. إِلهِي فَأَتَّكِلُ عَلَيْهِ».","15":"يَدْعُونِي فَأَسْتَجِيبُ لَهُ، مَعَهُ أَنَا فِي الضِّيقْ، أُنْقِذُهُ وَأُمَجِّدُهُ.","3":"لأَنَّهُ يُنَجِّيكَ مِنْ فَخِّ الصَّيَّادِ وَمِنَ الْوَبَإِ الْخَطِرِ.","4":"بِخَوَافِيهِ يُظَلِّلُكَ، وَتَحْتَ أَجْنِحَتِهِ تَحْتَمِي. تُرْسٌ وَمِجَنٌّ حَقُّهُ.","11":"لأَنَّهُ يُوصِي مَلاَئِكَتَهُ بِكَ لِكَيْ يَحْفَظُوكَ فِي كُلِّ طُرُقِكَ.","12":"عَلَى الأَيْدِي يَحْمِلُونَكَ لِئَلاَّ تَصْدِمَ بِحَجَرٍ رِجْلَكَ.","16":"مِنْ طُولِ الأَيَّامِ أُشْبِعُهُ، وَأُرِيهِ خَلاَصِي»."},"22.12":{"2":"هُوَذَا اللهُ خَلاَصِي فَأَطْمَئِنُّ وَلاَ أَرْتَعِبُ، لأَنَّ يَاهَ يَهْوَهَ قُوَّتِي وَتَرْنِيمَتِي وَقَدْ صَارَ لِي خَلاَصًا».","3":"فَتَسْتَقُونَ مِيَاهًا بِفَرَحٍ مِنْ يَنَابِيعِ الْخَلاَصِ."},"44.8":{"31":"فَمَاذَا نَقُولُ لِهذَا؟ إِنْ كَانَ اللهُ مَعَنَا، فَمَنْ عَلَيْنَا؟","28":"وَنَحْنُ نَعْلَمُ أَنَّ كُلَّ الأَشْيَاءِ تَعْمَلُ مَعًا لِلْخَيْرِ لِلَّذِينَ يُحِبُّونَ اللهَ، الَّذِينَ هُمْ مَدْعُوُّونَ حَسَبَ قَصْدِهِ.","38":"فَإِنِّي مُتَيَقِّنٌ أَنَّهُ لاَ مَوْتَ وَلاَ حَيَاةَ، وَلاَ مَلاَئِكَةَ وَلاَ رُؤَسَاءَ وَلاَ قُوَّاتِ، وَلاَ أُمُورَ حَاضِرَةً وَلاَ مُسْتَقْبَلَةً،","39":"وَلاَ عُلْوَ وَلاَ عُمْقَ، وَلاَ خَلِيقَةَ أُخْرَى، تَقْدِرُ أَنْ تَفْصِلَنَا عَنْ مَحَبَّةِ اللهِ الَّتِي فِي الْمَسِيحِ يَسُوعَ رَبِّنَا.","1":"إِذًا لاَ شَيْءَ مِنَ الدَّيْنُونَةِ الآنَ عَلَى الَّذِينَ هُمْ فِي الْمَسِيحِ يَسُوعَ، السَّالِكِينَ لَيْسَ حَسَبَ الْجَسَدِ بَلْ حَسَبَ الرُّوحِ.","33":"مَنْ سَيَشْتَكِي عَلَى مُخْتَارِي اللهِ؟ اَللهُ هُوَ الَّذِي يُبَرِّرُ.","34":"مَنْ هُوَ الَّذِي يَدِينُ؟ اَلْمَسِيحُ هُوَ الَّذِي مَاتَ، بَلْ بِالْحَرِيِّ قَامَ أَيْضًا، الَّذِي هُوَ أَيْضًا عَنْ يَمِينِ اللهِ، الَّذِي أَيْضًا يَشْفَعُ فِينَا.","25":"وَلكِنْ إِنْ كُنَّا نَرْجُو مَا لَسْنَا نَنْظُرُهُ فَإِنَّنَا نَتَوَقَّعُهُ بِالصَّبْرِ.","15":"إِذْ لَمْ تَأْخُذُوا رُوحَ الْعُبُودِيَّةِ أَيْضًا لِلْخَوْفِ، بَلْ أَخَذْتُمْ رُوحَ التَّبَنِّي الَّذِي بِهِ نَصْرُخُ:«يَا أَبَا الآبُ».","16":"اَلرُّوحُ نَفْسُهُ أَيْضًا يَشْهَدُ لأَرْوَاحِنَا أَنَّنَا أَوْلاَدُ اللهِ.","6":"لأَنَّ اهْتِمَامَ الْجَسَدِ هُوَ مَوْتٌ، وَلكِنَّ اهْتِمَامَ الرُّوحِ هُوَ حَيَاةٌ وَسَلاَمٌ.","18":"فَإِنِّي أَحْسِبُ أَنَّ آلاَمَ الزَّمَانِ الْحَاضِرِ لاَ تُقَاسُ بِالْمَجْدِ الْعَتِيدِ أَنْ يُسْتَعْلَنَ فِينَا."},"61.4":{"18":"لاَ خَوْفَ فِي الْمَحَبَّةِ، بَلِ الْمَحَبَّةُ الْكَامِلَةُ تَطْرَحُ الْخَوْفَ إِلَى خَارِجٍ لأَنَّ الْخَوْفَ لَهُ عَذَابٌ. وَأَمَّا مَنْ خَافَ فَلَمْ يَتَكَمَّلْ فِي الْمَحَبَّةِ.","4":"أَنْتُمْ مِنَ اللهِ أَيُّهَا الأَوْلاَدُ، وَقَدْ غَلَبْتُمُوهُمْ لأَنَّ الَّذِي فِيكُمْ أَعْظَمُ مِنَ الَّذِي فِي الْعَالَمِ.","7":"أَيُّهَا الأَحِبَّاءُ، لِنُحِبَّ بَعْضُنَا بَعْضًا، لأَنَّ الْمَحَبَّةَ هِيَ مِنَ اللهِ، وَكُلُّ مَنْ يُحِبُّ فَقَدْ وُلِدَ مِنَ اللهِ وَيَعْرِفُ اللهَ.","8":"وَمَنْ لاَ يُحِبُّ لَمْ يَعْرِفِ اللهَ، لأَنَّ اللهَ مَحَبَّةٌ.","9":"بِهذَا أُظْهِرَتْ مَحَبَّةُ اللهِ فِينَا: أَنَّ اللهَ قَدْ أَرْسَلَ ابْنَهُ الْوَحِيدَ إِلَى الْعَالَمِ لِكَيْ نَحْيَا بِهِ.","10":"فِي هذَا هِيَ الْمَحَبَّةُ: لَيْسَ أَنَّنَا نَحْنُ أَحْبَبْنَا اللهَ، بَلْ أَنَّهُ هُوَ أَحَبَّنَا، وَأَرْسَلَ ابْنَهُ كَفَّارَةً لِخَطَايَانَا.","11":"أَيُّهَا الأَحِبَّاءُ، إِنْ كَانَ اللهُ قَدْ أَحَبَّنَا هكَذَا، يَنْبَغِي لَنَا أَيْضًا أَنْ يُحِبَّ بَعْضُنَا بَعْضًا.","12":"اَللهُ لَمْ يَنْظُرْهُ أَحَدٌ قَطُّ. إِنْ أَحَبَّ بَعْضُنَا بَعْضًا، فَاللهُ يَثْبُتُ فِينَا، وَمَحَبَّتُهُ قَدْ تَكَمَّلَتْ فِينَا.","19":"نَحْنُ نُحِبُّهُ لأَنَّهُ هُوَ أَحَبَّنَا أَوَّلاً."},"18.23":{"4":"أَيْضًا إِذَا سِرْتُ فِي وَادِي ظِلِّ الْمَوْتِ لاَ أَخَافُ شَرًّا، لأَنَّكَ أَنْتَ مَعِي. عَصَاكَ وَعُكَّازُكَ هُمَا يُعَزِّيَانِنِي.","1":"الرَّبُّ رَاعِيَّ فَلاَ يُعْوِزُنِي شَيْءٌ.","2":"فِي مَرَاعٍ خُضْرٍ يُرْبِضُنِي. إِلَى مِيَاهِ الرَّاحَةِ يُورِدُنِي.","3":"يَرُدُّ نَفْسِي. يَهْدِينِي إِلَى سُبُلِ الْبِرِّ مِنْ أَجْلِ اسْمِهِ."},"39.14":{"27":"فَلِلْوَقْتِ كَلَّمَهُمْ يَسُوعُ قِائِلاً: «تَشَجَّعُوا! أَنَا هُوَ. لاَ تَخَافُوا».","22":"وَلِلْوَقْتِ أَلْزَمَ يَسُوعُ تَلاَمِيذَهُ أَنْ يَدْخُلُوا السَّفِينَةَ وَيَسْبِقُوهُ إِلَى الْعَبْرِ حَتَّى يَصْرِفَ الْجُمُوعَ.","23":"وَبَعْدَمَا صَرَفَ الْجُمُوعَ صَعِدَ إِلَى الْجَبَلِ مُنْفَرِدًا لِيُصَلِّيَ. وَلَمَّا صَارَ الْمَسَاءُ كَانَ هُنَاكَ وَحْدَهُ.","24":"وَأَمَّا السَّفِينَةُ فَكَانَتْ قَدْ صَارَتْ فِي وَسْطِ الْبَحْرِ مُعَذَّبَةً مِنَ الأَمْوَاجِ. لأَنَّ الرِّيحَ كَانَتْ مُضَادَّةً.","25":"وَفِي الْهَزِيعِ الرَّابعِ مِنَ اللَّيْلِ مَضَى إِلَيْهِمْ يَسُوعُ مَاشِيًا عَلَى الْبَحْرِ.","26":"فَلَمَّا أَبْصَرَهُ التَّلاَمِيذُ مَاشِيًا عَلَى الْبَحْرِ اضْطَرَبُوا قَائِلِينَ:«إِنَّهُ خَيَالٌ». وَمِنَ الْخَوْفِ صَرَخُوا!","28":"فَأَجَابَهُ بُطْرُسُ وَقَالَ:«يَا سَيِّدُ، إِنْ كُنْتَ أَنْتَ هُوَ، فَمُرْني أَنْ آتِيَ إِلَيْكَ عَلَى الْمَاءِ».","29":"فَقَالَ:«تَعَالَ». فَنَزَلَ بُطْرُسُ مِنَ السَّفِينَةِ وَمَشَى عَلَى الْمَاءِ لِيَأْتِيَ إِلَى يَسُوعَ.","30":"وَلكِنْ لَمَّا رَأَى الرِّيحَ شَدِيدَةً خَافَ. وَإِذِ ابْتَدَأَ يَغْرَقُ، صَرَخَ قِائِلاً:«يَارَبُّ، نَجِّنِي!».","31":"فَفِي الْحَالِ مَدَّ يَسُوعُ يَدَهُ وَأَمْسَكَ بِهِ وَقَالَ لَهُ:«يَا قَلِيلَ الإِيمَانِ، لِمَاذَا شَكَكْتَ؟»","32":"وَلَمَّا دَخَلاَ السَّفِينَةَ سَكَنَتِ الرِّيحُ.","33":"وَالَّذِينَ فِي السَّفِينَةِ جَاءُوا وَسَجَدُوا لَهُ قَائِلِينَ:«بِالْحَقِيقَةِ أَنْتَ ابْنُ اللهِ!»."},"18.112":{"7":"لاَ يَخْشَى مِنْ خَبَرِ سُوءٍ. قَلْبُهُ ثَابِتٌ مُتَّكِلاً عَلَى الرَّبِّ.","1":"هَلِّلُويَا. طُوبَى لِلرَّجُلِ الْمُتَّقِي الرَّبَِّ، الْمَسْرُورِ جِدًّا بِوَصَايَاهُ.","2":"نَسْلُهُ يَكُونُ قَوِيًّا فِي الأَرْضِ. جِيلُ الْمُسْتَقِيمِينَ يُبَارَكُ.","3":"رَغْدٌ وَغِنًى فِي بَيْتِهِ، وَبِرُّهُ قَائِمٌ إِلَى الأَبَدِ."},"40.4":{"35":"وَقَالَ لَهُمْ فِي ذلِكَ الْيَوْمِ لَمَّا كَانَ الْمَسَاءُ: «لِنَجْتَزْ إِلَى الْعَبْرِ».","36":"فَصَرَفُوا الْجَمْعَ وَأَخَذُوهُ كَمَا كَانَ فِي السَّفِينَةِ. وَكَانَتْ مَعَهُ أَيْضًا سُفُنٌ أُخْرَى صَغِيرَةٌ.","37":"فَحَدَثَ نَوْءُ رِيحٍ عَظِيمٌ، فَكَانَتِ الأَمْوَاجُ تَضْرِبُ إِلَى السَّفِينَةِ حَتَّى صَارَتْ تَمْتَلِئُ.","38":"وَكَانَ هُوَ فِي الْمُؤَخَّرِ عَلَى وِسَادَةٍ نَائِمًا. فَأَيْقَظُوهُ وَقَالُوا لَهُ:«يَا مُعَلِّمُ، أَمَا يَهُمُّكَ أَنَّنَا نَهْلِكُ؟»","39":"فَقَامَ وَانْتَهَرَ الرِّيحَ، وَقَالَ لِلْبَحْرِ:«اسْكُتْ! اِبْكَمْ!». فَسَكَنَتِ الرِّيحُ وَصَارَ هُدُوءٌ عَظِيمٌ.","40":"وَقَالَ لَهُمْ:«مَا بَالُكُمْ خَائِفِينَ هكَذَا؟ كَيْفَ لاَ إِيمَانَ لَكُمْ؟»","41":"فَخَافُوا خَوْفًا عَظِيمًا، وَقَالُوا بَعْضُهُمْ لِبَعْضٍ:«مَنْ هُوَ هذَا؟ فَإِنَّ الرِّيحَ أَيْضًا وَالْبَحْرَ يُطِيعَانِهِ!»."},"26.3":{"19":"حِينَئِذٍ امْتَلأَ نَبُوخَذْنَصَّرُ غَيْظًا وَتَغَيَّرَ مَنْظَرُ وَجْهِهِ عَلَى شَدْرَخَ وَمِيشَخَ وَعَبْدَنَغُوَ، فَأَجَابَ وَأَمَرَ بِأَنْ يَحْمُوا الأَتُونَ سَبْعَةَ أَضْعَافٍ أَكْثَرَ مِمَّا كَانَ مُعْتَادًا أَنْ يُحْمَى.","20":"وَأَمَرَ جَبَابِرَةَ الْقُوَّةِ فِي جَيْشِهِ بِأَنْ يُوثِقُوا شَدْرَخَ وَمِيشَخَ وَعَبْدَنَغُوَ وَيُلْقُوهُمْ فِي أَتُّونِ النَّارِ الْمُتَّقِدَةِ.","21":"ثُمَّ أُوثِقَ هؤُلاَءِ الرِّجَالُ فِي سَرَاوِيلِهِمْ وَأَقْمِصَتِهِمْ وَأَرْدِيَتِهِمْ وَلِبَاسِهِمْ وَأُلْقُوا فِي وَسَطِ أَتُّونِ النَّارِ الْمُتَّقِدَةِ.","22":"وَمِنْ حَيْثُ إِنَّ كَلِمَةَ الْمَلِكِ شَدِيدَةٌ وَالأَتُونَ قَدْ حَمِيَ جِدًّا، قَتَلَ لَهِيبُ النَّارِ الرِّجَالَ الَّذِينَ رَفَعُوا شَدْرَخَ وَمِيشَخَ وَعَبْدَنَغُوَ.","23":"وَهؤُلاَءِ الثَّلاَثَةُ الرِّجَالِ، شَدْرَخُ وَمِيشَخُ وَعَبْدَنَغُوَ، سَقَطُوا مُوثَقِينَ فِي وَسَطِ أَتُّونِ النَّارِ الْمُتَّقِدَةِ.","24":"حِينَئِذٍ تَحَيَّرَ نَبُوخَذْنَصَّرُ الْمَلِكُ وَقَامَ مُسْرِعًا فَأَجَابَ وَقَالَ لِمُشِيرِيهِ: «أَلَمْ نُلْقِ ثَلاَثَةَ رِجَال مُوثَقِينَ فِي وَسَطِ النَّارِ؟» فَأَجَابُوا وَقَالُوا لِلْمَلِكِ: «صَحِيحٌ أَيُّهَا الْمَلِكُ».","25":"أَجَابَ وَقَالَ: «هَا أَنَا نَاظِرٌ أَرْبَعَةَ رِجَال مَحْلُولِينَ يَتَمَشَّوْنَ فِي وَسَطِ النَّارِ وَمَا بِهِمْ ضَرَرٌ، وَمَنْظَرُ الرَّابعِ شَبِيهٌ بِابْنِ الآلِهَةِ».","26":"ثُمَّ اقْتَرَبَ نَبُوخَذْنَصَّرُ إِلَى بَابِ أَتُّونِ النَّارِ الْمُتَّقِدَةِ وَأَجَابَ، فََقَالَ: «يَا شَدْرَخُ وَمِيشَخُ وَعَبْدَنَغُو، يَا عَبِيدَ اللهِ الْعَلِيِّ، اخْرُجُوا وَتَعَالَوْا». فَخَرَجَ شَدْرَخُ وَمِيشَخُ وَعَبْدَنَغُو مِنْ وَسَطِ النَّارِ.","27":"فَاجْتَمَعَتِ الْمَرَازِبَةُ وَالشِّحَنُ وَالْوُلاَةُ وَمُشِيرُو الْمَلِكِ وَرَأَوْا هؤُلاَءِ الرِّجَالَ الَّذِينَ لَمْ تَكُنْ لِلنَّارِ قُوَّةٌ عَلَى أَجْسَامِهِمْ، وَشَعْرَةٌ مِنْ رُؤُوسِهِمْ لَمْ تَحْتَرِقْ، وَسَرَاوِيلُهُمْ لَمْ تَتَغَيَّرْ، وَرَائِحَةُ النَّارِ لَمْ تَأْتِ عَلَيْهِمْ."},"26.6":{"16":"حِينَئِذٍ أَمَرَ الْمَلِكُ فَأَحْضَرُوا دَانِيآلَ وَطَرَحُوهُ فِي جُبِّ الأُسُودِ. أَجَابَ الْمَلِكُ وَقَالَ لِدَانِيآلَ: «إِنَّ إِلهَكَ الَّذِي تَعْبُدُهُ دَائِمًا هُوَ يُنَجِّيكَ».","17":"وَأُتِيَ بِحَجَرٍ وَوُضِعَ عَلَى فَمِ الْجُبِّ وَخَتَمَهُ الْمَلِكُ بِخَاتِمِهِ وَخَاتِمِ عُظَمَائِهِ، لِئَلاَّ يَتَغَيَّرَ الْقَصْدُ فِي دَانِيآلَ.","18":"حِينَئِذٍ مَضَى الْمَلِكُ إِلَى قَصْرِهِ وَبَاتَ صَائِمًا، وَلَمْ يُؤْتَ قُدَّامَهُ بِسَرَارِيهِ وَطَارَ عَنْهُ نَوْمُهُ.","19":"ثُمَّ قَامَ الْمَلِكُ بَاكِرًا عِنْدَ الْفَجْرِ وَذَهَبَ مُسْرِعًا إِلَى جُبِّ الأُسُودِ.","20":"فَلَمَّا اقْتَرَبَ إِلَى الْجُبِّ نَادَى دَانِيآلَ بِصَوْتٍ أَسِيفٍ. أَجَابَ الْمَلِكُ وَقَالَ لِدَانِيآلَ: «يَا دَانِيآلُ عَبْدَ اللهِ الْحَيِّ، هَلْ إِلهُكَ الَّذِي تَعْبُدُهُ دَائِمًا قَدِرَ عَلَى أَنْ يُنَجِّيَكَ مِنَ الأُسُودِ؟»","21":"فَتَكَلَّمَ دَانِيآلُ مَعَ الْمَلِكِ: «يَا أَيُّهَا الْمَلِكُ، عِشْ إِلَى الأَبَدِ!","22":"إِلهِي أَرْسَلَ مَلاَكَهُ وَسَدَّ أَفْوَاهَ الأُسُودِ فَلَمْ تَضُرَّنِي، لأَنِّي وُجِدْتُ بَرِيئًا قُدَّامَهُ، وَقُدَّامَكَ أَيْضًا أَيُّهَا الْمَلِكُ، لَمْ أَفْعَلْ ذَنْبًا».","23":"حِينَئِذٍ فَرِحَ الْمَلِكُ بِهِ، وَأَمَرَ بِأَنْ يُصْعَدَ دَانِيآلُ مِنَ الْجُبِّ. فَأُصْعِدَ دَانِيآلُ مِنَ الْجُبِّ وَلَمْ يُوجَدْ فِيهِ ضَرَرٌ، لأَنَّهُ آمَنَ بِإِلهِهِ."},"11.6":{"8":"وَأَمَّا مَلِكُ أَرَامَ فَكَانَ يُحَارِبُ إِسْرَائِيلَ، وَتَآمَرَ مَعَ عَبِيدِهِ قَائِلاً: «فِي الْمَكَانِ الْفُلاَنِيِّ تَكُونُ مَحَلَّتِي».","9":"فَأَرْسَلَ رَجُلُ اللهِ إِلَى مَلِكِ إِسْرَائِيلَ يَقُولُ: «احْذَرْ مِنْ أَنْ تَعْبُرَ بِهذَا الْمَوْضِعِ، لأَنَّ الأَرَامِيِّينَ حَالُّونَ هُنَاكَ».","10":"فَأَرْسَلَ مَلِكُ إِسْرَائِيلَ إِلَى الْمَوْضِعِ الَّذِي قَالَ لَهُ عَنْهُ رَجُلُ اللهِ وَحَذَّرَهُ مِنْهُ وَتَحَفَّظَ هُنَاكَ، لاَ مَرَّةً وَلاَ مَرَّتَيْنِ.","11":"فَاضْطَرَبَ قَلْبُ مَلِكِ أَرَامَ مِنْ هذَا الأَمْرِ، وَدَعَا عَبِيدَهُ وَقَالَ لَهُمْ: «أَمَا تُخْبِرُونَنِي مَنْ مِنَّا هُوَ لِمَلِكِ إِسْرَائِيلَ؟»","12":"فَقَالَ وَاحِدٌ مِنْ عَبِيدِهِ: «لَيْسَ هكَذَا يَا سَيِّدِي الْمَلِكَ. وَلكِنَّ أَلِيشَعَ النَّبِيَّ الَّذِي فِي إِسْرَائِيلَ، يُخْبِرُ مَلِكَ إِسْرَائِيلَ بِالأُمُورِ الَّتِي تَتَكَلَّمُ بِهَا فِي مُخْدَعِ مِضْطَجَعِكَ».","13":"فَقَالَ: «اذْهَبُوا وَانْظُرُوا أَيْنَ هُوَ، فَأُرْسِلَ وَآخُذَهُ». فَأُخْبِرَ وَقِيلَ لَهُ: «هُوَذَا هُوَ فِي دُوثَانَ».","14":"فَأَرْسَلَ إِلَى هُنَاكَ خَيْلاً وَمَرْكَبَاتٍ وَجَيْشًا ثَقِيلاً، وَجَاءُوا لَيْلاً وَأَحَاطُوا بِالْمَدِينَةِ.","15":"فَبَكَّرَ خَادِمُ رَجُلِ اللهِ وَقَامَ وَخَرَجَ، وَإِذَا جَيْشٌ مُحِيطٌ بِالْمَدِينَةِ وَخَيْلٌ وَمَرْكَبَاتٌ. فَقَالَ غُلاَمُهُ لَهُ: «آهِ يَا سَيِّدِي! كَيْفَ نَعْمَلُ؟»","16":"فَقَالَ: «لاَ تَخَفْ، لأَنَّ الَّذِينَ مَعَنَا أَكْثَرُ مِنَ الَّذِينَ مَعَهُمْ».","17":"وَصَلَّى أَلِيشَعُ وَقَالَ: «يَا رَبُّ، افْتَحْ عَيْنَيْهِ فَيُبْصِرَ». فَفَتَحَ الرَّبُّ عَيْنَيِ الْغُلاَمِ فَأَبْصَرَ، وَإِذَا الْجَبَلُ مَمْلُوءٌ خَيْلاً وَمَرْكَبَاتِ نَارٍ حَوْلَ أَلِيشَعَ."},"0.15":{"1":"بَعْدَ هذِهِ الأُمُورِ صَارَ كَلاَمُ الرَّبِّ إِلَى أَبْرَامَ فِي الرُّؤْيَا قَائِلاً: «لاَ تَخَفْ يَا أَبْرَامُ. أَنَا تُرْسٌ لَكَ. أَجْرُكَ كَثِيرٌ جِدًّا».","2":"فَقَالَ أَبْرَامُ: «أَيُّهَا السَّيِّدُ الرَّبُّ، مَاذَا تُعْطِينِي وَأَنَا مَاضٍ عَقِيمًا، وَمَالِكُ بَيْتِي هُوَ أَلِيعَازَرُ الدِّمَشْقِيُّ؟»","3":"وَقَالَ أَبْرَامُ أَيْضًا: «إِنَّكَ لَمْ تُعْطِنِي نَسْلاً، وَهُوَذَا ابْنُ بَيْتِي وَارِثٌ لِي».","4":"فَإِذَا كَلاَمُ الرَّبِّ إِلَيْهِ قَائِلاً: «لاَ يَرِثُكَ هذَا، بَلِ الَّذِي يَخْرُجُ مِنْ أَحْشَائِكَ هُوَ يَرِثُكَ».","5":"ثُمَّ أَخْرَجَهُ إِلَى خَارِجٍ وَقَالَ: «انْظُرْ إِلَى السَّمَاءِ وَعُدَّ النُّجُومَ إِنِ اسْتَطَعْتَ أَنْ تَعُدَّهَا». وَقَالَ لَهُ: «هكَذَا يَكُونُ نَسْلُكَ».","6":"فَآمَنَ بِالرَّبِّ فَحَسِبَهُ لَهُ بِرًّا."},"1.14":{"10":"فَلَمَّا اقْتَرَبَ فِرْعَوْنُ رَفَعَ بَنُو إِسْرَائِيلَ عُيُونَهُمْ، وَإِذَا الْمِصْرِيُّونَ رَاحِلُونَ وَرَاءَهُمْ. فَفَزِعُوِا جِدًّا، وَصَرَخَ بَنُو إِسْرَائِيلَ إِلَى الرَّبِّ.","11":"وَقَالُوا لِمُوسَى: «هَلْ لأَنَّهُ لَيْسَتْ قُبُورٌ فِي مِصْرَ أَخَذْتَنَا لِنَمُوتَ فِي الْبَرِّيَّةِ؟ مَاذَا صَنَعْتَ بِنَا حَتَّى أَخْرَجْتَنَا مِنْ مِصْرَ؟","12":"أَلَيْسَ هذَا هُوَ الْكَلاَمُ الَّذِي كَلَّمْنَاكَ بِهِ فِي مِصْرَ قَائِلِينَ: كُفَّ عَنَّا فَنَخْدِمَ الْمِصْرِيِّينَ؟ لأَنَّهُ خَيْرٌ لَنَا أَنْ نَخْدِمَ الْمِصْرِيِّينَ مِنْ أَنْ نَمُوتَ فِي الْبَرِّيَّةِ».","13":"فَقَالَ مُوسَى لِلشَّعْبِ: «لاَ تَخَافُوا. قِفُوا وَانْظُرُوا خَلاَصَ الرَّبِّ الَّذِي يَصْنَعُهُ لَكُمُ الْيَوْمَ. فَإِنَّهُ كَمَا رَأَيْتُمُ الْمِصْرِيِّينَ الْيَوْمَ، لاَ تَعُودُونَ تَرَوْنَهُمْ أَيْضًا إِلَى الأَبَدِ.","14":"الرَّبُّ يُقَاتِلُ عَنْكُمْ وَأَنْتُمْ تَصْمُتُونَ».","15":"فَقَالَ الرَّبُّ لِمُوسَى: «مَا لَكَ تَصْرُخُ إِلَيَّ؟ قُلْ لِبَنِي إِسْرَائِيلَ أَنْ يَرْحَلُوا.","16":"وَارْفَعْ أَنْتَ عَصَاكَ وَمُدَّ يَدَكَ عَلَى الْبَحْرِ وَشُقَّهُ، فَيَدْخُلَ بَنُو إِسْرَائِيلَ فِي وَسَطِ الْبَحْرِ عَلَى الْيَابِسَةِ.","17":"وَهَا أَنَا أُشَدِّدُ قُلُوبَ الْمِصْرِيِّينَ حَتَّى يَدْخُلُوا وَرَاءَهُمْ، فَأَتَمَجَّدُ بِفِرْعَوْنَ وَكُلِّ جَيْشِهِ، بِمَرْكَبَاتِهِ وَفُرْسَانِهِ.","18":"فَيَعْرِفُ الْمِصْرِيُّونَ أَنِّي أَنَا الرَّبُّ حِينَ أَتَمَجَّدُ بِفِرْعَوْنَ وَمَرْكَبَاتِهِ وَفُرْسَانِهِ».","19":"فَانْتَقَلَ مَلاَكُ اللهِ السَّائِرُ أَمَامَ عَسْكَرِ إِسْرَائِيلَ وَسَارَ وَرَاءَهُمْ، وَانْتَقَلَ عَمُودُ السَّحَابِ مِنْ أَمَامِهِمْ وَوَقَفَ وَرَاءَهُمْ.","20":"فَدَخَلَ بَيْنَ عَسْكَرِ الْمِصْرِيِّينَ وَعَسْكَرِ إِسْرَائِيلَ، وَصَارَ السَّحَابُ وَالظَّلاَمُ وَأَضَاءَ اللَّيْلَ. فَلَمْ يَقْتَرِبْ هذَا إِلَى ذَاكَ كُلَّ اللَّيْلِ.","21":"وَمَدَّ مُوسَى يَدَهُ عَلَى الْبَحْرِ، فَأَجْرَى الرَّبُّ الْبَحْرَ بِرِيحٍ شَرْقِيَّةٍ شَدِيدَةٍ كُلَّ اللَّيْلِ، وَجَعَلَ الْبَحْرَ يَابِسَةً وَانْشَقَّ الْمَاءُ.","22":"فَدَخَلَ بَنُو إِسْرَائِيلَ فِي وَسَطِ الْبَحْرِ عَلَى الْيَابِسَةِ، وَالْمَاءُ سُورٌ لَهُمْ عَنْ يَمِينِهِمْ وَعَنْ يَسَارِهِمْ."},"39.28":{"20":"وَعَلِّمُوهُمْ أَنْ يَحْفَظُوا جَمِيعَ مَا أَوْصَيْتُكُمْ بِهِ. وَهَا أَنَا مَعَكُمْ كُلَّ الأَيَّامِ إِلَى انْقِضَاءِ الدَّهْرِ». آمِينَ.","1":"وَبَعْدَ السَّبْتِ، عِنْدَ فَجْرِ أَوَّلِ الأُسْبُوعِ، جَاءَتْ مَرْيَمُ الْمَجْدَلِيَّةُ وَمَرْيَمُ الأُخْرَى لِتَنْظُرَا الْقَبْرَ.","2":"وَإِذَا زَلْزَلَةٌ عَظِيمَةٌ حَدَثَتْ، لأَنَّ مَلاَكَ الرَّبِّ نَزَلَ مِنَ السَّمَاءِ وَجَاءَ وَدَحْرَجَ الْحَجَرَ عَنِ الْبَابِ، وَجَلَسَ عَلَيْهِ.","3":"وَكَانَ مَنْظَرُهُ كَالْبَرْقِ، وَلِبَاسُهُ أَبْيَضَ كَالثَّلْجِ.","4":"فَمِنْ خَوْفِهِ ارْتَعَدَ الْحُرَّاسُ وَصَارُوا كَأَمْوَاتٍ.","5":"فَأَجَابَ الْمَلاَكُ وَقَالَ لِلْمَرْأَتَيْنِ :«لاَ تَخَافَا أَنْتُمَا، فَإِنِّي أَعْلَمُ أَنَّكُمَا تَطْلُبَانِ يَسُوعَ الْمَصْلُوبَ.","6":"لَيْسَ هُوَ ههُنَا، لأَنَّهُ قَامَ كَمَا قَالَ! هَلُمَّا انْظُرَا الْمَوْضِعَ الَّذِي كَانَ الرَّبُّ مُضْطَجِعًا فِيهِ.","7":"وَاذْهَبَا سَرِيعًا قُولاَ لِتَلاَمِيذِهِ: إِنَّهُ قَدْ قَامَ مِنَ الأَمْوَاتِ. هَا هُوَ يَسْبِقُكُمْ إِلَى الْجَلِيلِ. هُنَاكَ تَرَوْنَهُ. هَا أَنَا قَدْ قُلْتُ لَكُمَا».","8":"فَخَرَجَتَا سَرِيعًا مِنَ الْقَبْرِ بِخَوْفٍ وَفَرَحٍ عَظِيمٍ، رَاكِضَتَيْنِ لِتُخْبِرَا تَلاَمِيذَهُ.","9":"وَفِيمَا هُمَا مُنْطَلِقَتَانِ لِتُخْبِرَا تَلاَمِيذَهُ إِذَا يَسُوعُ لاَقَاهُمَا وَقَالَ:«سَلاَمٌ لَكُمَا». فَتَقَدَّمَتَا وَأَمْسَكَتَا بِقَدَمَيْهِ وَسَجَدَتَا لَهُ.","10":"فَقَالَ لَهُمَا يَسُوعُ:«لاَ تَخَافَا. اِذْهَبَا قُولاَ لإِخْوَتِي أَنْ يَذْهَبُوا إِلَى الْجَلِيلِ، وَهُنَاكَ يَرَوْنَنِي»."},"18.68":{"6":"اَللهُ مُسْكِنُ الْمُتَوَحِّدِينَ فِي بَيْتٍ. مُخْرِجُ الأَسْرَى إِلَى فَلاَحٍ. إِنَّمَا الْمُتَمَرِّدُونَ يَسْكُنُونَ الرَّمْضَاءَ.","19":"مُبَارَكٌ الرَّبُّ، يَوْمًا فَيَوْمًا يُحَمِّلُنَا إِلهُ خَلاَصِنَا. سِلاَهْ.","35":"مَخُوفٌ أَنْتَ يَا اَللهُ مِنْ مَقَادِسِكَ. إِلهُ إِسْرَائِيلَ هُوَ الْمُعْطِي قُوَّةً وَشِدَّةً لِلشَّعْبِ. مُبَارَكٌ اللهُ!"},"22.49":{"15":"«هَلْ تَنْسَى الْمَرْأَةُ رَضِيعَهَا فَلاَ تَرْحَمَ ابْنَ بَطْنِهَا؟ حَتَّى هؤُلاَءِ يَنْسَيْنَ، وَأَنَا لاَ أَنْسَاكِ.","16":"هُوَذَا عَلَى كَفَّيَّ نَقَشْتُكِ. أَسْوَارُكِ أَمَامِي دَائِمًا.","25":"فَإِنَّهُ هكَذَا قَالَ الرَّبُّ: «حَتَّى سَبْيُ الْجَبَّارِ يُسْلَبُ، وَغَنِيمَةُ الْعَاتِي تُفْلِتُ. وَأَنَا أُخَاصِمُ مُخَاصِمَكِ وَأُخَلِّصُ أَوْلاَدَكِ،"},"57.13":{"5":"لِتَكُنْ سِيرَتُكُمْ خَالِيَةً مِنْ مَحَبَّةِ الْمَالِ. كُونُوا مُكْتَفِينَ بِمَا عِنْدَكُمْ، لأَنَّهُ قَالَ:«لاَ أُهْمِلُكَ وَلاَ أَتْرُكُكَ»","6":"حَتَّى إِنَّنَا نَقُولُ وَاثِقِينَ:«الرَّبُّ مُعِينٌ لِي فَلاَ أَخَافُ. مَاذَا يَصْنَعُ بِي إِنْسَانٌ؟»","15":"فَلْنُقَدِّمْ بِهِ فِي كُلِّ حِينٍ للهِِ ذَبِيحَةَ التَّسْبِيحِ، أَيْ ثَمَرَ شِفَاهٍ مُعْتَرِفَةٍ بِاسْمِهِ."},"18.139":{"7":"أَيْنَ أَذْهَبُ مِنْ رُوحِكَ؟ وَمِنْ وَجْهِكَ أَيْنَ أَهْرُبُ؟","8":"إِنْ صَعِدْتُ إِلَى السَّمَاوَاتِ فَأَنْتَ هُنَاكَ، وَإِنْ فَرَشْتُ فِي الْهَاوِيَةِ فَهَا أَنْتَ.","9":"إِنْ أَخَذْتُ جَنَاحَيِ الصُّبْحِ، وَسَكَنْتُ فِي أَقَاصِي الْبَحْرِ،","10":"فَهُنَاكَ أَيْضًا تَهْدِينِي يَدُكَ وَتُمْسِكُنِي يَمِينُكَ.","13":"لأَنَّكَ أَنْتَ اقْتَنَيْتَ كُلْيَتَيَّ. نَسَجْتَنِي فِي بَطْنِ أُمِّي.","14":"أَحْمَدُكَ مِنْ أَجْلِ أَنِّي قَدِ امْتَزْتُ عَجَبًا. عَجِيبَةٌ هِيَ أَعْمَالُكَ، وَنَفْسِي تَعْرِفُ ذلِكَ يَقِينًا.","16":"رَأَتْ عَيْنَاكَ أَعْضَائِي، وَفِي سِفْرِكَ كُلُّهَا كُتِبَتْ يَوْمَ تَصَوَّرَتْ، إِذْ لَمْ يَكُنْ وَاحِدٌ مِنْهَا.","15":"لَمْ تَخْتَفِ عَنْكَ عِظَامِي حِينَمَا صُنِعْتُ فِي الْخَفَاءِ، وَرُقِمْتُ فِي أَعْمَاقِ الأَرْضِ."},"18.25":{"16":"اِلْتَفِتْ إِلَيَّ وَارْحَمْنِي، لأَنِّي وَحْدٌ وَمِسْكِينٌ أَنَا.","4":"طُرُقَكَ يَا رَبُّ عَرِّفْنِي. سُبُلَكَ عَلِّمْنِي.","5":"دَرِّبْنِي فِي حَقِّكَ وَعَلِّمْنِي، لأَنَّكَ أَنْتَ إِلهُ خَلاَصِي. إِيَّاكَ انْتَظَرْتُ الْيَوْمَ كُلَّهُ.","2":"يَا إِلهِي عَلَيْكَ تَوَكَّلْتُ، فَلاَ تَدَعْنِي أَخْزَى. لاَ تَشْمَتْ بِي أَعْدَائِي.","3":"أَيْضًا كُلُّ مُنْتَظِرِيكَ لاَ يَخْزَوْا. لِيَخْزَ الْغَادِرُونَ بِلاَ سَبَبٍ."},"18.145":{"18":"الرَّبُّ قَرِيبٌ لِكُلِّ الَّذِينَ يَدْعُونَهُ، الَّذِينَ يَدْعُونَهُ بِالْحَقِّ.","14":"اَلرَّبُّ عَاضِدٌ كُلَّ السَّاقِطِينَ، وَمُقَوِّمٌ كُلَّ الْمُنْحَنِينَ.","15":"أَعْيُنُ الْكُلِّ إِيَّاكَ تَتَرَجَّى، وَأَنْتَ تُعْطِيهِمْ طَعَامَهُمْ فِي حِينِهِ.","16":"تَفْتَحُ يَدَكَ فَتُشْبعُ كُلَّ حَيٍّ رِضًى."},"0.28":{"15":"وَهَا أَنَا مَعَكَ، وَأَحْفَظُكَ حَيْثُمَا تَذْهَبُ، وَأَرُدُّكَ إِلَى هذِهِ الأَرْضِ، لأَنِّي لاَ أَتْرُكُكَ حَتَّى أَفْعَلَ مَا كَلَّمْتُكَ بِهِ».","10":"فَخَرَجَ يَعْقُوبُ مِنْ بِئْرِ سَبْعٍ وَذَهَبَ نَحْوَ حَارَانَ.","11":"وَصَادَفَ مَكَانًا وَبَاتَ هُنَاكَ لأَنَّ الشَّمْسَ كَانَتْ قَدْ غَابَتْ، وَأَخَذَ مِنْ حِجَارَةِ الْمَكَانِ وَوَضَعَهُ تَحْتَ رَأْسِهِ، فَاضْطَجَعَ فِي ذلِكَ الْمَكَانِ.","12":"وَرَأَى حُلْمًا، وَإِذَا سُلَّمٌ مَنْصُوبَةٌ عَلَى الأَرْضِ وَرَأْسُهَا يَمَسُّ السَّمَاءَ، وَهُوَذَا مَلاَئِكَةُ اللهِ صَاعِدَةٌ وَنَازِلَةٌ عَلَيْهَا.","13":"وَهُوَذَا الرَّبُّ وَاقِفٌ عَلَيْهَا، فَقَالَ: «أَنَا الرَّبُّ إِلهُ إِبْرَاهِيمَ أَبِيكَ وَإِلهُ إِسْحَاقَ. الأَرْضُ الَّتِي أَنْتَ مُضْطَجِعٌ عَلَيْهَا أُعْطِيهَا لَكَ وَلِنَسْلِكَ.","14":"وَيَكُونُ نَسْلُكَ كَتُرَابِ الأَرْضِ، وَتَمْتَدُّ غَرْبًا وَشَرْقًا وَشَمَالاً وَجَنُوبًا، وَيَتَبَارَكُ فِيكَ وَفِي نَسْلِكَ جَمِيعُ قَبَائِلِ الأَرْضِ.","16":"فَاسْتَيْقَظَ يَعْقُوبُ مِنْ نَوْمِهِ وَقَالَ: «حَقًّا إِنَّ الرَّبَّ فِي هذَا الْمَكَانِ وَأَنَا لَمْ أَعْلَمْ!».","17":"وَخَافَ وَقَالَ: «مَا أَرْهَبَ هذَا الْمَكَانَ! مَا هذَا إِلاَّ بَيْتُ اللهِ، وَهذَا بَابُ السَّمَاءِ».","18":"وَبَكَّرَ يَعْقُوبُ فِي الصَّبَاحِ وَأَخَذَ الْحَجَرَ الَّذِي وَضَعَهُ تَحْتَ رَأْسِهِ وَأَقَامَهُ عَمُودًا، وَصَبَّ زَيْتًا عَلَى رَأْسِهِ.","19":"وَدَعَا اسْمَ ذلِكَ الْمَكَانِ «بَيْتَ إِيلَ»، وَلكِنِ اسْمُ الْمَدِينَةِ أَوَّلاً كَانَ لُوزَ.","20":"وَنَذَرَ يَعْقُوبُ نَذْرًا قَائِلاً: «إِنْ كَانَ اللهُ مَعِي، وَحَفِظَنِي فِي هذَا الطَّرِيقِ الَّذِي أَنَا سَائِرٌ فِيهِ، وَأَعْطَانِي خُبْزًا لآكُلَ وَثِيَابًا لأَلْبَسَ،","21":"وَرَجَعْتُ بِسَلاَمٍ إِلَى بَيْتِ أَبِي، يَكُونُ الرَّبُّ لِي إِلهًا،","22":"وَهذَا الْحَجَرُ الَّذِي أَقَمْتُهُ عَمُودًا يَكُونُ بَيْتَ اللهِ، وَكُلُّ مَا تُعْطِينِي فَإِنِّي أُعَشِّرُهُ لَكَ»."},"18.73":{"23":"وَلكِنِّي دَائِمًا مَعَكَ. أَمْسَكْتَ بِيَدِي الْيُمْنَى.","26":"قَدْ فَنِيَ لَحْمِي وَقَلْبِي. صَخْرَةُ قَلْبِي وَنَصِيبِي اللهُ إِلَى الدَّهْرِ.","24":"بِرَأْيِكَ تَهْدِينِي، وَبَعْدُ إِلَى مَجْدٍ تَأْخُذُنِي.","16":"فَلَمَّا قَصَدْتُ مَعْرِفَةَ هذَا، إِذَا هُوَ تَعَبٌ فِي عَيْنَيَّ.","17":"حَتَّى دَخَلْتُ مَقَادِسَ اللهِ، وَانْتَبَهْتُ إِلَى آخِرَتِهِمْ.","25":"مَنْ لِي فِي السَّمَاءِ؟ وَمَعَكَ لاَ أُرِيدُ شَيْئًا فِي الأَرْضِ.","2":"أَمَّا أَنَا فَكَادَتْ تَزِلُّ قَدَمَايَ. لَوْلاَ قَلِيلٌ لَزَلِقَتْ خَطَوَاتِي.","3":"لأَنِّي غِرْتُ مِنَ الْمُتَكَبِّرِينَ، إِذْ رَأَيْتُ سَلاَمَةَ الأَشْرَارِ.","21":"لأَنَّهُ تَمَرْمَرَ قَلْبِي، وَانْتَخَسْتُ فِي كُلْيَتَيَّ.","22":"وَأَنَا بَلِيدٌ وَلاَ أَعْرِفُ. صِرْتُ كَبَهِيمٍ عِنْدَكَ."},"18.40":{"17":"أَمَّا أَنَا فَمِسْكِينٌ وَبَائِسٌ. الرَّبُّ يَهْتَمُّ بِي. عَوْنِي وَمُنْقِذِي أَنْتَ. يَا إِلهِي لاَ تُبْطِئْ.","1":"اِنْتِظَارًا انْتَظَرْتُ الرَّبَّ، فَمَالَ إِلَيَّ وَسَمِعَ صُرَاخِي،","2":"وَأَصْعَدَنِي مِنْ جُبِّ الْهَلاَكِ، مِنْ طِينِ الْحَمْأَةِ، وَأَقَامَ عَلَى صَخْرَةٍ رِجْلَيَّ. ثَبَّتَ خُطُوَاتِي،","3":"وَجَعَلَ فِي فَمِي تَرْنِيمَةً جَدِيدَةً، تَسْبِيحَةً لإِلهِنَا. كَثِيرُونَ يَرَوْنَ وَيَخَافُونَ وَيَتَوَكَّلُونَ عَلَى الرَّبِّ."},"0.16":{"7":"فَوَجَدَهَا مَلاَكُ الرَّبِّ عَلَى عَيْنِ الْمَاءِ فِي الْبَرِّيَّةِ، عَلَى الْعَيْنِ الَّتِي فِي طَرِيقِ شُورَ.","8":"وَقَالَ: «يَا هَاجَرُ جَارِيَةَ سَارَايَ، مِنْ أَيْنَ أَتَيْتِ؟ وَإِلَى أَيْنَ تَذْهَبِينَ؟». فَقَالَتْ: «أَنَا هَارِبَةٌ مِنْ وَجْهِ مَوْلاَتِي سَارَايَ».","9":"فَقَالَ لَهَا مَلاَكُ الرَّبِّ: «ارْجِعِي إِلَى مَوْلاَتِكِ وَاخْضَعِي تَحْتَ يَدَيْهَا».","10":"وَقَالَ لَهَا مَلاَكُ الرَّبِّ: «تَكْثِيرًا أُكَثِّرُ نَسْلَكِ فَلاَ يُعَدُّ مِنَ الْكَثْرَةِ».","11":"وَقَالَ لَهَا مَلاَكُ الرَّبِّ: «هَا أَنْتِ حُبْلَى، فَتَلِدِينَ ابْنًا وَتَدْعِينَ اسْمَهُ إِسْمَاعِيلَ، لأَنَّ الرَّبَّ قَدْ سَمِعَ لِمَذَلَّتِكِ.","12":"وَإِنَّهُ يَكُونُ إِنْسَانًا وَحْشِيًّا، يَدُهُ عَلَى كُلِّ وَاحِدٍ، وَيَدُ كُلِّ وَاحِدٍ عَلَيْهِ، وَأَمَامَ جَمِيعِ إِخْوَتِهِ يَسْكُنُ».","13":"فَدَعَتِ اسْمَ الرَّبِّ الَّذِي تَكَلَّمَ مَعَهَا: «أَنْتَ إِيلُ رُئِي». لأَنَّهَا قَالَتْ: «أَههُنَا أَيْضًا رَأَيْتُ بَعْدَ رُؤْيَةٍ؟»","14":"لِذلِكَ دُعِيَتِ الْبِئْرُ «بِئْرَ لَحَيْ رُئِي». هَا هِيَ بَيْنَ قَادِشَ وَبَارَدَ."},"0.39":{"20":"فَأَخَذَ يُوسُفَ سَيِّدُهُ وَوَضَعَهُ فِي بَيْتِ السِّجْنِ، الْمَكَانِ الَّذِي كَانَ أَسْرَى الْمَلِكِ مَحْبُوسِينَ فِيهِ. وَكَانَ هُنَاكَ فِي بَيْتِ السِّجْنِ.","21":"وَلكِنَّ الرَّبَّ كَانَ مَعَ يُوسُفَ، وَبَسَطَ إِلَيْهِ لُطْفًا، وَجَعَلَ نِعْمَةً لَهُ فِي عَيْنَيْ رَئِيسِ بَيْتِ السِّجْنِ.","22":"فَدَفَعَ رَئِيسُ بَيْتِ السِّجْنِ إِلَى
