<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>كلمة تعزية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: a single calm column. Feeling chips on top, the chosen feeling's verses set large as plain text, then one gospel scene and a short reflection. */
:root {
  --bg: #EDF0F3;
  --surface: #F8FAFB;
  --ink: #1B2733;
  --muted: #566574;
  --line: #CDD5DC;
  --accent: #2A6B70;
  --accent-ink: #FFFFFF;
  --soft: #DDE8EA;
  --font-verse: "Amiri", "Noto Naskh Arabic", "Traditional Arabic", serif;
  --font-ui: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111920; --surface: #18222B; --ink: #E4EAEF; --muted: #9AA9B6;
    --line: #2B3946; --accent: #7DB9B6; --accent-ink: #0E1A1F; --soft: #1E2D33;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111920; --surface: #18222B; --ink: #E4EAEF; --muted: #9AA9B6;
  --line: #2B3946; --accent: #7DB9B6; --accent-ink: #0E1A1F; --soft: #1E2D33;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.7;
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3, p, blockquote { margin: 0; }

.head { display: flex; flex-direction: column; gap: 8px; }
.head h1 { font-family: var(--font-verse); font-size: 2.6rem; font-weight: 700; line-height: 1.2; color: var(--accent); }
.head p { color: var(--muted); font-size: 1rem; max-width: 34em; }

.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.chip {
  font: inherit; font-size: 0.95rem; font-weight: 500;
  color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 9px 10px; cursor: pointer; min-width: 0;
  transition: background-color .15s, border-color .15s, color .15s;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip:focus-visible, .copy:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.result { display: flex; flex-direction: column; gap: 26px; scroll-margin-top: 16px; }
.result.in { animation: rise .35s ease-out; }
@keyframes rise { from { opacity: .35; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .result.in { animation: none; } }


.verses { display: flex; flex-direction: column; }
.verse { padding-block: 20px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.verse:last-child { border-bottom: 1px solid var(--line); }
.verse blockquote { font-family: var(--font-verse); font-size: 1.45rem; line-height: 1.95; }
.verse .meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ref { color: var(--accent); font-weight: 600; font-size: 0.9rem; letter-spacing: .02em; }
.copy {
  font: inherit; font-size: 0.85rem; color: var(--muted); background: none;
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; cursor: pointer;
}
.copy:hover { color: var(--ink); border-color: var(--muted); }

.scene { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.label { font-size: 0.8rem; color: var(--muted); font-weight: 600; letter-spacing: .06em; }
.scene h2 { font-family: var(--font-verse); font-size: 1.45rem; line-height: 1.4; }
.scene p { max-width: 36em; }
.scene .ref { align-self: flex-start; }

.reflect { background: var(--soft); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; }

.again {
  font: inherit; font-weight: 600; font-size: 1rem; align-self: stretch;
  color: var(--accent-ink); background: var(--accent);
  border: 0; border-radius: 999px; padding: 12px 20px; cursor: pointer;
}
.again:hover { filter: brightness(1.08); }
.again:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.foot { color: var(--muted); font-size: 0.85rem; display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
</style>

<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<main dir="rtl" lang="ar">
  <header class="head">
    <h1>كلمة تعزية</h1>
    <p>اختار الإحساس اللي جواك دلوقتي، وهتلاقي آيات وموقف من الإنجيل يناسبه.</p>
  </header>

  <nav class="chips" id="chips" aria-label="اختار إحساسك"></nav>

  <section class="result" id="result" aria-live="polite"></section>

  <footer class="foot">
    <p>لو حاسس إنك في خطر أو بتفكر تأذي نفسك، كلم حد قريب منك دلوقتي، أو اتصل بالإسعاف أو بخط الدعم النفسي في بلدك.</p>
  </footer>
</main>

      { t: "طُوبَى لِلَّذِي غُفِرَ إِثْمُهُ وَسُتِرَتْ خَطِيَّتُهُ.", r: "مزمور ٣٢: ١" },
      { t: "قَلْبًا نَقِيًّا اخْلُقْ فِيَّ يَا اَللهُ، وَرُوحًا مُسْتَقِيمًا جَدِّدْ فِي دَاخِلِي.", r: "مزمور ٥١: ١٠" }
    ],

    reflects: ["الندم الصادق بيفتح باب. جلد النفس المستمر بيقفله.", "لو ضايقت حد، فكّر في خطوة اعتذار صغيرة."]
  },

      { t: "لاَ تَضْطَرِبْ قُلُوبُكُمْ. أَنْتُمْ تُؤْمِنُونَ بِاللهِ فَآمِنُوا بِي. فِي بَيْتِ أَبِي مَنَازِلُ كَثِيرَةٌ.", r: "يوحنا ١٤: ١–٢" },
      { t: "عَزِيزٌ فِي عَيْنَيِ الرَّبِّ مَوْتُ أَتْقِيَائِهِ.", r: "مزمور ١١٦: ١٥" },
      { t: "ثُمَّ لاَ أُرِيدُ أَنْ تَجْهَلُوا مِنْ جِهَةِ الرَّاقِدِينَ، لِكَيْ لاَ تَحْزَنُوا كَالْبَاقِينَ الَّذِينَ لاَ رَجَاءَ لَهُمْ.", r: "١ تسالونيكي ٤: ١٣" }
    ],

    reflects: ["اذكر اسمه واحكي عنه. الذكريات مش بتزوّد الوجع بس.", "الحزن بييجي موجات، ومش دايمًا بنفس الحجم."]

      { t: "الرَّبُّ قُوَّتِي وَتُرْسِي. عَلَيْهِ اتَّكَلَ قَلْبِي فَانْتَصَرْتُ.", r: "مزمور ٢٨: ٧" },
      { t: "يُعْطِي الْمُعْيِيَ قُدْرَةً، وَلِعَدِيمِ الْقُوَّةِ يُكَثِّرُ شِدَّةً.", r: "إشعياء ٤٠: ٢٩" }

    reflects: ["قول لحد إنك محتاج مساعدة. ده شجاعة.", "خطوة صغيرة النهارده أحسن من خطة كبيرة مش هتبدأها."]
  }
};

FEELINGS.forEach(f => {
  const m = MORE[f.id];
  f.events = [f.event].concat(m.events);
  f.reflects = [f.reflect].concat(m.reflects);
  f.verses = f.verses.concat(m.verses);
});

function choose(n, total, avoid) {
  const idx = Array.from({ length: total }, (_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  const fresh = idx.filter(i => avoid.indexOf(i) === -1);
  const stale = idx.filter(i => avoid.indexOf(i) !== -1);
  return fresh.concat(stale).slice(0, n);
}

const chips = document.getElementById("chips");
const result = document.getElementById("result");
let current = null;
let shown = [];
const last = {};

FEELINGS.forEach(f => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "chip";
  b.id = "chip-" + f.id;
  b.textContent = f.label;
  b.setAttribute("aria-pressed", "false");
  b.addEventListener("click", () => { pick(f.id, true); });
  chips.appendChild(b);
});

function pick(id, fromClick) {
  const f = FEELINGS.find(x => x.id === id) || FEELINGS[0];
  if (current === f.id && !fromClick) return;
  current = f.id;
  try { history.replaceState(null, "", "#" + f.id); } catch (e) { try { location.hash = f.id; } catch (e2) {} }
  FEELINGS.forEach(x => {
    document.getElementById("chip-" + x.id).setAttribute("aria-pressed", String(x.id === f.id));
  });
  render(f);
  if (fromClick) {
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    try { result.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" }); } catch (e) {}
  }
}

function render(f) {
  const L = last[f.id] || (last[f.id] = { v: [], e: -1, r: -1 });
  const vi = choose(3, f.verses.length, L.v);
  const ei = choose(1, f.events.length, [L.e])[0];
  const ri = choose(1, f.reflects.length, [L.r])[0];
  L.v = vi; L.e = ei; L.r = ri;
  shown = vi.map(i => f.verses[i]);
  const ev = f.events[ei];
  const verses = shown.map((v, i) =>
    '<div class="verse">' +
      '<blockquote id="v-' + i + '">' + v.t + '</blockquote>' +
      '<div class="meta"><span class="ref">' + v.r + '</span>' +
      '<button type="button" class="copy" data-i="' + i + '">نسخ</button></div>' +
    '</div>'
  ).join("");
  result.innerHTML =
    '<div class="verses">' + verses + '</div>' +
    '<article class="scene"><span class="label">موقف من الإنجيل</span>' +
      '<h2>' + ev.title + '</h2><p>' + ev.text + '</p>' +
      '<span class="ref">' + ev.r + '</span></article>' +
    '<div class="reflect"><span class="label">تأمل</span><p>' + f.reflects[ri] + '</p></div>' +
    '<button type="button" class="again" id="again">آيات تانية لنفس الإحساس</button>';
  result.classList.remove("in");
  void result.offsetWidth;
  result.classList.add("in");
}

result.addEventListener("click", e => {
  if (e.target.closest(".again")) { pick(current, true); return; }
  const btn = e.target.closest(".copy");
  if (!btn) return;
  const v = shown[Number(btn.dataset.i)];
  const text = v.t + " (" + v.r + ")";
  const done = () => { btn.textContent = "اتنسخ"; setTimeout(() => { btn.textContent = "نسخ"; }, 1500); };
  const fallback = () => {
    try {
      const r = document.createRange();
      r.selectNodeContents(document.getElementById("v-" + btn.dataset.i));
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      btn.textContent = "حدّد النص وانسخه";
    } catch (err) {}
  };
  try {
    navigator.clipboard.writeText(text).then(done, fallback);
  } catch (err) { fallback(); }
});

function fromHash() {
  let h = "";
  try { h = decodeURIComponent(location.hash.replace("#", "")); } catch (e) {}
  return FEELINGS.some(x => x.id === h) ? h : "sad";
}
window.addEventListener("hashchange", () => pick(fromHash(), false));
pick(fromHash(), false);
</script>
