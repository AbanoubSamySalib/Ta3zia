لَهُمْ مُوسَى: «هُوَ الْخُبْزُ الَّذِي أَعْطَاكُمُ الرَّبُّ لِتَأْكُلُوا."},"42.2":{"1":"وَفِي الْيَوْمِ الثَّالِثِ كَانَ عُرْسٌ فِي قَانَا الْجَلِيلِ، وَكَانَتْ أُمُّ يَسُوعَ هُنَاكَ.","2":"وَدُعِيَ أَيْضًا يَسُوعُ وَتَلاَمِيذُهُ إِلَى الْعُرْسِ.","3":"وَلَمَّا فَرَغَتِ الْخَمْرُ، قَالَتْ أُمُّ يَسُوعَ لَهُ:«لَيْسَ لَهُمْ خَمْرٌ».","4":"قَالَ لَهَا يَسُوعُ:«مَا لِي وَلَكِ يَا امْرَأَةُ؟ لَمْ تَأْتِ سَاعَتِي بَعْدُ».","5":"قَالَتْ أُمُّهُ لِلْخُدَّامِ:«مَهْمَا قَالَ لَكُمْ فَافْعَلُوهُ».","6":"وَكَانَتْ سِتَّةُ أَجْرَانٍ مِنْ حِجَارَةٍ مَوْضُوعَةً هُنَاكَ، حَسَبَ تَطْهِيرِ الْيَهُودِ، يَسَعُ كُلُّ وَاحِدٍ مِطْرَيْنِ أَوْ ثَلاَثَةً.","7":"قَالَ لَهُمْ يَسُوعُ:«امْلأُوا الأَجْرَانَ مَاءً». فَمَلأُوهَا إِلَى فَوْقُ.","8":"ثُمَّ قَالَ لَهُمُ:«اسْتَقُوا الآنَ وَقَدِّمُوا إِلَى رَئِيسِ الْمُتَّكَإِ». فَقَدَّمُوا.","9":"فَلَمَّا ذَاقَ رَئِيسُ الْمُتَّكَإِ الْمَاءَ الْمُتَحَوِّلَ خَمْرًا، وَلَمْ يَكُنْ يَعْلَمُ مِنْ أَيْنَ هِيَ، لكِنَّ الْخُدَّامَ الَّذِينَ كَانُوا قَدِ اسْتَقَوُا الْمَاءَ عَلِمُوا، دَعَا رَئِيسُ الْمُتَّكَإِ الْعَرِيسَ","10":"وَقَالَ لَهُ:«كُلُّ إِنْسَانٍ إِنَّمَا يَضَعُ الْخَمْرَ الْجَيِّدَةَ أَوَّلاً، وَمَتَى سَكِرُوا فَحِينَئِذٍ الدُّونَ. أَمَّا أَنْتَ فَقَدْ أَبْقَيْتَ الْخَمْرَ الْجَيِّدَةَ إِلَى الآنَ!».","11":"هذِهِ بِدَايَةُ الآيَاتِ فَعَلَهَا يَسُوعُ فِي قَانَا الْجَلِيلِ، وَأَظْهَرَ مَجْدَهُ، فَآمَنَ بِهِ تَلاَمِيذُهُ."},"48.2":{"10":"لأَنَّنَا نَحْنُ عَمَلُهُ، مَخْلُوقِينَ فِي الْمَسِيحِ يَسُوعَ لأَعْمَال صَالِحَةٍ، قَدْ سَبَقَ اللهُ فَأَعَدَّهَا لِكَيْ نَسْلُكَ فِيهَا.","14":"لأَنَّهُ هُوَ سَلاَمُنَا، الَّذِي جَعَلَ الاثْنَيْنِ وَاحِدًا، وَنَقَضَ حَائِطَ السِّيَاجِ الْمُتَوَسِّطَ"},"16.4":{"14":"لأَنَّكِ إِنْ سَكَتِّ سُكُوتًا فِي هذَا الْوَقْتِ يَكُونُ الْفَرَجُ وَالنَّجَاةُ لِلْيَهُودِ مِنْ مَكَانٍ آخَرَ، وَأَمَّا أَنْتِ وَبَيْتُ أَبِيكِ فَتَبِيدُونَ. وَمَنْ يَعْلَمُ إِنْ كُنْتِ لِوَقْتٍ مِثْلِ هذَا وَصَلْتِ إِلَى الْمُلْكِ؟».","12":"فَأَخْبَرُوا مُرْدَخَايَ بِكَلاَمِ أَسْتِيرَ.","13":"فَقَالَ مُرْدَخَايُ أَنْ تُجَاوَبَ أَسْتِيرُ: «لاَ تَفْتَكِرِي فِي نَفْسِكِ أَنَّكِ تَنْجِينَ فِي بَيْتِ الْمَلِكِ دُونَ جَمِيعِ الْيَهُودِ.","15":"فَقَالَتْ أَسْتِيرُ أَنْ يُجَاوَبَ مُرْدَخَايُ:","16":"«اذْهَبِ اجْمَعْ جَمِيعَ الْيَهُودِ الْمَوْجُودِينَ فِي شُوشَنَ وَصُومُوا مِنْ جِهَتِي وَلاَ تَأْكُلُوا وَلاَ تَشْرَبُوا ثَلاَثَةَ أَيَّامٍ لَيْلاً وَنَهَارًا. وَأَنَا أَيْضًا وَجَوَارِيَّ نَصُومُ كَذلِكَ. وَهكَذَا أَدْخُلُ إِلَى الْمَلِكِ خِلاَفَ السُّنَّةِ. فَإِذَا هَلَكْتُ، هَلَكْتُ».","17":"فَانْصَرَفَ مُرْدَخَايُ وَعَمِلَ حَسَبَ كُلِّ مَا أَوْصَتْهُ بِهِ أَسْتِيرُ."},"22.6":{"1":"فِي سَنَةِ وَفَاةِ عُزِّيَّا الْمَلِكِ، رَأَيْتُ السَّيِّدَ جَالِسًا عَلَى كُرْسِيٍّ عَال وَمُرْتَفِعٍ، وَأَذْيَالُهُ تَمْلأُ الْهَيْكَلَ.","2":"السَّرَافِيمُ وَاقِفُونَ فَوْقَهُ، لِكُلِّ وَاحِدٍ سِتَّةُ أَجْنِحَةٍ، بِاثْنَيْنِ يُغَطِّي وَجْهَهُ، وَبِاثْنَيْنِ يُغَطِّي رِجْلَيْهِ، وَبَاثْنَيْنِ يَطِيرُ.","3":"وَهذَا نَادَى ذَاكَ وَقَالَ: «قُدُّوسٌ، قُدُّوسٌ، قُدُّوسٌ رَبُّ الْجُنُودِ. مَجْدُهُ مِلْءُ كُلِّ الأَرْضِ».","4":"فَاهْتَزَّتْ أَسَاسَاتُ الْعَتَبِ مِنْ صَوْتِ الصَّارِخِ، وَامْتَلأَ الْبَيْتُ دُخَانًا.","5":"فَقُلْتُ: «وَيْلٌ لِي! إِنِّي هَلَكْتُ، لأَنِّي إِنْسَانٌ نَجِسُ الشَّفَتَيْنِ، وَأَنَا سَاكِنٌ بَيْنَ شَعْبٍ نَجِسِ الشَّفَتَيْنِ، لأَنَّ عَيْنَيَّ قَدْ رَأَتَا الْمَلِكَ رَبَّ الْجُنُودِ».","6":"فَطَارَ إِلَيَّ وَاحِدٌ مِنَ السَّرَافِيمِ وَبِيَدِهِ جَمْرَةٌ قَدْ أَخَذَهَا بِمِلْقَطٍ مِنْ عَلَى الْمَذْبَحِ،","7":"وَمَسَّ بِهَا فَمِي وَقَالَ: «إِنَّ هذِهِ قَدْ مَسَّتْ شَفَتَيْكَ، فَانْتُزِعَ إِثْمُكَ، وَكُفِّرَ عَنْ خَطِيَّتِكَ».","8":"ثُمَّ سَمِعْتُ صَوْتَ السَّيِّدِ قَائِلاً: «مَنْ أُرْسِلُ؟ وَمَنْ يَذْهَبُ مِنْ أَجْلِنَا؟» فَقُلْتُ: «هأَنَذَا أَرْسِلْنِي»."},"44.14":{"8":"لأَنَّنَا إِنْ عِشْنَا فَلِلرَّبِّ نَعِيشُ، وَإِنْ مُتْنَا فَلِلرَّبِّ نَمُوتُ. فَإِنْ عِشْنَا وَإِنْ مُتْنَا فَلِلرَّبِّ نَحْنُ.","17":"لأَنْ لَيْسَ مَلَكُوتُ اللهِ أَكْلاً وَشُرْبًا، بَلْ هُوَ بِرٌّ وَسَلاَمٌ وَفَرَحٌ فِي الرُّوحِ الْقُدُسِ."},"65.1":{"17":"فَلَمَّا رَأَيْتُهُ سَقَطْتُ عِنْدَ رِجْلَيْهِ كَمَيِّتٍ، فَوَضَعَ يَدَهُ الْيُمْنَى عَلَيَّ قَائِلاً لِي:«لاَ تَخَفْ، أَنَا هُوَ الأَوَّلُ وَالآخِرُ،","18":"وَالْحَيُّ. وَكُنْتُ مَيْتًا، وَهَا أَنَا حَيٌّ إِلَى أَبَدِ الآبِدِينَ! آمِينَ. وَلِي مَفَاتِيحُ الْهَاوِيَةِ وَالْمَوْتِ."},"18.49":{"15":"إِنَّمَا اللهُ يَفْدِي نَفْسِي مِنْ يَدِ الْهَاوِيَةِ لأَنَّهُ يَأْخُذُنِي. سِلاَهْ."},"52.3":{"3":"أَمِينٌ هُوَ الرَّبُّ الَّذِي سَيُثَبِّتُكُمْ وَيَحْفَظُكُمْ مِنَ الشِّرِّيرِ.","16":"وَرَبُّ السَّلاَمِ نَفْسُهُ يُعْطِيكُمُ السَّلاَمَ دَائِمًا مِنْ كُلِّ وَجْهٍ. الرَّبُّ مَعَ جَمِيعِكُمْ."},"18.125":{"2":"أُورُشَلِيمُ الْجِبَالُ حَوْلَهَا، وَالرَّبُّ حَوْلَ شَعْبِهِ مِنَ الآنَ وَإِلَى الدَّهْرِ."},"18.5":{"11":"وَيَفْرَحُ جَمِيعُ الْمُتَّكِلِينَ عَلَيْكَ. إِلَى الأَبَدِ يَهْتِفُونَ، وَتُظَلِّلُهُمْ. وَيَبْتَهِجُ بِكَ مُحِبُّو اسْمِكَ.","12":"لأَنَّكَ أَنْتَ تُبَارِكُ الصِّدِّيقَ يَا رَبُّ. كَأَنَّهُ بِتُرْسٍ تُحِيطُهُ بِالرِّضَا."},"18.17":{"8":"احْفَظْنِي مِثْلَ حَدَقَةِ الْعَيْنِ. بِظِلِّ جَنَاحَيْكَ اسْتُرْنِي"},"33.1":{"7":"صَالِحٌ هُوَ الرَّبُّ. حِصْنٌ فِي يَوْمِ الضَّيقِ، وَهُوَ يَعْرِفُ الْمُتَوَكِّلِينَ عَلَيْهِ."},"43.12":{"1":"وَفِي ذلِكَ الْوَقْتِ مَدَّ هِيرُودُسُ الْمَلِكُ يَدَيْهِ لِيُسِيئَ إِلَى أُنَاسٍ مِنَ الْكَنِيسَةِ،","2":"فَقَتَلَ يَعْقُوبَ أَخَا يُوحَنَّا بِالسَّيْفِ.","3":"وَإِذْ رَأَى أَنَّ ذلِكَ يُرْضِي الْيَهُودَ، عَادَ فَقَبَضَ عَلَى بُطْرُسَ أَيْضًا. وَكَانَتْ أَيَّامُ الْفَطِيرِ.","4":"وَلَمَّا أَمْسَكَهُ وَضَعَهُ فِي السِّجْنِ، مُسَلِّمًا إِيَّاهُ إِلَى أَرْبَعَةِ أَرَابعَ مِنَ الْعَسْكَرِ لِيَحْرُسُوهُ، نَاوِيًا أَنْ يُقَدِّمَهُ بَعْدَ الْفِصْحِ إِلَى الشَّعْبِ.","5":"فَكَانَ بُطْرُسُ مَحْرُوسًا فِي السِّجْنِ، وَأَمَّا الْكَنِيسَةُ فَكَانَتْ تَصِيرُ مِنْهَا صَلاَةٌ بِلَجَاجَةٍ إِلَى اللهِ مِنْ أَجْلِهِ.","6":"وَلَمَّا كَانَ هِيرُودُسُ مُزْمِعًا أَنْ يُقَدِّمَهُ، كَانَ بُطْرُسُ فِي تِلْكَ اللَّيْلَةِ نَائِمًا بَيْنَ عَسْكَرِيَّيْنِ مَرْبُوطًا بِسِلْسِلَتَيْنِ، وَكَانَ قُدَّامَ الْبَابِ حُرَّاسٌ يَحْرُسُونَ السِّجْنَ.","7":"وَإِذَا مَلاَكُ الرَّبِّ أَقْبَلَ، وَنُورٌ أَضَاءَ فِي الْبَيْتِ، فَضَرَبَ جَنْبَ بُطْرُسَ وَأَيْقَظَهُ قَائِلاً: «قُمْ عَاجِلاً!». فَسَقَطَتِ السِّلْسِلَتَانِ مِنْ يَدَيْهِ.","8":"وَقَالَ لَهُ الْمَلاَكُ:«تَمَنْطَقْ وَالْبَسْ نَعْلَيْكَ». فَفَعَلَ هكَذَا. فَقَالَ لَهُ:«الْبَسْ رِدَاءَكَ وَاتْبَعْنِي».","9":"فَخَرَجَ يَتْبَعُهُ. وَكَانَ لاَ يَعْلَمُ أَنَّ الَّذِي جَرَى بِوَاسِطَةِ الْمَلاَكِ هُوَ حَقِيقِيٌّ، بَلْ يَظُنُّ أَنَّهُ يَنْظُرُ رُؤْيَا.","10":"فَجَازَا الْمَحْرَسَ الأَوَّلَ وَالثَّانِيَ، وَأَتَيَا إِلَى بَابِ الْحَدِيدِ الَّذِي يُؤَدِّي إِلَى الْمَدِينَةِ، فَانْفَتَحَ لَهُمَا مِنْ ذَاتِهِ، فَخَرَجَا وَتَقَدَّمَا زُقَاقًا وَاحِدًا، وَلِلْوَقْتِ فَارَقَهُ الْمَلاَكُ.","11":"فَقَالَ بُطْرُسُ، وَهُوَ قَدْ رَجَعَ إِلَى نَفْسِهِ:«الآنَ عَلِمْتُ يَقِينًا أَنَّ الرَّبَّ أَرْسَلَ مَلاَكَهُ وَأَنْقَذَنِي مِنْ يَدِ هِيرُودُسَ، وَمِنْ كُلِّ انْتِظَارِ شَعْبِ الْيَهُودِ»."},"41.4":{"28":"فَامْتَلأَ غَضَبًا جَمِيعُ الَّذِينَ فِي الْمَجْمَعِ حِينَ سَمِعُوا هذَا،","29":"فَقَامُوا وَأَخْرَجُوهُ خَارِجَ الْمَدِينَةِ، وَجَاءُوا بِهِ إِلَى حَافَّةَِ الْجَبَلِ الَّذِي كَانَتْ مَدِينَتُهُمْ مَبْنِيَّةً عَلَيْهِ حَتَّى يَطْرَحُوهُ إِلَى أَسْفَلٍ.","30":"أَمَّا هُوَ فَجَازَ فِي وَسْطِهِمْ وَمَضَى."},"28.2":{"26":"فَتَأْكُلُونَ أَكْلاً وَتَشْبَعُونَ وَتُسَبِّحُونَ اسْمَ الرَّبِّ إِلهِكُمُ الَّذِي صَنَعَ مَعَكُمْ عَجَبًا، وَلاَ يَخْزَى شَعْبِي إِلَى الأَبَدِ.","27":"وَتَعْلَمُونَ أَنِّي أَنَا فِي وَسْطِ إِسْرَائِيلَ، وَأَنِّي أَنَا الرَّبُّ إِلهُكُمْ وَلَيْسَ غَيْرِي. وَلاَ يَخْزَى شَعْبِي إِلَى الأَبَدِ.","12":"« وَلكِنِ الآنَ، يَقُولُ الرَّبُّ، ارْجِعُوا إِلَيَّ بِكُلِّ قُلُوبِكُمْ، وَبِالصَّوْمِ وَالْبُكَاءِ وَالنَّوْحِ.","13":"وَمَزِّقُوا قُلُوبَكُمْ لاَ ثِيَابَكُمْ». وَارْجِعُوا إِلَى الرَّبِّ إِلهِكُمْ لأَنَّهُ رَؤُوفٌ رَحِيمٌ، بَطِيءُ الْغَضَبِ وَكَثِيرُ الرَّأْفَةِ وَيَنْدَمُ عَلَى الشَّرِّ.","25":"«وَأُعَوِّضُ لَكُمْ عَنِ السِّنِينَ الَّتِي أَكَلَهَا الْجَرَادُ، الْغَوْغَاءُ وَالطَّيَّارُ وَالْقَمَصُ، جَيْشِي الْعَظِيمُ الَّذِي أَرْسَلْتُهُ عَلَيْكُمْ.","28":"« وَيَكُونُ بَعْدَ ذلِكَ أَنِّي أَسْكُبُ رُوحِي عَلَى كُلِّ بَشَرٍ، فَيَتَنَبَّأُ بَنُوكُمْ وَبَنَاتُكُمْ، وَيَحْلَمُ شُيُوخُكُمْ أَحْلاَمًا، وَيَرَى شَبَابُكُمْ رُؤًى."},"22.50":{"7":"وَالسَّيِّدُ الرَّبُّ يُعِينُنِي، لِذلِكَ لاَ أَخْجَلُ. لِذلِكَ جَعَلْتُ وَجْهِي كَالصَّوَّانِ وَعَرَفْتُ أَنِّي لاَ أَخْزَى.","4":"أَعْطَانِي السَّيِّدُ الرَّبُّ لِسَانَ الْمُتَعَلِّمِينَ لأَعْرِفَ أَنْ أُغِيثَ الْمُعْيِيَ بِكَلِمَةٍ. يُوقِظُ كُلَّ صَبَاحٍ لِي أُذُنًا، لأَسْمَعَ كَالْمُتَعَلِّمِينَ."},"18.22":{"4":"عَلَيْكَ اتَّكَلَ آبَاؤُنَا. اتَّكَلُوا فَنَجَّيْتَهُمْ.","5":"إِلَيْكَ صَرَخُوا فَنَجَوْا. عَلَيْكَ اتَّكَلُوا فَلَمْ يَخْزَوْا.","1":"إِلهِي، إِلهِي، لِمَاذَا تَرَكْتَنِي، بَعِيدًا عَنْ خَلاَصِي، عَنْ كَلاَمِ زَفِيرِي؟","2":"إِلهِي، فِي النَّهَارِ أَدْعُو فَلاَ تَسْتَجِيبُ، فِي اللَّيْلِ أَدْعُو فَلاَ هُدُوَّ لِي.","3":"وَأَنْتَ الْقُدُّوسُ الْجَالِسُ بَيْنَ تَسْبِيحَاتِ إِسْرَائِيلَ."},"22.45":{"17":"أَمَّا إِسْرَائِيلُ فَيَخْلُصُ بِالرَّبِّ خَلاَصًا أَبَدِيًّا. لاَ تَخْزَوْنَ وَلاَ تَخْجَلُونَ إِلَى دُهُورِ الأَبَدِ."},"18.69":{"6":"لاَ يَخْزَ بِي مُنْتَظِرُوكَ يَا سَيِّدُ رَبَّ الْجُنُودِ. لاَ يَخْجَلْ بِي مُلْتَمِسُوكَ يَا إِلهَ إِسْرَائِيلَ."},"18.8":{"3":"إِذَا أَرَى سَمَاوَاتِكَ عَمَلَ أَصَابِعِكَ، الْقَمَرَ وَالنُّجُومَ الَّتِي كَوَّنْتَهَا،","4":"فَمَنْ هُوَ الإِنْسَانُ حَتَّى تَذكُرَهُ؟ وَابْنُ آدَمَ حَتَّى تَفْتَقِدَهُ؟","5":"وَتَنْقُصَهُ قَلِيلاً عَنِ الْمَلاَئِكَةِ، وَبِمَجْدٍ وَبَهَاءٍ تُكَلِّلُهُ."},"39.10":{"29":"أَلَيْسَ عُصْفُورَانِ يُبَاعَانِ بِفَلْسٍ؟ وَوَاحِدٌ مِنْهُمَا لاَ يَسْقُطُ عَلَى الأَرْضِ بِدُونِ أَبِيكُمْ.","30":"وَأَمَّا أَنْتُمْ فَحَتَّى شُعُورُ رُؤُوسِكُمْ جَمِيعُهَا مُحْصَاةٌ.","31":"فَلاَ تَخَافُوا! أَنْتُمْ أَفْضَلُ مِنْ عَصَافِيرَ كَثِيرَةٍ!"},"0.1":{"27":"فَخَلَقَ اللهُ الإِنْسَانَ عَلَى صُورَتِهِ. عَلَى صُورَةِ اللهِ خَلَقَهُ. ذَكَرًا وَأُنْثَى خَلَقَهُمْ."},"22.62":{"3":"وَتَكُونِينَ إِكْلِيلَ جَمَال بِيَدِ الرَّبِّ، وَتَاجًا مَلِكِيًّا بِكَفِّ إِلهِكِ.","4":"لاَ يُقَالُ بَعْدُ لَكِ: «مَهْجُورَةٌ»، وَلاَ يُقَالُ بَعْدُ لأَرْضِكِ: «مُوحَشَةٌ»، بَلْ تُدْعَيْنَ: «حَفْصِيبَةَ»، وَأَرْضُكِ تُدْعَى: «بَعُولَةَ». لأَنَّ الرَّبَّ يُسَرُّ بِكِ، وَأَرْضُكِ تَصِيرُ ذَاتِ بَعْلٍ."},"46.3":{"5":"لَيْسَ أَنَّنَا كُفَاةٌ مِنْ أَنْفُسِنَا أَنْ نَفْتَكِرَ شَيْئًا كَأَنَّهُ مِنْ أَنْفُسِنَا، بَلْ كِفَايَتُنَا مِنَ اللهِ،"},"8.9":{"15":"وَالرَّبُّ كَشَفَ أُذُنَ صَمُوئِيلَ قَبْلَ مَجِيءِ شَاوُلَ بِيَوْمٍ قَائِلاً:","16":"«غَدًا فِي مِثْلِ الآنَ أُرْسِلُ إِلَيْكَ رَجُلاً مِنْ أَرْضِ بَنْيَامِينَ، فَامْسَحْهُ رَئِيسًا لِشَعْبِي إِسْرَائِيلَ، فَيُخَلِّصَ شَعْبِي مِنْ يَدِ الْفِلِسْطِينِيِّينَ، لأَنِّي نَظَرْتُ إِلَى شَعْبِي لأَنَّ صُرَاخَهُمْ قَدْ جَاءَ إِلَيَّ».","17":"فَلَمَّا رَأَى صَمُوئِيلُ شَاوُلَ أَجَابَهُ الرَّبُّ: «هُوَذَا الرَّجُلُ الَّذِي كَلَّمْتُكَ عَنْهُ. هذَا يَضْبِطُ شَعْبِي».","18":"فَتَقَدَّمَ شَاوُلُ إِلَى صَمُوئِيلَ فِي وَسَطِ الْبَابِ وَقَالَ: «أَطْلُبُ إِلَيْكَ: أَخْبِرْنِي أَيْنَ بَيْتُ الرَّائِي؟»","19":"فَأَجَابَ صَمُوئِيلُ شَاوُلَ وَقَالَ: «أَنَا الرَّائِي. اِصْعَدَا أَمَامِي إِلَى الْمُرْتَفَعَةِ فَتَأْكُلاَ مَعِيَ الْيَوْمَ، ثُمَّ أُطْلِقَكَ صَبَاحًا وَأُخْبِرَكَ بِكُلِّ مَا فِي قَلْبِكَ.","20":"وَأَمَّا الأُتُنُ الضَّالَّةُ لَكَ مُنْذُ ثَلاَثَةِ أَيَّامٍ فَلاَ تَضَعْ قَلْبَكَ عَلَيْهَا لأَنَّهَا قَدْ وُجِدَتْ. وَلِمَنْ كُلُّ شَهِيِّ إِسْرَائِيلَ؟ أَلَيْسَ لَكَ وَلِكُلِّ بَيْتِ أَبِيكَ؟»","21":"فَأَجَابَ شَاوُلُ وَقَالَ: «أَمَا أَنَا بَنْيَامِينِيٌّ مِنْ أَصْغَرِ أَسْبَاطِ إِسْرَائِيلَ، وَعَشِيرَتِي أَصْغَرُ كُلِّ عَشَائِرِ أَسْبَاطِ بَنْيَامِينَ؟ فَلِمَاذَا تُكَلِّمُنِي بِمِثْلِ هذَا الْكَلاَمِ؟»."},"19.27":{"4":"اَلْغَضَبُ قَسَاوَةٌ وَالسَّخَطُ جُرَافٌ، وَمَنْ يَقِفُ قُدَّامَ الْحَسَدِ؟"},"19.23":{"17":"لاَ يَحْسِدَنَّ قَلْبُكَ الْخَاطِئِينَ، بَلْ كُنْ فِي مَخَافَةِ الرَّبِّ الْيَوْمَ كُلَّهُ."},"45.13":{"4":"الْمَحَبَّةُ تَتَأَنَّى وَتَرْفُقُ. الْمَحَبَّةُ لاَ تَحْسِدُ. الْمَحَبَّةُ لاَ تَتَفَاخَرُ، وَلاَ تَنْتَفِخُ،","5":"وَلاَ تُقَبِّحُ، وَلاَ تَطْلُبُ مَا لِنَفْسِهَا، وَلاَ تَحْتَدُّ، وَلاَ تَظُنُّ السُّؤَ،","6":"وَلاَ تَفْرَحُ بِالإِثْمِ بَلْ تَفْرَحُ بِالْحَقِّ،","7":"وَتَحْتَمِلُ كُلَّ شَيْءٍ، وَتُصَدِّقُ كُلَّ شَيْءٍ، وَتَرْجُو كُلَّ شَيْءٍ، وَتَصْبِرُ عَلَى كُلِّ شَيْءٍ."},"39.20":{"1":"«فَإِنَّ مَلَكُوتَ السَّمَاوَاتِ يُشْبِهُ رَجُلاً رَبَّ بَيْتٍ خَرَجَ مَعَ الصُّبْحِ لِيَسْتَأْجِرَ فَعَلَةً لِكَرْمِهِ،","2":"فَاتَّفَقَ مَعَ الْفَعَلَةِ عَلَى دِينَارٍ فِي الْيَوْمِ، وَأَرْسَلَهُمْ إِلَى كَرْمِهِ.","3":"ثُمَّ خَرَجَ نَحْوَ السَّاعَةِ الثَّالِثَةِ وَرَأَى آخَرِينَ قِيَامًا فِي السُّوقِ بَطَّالِينَ،","4":"فَقَالَ لَهُمُ: اذْهَبُوا أَنْتُمْ أَيْضًا إِلَى الْكَرْمِ فَأُعْطِيَكُمْ مَا يَحِقُّ لَكُمْ. فَمَضَوْا.","5":"وَخَرَجَ أَيْضًا نَحْوَ السَّاعَةِ السَّادِسَةِ وَالتَّاسِعَةِ وَفَعَلَ كَذلِكَ.","6":"ثُمَّ نَحْوَ السَّاعَةِ الْحَادِيَةَ عَشْرَةَ خَرَجَ وَوَجَدَ آخَرِينَ قِيَامًا بَطَّالِينَ، فَقَالَ لَهُمْ: لِمَاذَا وَقَفْتُمْ ههُنَا كُلَّ النَّهَارِ بَطَّالِينَ؟","7":"قَالُوا لَهُ: لأَنَّهُ لَمْ يَسْتَأْجِرْنَا أَحَدٌ. قَالَ لَهُمُ:اذْهَبُوا أَنْتُمْ أَيْضًا إِلَى الْكَرْمِ فَتَأْخُذُوا مَا يَحِقُّ لَكُمْ.","8":"فَلَمَّا كَانَ الْمَسَاءُ قَالَ صَاحِبُ الْكَرْمِ لِوَكِيلِهِ: ادْعُ الْفَعَلَةَ وَأَعْطِهِمُ الأُجْرَةَ مُبْتَدِئًا مِنَ الآخِرِينَ إِلَى الأَوَّلِينَ.","9":"فَجَاءَ أَصْحَابُ السَّاعَةِ الْحَادِيَةَ عَشْرَةَ وَأَخَذُوا دِينَارًا دِينَارًا.","10":"فَلَمَّا جَاءَ الأَوَّلُونَ ظَنُّوا أَنَّهُمْ يَأْخُذُونَ أَكْثَرَ. فَأَخَذُوا هُمْ أَيْضًا دِينَارًا دِينَارًا.","11":"وَفِيمَا هُمْ يَأْخُذُونَ تَذَمَّرُوا عَلَى رَبِّ الْبَيْتِ","12":"قَائِلِينَ: هؤُلاَءِ الآخِرُونَ عَمِلُوا سَاعَةً وَاحِدَةً، وَقَدْ سَاوَيْتَهُمْ بِنَا نَحْنُ الَّذِينَ احْتَمَلْنَا ثِقَلَ النَّهَارِ وَالْحَرَّ!","13":"فَأجَابَ وَقَالَ لِوَاحِدٍ مِنْهُمْ: يَا صَاحِبُ، مَا ظَلَمْتُكَ! أَمَا اتَّفَقْتَ مَعِي عَلَى دِينَارٍ؟","14":"فَخُذِ الَّذِي لَكَ وَاذْهَبْ، فَإِنِّي أُرِيدُ أَنْ أُعْطِيَ هذَا الأَخِيرَ مِثْلَكَ.","15":"أَوَ مَا يَحِلُّ لِي أَنْ أَفْعَلَ مَا أُرِيدُ بِمَا لِي؟ أَمْ عَيْنُكَ شِرِّيرَةٌ لأَنِّي أَنَا صَالِحٌ؟","16":"هكَذَا يَكُونُ الآخِرُونَ أَوَّلِينَ وَالأَوَّلُونَ آخِرِينَ، لأَنَّ كَثِيرِينَ يُدْعَوْنَ وَقَلِيلِينَ يُنْتَخَبُونَ»."},"8.18":{"6":"وَكَانَ عِنْدَ مَجِيئِهِمْ حِينَ رَجَعَ دَاوُدُ مِنْ قَتْلِ الْفِلِسْطِينِيِّ، أَنَّ النِّسَاءَ خَرَجَتْ مِنْ جَمِيعِ مُدُنِ إِسْرَائِيلَ بِالْغِنَاءِ وَالرَّقْصِ لِلِقَاءِ شَاوُلَ الْمَلِكِ بِدُفُوفٍ وَبِفَرَحٍ وَبِمُثَلَّثَاتٍ.","7":"فَأَجَابَتِ النِّسَاءُ اللاَّعِبَاتُ وَقُلْنَ: «ضَرَبَ شَاوُلُ أُلُوفَهُ وَدَاوُدُ رِبْوَاتِهِ.","8":"فَاحْتَمى شَاوُلُ جِدًّا وَسَاءَ هذَا الْكَلاَمُ فِي عَيْنَيْهِ، وَقَالَ: «أَعْطَيْنَ دَاوُدَ رِبْوَاتٍ وَأَمَّا أَنَا فَأَعْطَيْنَنِي الأُلُوفَ! وَبَعْدُ فَقَطْ تَبْقَى لَهُ الْمَمْلَكَةُ».","9":"فَكَانَ شَاوُلُ يُعَايِنُ دَاوُدَ مِنْ ذلِكَ الْيَوْمِ فَصَاعِدًا.","1":"وَكَانَ لَمَّا فَرَغَ مِنَ الْكَلاَمِ مَعَ شَاوُلَ أَنَّ نَفْسَ يُونَاثَانَ تَعَلَّقَتْ بِنَفْسِ دَاوُدَ، وَأَحَبَّهُ يُونَاثَانُ كَنَفْسِهِ.","2":"فَأَخَذَهُ شَاوُلُ فِي ذلِكَ الْيَوْمِ وَلَمْ يَدَعْهُ يَرْجعُ إِلَى بَيْتِ أَبِيهِ.","3":"وَقَطَعَ يُونَاثَانُ وَدَاوُدُ عَهْدًا لأَنَّهُ أَحَبَّهُ كَنَفْسِهِ.","4":"وَخَلَعَ يُونَاثَانُ الْجُبَّةَ الَّتِي عَلَيْهِ وَأَعْطَاهَا لِدَاوُدَ مَعَ ثِيَابِهِ وَسَيْفِهِ وَقَوْسِهِ وَمِنْطَقَتِهِ."},"18.63":{"1":"يَا اَللهُ، إِلهِي أَنْتَ. إِلَيْكَ أُبَكِّرُ. عَطِشَتْ إِلَيْكَ نَفْسِي، يَشْتَاقُ إِلَيْكَ جَسَدِي فِي أَرْضٍ نَاشِفَةٍ وَيَابِسَةٍ بِلاَ مَاءٍ،","2":"لِكَيْ أُبْصِرَ قُوَّتَكَ وَمَجْدَكَ. كَمَا قَدْ رَأَيْتُكَ فِي قُدْسِكَ.","3":"لأَنَّ رَحْمَتَكَ أَفْضَلُ مِنَ الْحَيَاةِ. شَفَتَايَ تُسَبِّحَانِكَ.","8":"اِلْتَصَقَتْ نَفْسِي بِكَ. يَمِينُكَ تَعْضُدُنِي."},"18.84":{"1":"مَا أَحْلَى مَسَاكِنَكَ يَا رَبَّ الْجُنُودِ!","2":"تَشْتَاقُ بَلْ تَتُوقُ نَفْسِي إِلَى دِيَارِ الرَّبِّ. قَلْبِي وَلَحْمِي يَهْتِفَانِ بِالإِلهِ الْحَيِّ."},"65.3":{"20":"هنَذَا وَاقِفٌ عَلَى الْبَابِ وَأَقْرَعُ. إِنْ سَمِعَ أَحَدٌ صَوْتِي وَفَتَحَ الْبَابَ، أَدْخُلُ إِلَيْهِ وَأَتَعَشَّى مَعَهُ وَهُوَ مَعِي."},"18.105":{"4":"اُطْلُبُوا الرَّبَّ وَقُدْرَتَهُ. الْتَمِسُوا وَجْهَهُ دَائِمًا."},"22.44":{"3":"لأَنِّي أَسْكُبُ مَاءً عَلَى الْعَطْشَانِ، وَسُيُولاً عَلَى الْيَابِسَةِ. أَسْكُبُ رُوحِي عَلَى نَسْلِكَ وَبَرَكَتِي عَلَى ذُرِّيَّتِكَ."},"59.1":{"8":"الَّذِي وَإِنْ لَمْ تَرَوْهُ تُحِبُّونَهُ. ذلِكَ وَإِنْ كُنْتُمْ لاَ تَرَوْنَهُ الآنَ لكِنْ تُؤْمِنُونَ بِهِ، فَتَبْتَهِجُونَ بِفَرَحٍ لاَ يُنْطَقُ بِهِ وَمَجِيدٍ،"},"18.98":{"4":"اِهْتِفِي لِلرَّبِّ يَا كُلَّ الأَرْضِ. اهْتِفُوا وَرَنِّمُوا وَغَنُّوا."},"9.6":{"12":"فَأُخْبِرَ الْمَلِكُ دَاوُدُ وَقِيلَ لَهُ: «قَدْ بَارَكَ الرَّبُّ بَيْتَ عُوبِيدَ أَدُومَ، وَكُلَّ مَا لَهُ بِسَبَبِ تَابُوتِ اللهِ». فَذَهَبَ دَاوُدُ وَأَصْعَدَ تَابُوتَ اللهِ مِنْ بَيْتِ عُوبِيدَ أَدُومَ إِلَى مَدِينَةِ دَاوُدَ بِفَرَحٍ.","13":"وَكَانَ كُلَّمَا خَطَا حَامِلُوا تَابُوتِ الرَّبِّ سِتَّ خَطَوَاتٍ يَذْبَحُ ثَوْرًا وَعِجْلاً مَعْلُوفًا.","14":"وَكَانَ دَاوُدُ يَرْقُصُ بِكُلِّ قُوَّتِهِ أَمَامَ الرَّبِّ. وَكَانَ دَاوُدُ مُتَنَطِّقًا بِأَفُودٍ مِنْ كَتَّانٍ.","15":"فَأَصْعَدَ دَاوُدُ وَجَمِيعُ بَيْتِ إِسْرَائِيلَ تَابُوتَ الرَّبِّ بِالْهُتَافِ وَبِصَوْتِ الْبُوقِ."},"39.2":{"9":"فَلَمَّا سَمِعُوا مِنَ الْمَلِكِ ذَهَبُوا. وَإِذَا النَّجْمُ الَّذِي رَأَوْهُ فِي الْمَشْرِقِ يَتَقَدَّمُهُمْ حَتَّى جَاءَ وَوَقَفَ فَوْقُ، حَيْثُ كَانَ الصَّبِيُّ.","10":"فَلَمَّا رَأَوْا النَّجْمَ فَرِحُوا فَرَحًا عَظِيمًا جِدًّا.","11":"وَأَتَوْا إِلَى الْبَيْتِ، وَرَأَوْا الصَّبِيَّ مَعَ مَرْيَمَ أُمِّهِ. فَخَرُّوا وَسَجَدُوا لَهُ. ثُمَّ فَتَحُوا كُنُوزَهُمْ وَقَدَّمُوا لَهُ هَدَايَا: ذَهَبًا وَلُبَانًا وَمُرًّا."},"25.36":{"26":"وَأُعْطِيكُمْ قَلْبًا جَدِيدًا، وَأَجْعَلُ رُوحًا جَدِيدَةً فِي دَاخِلِكُمْ، وَأَنْزِعُ قَلْبَ الْحَجَرِ مِنْ لَحْمِكُمْ وَأُعْطِيكُمْ قَلْبَ لَحْمٍ."},"57.8":{"12":"لأَنِّي أَكُونُ صَفُوحًا عَنْ آثَامِهِمْ، وَلاَ أَذْكُرُ خَطَايَاهُمْ وَتَعَدِّيَاتِهِمْ فِي مَا بَعْدُ»."},"22.65":{"17":"«لأَنِّي هأَنَذَا خَالِقٌ سَمَاوَاتٍ جَدِيدَةً وَأَرْضًا جَدِيدَةً، فَلاَ تُذْكَرُ الأُولَى وَلاَ تَخْطُرُ عَلَى بَال."},"42.3":{"1":"كَانَ إِنْسَانٌ مِنَ الْفَرِّيسِيِّينَ اسْمُهُ نِيقُودِيمُوسُ، رَئِيسٌ لِلْيَهُودِ.","2":"هذَا جَاءَ إِلَى يَسُوعَ لَيْلاً وَقَالَ لَهُ:«يَا مُعَلِّمُ، نَعْلَمُ أَنَّكَ قَدْ أَتَيْتَ مِنَ اللهِ مُعَلِّمًا، لأَنْ لَيْسَ أَحَدٌ يَقْدِرُ أَنْ يَعْمَلَ هذِهِ الآيَاتِ الَّتِي أَنْتَ تَعْمَلُ إِنْ لَمْ يَكُنِ اللهُ مَعَهُ».","3":"أَجَابَ يَسُوعُ وَقَالَ لَهُ:«الْحَقَّ الْحَقَّ أَقُولُ لَكَ: إِنْ كَانَ أَحَدٌ لاَ يُولَدُ مِنْ فَوْقُ لاَ يَقْدِرُ أَنْ يَرَى مَلَكُوتَ اللهِ».","4":"قَالَ لَهُ نِيقُودِيمُوسُ:«كَيْفَ يُمْكِنُ الإِنْسَانَ أَنْ يُولَدَ وَهُوَ شَيْخٌ؟ أَلَعَلَّهُ يَقْدِرُ أَنْ يَدْخُلَ بَطْنَ أُمِّهِ ثَانِيَةً وَيُولَدَ؟»","5":"أَجَابَ يَسُوعُ:«الْحَقَّ الْحَقَّ أَقُولُ لَكَ: إِنْ كَانَ أَحَدٌ لاَ يُولَدُ مِنَ الْمَاءِ وَالرُّوحِ لاَ يَقْدِرُ أَنْ يَدْخُلَ مَلَكُوتَ اللهِ.","6":"اَلْمَوْلُودُ مِنَ الْجَسَدِ جَسَدٌ هُوَ، وَالْمَوْلُودُ مِنَ الرُّوحِ هُوَ رُوحٌ.","7":"لاَ تَتَعَجَّبْ أَنِّي قُلْتُ لَكَ: يَنْبَغِي أَنْ تُولَدُوا مِنْ فَوْقُ.","8":"اَلرِّيحُ تَهُبُّ حَيْثُ تَشَاءُ، وَتَسْمَعُ صَوْتَهَا، لكِنَّكَ لاَ تَعْلَمُ مِنْ أَيْنَ تَأْتِي وَلاَ إِلَى أَيْنَ تَذْهَبُ. هكَذَا كُلُّ مَنْ وُلِدَ مِنَ الرُّوحِ».","16":"لأَنَّهُ هكَذَا أَحَبَّ اللهُ الْعَالَمَ حَتَّى بَذَلَ ابْنَهُ الْوَحِيدَ، لِكَيْ لاَ يَهْلِكَ كُلُّ مَنْ يُؤْمِنُ بِهِ، بَلْ تَكُونُ لَهُ الْحَيَاةُ الأَبَدِيَّةُ."},"43.9":{"1":"أَمَّا شَاوُلُ فَكَانَ لَمْ يَزَلْ يَنْفُثُ تَهَدُّدًا وَقَتْلاً عَلَى تَلاَمِيذِ الرَّبِّ، فَتَقَدَّمَ إِلَى رَئِيسِ الْكَهَنَةِ","2":"وَطَلَبَ مِنْهُ رَسَائِلَ إِلَى دِمَشْقَ، إِلَى الْجَمَاعَاتِ، حَتَّى إِذَا وَجَدَ أُنَاسًا مِنَ الطَّرِيقِ، رِجَالاً أَوْ نِسَاءً، يَسُوقُهُمْ مُوثَقِينَ إِلَى أُورُشَلِيمَ.","3":"وَفِي ذَهَابِهِ حَدَثَ أَنَّهُ اقْتَرَبَ إِلَى دِمَشْقَ فَبَغْتَةً أَبْرَقَ حَوْلَهُ نُورٌ مِنَ السَّمَاءِ،","4":"فَسَقَطَ عَلَى الأَرْضِ وَسَمِعَ صَوْتًا قَائِلاً لَهُ:«شَاوُلُ، شَاوُلُ! لِمَاذَا تَضْطَهِدُنِي؟»","5":"فَقَالَ:«مَنْ أَنْتَيَا سَيِّدُ؟» فَقَالَ الرَّبُّ:«أَنَا يَسُوعُ الَّذِي أَنْتَتَضْطَهِدُهُ. صَعْبٌ عَلَيْكَ أَنْ تَرْفُسَ مَنَاخِسَ».","6":"فَقَاَلَ وَهُوَ مُرْتَعِدٌ وَمُتَحَيِّرٌ:«يَارَبُّ، مَاذَا تُرِيدُ أَنْ أَفْعَلَ؟»فَقَالَ لَهُ الرَّبُّ:«قُمْ وَادْخُلِ الْمَدِينَةَ فَيُقَالَ لَكَ مَاذَا يَنْبَغِي أَنْ تَفْعَلَ».","7":"وَأَمَّا الرِّجَالُ الْمُسَافِرُونَ مَعَهُ فَوَقَفُوا صَامِتِينَ، يَسْمَعُونَ الصَّوْتَ وَلاَ يَنْظُرُونَ أَحَدًا.","8":"فَنَهَضَ شَاوُلُ عَنِ الأَرْضِ، وَكَانَ وَهُوَ مَفْتُوحُ الْعَيْنَيْنِ لاَ يُبْصِرُ أَحَدًا. فَاقْتَادُوهُ بِيَدِهِ وَأَدْخَلُوهُ إِلَى دِمَشْقَ.","9":"وَكَانَ ثَلاَثَةَ أَيَّامٍ لاَ يُبْصِرُ، فَلَمْ يَأْكُلْ وَلَمْ يَشْرَبْ."},"4.6":{"6":"وَلْتَكُنْ هذِهِ الْكَلِمَاتُ الَّتِي أَنَا أُوصِيكَ بِهَا الْيَوْمَ عَلَى قَلْبِكَ،","7":"وَقُصَّهَا عَلَى أَوْلاَدِكَ، وَتَكَلَّمْ بِهَا حِينَ تَجْلِسُ فِي بَيْتِكَ، وَحِينَ تَمْشِي فِي الطَّرِيقِ، وَحِينَ تَنَامُ وَحِينَ تَقُومُ،"},"18.102":{"28":"أَبْنَاءُ عَبِيدِكَ يَسْكُنُونَ، وَذُرِّيَّتُهُمْ تُثَبَّتُ أَمَامَكَ»."},"18.78":{"4":"لاَ نُخْفِي عَنْ بَنِيهِمْ إِلَى الْجِيلِ الآخِرِ، مُخْبِرِينَ بِتَسَابِيحِ الرَّبِّ وَقُوَّتِهِ وَعَجَائِبِهِ الَّتِي صَنَعَ.","5":"أَقَامَ شَهَادَةً فِي يَعْقُوبَ، وَوَضَعَ شَرِيعَةً فِي إِسْرَائِيلَ، الَّتِي أَوْصَى آبَاءَنَا أَنْ يُعَرِّفُوا بِهَا أَبْنَاءَهُمْ،","6":"لِكَيْ يَعْلَمَ الْجِيلُ الآخِرُ. بَنُونَ يُولَدُونَ فَيَقُومُونَ وَيُخْبِرُونَ أَبْنَاءَهُمْ،","7":"فَيَجْعَلُونَ عَلَى اللهِ اعْتِمَادَهُمْ، وَلاَ يَنْسَوْنَ أَعْمَالَ اللهِ، بَلْ يَحْفَظُونَ وَصَايَاهُ."},"22.59":{"21":"أَمَّا أَنَا فَهذَا عَهْدِي مَعَهُمْ، قَالَ الرَّبُّ: رُوحِي الَّذِي عَلَيْكَ، وَكَلاَمِي الَّذِي وَضَعْتُهُ فِي فَمِكَ لاَ يَزُولُ مِنْ فَمِكَ، وَلاَ مِنْ فَمِ نَسْلِكَ، وَلاَ مِنْ فَمِ نَسْلِ نَسْلِكَ، قَالَ الرَّبُّ، مِنَ الآنَ وَإِلَى الأَبَدِ."},"40.7":{"24":"ثُمَّ قَامَ مِنْ هُنَاكَ وَمَضَى إِلَى تُخُومِ صُورَ وَصَيْدَاءَ، وَدَخَلَ بَيْتًا وَهُوَ يُرِيدُ أَنْ لاَ يَعْلَمَ أَحَدٌ، فَلَمْ يَقْدِرْ أَنْ يَخْتَفِيَ،","25":"لأَنَّ امْرَأَةً كَانَ بِابْنَتِهَا رُوحٌ نَجِسٌ سَمِعَتْ بِهِ، فَأَتَتْ وَخَرَّتْ عِنْدَ قَدَمَيْهِ.","26":"وَكَانَتْ الامْرَأَةُ أُمَمِيَّةً، وَفِي جِنْسِهَا فِينِيقِيَّةً سُورِيَّةً. فَسَأَلَتْهُ أَنْ يُخْرِجَ الشَّيْطَانَ مِنِ ابْنَتِهَا.","27":"وَأَمَّا يَسُوعُ فَقَالَ لَهَا:«دَعِي الْبَنِينَ أَوَّلاً يَشْبَعُونَ، لأَنَّهُ لَيْسَ حَسَنًا أَنْ يُؤْخَذَ خُبْزُ الْبَنِينَ وَيُطْرَحَ لِلْكِلاَبِ».","28":"فَأَجَابَتْ وَقَالَتْ لَهُ:«نَعَمْ، يَا سَيِّدُ! وَالْكِلاَبُ أَيْضًا تَحْتَ الْمَائِدَةِ تَأْكُلُ مِنْ فُتَاتِ الْبَنِينَ!».","29":"فَقَالَ لَهَا:«لأَجْلِ هذِهِ الْكَلِمَةِ، اذْهَبِي. قَدْ خَرَجَ الشَّيْطَانُ مِنِ ابْنَتِكِ».","30":"فَذَهَبَتْ إِلَى بَيْتِهَا وَوَجَدَتِ الشَّيْطَانَ قَدْ خَرَجَ، وَالابْنَةَ مَطْرُوحَةً عَلَى الْفِرَاشِ."},"18.85":{"8":"إِنِّي أَسْمَعُ مَا يَتَكَلَّمُ بِهِ اللهُ الرَّبُّ، لأَنَّهُ يَتَكَلَّمُ بِالسَّلاَمِ لِشَعْبِهِ وَلأَتْقِيَائِهِ، فَلاَ يَرْجِعُنَّ إِلَى الْحَمَاقَةِ."},"22.32":{"17":"وَيَكُونُ صُنْعُ الْعَدْلِ سَلاَمًا، وَعَمَلُ الْعَدْلِ سُكُونًا وَطُمَأْنِينَةً إِلَى الأَبَدِ."},"3.6":{"24":"يُبَارِكُكَ الرَّبُّ وَيَحْرُسُكَ.","25":"يُضِيءُ الرَّبُّ بِوَجْهِهِ عَلَيْكَ وَيَرْحَمُكَ.","26":"يَرْفَعُ الرَّبُّ وَجْهَهُ عَلَيْكَ وَيَمْنَحُكَ سَلاَمًا."},"22.48":{"18":"لَيْتَكَ أَصْغَيْتَ لِوَصَايَايَ، فَكَانَ كَنَهْرٍ سَلاَمُكَ وَبِرُّكَ كَلُجَجِ الْبَحْرِ."},"22.9":{"6":"لأَنَّهُ يُولَدُ لَنَا وَلَدٌ وَنُعْطَى ابْنًا، وَتَكُونُ الرِّيَاسَةُ عَلَى كَتِفِهِ، وَيُدْعَى اسْمُهُ عَجِيبًا، مُشِيرًا، إِلهًا قَدِيرًا، أَبًا أَبَدِيًّا، رَئِيسَ السَّلاَمِ."},"4.33":{"25":"حَدِيدٌ وَنُحَاسٌ مَزَالِيجُكَ، وَكَأَيَّامِكَ رَاحَتُكَ."},"22.46":{"4":"وَإِلَى الشَّيْخُوخَةِ أَنَا هُوَ، وَإِلَى الشَّيْبَةِ أَنَا أَحْمِلُ. قَدْ فَعَلْتُ، وَأَنَا أَرْفَعُ، وَأَنَا أَحْمِلُ وَأُنَجِّي."},"2.19":{"32":"مِنْ أَمَامِ الأَشْيَبِ تَقُومُ وَتَحْتَرِمُ وَجْهَ الشَّيْخِ، وَتَخْشَى إِلهَكَ. أَنَا الرَّبُّ."},"17.12":{"12":"عِنْدَ الشَّيْبِ حِكْمَةٌ، وَطُولُ الأَيَّامِ فَهْمٌ."},"20.12":{"1":"فَاذْكُرْ خَالِقَكَ فِي أَيَّامِ شَبَابِكَ، قَبْلَ أَنْ تَأْتِيَ أَيَّامُ الشَّرِّ أَوْ تَجِيءَ السِّنُونَ إِذْ تَقُولُ: «لَيْسَ لِي فِيهَا سُرُورٌ»."},"5.14":{"6":"فَتَقَدَّمَ بَنُو يَهُوذَا إِلَى يَشُوعَ فِي الْجِلْجَالِ. وَقَالَ لَهُ كَالَبُ بْنُ يَفُنَّةَ الْقَنِزِّيُّ: «أَنْتَ تَعْلَمُ الْكَلاَمَ الَّذِي كَلَّمَ بِهِ الرَّبُّ مُوسَى رَجُلَ اللهِ مِنْ جِهَتِي وَمِنْ جِهَتِكَ فِي قَادَشِ بَرْنِيعَ.","7":"كُنْتُ ابْنَ أَرْبَعِينَ سَنَةً حِينَ أَرْسَلَنِي مُوسَى عَبْدُ الرَّبِّ مِنْ قَادَشِ بَرْنِيعَ لأَتَجَسَّسَ الأَرْضَ. فَرَجَعْتُ إِلَيْهِ بِكَلاَمٍ عَمَّا فِي قَلْبِي.","8":"وَأَمَّا إِخْوَتِيَ الَّذِينَ صَعِدُوا مَعِي فَأَذَابُوا قَلْبَ الشَّعْبِ. وَأَمَّا أَنَا فَاتَّبَعْتُ تَمَامًا الرَّبَّ إِلهِي.","9":"فَحَلَفَ مُوسَى فِي ذلِكَ الْيَوْمِ قَائِلاً: إِنَّ الأَرْضَ الَّتِي وَطِئَتْهَا رِجْلُكَ لَكَ تَكُونُ نَصِيبًا وَلأَوْلاَدِكَ إِلَى الأَبَدِ، لأَنَّكَ اتَّبَعْتَ الرَّبَّ إِلهِي تَمَامًا.","10":"وَالآنَ فَهَا قَدِ اسْتَحْيَانِيَ الرَّبُّ كَمَا تَكَلَّمَ هذِهِ الْخَمْسَ وَالأَرْبَعِينَ سَنَةً، مِنْ حِينَ كَلَّمَ الرَّبُّ مُوسَى بِهذَا الْكَلاَمِ حِينَ سَارَ إِسْرَائِيلُ فِي الْقَفْرِ. وَالآنَ فَهَا أَنَا الْيَوْمَ ابْنُ خَمْسٍ وَثَمَانِينَ سَنَةً.","11":"فَلَمْ أَزَلِ الْيَوْمَ مُتَشَدِّدًا كَمَا فِي يَوْمَ أَرْسَلَنِي مُوسَى. كَمَا كَانَتْ قُوَّتِي حِينَئِذٍ، هكَذَا قُوَّتِي الآنَ لِلْحَرْبِ وَلِلْخُرُوجِ وَلِلدُّخُولِ.","12":"فَالآنَ أَعْطِنِي هذَا الْجَبَلَ الَّذِي تَكَلَّمَ عَنْهُ الرَّبُّ فِي ذلِكَ الْيَوْمِ. لأَنَّكَ أَنْتَ سَمِعْتَ فِي ذلِكَ الْيَوْمِ أَنَّ الْعَنَاقِيِّينَ هُنَاكَ، وَالْمُدُنُ عَظِيمَةٌ مُحَصَّنَةٌ. لَعَلَّ الرَّبَّ مَعِي فَأَطْرُدَهُمْ كَمَا تَكَلَّمَ الرَّبُّ»."},"0.18":{"9":"وَقَالُوا لَهُ: «أَيْنَ سَارَةُ امْرَأَتُكَ؟» فَقَالَ: «هَا هِيَ فِي الْخَيْمَةِ».","10":"فَقَالَ: «إِنِّي أَرْجعُ إِلَيْكَ نَحْوَ زَمَانِ الْحَيَاةِ وَيَكُونُ لِسَارَةَ امْرَأَتِكَ ابْنٌ». وَكَانَتْ سَارَةُ سَامِعَةً فِي بَابِ الْخَيْمَةِ وَهُوَ وَرَاءَهُ.","11":"وَكَانَ إِبْرَاهِيمُ وَسَارَةُ شَيْخَيْنِ مُتَقَدِّمَيْنِ فِي الأَيَّامِ، وَقَدِ انْقَطَعَ أَنْ يَكُونَ لِسَارَةَ عَادَةٌ كَالنِّسَاءِ.","12":"فَضَحِكَتْ سَارَةُ فِي بَاطِنِهَا قَائِلَةً: «أَبَعْدَ فَنَائِي يَكُونُ لِي تَنَعُّمٌ، وَسَيِّدِي قَدْ شَاخَ؟»","13":"فَقَالَ الرَّبُّ لإِبْرَاهِيمَ: «لِمَاذَا ضَحِكَتْ سَارَةُ قَائِلَةً: أَفَبِالْحَقِيقَةِ أَلِدُ وَأَنَا قَدْ شِخْتُ؟","14":"هَلْ يَسْتَحِيلُ عَلَى الرَّبِّ شَيْءٌ؟ فِي الْمِيعَادِ أَرْجعُ إِلَيْكَ نَحْوَ زَمَانِ الْحَيَاةِ وَيَكُونُ لِسَارَةَ ابْنٌ».","15":"فَأَنْكَرَتْ سَارَةُ قَائِلَةً: «لَمْ أَضْحَكْ». لأَنَّهَا خَافَتْ. فَقَالَ: «لاَ! بَلْ ضَحِكْتِ»."},"18.13":{"1":"إِلَى مَتَى يَا رَبُّ تَنْسَانِي كُلَّ النِّسْيَانِ؟ إِلَى مَتَى تَحْجُبُ وَجْهَكَ عَنِّي؟","2":"إِلَى مَتَى أَجْعَلُ هُمُومًا فِي نَفْسِي وَحُزْنًا فِي قَلْبِي كُلَّ يَوْمٍ؟ إِلَى مَتَى يَرْتَفِعُ عَدُوِّي عَلَيَّ؟","3":"انْظُرْ وَاسْتَجِبْ لِي يَا رَبُّ إِلهِي. أَنِرْ عَيْنَيَّ لِئَلاَّ أَنَامَ نَوْمَ الْمَوْتِ،","4":"لِئَلاَّ يَقُولَ عَدُوِّي: «قَدْ قَوِيتُ عَلَيْهِ». لِئَلاَّ يَهْتِفَ مُضَايِقِيَّ بِأَنِّي تَزَعْزَعْتُ.","5":"أَمَّا أَنَا فَعَلَى رَحْمَتِكَ تَوَكَّلْتُ. يَبْتَهِجُ قَلْبِي بِخَلاَصِكَ.","6":"أُغَنِّي لِلرَّبِّ لأَنَّهُ أَحْسَنَ إِلَيَّ."},"17.1":{"21":"وَقَالَ: «عُرْيَانًا خَرَجْتُ مِنْ بَطْنِ أُمِّي، وَعُرْيَانًا أَعُودُ إِلَى هُنَاكَ. الرَّبُّ أَعْطَى وَالرَّبُّ أَخَذَ، فَلْيَكُنِ اسْمُ الرَّبِّ مُبَارَكًا».","13":"وَكَانَ ذَاتَ يَوْمٍ وَأَبْنَاؤُهُ وَبَنَاتُهُ يَأْكُلُونَ وَيَشْرَبُونَ خَمْرًا فِي بَيْتِ أَخِيهِمِ الأَكْبَرِ،","14":"أَنَّ رَسُولاً جَاءَ إِلَى أَيُّوبَ وَقَالَ: «الْبَقَرُ كَانَتْ تَحْرُثُ، وَالأُتُنُ تَرْعَى بِجَانِبِهَا،","15":"فَسَقَطَ عَلَيْهَا السَّبَئِيُّونَ وَأَخَذُوهَا، وَضَرَبُوا الْغِلْمَانَ بِحَدِّ السَّيْفِ، وَنَجَوْتُ أَنَا وَحْدِي لأُخْبِرَكَ».","16":"وَبَيْنَمَا هُوَ يَتَكَلَّمُ إِذْ جَاءَ آخَرُ وَقَالَ: «نَارُ اللهِ سَقَطَتْ مِنَ السَّمَاءِ فَأَحْرَقَتِ الْغَنَمَ وَالْغِلْمَانَ وَأَكَلَتْهُمْ، وَنَجَوْتُ أَنَا وَحْدِي لأُخْبِرَكَ».","17":"وَبَيْنَمَا هُوَ يَتَكَلَّمُ إِذْ جَاءَ آخَرُ وَقَالَ: «الْكَلْدَانِيُّونَ عَيَّنُوا ثَلاَثَ فِرَق، فَهَجَمُوا عَلَى الْجِمَالِ وَأَخَذُوهَا، وَضَرَبُوا الْغِلْمَانَ بِحَدِّ السَّيْفِ، وَنَجَوْتُ أَنَا وَحْدِي لأُخْبِرَكَ».","18":"وَبَيْنَمَا هُوَ يَتَكَلَّمُ إِذْ جَاءَ آخَرُ وَقَالَ: «بَنُوكَ وَبَنَاتُكَ كَانُوا يَأْكُلُونَ وَيَشْرَبُونَ خَمْرًا فِي بَيْتِ أَخِيهِمِ الأَكْبَرِ،","19":"وَإِذَا رِيحٌ شَدِيدَةٌ جَاءَتْ مِنْ عَبْرِ الْقَفْرِ وَصَدَمَتْ زَوَايَا الْبَيْتِ الأَرْبَعَ، فَسَقَطَ عَلَى الْغِلْمَانِ فَمَاتُوا، وَنَجَوْتُ أَنَا وَحْدِي لأُخْبِرَكَ».","20":"فَقَامَ أَيُّوبُ وَمَزَّقَ جُبَّتَهُ، وَجَزَّ شَعْرَ رَأْسِهِ، وَخَرَّ عَلَى الأَرْضِ وَسَجَدَ،","22":"فِي كُلِّ هذَا لَمْ يُخْطِئْ أَيُّوبُ وَلَمْ يَنْسِبْ للهِ جِهَالَةً."},"17.19":{"25":"أَمَّا أَنَا فَقَدْ عَلِمْتُ أَنَّ وَلِيِّي حَيٌّ، وَالآخِرَ عَلَى الأَرْضِ يَقُومُ،","26":"وَبَعْدَ أَنْ يُفْنَى جِلْدِي هذَا، وَبِدُونِ جَسَدِي أَرَى اللهَ.","27":"الَّذِي أَرَاهُ أَنَا لِنَفْسِي، وَعَيْنَايَ تَنْظُرَانِ وَلَيْسَ آخَرُ. إِلَى ذلِكَ تَتُوقُ كُلْيَتَايَ فِي جَوْفِي."},"44.11":{"33":"يَا لَعُمْقِ غِنَى اللهِ وَحِكْمَتِهِ وَعِلْمِهِ! مَا أَبْعَدَ أَحْكَامَهُ عَنِ الْفَحْصِ وَطُرُقَهُ عَنِ الاسْتِقْصَاءِ!","34":"«لأَنْ مَنْ عَرَفَ فِكْرَ الرَّبِّ؟ أَوْ مَنْ صَارَ لَهُ مُشِيرًا؟","35":"أَوْ مَنْ سَبَقَ فَأَعْطَاهُ فَيُكَافَأَ؟».","36":"لأَنَّ مِنْهُ وَبِهِ وَلَهُ كُلَّ الأَشْيَاءِ. لَهُ الْمَجْدُ إِلَى الأَبَدِ. آمِينَ."},"59.4":{"12":"أَيُّهَا الأَحِبَّاءُ، لاَ تَسْتَغْرِبُوا الْبَلْوَى الْمُحْرِقَةَ الَّتِي بَيْنَكُمْ حَادِثَةٌ، لأَجْلِ امْتِحَانِكُمْ، كَأَنَّهُ أَصَابَكُمْ أَمْرٌ غَرِيبٌ،","13":"بَلْ كَمَا اشْتَرَكْتُمْ فِي آلاَمِ الْمَسِيحِ، افْرَحُوا لِكَيْ تَفْرَحُوا فِي اسْتِعْلاَنِ مَجْدِهِ أَيْضًا مُبْتَهِجِينَ.","8":"وَلكِنْ قَبْلَ كُلِّ شَيْءٍ، لِتَكُنْ مَحَبَّتُكُمْ بَعْضِكُمْ لِبَعْضٍ شَدِيدَةً، لأَنَّ الْمَحَبَّةَ تَسْتُرُ كَثْرَةً مِنَ الْخَطَايَا."},"42.13":{"7":"أَجَابَ يَسُوعُ وَقَالَ لَهُ:«لَسْتَ تَعْلَمُ أَنْتَ الآنَ مَا أَنَا أَصْنَعُ، وَلكِنَّكَ سَتَفْهَمُ فِيمَا بَعْدُ».","34":"وَصِيَّةً جَدِيدَةً أَنَا أُعْطِيكُمْ: أَنْ تُحِبُّوا بَعْضُكُمْ بَعْضًا. كَمَا أَحْبَبْتُكُمْ أَنَا تُحِبُّونَ أَنْتُمْ أَيْضًا بَعْضُكُمْ بَعْضًا.","35":"بِهذَا يَعْرِفُ الْجَمِيعُ أَنَّكُمْ تَلاَمِيذِي: إِنْ كَانَ لَكُمْ حُبٌّ بَعْضًا لِبَعْضٍ».","1":"أَمَّا يَسُوعُ قَبْلَ عِيدِ الْفِصْحِ، وَهُوَ عَالِمٌ أَنَّ سَاعَتَهُ قَدْ جَاءَتْ لِيَنْتَقِلَ مِنْ هذَا الْعَالَمِ إِلَى الآبِ، إِذْ كَانَ قَدْ أَحَبَّ خَاصَّتَهُ الَّذِينَ فِي الْعَالَمِ، أَحَبَّهُمْ إِلَى الْمُنْتَهَى.","2":"فَحِينَ كَانَ الْعَشَاءُ، وَقَدْ أَلْقَى الشَّيْطَانُ فِي قَلْبِ يَهُوذَا سِمْعَانَ الإِسْخَرْيُوطِيِّ أَنْ يُسَلِّمَهُ،","3":"يَسُوعُ وَهُوَ عَالِمٌ أَنَّ الآبَ قَدْ دَفَعَ كُلَّ شَيْءٍ إِلَى يَدَيْهِ، وَأَنَّهُ مِنْ عِنْدِ اللهِ خَرَجَ، وَإِلَى اللهِ يَمْضِي،","4":"قَامَ عَنِ الْعَشَاءِ، وَخَلَعَ ثِيَابَهُ، وَأَخَذَ مِنْشَفَةً وَاتَّزَرَ بِهَا،","5":"ثُمَّ صَبَّ مَاءً فِي مِغْسَل، وَابْتَدَأَ يَغْسِلُ أَرْجُلَ التَّلاَمِيذِ وَيَمْسَحُهَا بِالْمِنْشَفَةِ الَّتِي كَانَ مُتَّزِرًا بِهَا.","6":"فَجَاءَ إِلَى سِمْعَانَ بُطْرُسَ. فَقَالَ لَهُ ذَاكَ:«يَا سَيِّدُ، أَنْتَ تَغْسِلُ رِجْلَيَّ!»","8":"قَالَ لَهُ بُطْرُسُ:«لَنْ تَغْسِلَ رِجْلَيَّ أَبَدًا!» أَجَابَهُ يَسُوعُ:«إِنْ كُنْتُ لاَ أَغْسِلُكَ فَلَيْسَ لَكَ مَعِي نَصِيبٌ».","9":"قَالَ لَهُ سِمْعَانُ بُطْرُسُ:«يَا سَيِّدُ، لَيْسَ رِجْلَيَّ فَقَطْ بَلْ أَيْضًا يَدَيَّ وَرَأْسِي».","10":"قَالَ لَهُ يَسُوعُ:«الَّذِي قَدِ اغْتَسَلَ لَيْسَ لَهُ حَاجَةٌ إِلاَّ إِلَى غَسْلِ رِجْلَيْهِ، بَلْ هُوَ طَاهِرٌ كُلُّهُ. وَأَنْتُمْ طَاهِرُونَ وَلكِنْ لَيْسَ كُلُّكُمْ».","11":"لأَنَّهُ عَرَفَ مُسَلِّمَهُ، لِذلِكَ قَالَ: «لَسْتُمْ كُلُّكُمْ طَاهِرِينَ».","12":"فَلَمَّا كَانَ قَدْ غَسَلَ أَرْجُلَهُمْ وَأَخَذَ ثِيَابَهُ وَاتَّكَأَ أَيْضًا، قَالَ لَهُمْ:«أَتَفْهَمُونَ مَا قَدْ صَنَعْتُ بِكُمْ؟","13":"أَنْتُمْ تَدْعُونَنِي مُعَلِّمًا وَسَيِّدًا، وَحَسَنًا تَقُولُونَ، لأَنِّي أَنَا كَذلِكَ.","14":"فَإِنْ كُنْتُ وَأَنَا السَّيِّدُ وَالْمُعَلِّمُ قَدْ غَسَلْتُ أَرْجُلَكُمْ، فَأَنْتُمْ يَجِبُ عَلَيْكُمْ أَنْ يَغْسِلَ بَعْضُكُمْ أَرْجُلَ بَعْضٍ،","15":"لأَنِّي أَعْطَيْتُكُمْ مِثَالاً، حَتَّى كَمَا صَنَعْتُ أَنَا بِكُمْ تَصْنَعُونَ أَنْتُمْ أَيْضًا.","16":"اَلْحَقَّ الْحَقَّ أَقُولُ لَكُمْ: إِنَّهُ لَيْسَ عَبْدٌ أَعْظَمَ مِنْ سَيِّدِهِ، وَلاَ رَسُولٌ أَعْظَمَ مِنْ مُرْسِلِهِ.","17":"إِنْ عَلِمْتُمْ هذَا فَطُوبَاكُمْ إِنْ عَمِلْتُمُوهُ."},"18.77":{"1":"صَوْتِي إِلَى اللهِ فَأَصْرُخُ. صَوْتِي إِلَى اللهِ فَأَصْغَى إِلَيَّ.","2":"فِي يَوْمِ ضِيقْيِ الْتَمَسْتُ الرَّبَّ. يَدِي فِي اللَّيْلِ انْبَسَطَتْ وَلَمْ تَخْدَرْ. أَبَتْ نَفْسِي التَّعْزِيَةَ.","3":"أَذْكُرُ اللهَ فَأَئِنُّ. أُنَاجِي نَفْسِي فَيُغْشَى عَلَى رُوحِي. سِلاَهْ."},"17.2":{"7":"فَخَرَجَ الشَّيْطَانُ مِنْ حَضْرَةِ الرَّبِّ، وَضَرَبَ أَيُّوبَ بِقُرْحٍ رَدِيءٍ مِنْ بَاطِنِ قَدَمِهِ إِلَى هَامَتِهِ.","8":"فَأَخَذَ لِنَفْسِهِ شَقْفَةً لِيَحْتَكَّ بِهَا وَهُوَ جَالِسٌ فِي وَسَطِ الرَّمَادِ.","9":"فَقَالَتْ لَهُ امْرَأَتُهُ: «أَنْتَ مُتَمَسِّكٌ بَعْدُ بِكَمَالِكَ؟ بَارِكِ اللهِ وَمُتْ!».","10":"فَقَالَ لَهَا: «تَتَكَلَّمِينَ كَلاَمًا كَإِحْدَى الْجَاهِلاَتِ! أَالْخَيْرَ نَقْبَلُ مِنْ عِنْدِ اللهِ، وَالشَّرَّ لاَ نَقْبَلُ؟». فِي كُلِّ هذَا لَمْ يُخْطِئْ أَيُّوبُ بِشَفَتَيْهِ."},"17.42":{"1":"فَأَجَابَ أَيُّوبُ الرَّبَّ فَقَالَ:","2":"«قَدْ عَلِمْتُ أَنَّكَ تَسْتَطِيعُ كُلَّ شَيْءٍ، وَلاَ يَعْسُرُ عَلَيْكَ أَمْرٌ.","3":"فَمَنْ ذَا الَّذِي يُخْفِي الْقَضَاءَ بِلاَ مَعْرِفَةٍ؟ وَلكِنِّي قَدْ نَطَقْتُ بِمَا لَمْ أَفْهَمْ. بِعَجَائِبَ فَوْقِي لَمْ أَعْرِفْهَا.","4":"اِسْمَعِ الآنَ وَأَنَا أَتَكَلَّمُ. أَسْأَلُكَ فَتُعَلِّمُنِي.","5":"بِسَمْعِ الأُذُنِ قَدْ سَمِعْتُ عَنْكَ، وَالآنَ رَأَتْكَ عَيْنِي.","6":"لِذلِكَ أَرْفُضُ وَأَنْدَمُ فِي التُّرَابِ وَالرَّمَادِ»."},"21.8":{"6":"اِجْعَلْنِي كَخَاتِمٍ عَلَى قَلْبِكَ، كَخَاتِمٍ عَلَى سَاعِدِكَ. لأَنَّ الْمَحَبَّةَ قَوِيَّةٌ كَالْمَوْتِ. الْغَيْرَةُ قَاسِيَةٌ كَالْهَاوِيَةِ. لَهِيبُهَا لَهِيبُ نَارِ لَظَى الرَّبِّ.","7":"مِيَاهٌ كَثِيرَةٌ لاَ تَسْتَطِيعُ أَنْ تُطْفِئَ الْمَحَبَّةَ، وَالسُّيُولُ لاَ تَغْمُرُهَا. إِنْ أَعْطَى الإِنْسَانُ كُلَّ ثَرْوَةِ بَيْتِهِ بَدَلَ الْمَحَبَّةِ، تُحْتَقَرُ احْتِقَارًا."},"40.12":{"28":"فَجَاءَ وَاحِدٌ مِنَ الْكَتَبَةِ وَسَمِعَهُمْ يَتَحَاوَرُونَ، فَلَمَّا رَأَى أَنَّهُ أَجَابَهُمْ حَسَنًا، سَأَلَهُ:«أَيَّةُ وَصِيَّةٍ هِيَ أَوَّلُ الْكُلِّ؟»","29":"فَأَجَابَهُ يَسُوعُ:«إِنَّ أَوَّلَ كُلِّ الْوَصَايَا هِيَ: اسْمَعْ يَا إِسْرَائِيلُ. الرَّبُّ إِلهُنَا رَبٌّ وَاحِدٌ.","30":"وَتُحِبُّ الرَّبَّ إِلهَكَ مِنْ كُلِّ قَلْبِكَ، وَمِنْ كُلِّ نَفْسِكَ، وَمِنْ كُلِّ فِكْرِكَ، وَمِنْ كُلِّ قُدْرَتِكَ. هذِهِ هِيَ الْوَصِيَّةُ الأُولَى.","31":"وَثَانِيَةٌ مِثْلُهَا هِيَ: تُحِبُّ قَرِيبَكَ كَنَفْسِكَ. لَيْسَ وَصِيَّةٌ أُخْرَى أَعْظَمَ مِنْ هَاتَيْنِ».","32":"فَقَالَ لَهُ الْكَاتِبُ:«جَيِّدًا يَا مُعَلِّمُ. بِالْحَقِّ قُلْتَ، لأَنَّهُ اللهُ وَاحِدٌ وَلَيْسَ آخَرُ سِوَاهُ.","33":"وَمَحَبَّتُهُ مِنْ كُلِّ الْقَلْبِ، وَمِنْ كُلِّ الْفَهْمِ، وَمِنْ كُلِّ النَّفْسِ، وَمِنْ كُلِّ الْقُدْرَةِ، وَمَحَبَّةُ الْقَرِيبِ كَالنَّفْسِ، هِيَ أَفْضَلُ مِنْ جَمِيعِ الْمُحْرَقَاتِ وَالذَّبَائِحِ».","34":"فَلَمَّا رَآهُ يَسُوعُ أَنَّهُ أَجَابَ بِعَقْل، قَالَ لَهُ:«لَسْتَ بَعِيدًا عَنْ مَلَكُوتِ اللهِ». وَلَمْ يَجْسُرْ أَحَدٌ بَعْدَ ذلِكَ أَنْ يَسْأَلَهُ!"},"20.9":{"10":"كُلُّ مَا تَجِدُهُ يَدُكَ لِتَفْعَلَهُ فَافْعَلْهُ بِقُوَّتِكَ، لأَنَّهُ لَيْسَ مِنْ عَمَل وَلاَ اخْتِرَاعٍ وَلاَ مَعْرِفَةٍ وَلاَ حِكْمَةٍ فِي الْهَاوِيَةِ الَّتِي أَنْتَ ذَاهِبٌ إِلَيْهَا."},"1.31":{"1":"وَكَلَّمَ الرَّبُّ مُوسَى قَائِلاً:","2":"«اُنْظُرْ. قَدْ دَعَوْتُ بَصَلْئِيلَ بْنَ أُورِي بْنَ حُورَ مِنْ سِبْطِ يَهُوذَا بِاسْمِهِ،","3":"وَمَلأْتُهُ مِنْ رُوحِ اللهِ بِالْحِكْمَةِ وَالْفَهْمِ وَالْمَعْرِفَةِ وَكُلِّ صَنْعَةٍ،","4":"لاخْتِرَاعِ مُخْتَرَعَاتٍ لِيَعْمَلَ فِي الذَّهَبِ وَالْفِضَّةِ وَالنُّحَاسِ،","5":"وَنَقْشِ حِجَارَةٍ لِلتَّرْصِيعِ، وَنِجَارَةِ الْخَشَبِ، لِيَعْمَلَ فِي كُلِّ صَنْعَةٍ."}},"F":[{"id":"sad","l":"حزين","v":[[18,34,18,18],[18,30,5,5],[39,5,4,4],[18,126,5,6],[18,42,11,11],[18,147,3,3],[22,61,3,3],[46,1,3,4],[65,21,4,4],[18,56,8,8],[18,34,17,17],[24,3,31,33],[42,14,18,18],[41,6,21,21],[18,30,11,12],[42,16,22,22],[22,25,8,8],[18,119,50,50],[52,2,16,17],[18,31,7,7]],"s":[["الأرملة في نايين",41,7,11,17],["مريم عند القبر",42,20,11,18],["يسوع في بستان جثسيماني",41,22,39,46],["حنة في الهيكل",8,1,9,20],["تلميذا عمواس",41,24,13,27],["يسوع يبكي على أورشليم",41,19,41,44]],"r":["ماتحاولش تبقى كويس بسرعة. الدموع كمان صلاة.","كلّم حد بتثق فيه النهارده، ماتقعدش لوحدك مع الحزن.","اكتب اللي حاسس بيه في ورقة. لما بتتسمّى بتخف شوية."]},{"id":"worried","l":"قلقان","v":[[49,4,6,7],[59,5,7,7],[39,6,34,34],[18,55,22,22],[42,14,27,27],[22,26,3,3],[18,94,19,19],[18,46,10,10],[18,62,8,8],[41,12,6,7],[39,6,33,33],[19,12,25,25],[49,4,19,19],[18,37,5,5],[19,3,5,6],[41,12,24,24],[18,34,4,4],[18,56,3,4],[22,41,13,13],[18,16,8,8]],"s":[["طيور السما وزنابق الحقل",39,6,25,34],["أرملة صرفة وإيليا",10,17,8,16],["الغربان وإيليا",10,17,1,6],["مرثا ومريم",41,10,38,42],["إطعام الخمسة آلاف",42,6,5,13],["الصيد العجيب",41,5,1,11],["زيت الأرملة",11,4,1,7]]," const FEELINGS = D.F;
const AR = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function refLabel(r){ const [b,c,v1,v2]=r; return D.N[b]+" "+AR(c)+": "+AR(v1)+(v2>v1?"–"+AR(v2):""); }
function plain(r){ const [b,c,v1,v2]=r; const a=[]; for(let v=v1;v<=v2;v++) a.push(D.V[b+"."+c][v]); return a.join(" "); }
function withNums(r){ const [b,c,v1,v2]=r; let h=""; for(let v=v1;v<=v2;v++) h+='<sup class="vn">'+AR(v)+'</sup>'+esc(D.V[b+"."+c][v])+" "; return h; }
function choose(n,total,avoid){
  const idx=Array.from({length:total},(_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  return idx.filter(i=>avoid.indexOf(i)===-1).concat(idx.filter(i=>avoid.indexOf(i)!==-1)).slice(0,n);
}
const chips=document.getElementById("chips"), result=document.getElementById("result");
let current=null, shown=[]; const last={};
FEELINGS.forEach(f=>{
  const b=document.createElement("button"); b.type="button"; b.className="chip"; b.id="chip-"+f.id;
  b.textContent=f.l; b.setAttribute("aria-pressed","false");
  b.addEventListener("click",()=>pick(f.id,true)); chips.appendChild(b);
});
function pick(id,fromClick){
  const f=FEELINGS.find(x=>x.id===id)||FEELINGS[0];
  if(current===f.id&&!fromClick) return;
  current=f.id;
  try{history.replaceState(null,"","#"+f.id);}catch(e){try{location.hash=f.id;}catch(e2){}}
  FEELINGS.forEach(x=>document.getElementById("chip-"+x.id).setAttribute("aria-pressed",String(x.id===f.id)));
  render(f);
  if(fromClick){
    const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    try{result.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});}catch(e){}
  }
}
function render(f){
  const L=last[f.id]||(last[f.id]={v:[],s:[],r:-1});
  const vi=choose(3,f.v.length,L.v), si=choose(1,f.s.length,L.s)[0], ri=choose(1,f.r.length,[L.r])[0];
  L.v=vi; L.s=[si]; L.r=ri;
  shown=vi.map(i=>f.v[i]);
  const st=f.s[si], sr=st.slice(1);
  const verses=shown.map((v,i)=>
    '<div class="verse"><blockquote id="v-'+i+'">'+(v[3]>v[2]?withNums(v):esc(plain(v)))+'</blockquote>'+
    '<div class="meta"><span class="ref">'+refLabel(v)+'</span><button type="button" class="copy" data-i="'+i+'">نسخ</button></div></div>').join("");
  result.innerHTML=
    '<div class="verses">'+verses+'</div>'+
    '<article class="scene"><span class="label">موقف من الإنجيل</span><h2>'+esc(st[0])+'</h2>'+
    '<p class="story">'+withNums(sr)+'</p><span class="ref">'+refLabel(sr)+'</span></article>'+
    '<div class="reflect"><span class="label">تأمل</span><p>'+esc(f.r[ri])+'</p></div>'+
    '<button type="button" class="again" id="again">آيات تانية لنفس الإحساس</button>';
  result.classList.remove("in"); void result.offsetWidth; result.classList.add("in");
}
result.addEventListener("click",e=>{
  if(e.target.closest(".again")){pick(current,true);return;}
  const btn=e.target.closest(".copy"); if(!btn) return;
  const v=shown[Number(btn.dataset.i)];
  const text=plain(v)+" ("+refLabel(v)+")";
  const done=()=>{btn.textContent="اتنسخ";setTimeout(()=>{btn.textContent="نسخ";},1500);};
  const fallback=()=>{try{const r=document.createRange();r.selectNodeContents(document.getElementById("v-"+btn.dataset.i));const s=window.getSelection();s.removeAllRanges();s.addRange(r);btn.textContent="حدّد النص وانسخه";}catch(err){}};
  try{navigator.clipboard.writeText(text).then(done,fallback);}catch(err){fallback();}
});
function fromHash(){let h="";try{h=decodeURIComponent(location.hash.replace("#",""));}catch(e){} return FEELINGS.some(x=>x.id===h)?h:FEELINGS[0].id;}
window.addEventListener("hashchange",()=>pick(fromHash(),false));
pick(fromHash(),false);
