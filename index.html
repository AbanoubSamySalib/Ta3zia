يَدِ يُوسُفَ جَمِيعَ الأَسْرَى الَّذِينَ فِي بَيْتِ السِّجْنِ. وَكُلُّ مَا كَانُوا يَعْمَلُونَ هُنَاكَ كَانَ هُوَ الْعَامِلَ.","23":"وَلَمْ يَكُنْ رَئِيسُ بَيْتِ السِّجْنِ يَنْظُرُ شَيْئًا الْبَتَّةَ مِمَّا فِي يَدِهِ، لأَنَّ الرَّبَّ كَانَ مَعَهُ، وَمَهْمَا صَنَعَ كَانَ الرَّبُّ يُنْجِحُهُ.","6":"فَتَرَكَ كُلَّ مَا كَانَ لَهُ فِي يَدِ يُوسُفَ. وَلَمْ يَكُنْ مَعَهُ يَعْرِفُ شَيْئًا إِلاَّ الْخُبْزَ الَّذِي يَأْكُلُ. وَكَانَ يُوسُفُ حَسَنَ الصُّورَةِ وَحَسَنَ الْمَنْظَرِ.","7":"وَحَدَثَ بَعْدَ هذِهِ الأُمُورِ أَنَّ امْرَأَةَ سَيِّدِهِ رَفَعَتْ عَيْنَيْهَا إِلَى يُوسُفَ وَقَالَتِ: «اضْطَجعْ مَعِي».","8":"فَأَبَى وَقَالَ لامْرَأَةِ سَيِّدِهِ: «هُوَذَا سَيِّدِي لاَ يَعْرِفُ مَعِي مَا فِي الْبَيْتِ، وَكُلُّ مَا لَهُ قَدْ دَفَعَهُ إِلَى يَدِي.","9":"لَيْسَ هُوَ فِي هذَا الْبَيْتِ أَعْظَمَ مِنِّي. وَلَمْ يُمْسِكْ عَنِّي شَيْئًا غَيْرَكِ، لأَنَّكِ امْرَأَتُهُ. فَكَيْفَ أَصْنَعُ هذَا الشَّرَّ الْعَظِيمَ وَأُخْطِئُ إِلَى اللهِ؟».","10":"وَكَانَ إِذْ كَلَّمَتْ يُوسُفَ يَوْمًا فَيَوْمًا أَنَّهُ لَمْ يَسْمَعْ لَهَا أَنْ يَضْطَجعَ بِجَانِبِهَا لِيَكُونَ مَعَهَا.","11":"ثُمَّ حَدَثَ نَحْوَ هذَا الْوَقْتِ أَنَّهُ دَخَلَ الْبَيْتَ لِيَعْمَلَ عَمَلَهُ، وَلَمْ يَكُنْ إِنْسَانٌ مِنْ أَهْلِ الْبَيْتِ هُنَاكَ فِي الْبَيْتِ.","12":"فَأَمْسَكَتْهُ بِثَوْبِهِ قَائِلَةً: «اضْطَجعْ مَعِي!». فَتَرَكَ ثَوْبَهُ فِي يَدِهَا وَهَرَبَ وَخَرَجَ إِلَى خَارِجٍ."},"10.19":{"9":"وَدَخَلَ هُنَاكَ الْمُغَارَةَ وَبَاتَ فِيهَا. وَكَانَ كَلاَمُ الرَّبِّ إِلَيْهِ يَقُولُ: «مَا لَكَ ههُنَا يَا إِيلِيَّا؟»","10":"فَقَالَ: «قَدْ غِرْتُ غَيْرَةً لِلرَّبِّ إِلهِ الْجُنُودِ، لأَنَّ بَنِي إِسْرَائِيلَ قَدْ تَرَكُوا عَهْدَكَ، وَنَقَضُوا مَذَابِحَكَ، وَقَتَلُوا أَنْبِيَاءَكَ بِالسَّيْفِ، فَبَقِيتُ أَنَا وَحْدِي، وَهُمْ يَطْلُبُونَ نَفْسِي لِيَأْخُذُوهَا».","11":"فَقَالَ: «اخْرُجْ وَقِفْ عَلَى الْجَبَلِ أَمَامَ الرَّبِّ». وَإِذَا بِالرَّبِّ عَابِرٌ وَرِيحٌ عَظِيمَةٌ وَشَدِيدَةٌ قَدْ شَقَّتِ الْجِبَالَ وَكَسَّرَتِ الصُّخُورَ أَمَامَ الرَّبِّ، وَلَمْ يَكُنِ الرَّبُّ فِي الرِّيحِ. وَبَعْدَ الرِّيحِ زَلْزَلَةٌ، وَلَمْ يَكُنِ الرَّبُّ فِي الزَّلْزَلَةِ.","12":"وَبَعْدَ الزَّلْزَلَةِ نَارٌ، وَلَمْ يَكُنِ الرَّبُّ فِي النَّارِ. وَبَعْدَ النَّارِ صَوْتٌ مُنْخَفِضٌ خَفِيفٌ.","13":"فَلَمَّا سَمِعَ إِيلِيَّا لَفَّ وَجْهَهُ بِرِدَائِهِ وَخَرَجَ وَوَقَفَ فِي بَابِ الْمُغَارَةِ، وَإِذَا بِصَوْتٍ إِلَيْهِ يَقُولُ: «مَا لَكَ ههُنَا يَا إِيلِيَّا؟»","14":"فَقَالَ: «غِرْتُ غَيْرَةً لِلرَّبِّ إِلهِ الْجُنُودِ، لأَنَّ بَنِي إِسْرَائِيلَ قَدْ تَرَكُوا عَهْدَكَ، وَنَقَضُوا مَذَابِحَكَ، وَقَتَلُوا أَنْبِيَاءَكَ بِالسَّيْفِ، فَبَقِيتُ أَنَا وَحْدِي، وَهُمْ يَطْلُبُونَ نَفْسِي لِيَأْخُذُوهَا».","15":"فَقَالَ لَهُ الرَّبُّ: «اذْهَبْ رَاجِعًا فِي طَرِيقِكَ إِلَى بَرِّيَّةِ دِمِشْقَ، وَادْخُلْ وَامْسَحْ حَزَائِيلَ مَلِكًا عَلَى أَرَامَ،","16":"وَامْسَحْ يَاهُوَ بْنَ نِمْشِي مَلِكًا عَلَى إِسْرَائِيلَ، وَامْسَحْ أَلِيشَعَ بْنَ شَافَاطَ مِنْ آبَلَ مَحُولَةَ نَبِيًّا عِوَضًا عَنْكَ.","17":"فَالَّذِي يَنْجُو مِنْ سَيْفِ حَزَائِيلَ يَقْتُلُهُ يَاهُو، وَالَّذِي يَنْجُو مِنْ سَيْفِ يَاهُو يَقْتُلُهُ أَلِيشَعُ.","18":"وَقَدْ أَبْقَيْتُ فِي إِسْرَائِيلَ سَبْعَةَ آلاَفٍ، كُلَّ الرُّكَبِ الَّتِي لَمْ تَجْثُ لِلْبَعْلِ وَكُلَّ فَمٍ لَمْ يُقَبِّلْهُ».","1":"وَأَخْبَرَ أَخْآبُ إِيزَابَلَ بِكُلِّ مَا عَمِلَ إِيلِيَّا، وَكَيْفَ أَنَّهُ قَتَلَ جَمِيعَ الأَنْبِيَاءِ بِالسَّيْفِ.","2":"فَأَرْسَلَتْ إِيزَابَلُ رَسُولاً إِلَى إِيلِيَّا تَقُولُ: «هكَذَا تَفْعَلُ الآلِهَةُ وَهكَذَا تَزِيدُ، إِنْ لَمْ أَجْعَلْ نَفْسَكَ كَنَفْسِ وَاحِدٍ مِنْهُمْ فِي نَحْوِ هذَا الْوَقْتِ غَدًا».","3":"فَلَمَّا رَأَى ذلِكَ قَامَ وَمَضَى لأَجْلِ نَفْسِهِ، وَأَتَى إِلَى بِئْرِ سَبْعٍ الَّتِي لِيَهُوذَا وَتَرَكَ غُلاَمَهُ هُنَاكَ.","4":"ثُمَّ سَارَ فِي الْبَرِّيَّةِ مَسِيرَةَ يَوْمٍ، حَتَّى أَتَى وَجَلَسَ تَحْتَ رَتَمَةٍ وَطَلَبَ الْمَوْتَ لِنَفْسِهِ، وَقَالَ: «قَدْ كَفَى الآنَ يَا رَبُّ. خُذْ نَفْسِي لأَنِّي لَسْتُ خَيْرًا مِنْ آبَائِي».","5":"وَاضْطَجَعَ وَنَامَ تَحْتَ الرَّتَمَةِ. وَإِذَا بِمَلاَكٍ قَدْ مَسَّهُ وَقَالَ: «قُمْ وَكُلْ».","6":"فَتَطَلَّعَ وَإِذَا كَعْكَةُ رَضْفٍ وَكُوزُ مَاءٍ عِنْدَ رَأْسِهِ، فَأَكَلَ وَشَرِبَ ثُمَّ رَجَعَ فَاضْطَجَعَ.","7":"ثُمَّ عَادَ مَلاَكُ الرَّبِّ ثَانِيَةً فَمَسَّهُ وَقَالَ: «قُمْ وَكُلْ، لأَنَّ الْمَسَافَةَ كَثِيرَةٌ عَلَيْكَ».","8":"فَقَامَ وَأَكَلَ وَشَرِبَ، وَسَارَ بِقُوَّةِ تِلْكَ الأَكْلَةِ أَرْبَعِينَ نَهَارًا وَأَرْبَعِينَ لَيْلَةً إِلَى جَبَلِ اللهِ حُورِيبَ،"},"42.5":{"1":"وَبَعْدَ هذَا كَانَ عِيدٌ لِلْيَهُودِ، فَصَعِدَ يَسُوعُ إِلَى أُورُشَلِيمَ.","2":"وَفِي أُورُشَلِيمَ عِنْدَ بَابِ الضَّأْنِ بِرْكَةٌ يُقَالُ لَهَا بِالْعِبْرَانِيَّةِ «بَيْتُ حِسْدَا» لَهَا خَمْسَةُ أَرْوِقَةٍ.","3":"فِي هذِهِ كَانَ مُضْطَجِعًا جُمْهُورٌ كَثِيرٌ مِنْ مَرْضَى وَعُمْيٍ وَعُرْجٍ وَعُسْمٍ، يَتَوَقَّعُونَ تَحْرِيكَ الْمَاءِ.","4":"لأَنَّ مَلاَكًا كَانَ يَنْزِلُ أَحْيَانًا فِي الْبِرْكَةِ وَيُحَرِّكُ الْمَاءَ. فَمَنْ نَزَلَ أَوَّلاً بَعْدَ تَحْرِيكِ الْمَاءِ كَانَ يَبْرَأُ مِنْ أَيِّ مَرَضٍ اعْتَرَاهُ.","5":"وَكَانَ هُنَاكَ إِنْسَانٌ بِهِ مَرَضٌ مُنْذُ ثَمَانٍ وَثَلاَثِينَ سَنَةً.","6":"هذَا رَآهُ يَسُوعُ مُضْطَجِعًا، وَعَلِمَ أَنَّ لَهُ زَمَانًا كَثِيرًا، فَقَالَ لَهُ: «أَتُرِيدُ أَنْ تَبْرَأَ؟»","7":"أَجَابَهُ الْمَرِيضُ:«يَا سَيِّدُ، لَيْسَ لِي إِنْسَانٌ يُلْقِينِي فِي الْبِرْكَةِ مَتَى تَحَرَّكَ الْمَاءُ. بَلْ بَيْنَمَا أَنَا آتٍ، يَنْزِلُ قُدَّامِي آخَرُ».","8":"قَالَ لَهُ يَسُوعُ:«قُمِ. احْمِلْ سَرِيرَكَ وَامْشِ».","9":"فَحَالاً بَرِئَ الإِنْسَانُ وَحَمَلَ سَرِيرَهُ وَمَشَى. وَكَانَ فِي ذلِكَ الْيَوْمِ سَبْتٌ.","24":"«اَلْحَقَّ الْحَقَّ أَقُولُ لَكُمْ: إِنَّ مَنْ يَسْمَعُ كَلاَمِي وَيُؤْمِنُ بِالَّذِي أَرْسَلَنِي فَلَهُ حَيَاةٌ أَبَدِيَّةٌ، وَلاَ يَأْتِي إِلَى دَيْنُونَةٍ، بَلْ قَدِ انْتَقَلَ مِنَ الْمَوْتِ إِلَى الْحَيَاةِ."},"43.16":{"22":"فَقَامَ الْجَمْعُ مَعًا عَلَيْهِمَا، وَمَزَّقَ الْوُلاَةُ ثِيَابَهُمَا وَأَمَرُوا أَنْ يُضْرَبَا بِالْعِصِيِّ.","23":"فَوَضَعُوا عَلَيْهِمَا ضَرَبَاتٍ كَثِيرَةً وَأَلْقُوهُمَا فِي السِّجْنِ، وَأَوْصَوْا حَافِظَ السِّجْنِ أَنْ يَحْرُسَهُمَا بِضَبْطٍ.","24":"وَهُوَ إِذْ أَخَذَ وَصِيَّةً مِثْلَ هذِهِ، أَلْقَاهُمَا فِي السِّجْنِ الدَّاخِلِيِّ، وَضَبَطَ أَرْجُلَهُمَا فِي الْمِقْطَرَةِ.","25":"وَنَحْوَ نِصْفِ اللَّيْلِ كَانَ بُولُسُ وَسِيلاَ يُصَلِّيَانِ وَيُسَبِّحَانِ اللهَ، وَالْمَسْجُونُونَ يَسْمَعُونَهُمَا.","26":"فَحَدَثَ بَغْتَةً زَلْزَلَةٌ عَظِيمَةٌ حَتَّى تَزَعْزَعَتْ أَسَاسَاتُ السِّجْنِ، فَانْفَتَحَتْ فِي الْحَالِ الأَبْوَابُ كُلُّهَا، وَانْفَكَّتْ قُيُودُ الْجَمِيعِ.","6":"وَبَعْدَ مَا اجْتَازُوا فِي فِرِيجِيَّةَ وَكُورَةِ غَلاَطِيَّةَ، مَنَعَهُمُ الرُّوحُ الْقُدُسُ أَنْ يَتَكَلَّمُوا بِالْكَلِمَةِ فِي أَسِيَّا.","7":"فَلَمَّا أَتَوْا إِلَى مِيسِيَّا حَاوَلُوا أَنْ يَذْهَبُوا إِلَى بِثِينِيَّةَ، فَلَمْ يَدَعْهُمُ الرُّوحُ.","8":"فَمَرُّوا عَلَى مِيسِيَّا وَانْحَدَرُوا إِلَى تَرُوَاسَ.","9":"وَظَهَرَتْ لِبُولُسَ رُؤْيَا فِي اللَّيْلِ: رَجُلٌ مَكِدُونِيٌّ قَائِمٌ يَطْلُبُ إِلَيْهِ وَيَقُولُ:«اعْبُرْ إِلَى مَكِدُونِيَّةَ وَأَعِنَّا!».","10":"فَلَمَّا رَأَى الرُّؤْيَا لِلْوَقْتِ طَلَبْنَا أَنْ نَخْرُجَ إِلَى مَكِدُونِيَّةَ، مُتَحَقِّقِينَ أَنَّ الرَّبَّ قَدْ دَعَانَا لِنُبَشِّرَهُمْ.","31":"فَقَالاَ:«آمِنْ بِالرَّبِّ يَسُوعَ الْمَسِيحِ فَتَخْلُصَ أَنْتَ وَأَهْلُ بَيْتِكَ»."},"39.11":{"28":"تَعَالَوْا إِلَيَّ يَا جَمِيعَ الْمُتْعَبِينَ وَالثَّقِيلِي الأَحْمَالِ، وَأَنَا أُرِيحُكُمْ.","29":"اِحْمِلُوا نِيرِي عَلَيْكُمْ وَتَعَلَّمُوا مِنِّي، لأَنِّي وَدِيعٌ وَمُتَوَاضِعُ الْقَلْبِ، فَتَجِدُوا رَاحَةً لِنُفُوسِكُمْ.","30":"لأَنَّ نِيرِي هَيِّنٌ وَحِمْلِي خَفِيفٌ».","2":"أَمَّا يُوحَنَّا فَلَمَّا سَمِعَ فِي السِّجْنِ بِأَعْمَالِ الْمَسِيحِ، أَرْسَلَ اثْنَيْنِ مِنْ تَلاَمِيذِهِ،","3":"وَقَالَ لَهُ:«أَنْتَ هُوَ الآتِي أَمْ نَنْتَظِرُ آخَرَ؟»","4":"فَأَجَابَ يَسُوعُ وَقَالَ لَهُمَا:«اذْهَبَا وَأَخْبِرَا يُوحَنَّا بِمَا تَسْمَعَانِ وَتَنْظُرَانِ:","5":"اَلْعُمْيُ يُبْصِرُونَ، وَالْعُرْجُ يَمْشُونَ، وَالْبُرْصُ يُطَهَّرُونَ، وَالصُّمُّ يَسْمَعُونَ، وَالْمَوْتَى يَقُومُونَ، وَالْمَسَاكِينُ يُبَشَّرُونَ.","6":"وَطُوبَى لِمَنْ لاَ يَعْثُرُ فِيَّ»."},"22.40":{"28":"أَمَا عَرَفْتَ أَمْ لَمْ تَسْمَعْ؟ إِلهُ الدَّهْرِ الرَّبُّ خَالِقُ أَطْرَافِ الأَرْضِ لاَ يَكِلُّ وَلاَ يَعْيَا. لَيْسَ عَنْ فَهْمِهِ فَحْصٌ.","29":"يُعْطِي الْمُعْيِيَ قُدْرَةً، وَلِعَدِيمِ الْقُوَّةِ يُكَثِّرُ شِدَّةً.","30":"اَلْغِلْمَانُ يُعْيُونَ وَيَتْعَبُونَ، وَالْفِتْيَانُ يَتَعَثَّرُونَ تَعَثُّرًا.","31":"وَأَمَّا مُنْتَظِرُو الرَّبِّ فَيُجَدِّدُونَ قُوَّةً. يَرْفَعُونَ أَجْنِحَةً كَالنُّسُورِ. يَرْكُضُونَ وَلاَ يَتْعَبُونَ. يَمْشُونَ وَلاَ يُعْيُونَ."},"18.4":{"8":"بِسَلاَمَةٍ أَضْطَجعُ بَلْ أَيْضًا أَنَامُ، لأَنَّكَ أَنْتَ يَا رَبُّ مُنْفَرِدًا فِي طُمَأْنِينَةٍ تُسَكِّنُنِي.","4":"اِرْتَعِدُوا وَلاَ تُخْطِئُوا. تَكَلَّمُوا فِي قُلُوبِكُمْ عَلَى مَضَاجِعِكُمْ وَاسْكُتُوا. سِلاَهْ."},"22.30":{"15":"لأَنَّهُ هكَذَا قَالَ السَّيِّدُ الرَّبُّ قُدُّوسُ إِسْرَائِيلَ: «بِالرُّجُوعِ وَالسُّكُونِ تَخْلُصُونَ. بِالْهُدُوءِ وَالطُّمَأْنِينَةِ تَكُونُ قُوَّتُكُمْ». فَلَمْ تَشَاءُوا.","21":"وَأُذُنَاكَ تَسْمَعَانِ كَلِمَةً خَلْفَكَ قَائِلَةً: «هذِهِ هِيَ الطَّرِيقُ. اسْلُكُوا فِيهَا». حِينَمَا تَمِيلُونَ إِلَى الْيَمِينِ وَحِينَمَا تَمِيلُونَ إِلَى الْيَسَارِ.","18":"وَلِذلِكَ يَنْتَظِرُ الرَّبُّ لِيَتَرَاءَفَ عَلَيْكُمْ. وَلِذلِكَ يَقُومُ لِيَرْحَمَكُمْ، لأَنَّ الرَّبَّ إِلهُ حَقّ. طُوبَى لِجَمِيعِ مُنْتَظِرِيهِ."},"46.4":{"16":"لِذلِكَ لاَ نَفْشَلُ، بَلْ وَإِنْ كَانَ إِنْسَانُنَا الْخَارِجُ يَفْنَى، فَالدَّاخِلُ يَتَجَدَّدُ يَوْمًا فَيَوْمًا.","8":"مُكْتَئِبِينَ فِي كُلِّ شَيْءٍ، لكِنْ غَيْرَ مُتَضَايِقِينَ. مُتَحَيِّرِينَ، لكِنْ غَيْرَ يَائِسِينَ.","9":"مُضْطَهَدِينَ، لكِنْ غَيْرَ مَتْرُوكِينَ. مَطْرُوحِينَ، لكِنْ غَيْرَ هَالِكِينَ.","17":"لأَنَّ خِفَّةَ ضِيقَتِنَا الْوَقْتِيَّةَ تُنْشِئُ لَنَا أَكْثَرَ فَأَكْثَرَ ثِقَلَ مَجْدٍ أَبَدِيًّا.","18":"وَنَحْنُ غَيْرُ نَاظِرِينَ إِلَى الأَشْيَاءِ الَّتِي تُرَى، بَلْ إِلَى الَّتِي لاَ تُرَى. لأَنَّ الَّتِي تُرَى وَقْتِيَّةٌ، وَأَمَّا الَّتِي لاَ تُرَى فَأَبَدِيَّةٌ.","7":"وَلكِنْ لَنَا هذَا الْكَنْزُ فِي أَوَانٍ خَزَفِيَّةٍ، لِيَكُونَ فَضْلُ الْقُوَّةِ للهِِ لاَ مِنَّا."},"47.6":{"9":"فَلاَ نَفْشَلْ فِي عَمَلِ الْخَيْرِ لأَنَّنَا سَنَحْصُدُ فِي وَقْتِهِ إِنْ كُنَّا لاَ نَكِلُّ."},"18.121":{"1":"أَرْفَعُ عَيْنَيَّ إِلَى الْجِبَالِ، مِنْ حَيْثُ يَأْتِي عَوْنِي!","2":"مَعُونَتِي مِنْ عِنْدِ الرَّبِّ، صَانِعِ السَّمَاوَاتِ وَالأَرْضِ.","3":"لاَ يَدَعُ رِجْلَكَ تَزِلُّ. لاَ يَنْعَسُ حَافِظُكَ.","4":"إِنَّهُ لاَ يَنْعَسُ وَلاَ يَنَامُ حَافِظُ إِسْرَائِيلَ.","5":"الرَّبُّ حَافِظُكَ. الرَّبُّ ظِلٌّ لَكَ عَنْ يَدِكَ الْيُمْنَى.","6":"لاَ تَضْرِبُكَ الشَّمْسُ فِي النَّهَارِ، وَلاَ الْقَمَرُ فِي اللَّيْلِ.","7":"الرَّبُّ يَحْفَظُكَ مِنْ كُلِّ شَرّ. يَحْفَظُ نَفْسَكَ.","8":"الرَّبُّ يَحْفَظُ خُرُوجَكَ وَدُخُولَكَ مِنَ الآنَ وَإِلَى الدَّهْرِ."},"1.33":{"14":"فَقَالَ: «وَجْهِي يَسِيرُ فَأُرِيحُكَ»."},"18.116":{"7":"ارْجِعِي يَا نَفْسِي إِلَى رَاحَتِكِ، لأَنَّ الرَّبَّ قَدْ أَحْسَنَ إِلَيْكِ.","15":"عَزِيزٌ فِي عَيْنَيِ الرَّبِّ مَوْتُ أَتْقِيَائِهِ.","12":"مَاذَا أَرُدُّ لِلرَّبِّ مِنْ أَجْلِ كُلِّ حَسَنَاتِهِ لِي؟"},"40.6":{"31":"فَقَالَ لَهُمْ:«تَعَالَوْا أَنْتُمْ مُنْفَرِدِينَ إِلَى مَوْضِعٍ خَلاَءٍ وَاسْتَرِيحُوا قَلِيلاً». لأَنَّ الْقَادِمِينَ وَالذَّاهِبِينَ كَانُوا كَثِيرِينَ، وَلَمْ تَتَيَسَّرْ لَهُمْ فُرْصَةٌ لِلأَكْلِ.","30":"وَاجْتَمَعَ الرُّسُلُ إِلَى يَسُوعَ وَأَخْبَرُوهُ بِكُلِّ شَيْءٍ، كُلِّ مَا فَعَلُوا وَكُلِّ مَا عَلَّمُوا.","32":"فَمَضَوْا فِي السَّفِينَةِ إِلَى مَوْضِعٍ خَلاَءٍ مُنْفَرِدِينَ.","33":"فَرَآهُمُ الْجُمُوعُ مُنْطَلِقِينَ، وَعَرَفَهُ كَثِيرُونَ. فَتَرَاكَضُوا إِلَى هُنَاكَ مِنْ جَمِيعِ الْمُدُنِ مُشَاةً، وَسَبَقُوهُمْ وَاجْتَمَعُوا إِلَيْهِ.","34":"فَلَمَّا خَرَجَ يَسُوعُ رَأَى جَمْعًا كَثِيرًا، فَتَحَنَّنَ عَلَيْهِمْ إِذْ كَانُوا كَخِرَافٍ لاَ رَاعِيَ لَهَا، فَابْتَدَأَ يُعَلِّمُهُمْ كَثِيرًا."},"23.31":{"25":"لأَنِّي أَرْوَيْتُ النَّفْسَ الْمُعْيِيَةَ، وَمَلأْتُ كُلَّ نَفْسٍ ذَائِبَةٍ.","34":"وَلاَ يُعَلِّمُونَ بَعْدُ كُلُّ وَاحِدٍ صَاحِبَهُ، وَكُلُّ وَاحِدٍ أَخَاهُ، قَائِلِينَ: اعْرِفُوا الرَّبَّ، لأَنَّهُمْ كُلَّهُمْ سَيَعْرِفُونَنِي مِنْ صَغِيرِهِمْ إِلَى كَبِيرِهِمْ، يَقُولُ الرَّبُّ، لأَنِّي أَصْفَحُ عَنْ إِثْمِهِمْ، وَلاَ أَذْكُرُ خَطِيَّتَهُمْ بَعْدُ.","3":"تَرَاءَى لِي الرَّبُّ مِنْ بَعِيدٍ: «وَمَحَبَّةً أَبَدِيَّةً أَحْبَبْتُكِ، مِنْ أَجْلِ ذلِكَ أَدَمْتُ لَكِ الرَّحْمَةَ."},"18.127":{"2":"بَاطِلٌ هُوَ لَكُمْ أَنْ تُبَكِّرُوا إِلَى الْقِيَامِ، مُؤَخِّرِينَ الْجُلُوسَ، آكِلِينَ خُبْزَ الأَتْعَابِ. لكِنَّهُ يُعْطِي حَبِيبَهُ نَوْمًا.","3":"هُوَذَا الْبَنُونَ مِيرَاثٌ مِنْ عِنْدِ الرَّبِّ، ثَمَرَةُ الْبَطْنِ أُجْرَةٌ."},"57.4":{"9":"إِذًا بَقِيَتْ رَاحَةٌ لِشَعْبِ اللهِ!","10":"لأَنَّ الَّذِي دَخَلَ رَاحَتَهُ اسْتَرَاحَ هُوَ أَيْضًا مِنْ أَعْمَالِهِ، كَمَا اللهُ مِنْ أَعْمَالِهِ.","11":"فَلْنَجْتَهِدْ أَنْ نَدْخُلَ تِلْكَ الرَّاحَةَ، لِئَلاَّ يَسْقُطَ أَحَدٌ فِي عِبْرَةِ الْعِصْيَانِ هذِهِ عَيْنِهَا.","15":"لأَنْ لَيْسَ لَنَا رَئِيسُ كَهَنَةٍ غَيْرُ قَادِرٍ أَنْ يَرْثِيَ لِضَعَفَاتِنَا، بَلْ مُجَرَّبٌ فِي كُلِّ شَيْءٍ مِثْلُنَا، بِلاَ خَطِيَّةٍ.","16":"فَلْنَتَقَدَّمْ بِثِقَةٍ إِلَى عَرْشِ النِّعْمَةِ لِكَيْ نَنَالَ رَحْمَةً وَنَجِدَ نِعْمَةً عَوْنًا فِي حِينِهِ."},"18.3":{"5":"أَنَا اضْطَجَعْتُ وَنِمْتُ. اسْتَيْقَظْتُ لأَنَّ الرَّبَّ يَعْضُدُنِي.","3":"أَمَّا أَنْتَ يَا رَبُّ فَتُرْسٌ لِي. مَجْدِي وَرَافِعُ رَأْسِي.","4":"بِصَوْتِي إِلَى الرَّبِّ أَصْرُخُ، فَيُجِيبُنِي مِنْ جَبَلِ قُدْسِهِ. سِلاَهْ.","6":"لاَ أَخَافُ مِنْ رِبْوَاتِ الشُّعُوب الْمُصْطَفِّينَ عَلَيَّ مِنْ حَوْلِي."},"42.4":{"4":"وَكَانَ لاَ بُدَّ لَهُ أَنْ يَجْتَازَ السَّامِرَةَ.","5":"فَأَتَى إِلَى مَدِينَةٍ مِنَ السَّامِرَةِ يُقَالُ لَهَا سُوخَارُ، بِقُرْبِ الضَّيْعَةِ الَّتِي وَهَبَهَا يَعْقُوبُ لِيُوسُفَ ابْنِهِ.","6":"وَكَانَتْ هُنَاكَ بِئْرُ يَعْقُوبَ. فَإِذْ كَانَ يَسُوعُ قَدْ تَعِبَ مِنَ السَّفَرِ، جَلَسَ هكَذَا عَلَى الْبِئْرِ، وَكَانَ نَحْوَ السَّاعَةِ السَّادِسَةِ.","7":"فَجَاءَتِ امْرَأَةٌ مِنَ السَّامِرَةِ لِتَسْتَقِيَ مَاءً، فَقَالَ لَهَا يَسُوعُ:«أَعْطِينِي لأَشْرَبَ»","8":"لأَنَّ تَلاَمِيذَهُ كَانُوا قَدْ مَضَوْا إِلَى الْمَدِينَةِ لِيَبْتَاعُوا طَعَامًا.","9":"فَقَالَتْ لَهُ الْمَرْأَةُ السَّامِرِيَّةُ:«كَيْفَ تَطْلُبُ مِنِّي لِتَشْرَبَ، وَأَنْتَ يَهُودِيٌّ وَأَنَا امْرَأَةٌ سَامِرِيَّةٌ؟» لأَنَّ الْيَهُودَ لاَ يُعَامِلُونَ السَّامِرِيِّينَ.","10":"أَجَابَ يَسُوعُ وَقَالَ لَهاَ:«لَوْ كُنْتِ تَعْلَمِينَ عَطِيَّةَ اللهِ، وَمَنْ هُوَ الَّذِي يَقُولُ لَكِ أَعْطِينِي لأَشْرَبَ، لَطَلَبْتِ أَنْتِ مِنْهُ فَأَعْطَاكِ مَاءً حَيًّا».","11":"قَالَتْ لَهُ الْمَرْأَةُ:«يَا سَيِّدُ، لاَ دَلْوَ لَكَ وَالْبِئْرُ عَمِيقَةٌ. فَمِنْ أَيْنَ لَكَ الْمَاءُ الْحَيُّ؟","12":"أَلَعَلَّكَ أَعْظَمُ مِنْ أَبِينَا يَعْقُوبَ، الَّذِي أَعْطَانَا الْبِئْرَ، وَشَرِبَ مِنْهَا هُوَ وَبَنُوهُ وَمَوَاشِيهِ؟»","13":"أَجَابَ يَسُوعُ وَقَالَ لَهاَ:«كُلُّ مَنْ يَشْرَبُ مِنْ هذَا الْمَاءِ يَعْطَشُ أَيْضًا.","14":"وَلكِنْ مَنْ يَشْرَبُ مِنَ الْمَاءِ الَّذِي أُعْطِيهِ أَنَا فَلَنْ يَعْطَشَ إِلَى الأَبَدِ، بَلِ الْمَاءُ الَّذِي أُعْطِيهِ يَصِيرُ فِيهِ يَنْبُوعَ مَاءٍ يَنْبَعُ إِلَى حَيَاةٍ أَبَدِيَّةٍ».","46":"فَجَاءَ يَسُوعُ أَيْضًا إِلَى قَانَا الْجَلِيلِ، حَيْثُ صَنَعَ الْمَاءَ خَمْرًا. وَكَانَ خَادِمٌ لِلْمَلِكِ ابْنُهُ مَرِيضٌ فِي كَفْرِنَاحُومَ.","47":"هذَا إِذْ سَمِعَ أَنَّ يَسُوعَ قَدْ جَاءَ مِنَ الْيَهُودِيَّةِ إِلَى الْجَلِيلِ، انْطَلَقَ إِلَيْهِ وَسَأَلَهُ أَنْ يَنْزِلَ وَيَشْفِيَ ابْنَهُ لأَنَّهُ كَانَ مُشْرِفًا عَلَى الْمَوْتِ.","48":"فَقَالَ لَهُ يَسُوعُ:«لاَ تُؤْمِنُونَ إِنْ لَمْ تَرَوْا آيَاتٍ وَعَجَائِبَ»","49":"قَالَ لَهُ خَادِمُ الْمَلِكِ:«يَا سَيِّدُ، انْزِلْ قَبْلَ أَنْ يَمُوتَ ابْنِي».","50":"قَالَ لَهُ يَسُوعُ:«اذْهَبْ. اِبْنُكَ حَيٌّ». فَآمَنَ الرَّجُلُ بِالْكَلِمَةِ الَّتِي قَالَهَا لَهُ يَسُوعُ، وَذَهَبَ.","51":"وَفِيمَا هُوَ نَازِلٌ اسْتَقْبَلَهُ عَبِيدُهُ وَأَخْبَرُوهُ قَائِلِينَ:«إِنَّ ابْنَكَ حَيٌّ».","52":"فَاسْتَخْبَرَهُمْ عَنِ السَّاعَةِ الَّتِي فِيهَا أَخَذَ يَتَعَافَى، فَقَالُوا لَهُ:«أَمْسِ فِي السَّاعَةِ السَّابِعَةِ تَرَكَتْهُ الْحُمَّى».","53":"فَفَهِمَ الأَبُ أَنَّهُ فِي تِلْكَ السَّاعَةِ الَّتِي قَالَ لَهُ فِيهَا يَسُوعُ:«إِنَّ ابْنَكَ حَيٌّ». فَآمَنَ هُوَ وَبَيْتُهُ كُلُّهُ.","54":"هذِهِ أَيْضًا آيَةٌ ثَانِيَةٌ صَنَعَهَا يَسُوعُ لَمَّا جَاءَ مِنَ الْيَهُودِيَّةِ إِلَى الْجَلِيلِ.","15":"قَالَتْ لَهُ الْمَرْأَةُ:«يَا سَيِّدُ أَعْطِنِي هذَا الْمَاءَ، لِكَيْ لاَ أَعْطَشَ وَلاَ آتِيَ إِلَى هُنَا لأَسْتَقِيَ».","16":"قَالَ لَهَا يَسُوعُ:«اذْهَبِي وَادْعِي زَوْجَكِ وَتَعَالَيْ إِلَى ههُنَا»","17":"أَجَابَتِ الْمَرْأَةُ وَقَالتْ:«لَيْسَ لِي زَوْجٌ». قَالَ لَهَا يَسُوعُ:«حَسَنًا قُلْتِ: لَيْسَ لِي زَوْجٌ،","18":"لأَنَّهُ كَانَ لَكِ خَمْسَةُ أَزْوَاجٍ، وَالَّذِي لَكِ الآنَ لَيْسَ هُوَ زَوْجَكِ. هذَا قُلْتِ بِالصِّدْقِ».","19":"قَالَتْ لَهُ الْمَرْأَةُ:«يَا سَيِّدُ، أَرَى أَنَّكَ نَبِيٌّ!","20":"آبَاؤُنَا سَجَدُوا فِي هذَا الْجَبَلِ، وَأَنْتُمْ تَقُولُونَ إِنَّ فِي أُورُشَلِيمَ الْمَوْضِعَ الَّذِي يَنْبَغِي أَنْ يُسْجَدَ فِيهِ».","21":"قَالَ لَهَا يَسُوعُ:«يَا امْرَأَةُ، صَدِّقِينِي أَنَّهُ تَأْتِي سَاعَةٌ، لاَ فِي هذَا الْجَبَلِ، وَلاَ فِي أُورُشَلِيمَ تَسْجُدُونَ لِلآبِ.","22":"أَنْتُمْ تَسْجُدُونَ لِمَا لَسْتُمْ تَعْلَمُونَ، أَمَّا نَحْنُ فَنَسْجُدُ لِمَا نَعْلَمُ . لأَنَّ الْخَلاَصَ هُوَ مِنَ الْيَهُودِ.","23":"وَلكِنْ تَأْتِي سَاعَةٌ، وَهِيَ الآنَ، حِينَ السَّاجِدُونَ الْحَقِيقِيُّونَ يَسْجُدُونَ لِلآبِ بِالرُّوحِ وَالْحَقِّ، لأَنَّ الآبَ طَالِبٌ مِثْلَ هؤُلاَءِ السَّاجِدِينَ لَهُ.","24":"اَللهُ رُوحٌ. وَالَّذِينَ يَسْجُدُونَ لَهُ فَبِالرُّوحِ وَالْحَقِّ يَنْبَغِي أَنْ يَسْجُدُوا».","25":"قَالَتْ لَهُ الْمَرْأَةُ:«أَنَا أَعْلَمُ أَنَّ مَسِيَّا، الَّذِي يُقَالُ لَهُ الْمَسِيحُ، يَأْتِي. فَمَتَى جَاءَ ذَاكَ يُخْبِرُنَا بِكُلِّ شَيْءٍ».","26":"قَالَ لَهَا يَسُوعُ:«أَنَا الَّذِي أُكَلِّمُكِ هُوَ»."},"1.17":{"8":"وَأَتَى عَمَالِيقُ وَحَارَبَ إِسْرَائِيلَ فِي رَفِيدِيمَ.","9":"فَقَالَ مُوسَى لِيَشُوعَ: «انْتَخِبْ لَنَا رِجَالاً وَاخْرُجْ حَارِبْ عَمَالِيقَ. وَغَدًا أَقِفُ أَنَا عَلَى رَأْسِ التَّلَّةِ وَعَصَا اللهِ فِي يَدِي».","10":"فَفَعَلَ يَشُوعُ كَمَا قَالَ لَهُ مُوسَى لِيُحَارِبَ عَمَالِيقَ. وَأَمَّا مُوسَى وَهَارُونُ وَحُورُ فَصَعِدُوا عَلَى رَأْسِ التَّلَّةِ.","11":"وَكَانَ إِذَا رَفَعَ مُوسَى يَدَهُ أَنَّ إِسْرَائِيلَ يَغْلِبُ، وَإِذَا خَفَضَ يَدَهُ أَنَّ عَمَالِيقَ يَغْلِبُ.","12":"فَلَمَّا صَارَتْ يَدَا مُوسَى ثَقِيلَتَيْنِ، أَخَذَا حَجَرًا وَوَضَعَاهُ تَحْتَهُ فَجَلَسَ عَلَيْهِ. وَدَعَمَ هَارُونُ وَحُورُ يَدَيْهِ، الْوَاحِدُ مِنْ هُنَا وَالآخَرُ مِنْ هُنَاكَ. فَكَانَتْ يَدَاهُ ثَابِتَتَيْنِ إِلَى غُرُوبِ الشَّمْسِ.","13":"فَهَزَمَ يَشُوعُ عَمَالِيقَ وَقَوْمَهُ بِحَدِّ السَّيْفِ.","1":"ثُمَّ ارْتَحَلَ كُلُّ جَمَاعَةِ بَنِي إِسْرَائِيلَ مِنْ بَرِّيَّةِ سِينٍ بِحَسَبِ مَرَاحِلِهِمْ عَلَى مُوجِبِ أَمْرِ الرَّبِّ، وَنَزَلُوا فِي رَفِيدِيمَ. وَلَمْ يَكُنْ مَاءٌ لِيَشْرَبَ الشَّعْبُ.","2":"فَخَاصَمَ الشَّعْبُ مُوسَى وَقَالُوا: «أَعْطُونَا مَاءً لِنَشْرَبَ.» فَقَالَ لَهُمْ مُوسَى: «لِمَاذَا تُخَاصِمُونَنِي؟ لِمَاذَا تُجَرِّبُونَ الرَّبَّ؟»","3":"وَعَطِشَ هُنَاكَ الشَّعْبُ إِلَى الْمَاءِ، وَتَذَمَّرَ الشَّعْبُ عَلَى مُوسَى وَقَالُوا: «لِمَاذَا أَصْعَدْتَنَا مِنْ مِصْرَ لِتُمِيتَنَا وَأَوْلاَدَنَا وَمَوَاشِيَنَا بِالْعَطَشِ؟»","4":"فَصَرَخَ مُوسَى إِلَى الرَّبِّ قَائِلاً: «مَاذَا أَفْعَلُ بِهذَا الشَّعْبِ؟ بَعْدَ قَلِيل يَرْجُمُونَنِي».","5":"فَقَالَ الرَّبُّ لِمُوسَى: «مُرَّ قُدَّامَ الشَّعْبِ، وَخُذْ مَعَكَ مِنْ شُيُوخِ إِسْرَائِيلَ. وَعَصَاكَ الَّتِي ضَرَبْتَ بِهَا النَّهْرَ خُذْهَا فِي يَدِكَ وَاذْهَبْ.","6":"هَا أَنَا أَقِفُ أَمَامَكَ هُنَاكَ عَلَى الصَّخْرَةِ فِي حُورِيبَ، فَتَضْرِبُ الصَّخْرَةَ فَيَخْرُجُ مِنْهَا مَاءٌ لِيَشْرَبَ الشَّعْبُ». فَفَعَلَ مُوسَى هكَذَا أَمَامَ عُيُونِ شُيُوخِ إِسْرَائِيلَ.","7":"وَدَعَا اسْمَ الْمَوْضِعِ «مَسَّةَ وَمَرِيبَةَ» مِنْ أَجْلِ مُخَاصَمَةِ بَنِي إِسْرَائِيلَ، وَمِنْ أَجْلِ تَجْرِبَتِهِمْ لِلرَّبِّ قَائِلِينَ: «أَفِي وَسْطِنَا الرَّبُّ أَمْ لاَ؟»."},"48.4":{"26":"اِغْضَبُوا وَلاَ تُخْطِئُوا. لاَ تَغْرُبِ الشَّمْسُ عَلَى غَيْظِكُمْ،","27":"وَلاَ تُعْطُوا إِبْلِيسَ مَكَانًا.","31":"لِيُرْفَعْ مِنْ بَيْنِكُمْ كُلُّ مَرَارَةٍ وَسَخَطٍ وَغَضَبٍ وَصِيَاحٍ وَتَجْدِيفٍ مَعَ كُلِّ خُبْثٍ.","32":"وَكُونُوا لُطَفَاءَ بَعْضُكُمْ نَحْوَ بَعْضٍ، شَفُوقِينَ مُتَسَامِحِينَ كَمَا سَامَحَكُمُ اللهُ أَيْضًا فِي الْمَسِيحِ.","22":"أَنْ تَخْلَعُوا مِنْ جِهَةِ التَّصَرُّفِ السَّابِقِ الإِنْسَانَ الْعَتِيقَ الْفَاسِدَ بِحَسَبِ شَهَوَاتِ الْغُرُورِ،","23":"وَتَتَجَدَّدُوا بِرُوحِ ذِهْنِكُمْ،","24":"وَتَلْبَسُوا الإِنْسَانَ الْجَدِيدَ الْمَخْلُوقَ بِحَسَبِ اللهِ فِي الْبِرِّ وَقَدَاسَةِ الْحَقِّ."},"58.1":{"19":"إِذًا يَا إِخْوَتِي الأَحِبَّاءَ، لِيَكُنْ كُلُّ إِنْسَانٍ مُسْرِعًا فِي الاسْتِمَاعِ، مُبْطِئًا فِي التَّكَلُّمِ، مُبْطِئًا فِي الْغَضَبِ،","20":"لأَنَّ غَضَبَ الإِنْسَانِ لاَ يَصْنَعُ بِرَّ اللهِ.","5":"وَإِنَّمَا إِنْ كَانَ أَحَدُكُمْ تُعْوِزُهُ حِكْمَةٌ، فَلْيَطْلُبْ مِنَ اللهِ الَّذِي يُعْطِي الْجَمِيعَ بِسَخَاءٍ وَلاَ يُعَيِّرُ، فَسَيُعْطَى لَهُ.","6":"وَلكِنْ لِيَطْلُبْ بِإِيمَانٍ غَيْرَ مُرْتَابٍ الْبَتَّةَ، لأَنَّ الْمُرْتَابَ يُشْبِهُ مَوْجًا مِنَ الْبَحْرِ تَخْبِطُهُ الرِّيحُ وَتَدْفَعُهُ.","17":"كُلُّ عَطِيَّةٍ صَالِحَةٍ وَكُلُّ مَوْهِبَةٍ تَامَّةٍ هِيَ مِنْ فَوْقُ، نَازِلَةٌ مِنْ عِنْدِ أَبِي الأَنْوَارِ، الَّذِي لَيْسَ عِنْدَهُ تَغْيِيرٌ وَلاَ ظِلُّ دَوَرَانٍ.","12":"طُوبَى لِلرَّجُلِ الَّذِي يَحْتَمِلُ التَّجْرِبَةَ، لأَنَّهُ إِذَا تَزَكَّى يَنَالُ «إِكْلِيلَ الْحَيَاةِ» الَّذِي وَعَدَ بِهِ الرَّبُّ لِلَّذِينَ يُحِبُّونَهُ.","13":"لاَ يَقُلْ أَحَدٌ إِذَا جُرِّبَ: «إِنِّي أُجَرَّبُ مِنْ قِبَلِ اللهِ»، لأَنَّ اللهَ غَيْرُ مُجَرَّبٍ بِالشُّرُورِ، وَهُوَ لاَ يُجَرِّبُ أَحَدًا.","14":"وَلكِنَّ كُلَّ وَاحِدٍ يُجَرَّبُ إِذَا انْجَذَبَ وَانْخَدَعَ مِنْ شَهْوَتِهِ.","15":"ثُمَّ الشَّهْوَةُ إِذَا حَبِلَتْ تَلِدُ خَطِيَّةً، وَالْخَطِيَّةُ إِذَا كَمَلَتْ تُنْتِجُ مَوْتًا.","2":"اِحْسِبُوهُ كُلَّ فَرَحٍ يَا إِخْوَتِي حِينَمَا تَقَعُونَ فِي تَجَارِبَ مُتَنَوِّعَةٍ،","3":"عَالِمِينَ أَنَّ امْتِحَانَ إِيمَانِكُمْ يُنْشِئُ صَبْرًا.","4":"وَأَمَّا الصَّبْرُ فَلْيَكُنْ لَهُ عَمَلٌ تَامٌّ، لِكَيْ تَكُونُوا تَامِّينَ وَكَامِلِينَ غَيْرَ نَاقِصِينَ فِي شَيْءٍ."},"19.15":{"1":"اَلْجَوَابُ اللَّيِّنُ يَصْرِفُ الْغَضَبَ، وَالْكَلاَمُ الْمُوجعُ يُهَيِّجُ السَّخَطَ.","18":"اَلرَّجُلُ الْغَضُوبُ يُهَيِّجُ الْخُصُومَةَ، وَبَطِيءُ الْغَضَبِ يُسَكِّنُ الْخِصَامَ.","22":"مَقَاصِدُ بِغَيْرِ مَشُورَةٍ تَبْطُلُ، وَبِكَثْرَةِ الْمُشِيرِينَ تَقُومُ."},"19.14":{"29":"بَطِيءُ الْغَضَبِ كَثِيرُ الْفَهْمِ، وَقَصِيرُ الرُّوحِ مُعَلِّي الْحَمَقِ.","17":"اَلسَّرِيعُ الْغَضَبِ يَعْمَلُ بِالْحَمَقِ، وَذُو الْمَكَايِدِ يُشْنَأُ.","30":"حَيَاةُ الْجَسَدِ هُدُوءُ الْقَلْبِ، وَنَخْرُ الْعِظَامِ الْحَسَدُ.","26":"فِي مَخَافَةِ الرَّبِّ ثِقَةٌ شَدِيدَةٌ، وَيَكُونُ لِبَنِيهِ مَلْجَأٌ."},"19.16":{"32":"اَلْبَطِيءُ الْغَضَبِ خَيْرٌ مِنَ الْجَبَّارِ، وَمَالِكُ رُوحِهِ خَيْرٌ مِمَّنْ يَأْخُذُ مَدِينَةً.","9":"قَلْبُ الإِنْسَانِ يُفَكِّرُ فِي طَرِيقِهِ، وَالرَّبُّ يَهْدِي خَطْوَتَهُ.","16":"قِنْيَةُ الْحِكْمَةِ كَمْ هِيَ خَيْرٌ مِنَ الذَّهَبِ، وَقِنْيَةُ الْفَهْمِ تُخْتَارُ عَلَى الْفِضَّةِ!","3":"أَلْقِ عَلَى الرَّبِّ أَعْمَالَكَ فَتُثَبَّتَ أَفْكَارُكَ.","31":"تَاجُ جَمَال: شَيْبَةٌ تُوجَدُ فِي طَرِيقِ الْبِرِّ."},"20.7":{"9":"لاَ تُسْرِعْ بِرُوحِكَ إِلَى الْغَضَبِ، لأَنَّ الْغَضَبَ يَسْتَقِرُّ فِي حِضْنِ الْجُهَّالِ.","12":"لأَنَّ الَّذِي فِي ظِلِّ الْحِكْمَةِ هُوَ فِي ظِلِّ الْفِضَّةِ، وَفَضْلُ الْمَعْرِفَةِ هُوَ إِنَّ الْحِكْمَةَ تُحْيِي أَصْحَابَهَا."},"50.3":{"8":"وَأَمَّا الآنَ فَاطْرَحُوا عَنْكُمْ أَنْتُمْ أَيْضًا الْكُلَّ: الْغَضَبَ، السَّخَطَ، الْخُبْثَ، التَّجْدِيفَ، الْكَلاَمَ الْقَبِيحَ مِنْ أَفْوَاهِكُمْ.","15":"وَلْيَمْلِكْ فِي قُلُوبِكُمْ سَلاَمُ اللهِ الَّذِي إِلَيْهِ دُعِيتُمْ فِي جَسَدٍ وَاحِدٍ، وَكُونُوا شَاكِرِينَ.","16":"لِتَسْكُنْ فِيكُمْ كَلِمَةُ الْمَسِيحِ بِغِنىً، وَأَنْتُمْ بِكُلِّ حِكْمَةٍ مُعَلِّمُونَ وَمُنْذِرُونَ بَعْضُكُمْ بَعْضًا، بِمَزَامِيرَ وَتَسَابِيحَ وَأَغَانِيَّ رُوحِيَّةٍ، بِنِعْمَةٍ، مُتَرَنِّمِينَ فِي قُلُوبِكُمْ لِلرَّبِّ.","17":"وَكُلُّ مَا عَمِلْتُمْ بِقَوْل أَوْ فِعْل، فَاعْمَلُوا الْكُلَّ بِاسْمِ الرَّبِّ يَسُوعَ، شَاكِرِينَ اللهَ وَالآبَ بِهِ.","13":"مُحْتَمِلِينَ بَعْضُكُمْ بَعْضًا، وَمُسَامِحِينَ بَعْضُكُمْ بَعْضًا إِنْ كَانَ لأَحَدٍ عَلَى أَحَدٍ شَكْوَى. كَمَا غَفَرَ لَكُمُ الْمَسِيحُ هكَذَا أَنْتُمْ أَيْضًا.","23":"وَكُلُّ مَا فَعَلْتُمْ، فَاعْمَلُوا مِنَ الْقَلْبِ، كَمَا لِلرَّبِّ لَيْسَ لِلنَّاسِ،","24":"عَالِمِينَ أَنَّكُمْ مِنَ الرَّبِّ سَتَأْخُذُونَ جَزَاءَ الْمِيرَاثِ، لأَنَّكُمْ تَخْدِمُونَ الرَّبَّ الْمَسِيحَ.","12":"فَالْبَسُوا كَمُخْتَارِي اللهِ الْقِدِّيسِينَ الْمَحْبُوبِينَ أَحْشَاءَ رَأْفَاتٍ، وَلُطْفًا، وَتَوَاضُعًا، وَوَدَاعَةً، وَطُولَ أَنَاةٍ،","9":"لاَ تَكْذِبُوا بَعْضُكُمْ عَلَى بَعْضٍ، إِذْ خَلَعْتُمُ الإِنْسَانَ الْعَتِيقَ مَعَ أَعْمَالِهِ،","10":"وَلَبِسْتُمُ الْجَدِيدَ الَّذِي يَتَجَدَّدُ لِلْمَعْرِفَةِ حَسَبَ صُورَةِ خَالِقِهِ،","14":"وَعَلَى جَمِيعِ هذِهِ الْبَسُوا الْمَحَبَّةَ الَّتِي هِيَ رِبَاطُ الْكَمَالِ."},"44.12":{"19":"لاَ تَنْتَقِمُوا لأَنْفُسِكُمْ أَيُّهَا الأَحِبَّاءُ، بَلْ أَعْطُوا مَكَانًا لِلْغَضَبِ، لأَنَّهُ مَكْتُوبٌ:«لِيَ النَّقْمَةُ أَنَا أُجَازِي يَقُولُ الرَّبُّ.","20":"فَإِنْ جَاعَ عَدُوُّكَ فَأَطْعِمْهُ. وَإِنْ عَطِشَ فَاسْقِهِ. لأَنَّكَ إِنْ فَعَلْتَ هذَا تَجْمَعْ جَمْرَ نَارٍ عَلَى رَأْسِهِ».","21":"لاَ يَغْلِبَنَّكَ الشَّرُّ بَلِ اغْلِبِ الشَّرَّ بِالْخَيْرِ.","2":"وَلاَ تُشَاكِلُوا هذَا الدَّهْرَ، بَلْ تَغَيَّرُوا عَنْ شَكْلِكُمْ بِتَجْدِيدِ أَذْهَانِكُمْ، لِتَخْتَبِرُوا مَا هِيَ إِرَادَةُ اللهِ: الصَّالِحَةُ الْمَرْضِيَّةُ الْكَامِلَةُ.","17":"لاَ تُجَازُوا أَحَدًا عَنْ شَرّ بِشَرّ. مُعْتَنِينَ بِأُمُورٍ حَسَنَةٍ قُدَّامَ جَمِيعِ النَّاسِ.","18":"إِنْ كَانَ مُمْكِنًا فَحَسَبَ طَاقَتِكُمْ سَالِمُوا جَمِيعَ النَّاسِ.","12":"فَرِحِينَ فِي الرَّجَاءِ، صَابِرِينَ فِي الضَِّيْقِ، مُواظِبِينَ عَلَى الصَّلاَةِ،","1":"فَأَطْلُبُ إِلَيْكُمْ أَيُّهَا الإِخْوَةُ بِرَأْفَةِ اللهِ أَنْ تُقَدِّمُوا أَجْسَادَكُمْ ذَبِيحَةً حَيَّةً مُقَدَّسَةً مَرْضِيَّةً عِنْدَ اللهِ، عِبَادَتَكُمُ الْعَقْلِيَّةَ.","15":"فَرَحًا مَعَ الْفَرِحِينَ وَبُكَاءً مَعَ الْبَاكِينَ.","9":"اَلْمَحَبَّةُ فَلْتَكُنْ بِلاَ رِيَاءٍ. كُونُوا كَارِهِينَ الشَّرَّ، مُلْتَصِقِينَ بِالْخَيْرِ.","10":"وَادِّينَ بَعْضُكُمْ بَعْضًا بِالْمَحَبَّةِ الأَخَوِيَّةِ، مُقَدِّمِينَ بَعْضُكُمْ بَعْضًا فِي الْكَرَامَةِ."},"19.29":{"11":"اَلْجَاهِلُ يُظْهِرُ كُلَّ غَيْظِهِ، وَالْحَكِيمُ يُسَكِّنُهُ أَخِيرًا.","22":"اَلرَّجُلُ الْغَضُوبُ يُهَيِّجُ الْخِصَامَ، وَالرَّجُلُ السَّخُوطُ كَثِيرُ الْمَعَاصِي."},"19.19":{"11":"تَعَقُّلُ الإِنْسَانِ يُبْطِئُ غَضَبَهُ، وَفَخْرُهُ الصَّفْحُ عَنْ مَعْصِيَةٍ.","21":"فِي قَلْبِ الإِنْسَانِ أَفْكَارٌ كَثِيرَةٌ، لكِنْ مَشُورَةُ الرَّبِّ هِيَ تَثْبُتُ.","20":"اِسْمَعِ الْمَشُورَةَ وَاقْبَلِ التَّأْدِيبَ، لِكَيْ تَكُونَ حَكِيمًا فِي آخِرَتِكَ."},"19.17":{"27":"ذُو الْمَعْرِفَةِ يُبْقِي كَلاَمَهُ، وَذُو الْفَهْمِ وَقُورُ الرُّوحِ.","22":"الْقَلْبُ الْفَرْحَانُ يُطَيِّبُ الْجِسْمَ، وَالرُّوحُ الْمُنْسَحِقَةُ تُجَفِّفُ الْعَظْمَ.","17":"اَلصَّدِيقُ يُحِبُّ فِي كُلِّ وَقْتٍ، أَمَّا الأَخُ فَلِلشِّدَّةِ يُولَدُ.","6":"تَاجُ الشُّيُوخِ بَنُو الْبَنِينَ، وَفَخْرُ الْبَنِينَ آبَاؤُهُمْ."},"31.4":{"1":"فَغَمَّ ذلِكَ يُونَانَ غَمًّا شَدِيدًا، فَاغْتَاظَ.","2":"وَصَلَّى إِلَى الرَّبِّ وَقَالَ: «آهِ يَا رَبُّ، أَلَيْسَ هذَا كَلاَمِي إِذْ كُنْتُ بَعْدُ فِي أَرْضِي؟ لِذلِكَ بَادَرْتُ إِلَى الْهَرَبِ إِلَى تَرْشِيشَ، لأَنِّي عَلِمْتُ أَنَّكَ إِلهٌ رَؤُوفٌ وَرَحِيمٌ بَطِيءُ الْغَضَبِ وَكَثِيرُ الرَّحْمَةِ وَنَادِمٌ عَلَى الشَّرِّ.","3":"فَالآنَ يَا رَبُّ، خُذْ نَفْسِي مِنِّي، لأَنَّ مَوْتِي خَيْرٌ مِنْ حَيَاتِي».","4":"فَقَالَ الرَّبُّ: «هَلِ اغْتَظْتَ بِالصَّوَابِ؟».","5":"وَخَرَجَ يُونَانُ مِنَ الْمَدِينَةِ وَجَلَسَ شَرْقِيَّ الْمَدِينَةِ، وَصَنَعَ لِنَفْسِهِ هُنَاكَ مَظَلَّةً وَجَلَسَ تَحْتَهَا فِي الظِّلِّ، حَتَّى يَرَى مَاذَا يَحْدُثُ فِي الْمَدِينَةِ.","6":"فَأَعَدَّ الرَّبُّ الإِلهُ يَقْطِينَةً فَارْتَفَعَتْ فَوْقَ يُونَانَ لِتَكُونَ ظِلاُ عَلَى رَأْسِهِ، لِكَيْ يُخَلِّصَهُ مِنْ غَمِّهِ. فَفَرِحَ يُونَانُ مِنْ أَجْلِ الْيَقْطِينَةِ فَرَحًا عَظِيمًا.","7":"ثُمَّ أَعَدَّ اللهُ دُودَةً عِنْدَ طُلُوعِ الْفَجْرِ في الْغَدِ، فَضَرَبَتِ الْيَقْطِينَةَ فَيَبِسَتْ.","8":"وَحَدَثَ عِنْدَ طُلُوعِ الشَّمْسِ أَنَّ اللهَ أَعَدَّ رِيحًا شَرْقِيَّةً حَارَّةً، فَضَرَبَتِ الشَّمْسُ عَلَى رَأْسِ يُونَانَ فَذَبُلَ. فَطَلَبَ لِنَفْسِهِ الْمَوْتَ، وَقَالَ: «مَوْتِي خَيْرٌ مِنْ حَيَاتِي».","9":"فَقَالَ اللهُ لِيُونَانَ: «هَلِ اغْتَظْتَ بِالصَّوَابِ مِنْ أَجْلِ الْيَقْطِينَةِ؟» فَقَالَ: «اغْتَظْتُ بِالصَّوَابِ حَتَّى الْمَوْتِ».","10":"فَقَالَ الرَّبُّ: «أَنْتَ شَفِقْتَ عَلَى الْيَقْطِينَةِ الَّتِي لَمْ تَتْعَبْ فِيهَا وَلاَ رَبَّيْتَهَا، الَّتِي بِنْتَ لَيْلَةٍ كَانَتْ وَبِنْتَ لَيْلَةٍ هَلَكَتْ.","11":"أَفَلاَ أَشْفَقُ أَنَا عَلَى نِينَوَى الْمَدِينَةِ الْعَظِيمَةِ الَّتِي يُوجَدُ فِيهَا أَكْثَرُ مِنِ اثْنَتَيْ عَشَرَةَ رِبْوَةً مِنَ النَّاسِ الَّذِينَ لاَ يَعْرِفُونَ يَمِينَهُمْ مِنْ شِمَالِهِمْ، وَبَهَائِمُ كَثِيرَةٌ؟»."},"0.4":{"1":"وَعَرَفَ آدَمُ حَوَّاءَ امْرَأَتَهُ فَحَبِلَتْ وَوَلَدَتْ قَايِينَ. وَقَالَتِ: «اقْتَنَيْتُ رَجُلاً مِنْ عِنْدِ الرَّبِّ».","2":"ثُمَّ عَادَتْ فَوَلَدَتْ أَخَاهُ هَابِيلَ. وَكَانَ هَابِيلُ رَاعِيًا لِلْغَنَمِ، وَكَانَ قَايِينُ عَامِلاً فِي الأَرْضِ.","3":"وَحَدَثَ مِنْ بَعْدِ أَيَّامٍ أَنَّ قَايِينَ قَدَّمَ مِنْ أَثْمَارِ الأَرْضِ قُرْبَانًا لِلرَّبِّ،","4":"وَقَدَّمَ هَابِيلُ أَيْضًا مِنْ أَبْكَارِ غَنَمِهِ وَمِنْ سِمَانِهَا. فَنَظَرَ الرَّبُّ إِلَى هَابِيلَ وَقُرْبَانِهِ،","5":"وَلكِنْ إِلَى قَايِينَ وَقُرْبَانِهِ لَمْ يَنْظُرْ. فَاغْتَاظَ قَايِينُ جِدًّا وَسَقَطَ وَجْهُهُ.","6":"فَقَالَ الرَّبُّ لِقَايِينَ: «لِمَاذَا اغْتَظْتَ؟ وَلِمَاذَا سَقَطَ وَجْهُكَ؟","7":"إِنْ أَحْسَنْتَ أَفَلاَ رَفْعٌ؟ وَإِنْ لَمْ تُحْسِنْ فَعِنْدَ الْبَابِ خَطِيَّةٌ رَابِضَةٌ، وَإِلَيْكَ اشْتِيَاقُهَا وَأَنْتَ تَسُودُ عَلَيْهَا».","8":"وَكَلَّمَ قَايِينُ هَابِيلَ أَخَاهُ. وَحَدَثَ إِذْ كَانَا فِي الْحَقْلِ أَنَّ قَايِينَ قَامَ عَلَى هَابِيلَ أَخِيهِ وَقَتَلَهُ."},"0.33":{"1":"وَرَفَعَ يَعْقُوبُ عَيْنَيْهِ وَنَظَرَ وَإِذَا عِيسُو مُقْبِلٌ وَمَعَهُ أَرْبَعُ مِئَةِ رَجُل، فَقَسَمَ الأَوْلاَدَ عَلَى لَيْئَةَ وَعَلَى رَاحِيلَ وَعَلَى الْجَارِيَتَيْنِ.","2":"وَوَضَعَ الْجَارِيَتَيْنِ وَأَوْلاَدَهُمَا أَوَّلاً، وَلَيْئَةَ وَأَوْلاَدَهَا وَرَاءَهُمْ، وَرَاحِيلَ وَيُوسُفَ أَخِيرًا.","3":"وَأَمَّا هُوَ فَاجْتَازَ قُدَّامَهُمْ وَسَجَدَ إِلَى الأَرْضِ سَبْعَ مَرَّاتٍ حَتَّى اقْتَرَبَ إِلَى أَخِيهِ.","4":"فَرَكَضَ عِيسُو لِلِقَائِهِ وَعَانَقَهُ وَوَقَعَ عَلَى عُنُقِهِ وَقَبَّلَهُ، وَبَكَيَا.","5":"ثُمَّ رَفَعَ عَيْنَيْهِ وَأَبْصَرَ النِّسَاءَ وَالأَوْلاَدَ وَقَالَ: «مَا هؤُلاَءِ مِنْكَ؟» فَقَالَ: «الأَوْلاَدُ الَّذِينَ أَنْعَمَ اللهُ بِهِمْ عَلَى عَبْدِكَ».","6":"فَاقْتَرَبَتِ الْجَارِيَتَانِ هُمَا وَأَوْلاَدُهُمَا وَسَجَدَتَا.","7":"ثُمَّ اقْتَرَبَتْ لَيْئَةُ أَيْضًا وَأَوْلاَدُهَا وَسَجَدُوا. وَبَعْدَ ذلِكَ اقْتَرَبَ يُوسُفُ وَرَاحِيلُ وَسَجَدَا.","8":"فَقَالَ: «مَاذَا مِنْكَ كُلُّ هذَا الْجَيْشِ الَّذِي صَادَفْتُهُ؟» فَقَالَ: «لأَجِدَ نِعْمَةً فِي عَيْنَيْ سَيِّدِي».","9":"فَقَالَ عِيسُو: «لِي كَثِيرٌ، يَا أَخِي. لِيَكُنْ لَكَ الَّذِي لَكَ».","10":"فَقَالَ يَعْقُوبُ: «لاَ. إِنْ وَجَدْتُ نِعْمَةً فِي عَيْنَيْكَ تَأْخُذْ هَدِيَّتِي مِنْ يَدِي، لأَنِّي رَأَيْتُ وَجْهَكَ كَمَا يُرَى وَجْهُ اللهِ، فَرَضِيتَ عَلَيَّ.","11":"خُذْ بَرَكَتِي الَّتِي أُتِيَ بِهَا إِلَيْكَ، لأَنَّ اللهَ قَدْ أَنْعَمَ عَلَيَّ وَلِي كُلُّ شَيْءٍ». وَأَلَحَّ عَلَيْهِ فَأَخَذَ."},"41.9":{"51":"وَحِينَ تَمَّتِ الأَيَّامُ لارْتِفَاعِهِ ثَبَّتَ وَجْهَهُ لِيَنْطَلِقَ إِلَى أُورُشَلِيمَ،","52":"وَأَرْسَلَ أَمَامَ وَجْهِهِ رُسُلاً، فَذَهَبُوا وَدَخَلُوا قَرْيَةً لِلسَّامِرِيِّينَ حَتَّى يُعِدُّوا لَهُ.","53":"فَلَمْ يَقْبَلُوهُ لأَنَّ وَجْهَهُ كَانَ مُتَّجِهًا نَحْوَ أُورُشَلِيمَ.","54":"فَلَمَّا رَأَى ذلِكَ تِلْمِيذَاهُ يَعْقُوبُ وَيُوحَنَّا، قَالاَ:«يَارَبُّ، أَتُرِيدُ أَنْ نَقُولَ أَنْ تَنْزِلَ نَارٌ مِنَ السَّمَاءِ فَتُفْنِيَهُمْ، كَمَا فَعَلَ إِيلِيَّا أَيْضًا؟»","55":"فَالْتَفَتَ وَانْتَهَرَهُمَا وَقَالَ:«لَسْتُمَا تَعْلَمَانِ مِنْ أَيِّ رُوحٍ أَنْتُمَا!","56":"لأَنَّ ابْنَ الإِنْسَانِ لَمْ يَأْتِ لِيُهْلِكَ أَنْفُسَ النَّاسِ، بَلْ لِيُخَلِّصَ». فَمَضَوْا إِلَى قَرْيَةٍ أُخْرَى."},"42.18":{"10":"ثُمَّ إِنَّ سِمْعَانَ بُطْرُسَ كَانَ مَعَهُ سَيْفٌ، فَاسْتَلَّهُ وَضَرَبَ عَبْدَ رَئِيسِ الْكَهَنَةِ، فَقَطَعَ أُذْنَهُ الْيُمْنَى. وَكَانَ اسْمُ الْعَبْدِ مَلْخُسَ.","11":"فَقَالَ يَسُوعُ لِبُطْرُسَ:«اجْعَلْ سَيْفَكَ فِي الْغِمْدِ! الْكَأْسُ الَّتِي أَعْطَانِي الآبُ أَلاَ أَشْرَبُهَا؟»."},"3.20":{"7":"وَكَلَّمَ الرَّبُّ مُوسَى قَائِلاً:","8":"«خُذِ الْعَصَا وَاجْمَعِ الْجَمَاعَةَ أَنْتَ وَهَارُونُ أَخُوكَ، وَكَلِّمَا الصَّخْرَةَ أَمَامَ أَعْيُنِهِمْ أَنْ تُعْطِيَ مَاءَهَا، فَتُخْرِجُ لَهُمْ مَاءً مِنَ الصَّخْرَةِ وَتَسْقِي الْجَمَاعَةَ وَمَوَاشِيَهُمْ».","9":"فَأَخَذَ مُوسَى الْعَصَا مِنْ أَمَامِ الرَّبِّ كَمَا أَمَرَهُ،","10":"وَجَمَعَ مُوسَى وَهَارُونُ الْجُمْهُورَ أَمَامَ الصَّخْرَةِ، فَقَالَ لَهُمُ: «اسْمَعُوا أَيُّهَا الْمَرَدَةُ، أَمِنْ هذِهِ الصَّخْرَةِ نُخْرِجُ لَكُمْ مَاءً؟».","11":"وَرَفَعَ مُوسَى يَدَهُ وَضَرَبَ الصَّخْرَةَ بِعَصَاهُ مَرَّتَيْنِ، فَخَرَجَ مَاءٌ غَزِيرٌ، فَشَرِبَتِ الْجَمَاعَةُ وَمَوَاشِيهَا.","12":"فَقَالَ الرَّبُّ لِمُوسَى وَهَارُونَ: «مِنْ أَجْلِ أَنَّكُمَا لَمْ تُؤْمِنَا بِي حَتَّى تُقَدِّسَانِي أَمَامَ أَعْيُنِ بَنِي إِسْرَائِيلَ، لِذلِكَ لاَ تُدْخِلاَنِ هذِهِ الْجَمَاعَةَ إِلَى الأَرْضِ الَّتِي أَعْطَيْتُهُمْ إِيَّاهَا»."},"22.53":{"5":"وَهُوَ مَجْرُوحٌ لأَجْلِ مَعَاصِينَا، مَسْحُوقٌ لأَجْلِ آثَامِنَا. تَأْدِيبُ سَلاَمِنَا عَلَيْهِ، وَبِحُبُرِهِ شُفِينَا.","3":"مُحْتَقَرٌ وَمَخْذُولٌ مِنَ النَّاسِ، رَجُلُ أَوْجَاعٍ وَمُخْتَبِرُ الْحَزَنِ، وَكَمُسَتَّرٍ عَنْهُ وُجُوهُنَا، مُحْتَقَرٌ فَلَمْ نَعْتَدَّ بِهِ."},"18.138":{"7":"إِنْ سَلَكْتُ فِي وَسَطِ الضِّيْقِ تُحْيِنِي. عَلَى غَضَبِ أَعْدَائِي تَمُدُّ يَدَكَ، وَتُخَلِّصُنِي يَمِينُكَ.","3":"فِي يَوْمَ دَعَوْتُكَ أَجَبْتَنِي. شَجَّعْتَنِي قُوَّةً فِي نَفْسِي.","1":"أَحْمَدُكَ مِنْ كُلِّ قَلْبِي. قُدَّامَ الآلِهَةِ أُرَنِّمُ لَكَ.","8":"الرَّبُّ يُحَامِي عَنِّي. يَا رَبُّ، رَحْمَتُكَ إِلَى الأَبَدِ. عَنْ أَعْمَالِ يَدَيْكَ لاَ تَتَخَلَّ."},"18.51":{"17":"ذَبَائِحُ اللهِ هِيَ رُوحٌ مُنْكَسِرَةٌ. الْقَلْبُ الْمُنْكَسِرُ وَالْمُنْسَحِقُ يَا اَللهُ لاَ تَحْتَقِرُهُ.","1":"اِرْحَمْنِي يَا اَللهُ حَسَبَ رَحْمَتِكَ. حَسَبَ كَثْرَةِ رَأْفَتِكَ امْحُ مَعَاصِيَّ.","2":"اغْسِلْنِي كَثِيرًا مِنْ إِثْمِي، وَمِنْ خَطِيَّتِي طَهِّرْنِي.","10":"قَلْبًا نَقِيًّا اخْلُقْ فِيَّ يَا اَللهُ، وَرُوحًا مُسْتَقِيمًا جَدِّدْ فِي دَاخِلِي.","12":"رُدَّ لِي بَهْجَةَ خَلاَصِكَ، وَبِرُوحٍ مُنْتَدِبَةٍ اعْضُدْنِي."},"23.30":{"17":"لأَنِّي أَرْفُدُكِ وَأَشْفِيكِ مِنْ جُرُوحِكِ، يَقُولُ الرَّبُّ. لأَنَّهُمْ قَدْ دَعَوْكِ مَنْفِيَّةَ صِهْيَوْنَ الَّتِي لاَ سَائِلَ عَنْهَا."},"27.6":{"1":"هَلُمَّ نَرْجعُ إِلَى الرَّبِّ لأَنَّهُ هُوَ افْتَرَسَ فَيَشْفِينَا، ضَرَبَ فَيَجْبِرُنَا.","3":"لِنَعْرِفْ فَلْنَتَتَبَّعْ لِنَعْرِفَ الرَّبَّ. خُرُوجُهُ يَقِينٌ كَالْفَجْرِ. يَأْتِي إِلَيْنَا كَالْمَطَرِ. كَمَطَرٍ مُتَأَخِّرٍ يَسْقِي الأَرْضَ."},"17.5":{"18":"لأَنَّهُ هُوَ يَجْرَحُ وَيَعْصِبُ. يَسْحَقُ وَيَدَاهُ تَشْفِيَانِ."},"23.17":{"14":"اِشْفِنِي يَا رَبُّ فَأُشْفَى. خَلِّصْنِي فَأُخَلَّصَ، لأَنَّكَ أَنْتَ تَسْبِيحَتِي."},"18.71":{"20":"أَنْتَ الَّذِي أَرَيْتَنَا ضِيقَاتٍ كَثِيرَةً وَرَدِيئَةً، تَعُودُ فَتُحْيِينَا، وَمِنْ أَعْمَاقِ الأَرْضِ تَعُودُ فَتُصْعِدُنَا.","21":"تَزِيدُ عَظَمَتِي وَتَرْجعُ فَتُعَزِّينِي.","5":"لأَنَّكَ أَنْتَ رَجَائِي يَا سَيِّدِي الرَّبَّ، مُتَّكَلِي مُنْذُ صِبَايَ.","1":"بِكَ يَا رَبُّ احْتَمَيْتُ، فَلاَ أَخْزَى إِلَى الدَّهْرِ.","9":"لاَ تَرْفُضْنِي فِي زَمَنِ الشَّيْخُوخَةِ. لاَ تَتْرُكْنِي عِنْدَ فَنَاءِ قُوَّتِي.","18":"وَأَيْضًا إِلَى الشَّيْخُوخَةِ وَالشَّيْبِيَا اَللهُ لاَ تَتْرُكْنِي، حَتَّى أُخْبِرَ بِذِرَاعِكَ الْجِيلَ الْمُقْبِلَ، وَبِقُوَّتِكَ كُلَّ آتٍ.","17":"اَلَّلهُمَّ، قَدْ عَلَّمْتَنِي مُنْذُ صِبَايَ، وَإِلَى الآنَ أُخْبِرُ بِعَجَائِبِكَ."},"0.45":{"1":"فَلَمْ يَسْتَطِعْ يُوسُفُ أَنْ يَضْبِطَ نَفْسَهُ لَدَى جَمِيعِ الْوَاقِفِينَ عِنْدَهُ فَصَرَخَ: «أَخْرِجُوا كُلَّ إِنْسَانٍ عَنِّي». فَلَمْ يَقِفْ أَحَدٌ عِنْدَهُ حِينَ عَرَّفَ يُوسُفُ إِخْوَتَهُ بِنَفْسِهِ.","2":"فَأَطْلَقَ صَوْتَهُ بِالْبُكَاءِ، فَسَمِعَ الْمِصْرِيُّونَ وَسَمِعَ بَيْتُ فِرْعَوْنَ.","3":"وَقَالَ يُوسُفُ لإِخْوَتِهِ: «أَنَا يُوسُفُ. أَحَيٌّ أَبِي بَعْدُ؟» فَلَمْ يَسْتَطِعْ إِخْوَتُهُ أَنْ يُجِيبُوهُ، لأَنَّهُمُ ارْتَاعُوا مِنْهُ.","4":"فَقَالَ يُوسُفُ لإِخْوَتِهِ: «تَقَدَّمُوا إِلَيَّ». فَتَقَدَّمُوا. فَقَالَ: «أَنَا يُوسُفُ أَخُوكُمُ الَّذِي بِعْتُمُوهُ إِلَى مِصْرَ.","5":"وَالآنَ لاَ تَتَأَسَّفُوا وَلاَ تَغْتَاظُوا لأَنَّكُمْ بِعْتُمُونِي إِلَى هُنَا، لأَنَّهُ لاسْتِبْقَاءِ حَيَاةٍ أَرْسَلَنِيَ اللهُ قُدَّامَكُمْ.","6":"لأَنَّ لِلْجُوعِ فِي الأَرْضِ الآنَ سَنَتَيْنِ. وَخَمْسُ سِنِينَ أَيْضًا لاَ تَكُونُ فِيهَا فَلاَحَةٌ وَلاَ حَصَادٌ.","7":"فَقَدْ أَرْسَلَنِي اللهُ قُدَّامَكُمْ لِيَجْعَلَ لَكُمْ بَقِيَّةً فِي الأَرْضِ وَلِيَسْتَبْقِيَ لَكُمْ نَجَاةً عَظِيمَةً.","8":"فَالآنَ لَيْسَ أَنْتُمْ أَرْسَلْتُمُونِي إِلَى هُنَا بَلِ اللهُ. وَهُوَ قَدْ جَعَلَنِي أَبًا لِفِرْعَوْنَ وَسَيِّدًا لِكُلِّ بَيْتِهِ وَمُتَسَلِّطًا عَلَى كُلِّ أَرْضِ مِصْرَ.","9":"أَسْرِعُوا وَاصْعَدُوا إِلَى أَبِي وَقُولُوا لَهُ: هكَذَا يَقُولُ ابْنُكَ يُوسُفُ: قَدْ جَعَلَنِيَ اللهُ سَيِّدًا لِكُلِّ مِصْرَ. اِنْزِلْ إِلَيَّ. لاَ تَقِفْ.","10":"فَتَسْكُنَ فِي أَرْضِ جَاسَانَ وَتَكُونَ قَرِيبًا مِنِّي، أَنْتَ وَبَنُوكَ وَبَنُو بَنِيكَ وَغَنَمُكَ وَبَقَرُكَ وَكُلُّ مَا لَكَ.","11":"وَأَعُولُكَ هُنَاكَ، لأَنَّهُ يَكُونُ أَيْضًا خَمْسُ سِنِينَ جُوعًا. لِئَلاَّ تَفْتَقِرَ أَنْتَ وَبَيْتُكَ وَكُلُّ مَا لَكَ.","12":"وَهُوَذَا عُِيُونُكُمْ تَرَى، وَعَيْنَا أَخِي بَنْيَامِينَ، أَنَّ فَمِي هُوَ الَّذِي يُكَلِّمُكُمْ.","13":"وَتُخْبِرُونَ أَبِي بِكُلِّ مَجْدِي فِي مِصْرَ وَبِكُلِّ مَا رَأَيْتُمْ، وَتَسْتَعْجِلُونَ وَتَنْزِلُونَ بِأَبِي إِلَى هُنَا».","14":"ثُمَّ وَقَعَ عَلَى عُنُقِ بَنْيَامِينَ أَخِيهِ وَبَكَى، وَبَكَى بَنْيَامِينُ عَلَى عُنُقِهِ.","15":"وَقَبَّلَ جَمِيعَ إِخْوَتِهِ وَبَكَى عَلَيْهِمْ. وَبَعْدَ ذلِكَ تَكَلَّمَ إِخْوَتُهُ مَعَهُ."},"7.1":{"19":"فَذَهَبَتَا كِلْتَاهُمَا حَتَّى دَخَلَتَا بَيْتَ لَحْمٍ. وَكَانَ عِنْدَ دُخُولِهِمَا بَيْتَ لَحْمٍ أَنَّ الْمَدِينَةَ كُلَّهَا تَحَرَّكَتْ بِسَبَبِهِمَا، وَقَالُوا: «أَهذِهِ نُعْمِي؟»","20":"فَقَالَتْ لَهُمْ: «لاَ تَدْعُونِي نُعْمِيَ بَلِ ادْعُونِي مُرَّةَ، لأَنَّ الْقَدِيرَ قَدْ أَمَرَّنِي جِدًّا.","21":"إِنِّي ذَهَبْتُ مُمْتَلِئَةً وَأَرْجَعَنِيَ الرَّبُّ فَارِغَةً. لِمَاذَا تَدْعُونَنِي نُعْمِي، وَالرَّبُّ قَدْ أَذَلَّنِي وَالْقَدِيرُ قَدْ كَسَّرَنِي؟»","16":"فَقَالَتْ رَاعُوثُ: «لاَ تُلِحِّي عَلَيَّ أَنْ أَتْرُكَكِ وَأَرْجعَ عَنْكِ، لأَنَّهُ حَيْثُمَا ذَهَبْتِ أَذْهَبُ وَحَيْثُمَا بِتِّ أَبِيتُ. شَعْبُكِ شَعْبِي وَإِلهُكِ إِلهِي.","17":"حَيْثُمَا مُتِّ أَمُوتُ وَهُنَاكَ أَنْدَفِنُ. هكَذَا يَفْعَلُ الرَّبُّ بِي وَهكَذَا يَزِيدُ. إِنَّمَا الْمَوْتُ يَفْصِلُ بَيْنِي وَبَيْنَكِ».","14":"ثُمَّ رَفَعْنَ أَصْوَاتَهُنَّ وَبَكَيْنَ أَيْضًا. فَقَبَّلَتْ عُرْفَةُ حَمَاتَهَا، وَأَمَّا رَاعُوثُ فَلَصِقَتْ بِهَا.","15":"فَقَالَتْ: «هُوَذَا قَدْ رَجَعَتْ سِلْفَتُكِ إِلَى شَعْبِهَا وَآلِهَتِهَا. اِرْجِعِي أَنْتِ وَرَاءَ سِلْفَتِكِ».","18":"فَلَمَّا رَأَتْ أَنَّهَا مُشَدِّدَةٌ عَلَى الذَّهَابِ مَعَهَا، كَفَّتْ عَنِ الْكَلاَمِ إِلَيْهَا."},"41.8":{"43":"وَامْرَأَةٌ بِنَزْفِ دَمٍ مُنْذُ اثْنَتَيْ عَشْرَةَ سَنَةً، وَقَدْ أَنْفَقَتْ كُلَّ مَعِيشَتِهَا لِلأَطِبَّاءِ، وَلَمْ تَقْدِرْ أَنْ تُشْفَى مِنْ أَحَدٍ،","44":"جَاءَتْ مِنْ وَرَائِهِ وَلَمَسَتْ هُدْبَ ثَوْبِهِ. فَفِي الْحَالِ وَقَفَ نَزْفُ دَمِهَا.","45":"فَقَالَ يَسُوعُ:«مَنِ الَّذِي لَمَسَنِي؟» وَإِذْ كَانَ الْجَمِيعُ يُنْكِرُونَ، قَالَ بُطْرُسُ وَالَّذِينَ مَعَهُ: «يَامُعَلِّمُ، الْجُمُوعُ يُضَيِّقُونَ عَلَيْكَ وَيَزْحَمُونَكَ، وَتَقُولُ: مَنِ الَّذِي لَمَسَنِي؟»","46":"فَقَالَ يَسُوعُ:«قَدْ لَمَسَنِي وَاحِدٌ، لأَنِّي عَلِمْتُ أَنَّ قُوَّةً قَدْ خَرَجَتْ مِنِّي».","47":"فَلَمَّا رَأَتِ الْمَرْأَةُ أَنَّهَا لَمْ تَخْتَفِ، جَاءَتْ مُرْتَعِدَةً وَخَرَّتْ لَهُ، وَأَخْبَرَتْهُ قُدَّامَ جَمِيعِ الشَّعْبِ لأَيِّ سَبَبٍ لَمَسَتْهُ، وَكَيْفَ بَرِئَتْ فِي الْحَالِ.","48":"فَقَالَ لَهَا:«ثِقِي يَا ابْنَةُ، إِيمَانُكِ قَدْ شَفَاكِ، اِذْهَبِي بِسَلاَمٍ»."},"39.8":{"1":"وَلَمَّا نَزَلَ مِنَ الْجَبَلِ تَبِعَتْهُ جُمُوعٌ كَثِيرَةٌ.","2":"وَإِذَا أَبْرَصُ قَدْ جَاءَ وَسَجَدَ لَهُ قَائِلاً:«يَا سَيِّدُ، إِنْ أَرَدْتَ تَقْدِرْ أَنْ تُطَهِّرَنِي».","3":"فَمَدَّ يَسُوعُ يَدَهُ وَلَمَسَهُ قَائِلاً:«أُرِيدُ، فَاطْهُرْ!». وَلِلْوَقْتِ طَهُرَ بَرَصُهُ.","4":"فَقَالَ لَهُ يَسُوعُ:«انْظُرْ أَنْ لاَ تَقُولَ لأَحَدٍ. بَلِ اذْهَبْ أَرِ نَفْسَكَ لِلْكَاهِنِ، وَقَدِّمِ الْقُرْبَانَ الَّذِي أَمَرَ بِهِ مُوسَى شَهَادَةً لَهُمْ».","17":"لِكَيْ يَتِمَّ مَا قِيلَ بِإِشَعْيَاءَ النَّبِيِّ الْقَائِلِ:«هُوَ أَخَذَ أَسْقَامَنَا وَحَمَلَ أَمْرَاضَنَا».","5":"وَلَمَّا دَخَلَ يَسُوعُ كَفْرَنَاحُومَ، جَاءَ إِلَيْهِ قَائِدُ مِئَةٍ يَطْلُبُ إِلَيْهِ","6":"وَيَقُولُ:«يَا سَيِّدُ، غُلاَمِي مَطْرُوحٌ فِي الْبَيْتِ مَفْلُوجًا مُتَعَذِّبًا جِدًّا».","7":"فَقَالَ لَهُ يَسُوعُ:«أَنَا آتِي وَأَشْفِيهِ».","8":"فَأَجَابَ قَائِدُ الْمِئَةِ وَقَالَ:«يَا سَيِّدُ، لَسْتُ مُسْتَحِقًّا أَنْ تَدْخُلَ تَحْتَ سَقْفِي، لكِنْ قُلْ كَلِمَةً فَقَطْ فَيَبْرَأَ غُلاَمِي.","9":"لأَنِّي أَنَا أَيْضًا إِنْسَانٌ تَحْتَ سُلْطَانٍ. لِي جُنْدٌ تَحْتَ يَدِي. أَقُولُ لِهذَا: اذْهَبْ! فَيَذْهَبُ، وَلآخَرَ: اءْيتِ! فَيَأْتِي، وَلِعَبْدِيَ: افْعَلْ هذَا! فَيَفْعَلُ».","10":"فَلَمَّا سَمِعَ يَسُوعُ تَعَجَّبَ، وَقَالَ لِلَّذِينَ يَتْبَعُونَ:«اَلْحَقَّ أَقُولُ لَكُمْ: لَمْ أَجِدْ وَلاَ فِي إِسْرَائِيلَ إِيمَانًا بِمِقْدَارِ هذَا!","11":"وَأَقُولُ لَكُمْ: إِنَّ كَثِيرِينَ سَيَأْتُونَ مِنَ الْمَشَارِقِ وَالْمَغَارِب وَيَتَّكِئُونَ مَعَ إِبْرَاهِيمَ وَإِسْحَاقَ وَيَعْقُوبَ فِي مَلَكُوتِ السَّمَاوَاتِ،","12":"وَأَمَّا بَنُو الْمَلَكُوتِ فَيُطْرَحُونَ إِلَى الظُّلْمَةِ الْخَارِجِيَّةِ. هُنَاكَ يَكُونُ الْبُكَاءُ وَصَرِيرُ الأَسْنَانِ».","13":"ثُمَّ قَالَ يَسُوعُ لِقَائِدِ الْمِئَةِ: «اذْهَبْ، وَكَمَا آمَنْتَ لِيَكُنْ لَكَ». فَبَرَأَ غُلاَمُهُ فِي تِلْكَ السَّاعَةِ."},"40.10":{"46":"وَجَاءُوا إِلَى أَرِيحَا. وَفِيمَا هُوَ خَارِجٌ مِنْ أَرِيحَا مَعَ تَلاَمِيذِهِ وَجَمْعٍ غَفِيرٍ، كَانَ بَارْتِيمَاوُسُ الأَعْمَى ابْنُ تِيمَاوُسَ جَالِسًا عَلَى الطَّرِيقِ يَسْتَعْطِي.","47":"فَلَمَّا سَمِعَ أَنَّهُ يَسُوعُ النَّاصِرِيُّ، ابْتَدَأَ يَصْرُخُ وَيَقُولُ:«يَا يَسُوعُ ابْنَ دَاوُدَ، ارْحَمْنِي!»","48":"فَانْتَهَرَهُ كَثِيرُونَ لِيَسْكُتَ، فَصَرَخَ أَكْثَرَ كَثِيرًا:«يَا ابْنَ دَاوُدَ، ارْحَمْنِي!».","49":"فَوَقَفَ يَسُوعُ وَأَمَرَ أَنْ يُنَادَى. فَنَادَوُا الأَعْمَى قَائِلِينَ لَهُ:«ثِقْ! قُمْ! هُوَذَا يُنَادِيكَ».","50":"فَطَرَحَ رِدَاءَهُ وَقَامَ وَجَاءَ إِلَى يَسُوعَ.","51":"فَأَجَابَ يَسُوعُ وَقَالَ لَهُ:«مَاذَا تُرِيدُ أَنْ أَفْعَلَ بِكَ؟» فَقَالَ لَهُ الأَعْمَى:«يَا سَيِّدِي، أَنْ أُبْصِرَ!».","52":"فَقَالَ لَهُ يَسُوعُ:«اذْهَبْ. إِيمَانُكَ قَدْ شَفَاكَ». فَلِلْوَقْتِ أَبْصَرَ، وَتَبِعَ يَسُوعَ فِي الطَّرِيقِ.","13":"وَقَدَّمُوا إِلَيْهِ أَوْلاَدًا لِكَيْ يَلْمِسَهُمْ. وَأَمَّا التَّلاَمِيذُ فَانْتَهَرُوا الَّذِينَ قَدَّمُوهُمْ.","14":"فَلَمَّا رَأَى يَسُوعُ ذلِكَ اغْتَاظَ وَقَالَ لَهُمْ:«دَعُوا الأَوْلاَدَ يَأْتُونَ إِلَيَّ وَلاَ تَمْنَعُوهُمْ، لأَنَّ لِمِثْلِ هؤُلاَءِ مَلَكُوتَ اللهِ.","15":"اَلْحَقَّ أَقُولُ لَكُمْ: مَنْ لاَ يَقْبَلُ مَلَكُوتَ اللهِ مِثْلَ وَلَدٍ فَلَنْ يَدْخُلَهُ».","16":"فَاحْتَضَنَهُمْ وَوَضَعَ يَدَيْهِ عَلَيْهِمْ وَبَارَكَهُمْ."},"23.29":{"11":"لأَنِّي عَرَفْتُ الأَفْكَارَ الَّتِي أَنَا مُفْتَكِرٌ بِهَا عَنْكُمْ، يَقُولُ الرَّبُّ، أَفْكَارَ سَلاَمٍ لاَ شَرّ، لأُعْطِيَكُمْ آخِرَةً وَرَجَاءً.","13":"وَتَطْلُبُونَنِي فَتَجِدُونَنِي إِذْ تَطْلُبُونَنِي بِكُلِّ قَلْبِكُمْ."},"44.15":{"13":"وَلْيَمْلأْكُمْ إِلهُ الرَّجَاءِ كُلَّ سُرُورٍ وَسَلاَمٍ فِي الإِيمَانِ، لِتَزْدَادُوا فِي الرَّجَاءِ بِقُوَّةِ الرُّوحِ الْقُدُسِ.","7":"لِذلِكَ اقْبَلُوا بَعْضُكُمْ بَعْضًا كَمَا أَنَّ الْمَسِيحَ أَيْضًا قَبِلَنَا، لِمَجْدِ اللهِ."},"44.5":{"5":"وَالرَّجَاءُ لاَ يُخْزِي، لأَنَّ مَحَبَّةَ اللهِ قَدِ انْسَكَبَتْ فِي قُلُوبِنَا بِالرُّوحِ الْقُدُسِ الْمُعْطَى لَنَا.","8":"وَلكِنَّ اللهَ بَيَّنَ مَحَبَّتَهُ لَنَا، لأَنَّهُ وَنَحْنُ بَعْدُ خُطَاةٌ مَاتَ الْمَسِيحُ لأَجْلِنَا.","1":"فَإِذْ قَدْ تَبَرَّرْنَا بِالإِيمَانِ لَنَا سَلاَمٌ مَعَ اللهِ بِرَبِّنَا يَسُوعَ الْمَسِيحِ،"},"57.6":{"19":"الَّذِي هُوَ لَنَا كَمِرْسَاةٍ لِلنَّفْسِ مُؤْتَمَنَةٍ وَثَابِتَةٍ، تَدْخُلُ إِلَى مَا دَاخِلَ الْحِجَابِ،","12":"لِكَيْ لاَ تَكُونُوا مُتَبَاطِئِينَ بَلْ مُتَمَثِّلِينَ بِالَّذِينَ بِالإِيمَانِ وَالأَنَاةِ يَرِثُونَ الْمَوَاعِيدَ."},"41.1":{"37":"لأَنَّهُ لَيْسَ شَيْءٌ غَيْرَ مُمْكِنٍ لَدَى اللهِ».","11":"فَظَهَرَ لَهُ مَلاَكُ الرَّبِّ وَاقِفًا عَنْ يَمِينِ مَذْبَحِ الْبَخُورِ.","12":"فَلَمَّا رَآهُ زَكَرِيَّا اضْطَرَبَ وَوَقَعَ عَلَيْهِ خَوْفٌ.","13":"فَقَالَ لَهُ الْمَلاَكُ:«لاَ تَخَفْ يَا زَكَرِيَّا، لأَنَّ طِلْبَتَكَ قَدْ سُمِعَتْ، وَامْرَأَتُكَ أَلِيصَابَاتُ سَتَلِدُ لَكَ ابْنًا وَتُسَمِّيهِ يُوحَنَّا.","14":"وَيَكُونُ لَكَ فَرَحٌ وَابْتِهَاجٌ، وَكَثِيرُونَ سَيَفْرَحُونَ بِوِلاَدَتِهِ،","15":"لأَنَّهُ يَكُونُ عَظِيمًا أَمَامَ الرَّبِّ، وَخَمْرًا وَمُسْكِرًا لاَ يَشْرَبُ، وَمِنْ بَطْنِ أُمِّهِ يَمْتَلِئُ مِنَ الرُّوحِ الْقُدُسِ.","16":"وَيَرُدُّ كَثِيرِينَ مِنْ بَنِي إِسْرَائِيلَ إِلَى الرَّبِّ إِلهِهِمْ.","17":"وَيَتَقَدَّمُ أَمَامَهُ بِرُوحِ إِيلِيَّا وَقُوَّتِهِ، لِيَرُدَّ قُلُوبَ الآبَاءِ إِلَى الأَبْنَاءِ، وَالْعُصَاةَ إِلَى فِكْرِ الأَبْرَارِ، لِكَيْ يُهَيِّئَ لِلرَّبِّ شَعْبًا مُسْتَعِدًّا».","18":"فَقَالَ زَكَرِيَّا لِلْمَلاَكِ:«كَيْفَ أَعْلَمُ هذَا، لأَنِّي أَنَا شَيْخٌ وَامْرَأَتِي مُتَقَدِّمَةٌ فِي أَيَّامِهَا؟»","19":"فَأَجَابَ الْمَلاَكُ وَقَالَ لَهُ:«أَنَا جِبْرَائِيلُ الْوَاقِفُ قُدَّامَ اللهِ، وَأُرْسِلْتُ لأُكَلِّمَكَ وَأُبَشِّرَكَ بِهذَا.","20":"وَهَا أَنْتَ تَكُونُ صَامِتًا وَلاَ تَقْدِرُ أَنْ تَتَكَلَّمَ، إِلَى الْيَوْمِ الَّذِي يَكُونُ فِيهِ هذَا، لأَنَّكَ لَمْ تُصَدِّقْ كَلاَمِي الَّذِي سَيَتِمُّ فِي وَقْتِهِ».","46":"فَقَالَتْ مَرْيَمُ:«تُعَظِّمُ نَفْسِي الرَّبَّ،","47":"وَتَبْتَهِجُ رُوحِي بِاللهِ مُخَلِّصِي،","48":"لأَنَّهُ نَظَرَ إِلَى اتِّضَاعِ أَمَتِهِ. فَهُوَذَا مُنْذُ الآنَ جَمِيعُ الأَجْيَالِ تُطَوِّبُنِي،","49":"لأَنَّ الْقَدِيرَ صَنَعَ بِي عَظَائِمَ، وَاسْمُهُ قُدُّوسٌ،","50":"وَرَحْمَتُهُ إِلَى جِيلِ الأَجْيَالِ لِلَّذِينَ يَتَّقُونَهُ.","51":"صَنَعَ قُوَّةً بِذِرَاعِهِ. شَتَّتَ الْمُسْتَكْبِرِينَ بِفِكْرِ قُلُوبِهِمْ.","52":"أَنْزَلَ الأَعِزَّاءَ عَنِ الْكَرَاسِيِّ وَرَفَعَ الْمُتَّضِعِينَ.","53":"أَشْبَعَ الْجِيَاعَ خَيْرَاتٍ وَصَرَفَ الأَغْنِيَاءَ فَارِغِينَ.","54":"عَضَدَ إِسْرَائِيلَ فَتَاهُ لِيَذْكُرَ رَحْمَةً،","55":"كَمَا كَلَّمَ آبَاءَنَا. لإِبْراهِيمَ وَنَسْلِهِ إِلَى الأَبَدِ».","5":"كَانَ فِي أَيَّامِ هِيرُودُسَ مَلِكِ الْيَهُودِيَّةِ كَاهِنٌ اسْمُهُ زَكَرِيَّا مِنْ فِرْقَةِ أَبِيَّا، وَامْرَأَتُهُ مِنْ بَنَاتِ هارُونَ وَاسْمُهَا أَلِيصَابَاتُ.","6":"وَكَانَا كِلاَهُمَا بَارَّيْنِ أَمَامَ اللهِ، سَالِكَيْنِ فِي جَمِيعِ وَصَايَا الرَّبِّ وَأَحْكَامِهِ بِلاَ لَوْمٍ.","7":"وَلَمْ يَكُنْ لَهُمَا وَلَدٌ، إِذْ كَانَتْ أَلِيصَابَاتُ عَاقِرًا. وَكَانَا كِلاَهُمَا مُتَقَدِّمَيْنِ فِي أَيَّامِهِمَا.","8":"فَبَيْنَمَا هُوَ يَكْهَنُ فِي نَوْبَةِ فِرْقَتِهِ أَمَامَ اللهِ،","9":"حَسَبَ عَادَةِ الْكَهَنُوتِ، أَصَابَتْهُ الْقُرْعَةُ أَنْ يَدْخُلَ إِلَى هَيْكَلِ الرَّبِّ وَيُبَخِّرَ.","10":"وَكَانَ كُلُّ جُمْهُورِ الشَّعْبِ يُصَلُّونَ خَارِجًا وَقْتَ الْبَخُورِ."},"18.130":{"7":"لِيَرْجُ إِسْرَائِيلُ الرَّبَّ، لأَنَّ عِنْدَ الرَّبِّ الرَّحْمَةَ وَعِنْدَهُ فِدًى كَثِيرٌ،","3":"إِنْ كُنْتَ تُرَاقِبُ الآثَامَ يَارَبُّ، يَا سَيِّدُ، فَمَنْ يَقِفُ؟","4":"لأَنَّ عِنْدَكَ الْمَغْفِرَةَ. لِكَيْ يُخَافَ مِنْكَ.","5":"انْتَظَرْتُكَ يَا رَبُّ. انْتَظَرَتْ نَفْسِي، وَبِكَلاَمِهِ رَجَوْتُ.","6":"نَفْسِي تَنْتَظِرُ الرَّبَّ أَكْثَرَ مِنَ الْمُرَاقِبِينَ الصُّبْحَ. أَكْثَرَ مِنَ الْمُرَاقِبِينَ الصُّبْحَ."},"32.7":{"7":"وَلكِنَّنِي أُرَاقِبُ الرَّبَّ، أَصْبِرُ لإِلهِ خَلاَصِي. يَسْمَعُنِي إِلهِي.","8":"لاَ تَشْمَتِي بِي يَا عَدُوَّتِي، إِذَا سَقَطْتُ أَقُومُ. إِذَا جَلَسْتُ فِي الظُّلْمَةِ فَالرَّبُّ نُورٌ لِي.","18":"مَنْ هُوَ إِلهٌ مِثْلُكَ غَافِرٌ الإِثْمَ وَصَافِحٌ عَنِ الذَّنْبِ لِبَقِيَّةِ مِيرَاثِهِ! لاَ يَحْفَظُ إِلَى الأَبَدِ غَضَبَهُ، فَإِنَّهُ يُسَرُّ بِالرَّأْفَةِ.","19":"يَعُودُ يَرْحَمُنَا، يَدُوسُ آثَامَنَا، وَتُطْرَحُ فِي أَعْمَاقِ الْبَحْرِ جَمِيعُ خَطَايَاهُمْ.","5":"لاَ تَأْتَمِنُوا صَاحِبًا. لاَ تَثِقُوا بِصَدِيق. احْفَظْ أَبْوَابَ فَمِكَ عَنِ الْمُضْطَجِعَةِ فِي حِضْنِكَ.","6":"لأَنَّ الابْنَ مُسْتَهِينٌ بِالأَبِ، وَالْبِنْتَ قَائِمَةٌ عَلَى أُمِّهَا، وَالْكَنَّةَ عَلَى حَمَاتِهَا، وَأَعْدَاءُ الإِنْسَانِ أَهْلُ بَيْتِهِ."},"22.54":{"10":"فَإِنَّ الْجِبَالَ تَزُولُ، وَالآكَامَ تَتَزَعْزَعُ، أَمَّا إِحْسَانِي فَلاَ يَزُولُ عَنْكِ، وَعَهْدُ سَلاَمِي لاَ يَتَزَعْزَعُ، قَالَ رَاحِمُكِ الرَّبُّ.","17":"«كُلُّ آلَةٍ صُوِّرَتْ ضِدَّكِ لاَ تَنْجَحُ، وَكُلُّ لِسَانٍ يَقُومُ عَلَيْكِ فِي الْقَضَاءِ تَحْكُمِينَ عَلَيْهِ. هذَا هُوَ مِيرَاثُ عَبِيدِ الرَّبِّ وَبِرُّهُمْ مِنْ عِنْدِي، يَقُولُ الرَّبُّ.","4":"لاَ تَخَافِي لأَنَّكِ لاَ تَخْزَيْنَ، وَلاَ تَخْجَلِي لأَنَّكِ لاَ تَسْتَحِينَ. فَإِنَّكِ تَنْسَيْنَ خِزْيَ صَبَاكِ، وَعَارُ تَرَمُّلِكِ لاَ تَذْكُرِينَهُ بَعْدُ.","13":"وَكُلَّ بَنِيكِ تَلاَمِيذَ الرَّبِّ، وَسَلاَمَ بَنِيكِ كَثِيرًا."},"25.37":{"1":"كَانَتْ عَلَيَّ يَدُ الرَّبِّ، فَأَخْرَجَني بِرُوحِ الرَّبِّ وَأَنْزَلَنِي فِي وَسْطِ الْبُقْعَةِ وَهِيَ مَلآنَةٌ عِظَامًا،","2":"وَأَمَرَّنِي عَلَيْهَا مِنْ حَوْلِهَا وَإِذَا هِيَ كَثِيرَةٌ جِدًّا عَلَى وَجْهِ الْبُقْعَةِ، وَإِذَا هِيَ يَابِسَةٌ جِدًّا.","3":"فَقَالَ لِي: «يَا ابْنَ آدَمَ، أَتَحْيَا هذِهِ الْعِظَامُ؟» فَقُلْتُ: «يَا سَيِّدُ الرَّبُّ أَنْتَ تَعْلَمُ».","4":"فَقَالَ لِي: «تَنَبَّأْ عَلَى هذِهِ الْعِظَامِ وَقُلْ لَهَا: أَيَّتُهَا الْعِظَامُ الْيَابِسَةُ، اسْمَعِي كَلِمَةَ الرَّبِّ:","5":"هكذَا قَالَ السَّيِّدُ الرَّبُّ لِهذِهِ الْعِظَامِ: هأَنَذَا أُدْخِلُ فِيكُمْ رُوحًا فَتَحْيَوْنَ.","6":"وَأَضَعُ عَلَيْكُمْ عَصَبًا وأَكْسِيكُمْ لَحْمًا وَأَبْسُطُ عَلَيْكُمْ جِلْدًا وَأَجْعَلُ فِيكُمْ رُوحًا، فَتَحْيَوْنَ وَتَعْلَمُونَ أَنِّي أَنَا الرَّبُّ».","7":"فَتَنَبَّأْتُ كمَا أُمِرتُ. وَبَيْنَمَا أَنَا أَتنَبَّأُ كَانَ صَوْتٌ، وَإِذَا رَعْشٌ، فَتَقَارَبَتِ الْعِظَامُ كُلُّ عَظْمٍ إِلَى عَظْمِهِ.","8":"ونَظَرْتُ وَإِذَا بِالْعَصَبِ وَاللَّحْمِ كَسَاهَا، وبُسِطَ الْجِلْدُ علَيْهَا مِنْ فَوْقُ، وَلَيْسَ فِيهَا رُوحٌ.","9":"فَقَالَ لِي: «تَنَبَّأْ لِلرُّوحِ، تَنَبَّأْ يَاابْنَ آدَمَ، وَقُلْ لِلرُّوحِ: هكذَا قَالَ السَّيِّدُ الرَّبُّ: هَلُمَّ يَا رُوحُ مِنَ الرِّيَاحِ الأَرْبَعِ وَهُبَّ عَلَى هؤُلاَءِ الْقَتْلَى لِيَحْيَوْا».","10":"فَتَنَبَّأْتُ كَمَا أَمَرَني، فَدَخَلَ فِيهِمِ الرُّوحُ، فَحَيُوا وَقَامُوا عَلَى أَقدَامِهِمْ جَيْشٌ عَظيمٌ جِدًّا جِدًّا.","11":"ثُمَّ قَالَ لِي: «يَا ابْنَ آدَمَ، هذِهِ العِظَامُ هِيَ كُلُّ بَيتِ إِسْرَائِيلَ. هَا هُمْ يَقُولُونَ: يَبِسَتْ عِظَامُنَا وَهَلَكَ رَجَاؤُنَا. قَدِ انْقَطَعْنَا.","12":"لِذلِكَ تَنَبَّأْ وَقُلْ لَهُمْ: هكذَا قَالَ السَّيِّدُ الرَّبُّ: هأَنَذَا أَفتَحُ قُبُورَكُمْ وأُصْعِدُكُمْ مِنْ قُبُورِكُمْ يَا شَعْبِي، وَآتِي بِكُمْ إِلَى أَرْضِ إِسْرَائِيلَ.","13":"فَتَعْلَمُونَ أَنِّي أَنَا الرَّبُّ عِنْدَ فَتْحِي قُبُورَكُمْ وَإِصْعَادِي إِيَّاكُمْ مِنْ قُبُورِكُمْ يَا شَعْبِي.","14":"وأَجْعَلُ رُوحِي فِيكُمْ فتَحْيَوْنَ، وَأَجْعَلُكُمْ فِي أَرْضِكُمْ، فَتَعْلَمُونَ أَنِّي أنَا الرَّبُّ تَكَلَّمْتُ وَأَفْعَلُ، يَقُولُ الرَّبُّ»."},"42.21":{"1":"بَعْدَ هذَا أَظْهَرَ أَيْضًا يَسُوعُ نَفْسَهُ لِلتَّلاَمِيذِ عَلَى بَحْرِ طَبَرِيَّةَ. ظَهَرَ هكَذَا:","2":"كَانَ سِمْعَانُ بُطْرُسُ، وَتُومَا الَّذِي يُقَالُ لَهُ التَّوْأَمُ، وَنَثَنَائِيلُ الَّذِي مِنْ قَانَا الْجَلِيلِ، وَابْنَا زَبْدِي، وَاثْنَانِ آخَرَانِ مِنْ تَلاَمِيذِهِ مَعَ بَعْضِهِمْ.","3":"قَالَ لَهُمْ سِمْعَانُ بُطْرُسُ:«أَنَا أَذْهَبُ لأَتَصَيَّدَ». قَالُوا لَهُ:«نَذْهَبُ نَحْنُ أَيْضًا مَعَكَ». فَخَرَجُوا وَدَخَلُوا السَّفِينَةَ لِلْوَقْتِ. وَفِي تِلْكَ اللَّيْلَةِ لَمْ يُمْسِكُوا شَيْئًا.","4":"وَلَمَّا كَانَ الصُّبْحُ، وَقَفَ يَسُوعُ عَلَى الشَّاطِئِ. وَلكِنَّ التَّلاَمِيذَ لَمْ يَكُونُوا يَعْلَمُونَ أَنَّهُ يَسُوعُ.","5":"فَقَالَ لَهُمْ يَسُوعُ:«يَا غِلْمَانُ أَلَعَلَّ عِنْدَكُمْ إِدَامًا؟». أَجَابُوهُ:«لاَ!»","6":"فَقَالَ لَهُمْ: «أَلْقُوا الشَّبَكَةَ إِلَى جَانِبِ السَّفِينَةِ الأَيْمَنِ فَتَجِدُوا». فَأَلْقَوْا، وَلَمْ يَعُودُوا يَقْدِرُونَ أَنْ يَجْذِبُوهَا مِنْ كَثْرَةِ السَّمَكِ.","7":"فَقَالَ ذلِكَ التِّلْمِيذُ الَّذِي كَانَ يَسُوعُ يُحِبُّهُ لِبُطْرُسَ:«هُوَ الرَّبُّ!». فَلَمَّا سَمِعَ سِمْعَانُ بُطْرُسُ أَنَّهُ الرَّبُّ، اتَّزَرَ بِثَوْبِهِ، لأَنَّهُ كَانَ عُرْيَانًا، وَأَلْقَى نَفْسَهُ فِي الْبَحْرِ.","8":"وَأَمَّا التَّلاَمِيذُ الآخَرُونَ فَجَاءُوا بِالسَّفِينَةِ، لأَنَّهُمْ لَمْ يَكُونُوا بَعِيدِينَ عَنِ الأَرْضِ إِلاَّ نَحْوَ مِئَتَيْ ذِرَاعٍ، وَهُمْ يَجُرُّونَ شَبَكَةَ السَّمَكِ.","9":"فَلَمَّا خَرَجُوا إِلَى الأَرْضِ نَظَرُوا جَمْرًا مَوْضُوعًا وَسَمَكًا مَوْضُوعًا عَلَيْهِ وَخُبْزًا.","10":"قَالَ لَهُمْ يَسُوعُ:«قَدِّمُوا مِنَ السَّمَكِ الَّذِي أَمْسَكْتُمُ الآنَ».","11":"فَصَعِدَ سِمْعَانُ بُطْرُسُ وَجَذَبَ الشَّبَكَةَ إِلَى الأَرْضِ، مُمْتَلِئَةً سَمَكًا كَبِيرًا، مِئَةً وَثَلاَثًا وَخَمْسِينَ. وَمَعْ هذِهِ الْكَثْرَةِ لَمْ تَتَخَرَّقِ الشَّبَكَةُ.","12":"قَالَ لَهُمْ يَسُوعُ:«هَلُمُّوا تَغَدَّوْا!». وَلَمْ يَجْسُرْ أَحَدٌ مِنَ التَّلاَمِيذِ أَنْ يَسْأَلَهُ: مَنْ أَنْتَ؟ إِذْ كَانُوا يَعْلَمُونَ أَنَّهُ الرَّبُّ.","13":"ثُمَّ جَاءَ يَسُوعُ وَأَخَذَ الْخُبْزَ وَأَعْطَاهُمْ وَكَذلِكَ السَّمَكَ.","14":"هذِهِ مَرَّةٌ ثَالِثَةٌ ظَهَرَ يَسُوعُ لِتَلاَمِيذِهِ بَعْدَمَا قَامَ مِنَ الأَمْوَاتِ.","15":"فَبَعْدَ مَا تَغَدَّوْا قَالَ يَسُوعُ لِسِمْعَانَ بُطْرُسَ: «يَاسِمْعَانُ بْنَ يُونَا، أَتُحِبُّنِي أَكْثَرَ مِنْ هؤُلاَءِ؟» قَالَ لَهُ:«نَعَمْ يَارَبُّ أَنْتَ تَعْلَمُ أَنِّي أُحِبُّكَ». قَالَ لَهُ: «ارْعَ خِرَافِي».","16":"قَالَ لَهُ أَيْضًا ثَانِيَةً:«يَا سِمْعَانُ بْنَ يُونَا، أَتُحِبُّنِي؟» قَالَ لَهُ:«نَعَمْ يَارَبُّ، أَنْتَ تَعْلَمُ أَنِّي أُحِبُّكَ». قَالَ لَهُ:«ارْعَ غَنَمِي».","17":"قَالَ لَهُ ثَالِثَةً:«يَا سِمْعَانُ بْنَ يُونَا، أَتُحِبُّنِي؟» فَحَزِنَ بُطْرُسُ لأَنَّهُ قَالَ لَهُ ثَالِثَةً: أَتُحِبُّنِي؟ فَقَالَ لَهُ: «يَارَبُّ، أَنْتَ تَعْلَمُ كُلَّ شَيْءٍ. أَنْتَ تَعْرِفُ أَنِّي أُحِبُّكَ». قَالَ لَهُ يَسُوعُ:«ارْعَ غَنَمِي.","18":"اَلْحَقَّ الْحَقَّ أَقُولُ لَكَ: لَمَّا كُنْتَ أَكْثَرَ حَدَاثَةً كُنْتَ تُمَنْطِقُ ذَاتَكَ وَتَمْشِي حَيْثُ تَشَاءُ. وَلكِنْ مَتَى شِخْتَ فَإِنَّكَ تَمُدُّ يَدَيْكَ وَآخَرُ يُمَنْطِقُكَ، وَيَحْمِلُكَ حَيْثُ لاَ تَشَاءُ».","19":"قَالَ هذَا مُشِيرًا إِلَى أَيَّةِ مِيتَةٍ كَانَ مُزْمِعًا أَنْ يُمَجِّدَ اللهَ بِهَا. وَلَمَّا قَالَ هذَا قَالَ لَهُ:«اتْبَعْنِي».","20":"فَالْتَفَتَ بُطْرُسُ وَنَظَرَ التِّلْمِيذَ الَّذِي كَانَ يَسُوعُ يُحِبُّهُ يَتْبَعُهُ، وَهُوَ أَيْضًا الَّذِي اتَّكَأَ عَلَى صَدْرِهِ وَقْتَ الْعَشَاءِ، وَقَالَ:«يَا سَيِّدُ، مَنْ هُوَ الَّذِي يُسَلِّمُكَ؟»","21":"فَلَمَّا رَأَى بُطْرُسُ هذَا، قَالَ لِيَسُوعَ:«يَارَبُّ، وَهذَا مَا لَهُ؟»","22":"قَالَ لَهُ يَسُوعُ:«إِنْ كُنْتُ أَشَاءُ أَنَّهُ يَبْقَى حَتَّى أَجِيءَ، فَمَاذَا لَكَ؟ اتْبَعْنِي أَنْتَ!»."},"40.5":{"35":"وَبَيْنَمَا هُوَ يَتَكَلَّمُ جَاءُوا مِنْ دَارِ رَئِيسِ الْمَجْمَعِ قَائِلِينَ:«ابْنَتُكَ مَاتَتْ. لِمَاذَا تُتْعِبُ الْمُعَلِّمَ بَعْدُ؟»","36":"فَسَمِعَ يَسُوعُ لِوَقْتِهِ الْكَلِمَةَ الَّتِي قِيلَتْ، فَقَالَ لِرَئِيسِ الْمَجْمَعِ:«لاَ تَخَفْ! آمِنْ فَقَطْ».","37":"وَلَمْ يَدَعْ أَحَدًا يَتْبَعُهُ إِلاَّ بُطْرُسَ وَيَعْقُوبَ، وَيُوحَنَّا أَخَا يَعْقُوبَ.","38":"فَجَاءَ إِلَى بَيْتِ رَئِيسِ الْمَجْمَعِ وَرَأَى ضَجِيجًا. يَبْكُونَ وَيُوَلْوِلُونَ كَثِيرًا.","39":"فَدَخَلَ وَقَالَ لَهُمْ:«لِمَاذَا تَضِجُّونَ وَتَبْكُونَ؟ لَمْ تَمُتِ الصَّبِيَّةُ لكِنَّهَا نَائِمَةٌ».","40":"فَضَحِكُوا عَلَيْهِ. أَمَّا هُوَ فَأَخْرَجَ الْجَمِيعَ، وَأَخَذَ أَبَا الصَّبِيَّةِ وَأُمَّهَا وَالَّذِينَ مَعَهُ وَدَخَلَ حَيْثُ كَانَتِ الصَّبِيَّةُ مُضْطَجِعَةً،","41":"وَأَمْسَكَ بِيَدِ الصَّبِيَّةِ وَقَالَ لَهَا:«طَلِيثَا، قُومِي!». الَّذِي تَفْسِيرُهُ: يَا صَبِيَّةُ، لَكِ أَقُولُ: قُومِي!","42":"وَلِلْوَقْتِ قَامَتِ الصَّبِيَّةُ وَمَشَتْ، لأَنَّهَا كَانَتِ ابْنَةَ اثْنَتَيْ عَشْرَةَ سَنَةً. فَبُهِتُوا بَهَتًا عَظِيمًا.","43":"فَأَوْصَاهُمْ كَثِيرًا أَنْ لاَ يَعْلَمَ أَحَدٌ بِذلِكَ. وَقَالَ أَنْ تُعْطَى لِتَأْكُلَ.","25":"وَامْرَأَةٌ بِنَزْفِ دَمٍ مُنْذُ اثْنَتَيْ عَشْرَةَ سَنَةً،","26":"وَقَدْ تَأَلَّمَتْ كَثِيرًا مِنْ أَطِبَّاءَ كَثِيرِينَ، وَأَنْفَقَتْ كُلَّ مَا عِنْدَهَا وَلَمْ تَنْتَفِعْ شَيْئًا، بَلْ صَارَتْ إِلَى حَال أَرْدَأَ.","27":"لَمَّا سَمِعَتْ بِيَسُوعَ، جَاءَتْ فِي الْجَمْعِ مِنْ وَرَاءٍ، وَمَسَّتْ ثَوْبَهُ،","28":"لأَنَّهَا قَالَتْ:«إِنْ مَسَسْتُ وَلَوْ ثِيَابَهُ شُفِيتُ».","29":"فَلِلْوَقْتِ جَفَّ يَنْبُوعُ دَمِهَا، وَعَلِمَتْ فِي جِسْمِهَا أَنَّهَا قَدْ بَرِئَتْ مِنَ الدَّاءِ.","30":"فَلِلْوَقْتِ الْتَفَتَ يَسُوعُ بَيْنَ الْجَمْعِ شَاعِرًا فِي نَفْسِهِ بِالْقُوَّةِ الَّتِي خَرَجَتْ مِنْهُ، وَقَالَ:«مَنْ لَمَسَ ثِيَابِي؟»","31":"فَقَالَ لَهُ تَلاَمِيذُهُ:«أَنْتَ تَنْظُرُ الْجَمْعَ يَزْحَمُكَ، وَتَقُولُ: مَنْ لَمَسَنِي؟»","32":"وَكَانَ يَنْظُرُ حَوْلَهُ لِيَرَى الَّتِي فَعَلَتْ هذَا.","33":"وَأَمَّا الْمَرْأَةُ فَجَاءَتْ وَهِيَ خَائِفَةٌ وَمُرْتَعِدَةٌ، عَالِمَةً بِمَا حَصَلَ لَهَا، فَخَرَّتْ وَقَالَتْ لَهُ الْحَقَّ كُلَّهُ.","34":"فَقَالَ لَهَا: «يَا ابْنَةُ، إِيمَانُكِ قَدْ شَفَاكِ، اذْهَبِي بِسَلاَمٍ وَكُونِي صَحِيحَةً مِنْ دَائِكِ»."},"31.2":{"1":"فَصَلَّى يُونَانُ إِلَى الرَّبِّ إِلهِهِ مِنْ جَوْفِ الْحُوتِ،","2":"وَقَالَ: «دَعَوْتُ مِنْ ضِيقِي الرَّبَّ، فَاسْتَجَابَنِي. صَرَخْتُ مِنْ جَوْفِ الْهَاوِيَةِ، فَسَمِعْتَ صَوْتِي.","3":"لأَنَّكَ طَرَحْتَنِي فِي الْعُمْقِ فِي قَلْبِ الْبِحَارِ، فَأَحَاطَ بِي نَهْرٌ. جَازَتْ فَوْقِي جَمِيعُ تَيَّارَاتِكَ وَلُجَجِكَ.","4":"فَقُلْتُ: قَدْ طُرِدْتُ مِنْ أَمَامِ عَيْنَيْكَ. وَلكِنَّنِي أَعُودُ أَنْظُرُ إِلَى هَيْكَلِ قُدْسِكَ.","5":"قَدِ اكْتَنَفَتْنِي مِيَاهٌ إِلَى النَّفْسِ. أَحَاطَ بِي غَمْرٌ. الْتَفَّ عُشْبُ الْبَحْرِ بِرَأْسِي.","6":"نَزَلْتُ إِلَى أَسَافِلِ الْجِبَالِ. مَغَالِيقُ الأَرْضِ عَلَيَّ إِلَى الأَبَدِ. ثُمَّ أَصْعَدْتَ مِنَ الْوَهْدَةِ حَيَاتِي أَيُّهَا الرَّبُّ إِلهِي.","7":"حِينَ أَعْيَتْ فِيَّ نَفْسِي ذَكَرْتُ الرَّبَّ، فَجَاءَتْ إِلَيْكَ صَلاَتِي إِلَى هَيْكَلِ قُدْسِكَ.","8":"اَلَّذِينَ يُرَاعُونَ أَبَاطِيلَ كَاذِبَةً يَتْرُكُونَ نِعْمَتَهُمْ.","9":"أَمَّا أَنَا فَبِصَوْتِ الْحَمْدِ أَذْبَحُ لَكَ، وَأُوفِي بِمَا نَذَرْتُهُ. لِلرَّبِّ الْخَلاَصُ».","10":"وَأَمَرَ الرَّبُّ الْحُوتَ فَقَذَفَ يُونَانَ إِلَى الْبَرِّ."},"41.15":{"17":"فَرَجَعَ إِلَى نَفْسِهِ وَقَالَ: كَمْ مِنْ أَجِيرٍ لأَبِي يَفْضُلُ عَنْهُ الْخُبْزُ وَأَنَا أَهْلِكُ جُوعًا!","18":"أَقُومُ وَأَذْهَبُ إِلَى أَبِي وَأَقُولُ لَهُ: يَا أَبِي، أَخْطَأْتُ إِلَى السَّمَاءِ وَقُدَّامَكَ،","19":"وَلَسْتُ مُسْتَحِقًّا بَعْدُ أَنْ أُدْعَى لَكَ ابْنًا. اِجْعَلْنِي كَأَحَدِ أَجْرَاكَ.","20":"فَقَامَ وَجَاءَ إِلَى أَبِيهِ. وَإِذْ كَانَ لَمْ يَزَلْ بَعِيدًا رَآهُ أَبُوهُ، فَتَحَنَّنَ وَرَكَضَ وَوَقَعَ عَلَى عُنُقِهِ وَقَبَّلَهُ.","21":"فَقَالَ لَهُ الابْنُ:يَا أَبِي، أَخْطَأْتُ إِلَى السَّمَاءِ وَقُدَّامَكَ، وَلَسْتُ مُسْتَحِقًّا بَعْدُ أَنْ أُدْعَى لَكَ ابْنًا.","22":"فَقَالَ الأَبُ لِعَبِيدِهِ: أَخْرِجُوا الْحُلَّةَ الأُولَى وَأَلْبِسُوهُ، وَاجْعَلُوا خَاتَمًا فِي يَدِهِ، وَحِذَاءً فِي رِجْلَيْهِ،","23":"وَقَدِّمُوا الْعِجْلَ الْمُسَمَّنَ وَاذْبَحُوهُ فَنَأْكُلَ وَنَفْرَحَ،","24":"لأَنَّ ابْنِي هذَا كَانَ مَيِّتًا فَعَاشَ، وَكَانَ ضَالاًّ فَوُجِدَ. فَابْتَدَأُوا يَفْرَحُونَ.","11":"وَقَالَ:«إِنْسَانٌ كَانَ لَهُ ابْنَانِ.","12":"فَقَالَ أَصْغَرُهُمَا لأَبِيهِ: يَا أَبِي أَعْطِنِي الْقِسْمَ الَّذِي يُصِيبُنِي مِنَ الْمَالِ. فَقَسَمَ لَهُمَا مَعِيشَتَهُ.","13":"وَبَعْدَ أَيَّامٍ لَيْسَتْ بِكَثِيرَةٍ جَمَعَ الابْنُ الأَصْغَرُ كُلَّ شَيْءٍ وَسَافَرَ إِلَى كُورَةٍ بَعِيدَةٍ، وَهُنَاكَ بَذَّرَ مَالَهُ بِعَيْشٍ مُسْرِفٍ.","14":"فَلَمَّا أَنْفَقَ كُلَّ شَيْءٍ، حَدَثَ جُوعٌ شَدِيدٌ فِي تِلْكَ الْكُورَةِ، فَابْتَدَأَ يَحْتَاجُ.","15":"فَمَضَى وَالْتَصَقَ بِوَاحِدٍ مِنْ أَهْلِ تِلْكَ الْكُورَةِ، فَأَرْسَلَهُ إِلَى حُقُولِهِ لِيَرْعَى خَنَازِيرَ.","16":"وَكَانَ يَشْتَهِي أَنْ يَمْلأَ بَطْنَهُ مِنَ الْخُرْنُوبِ الَّذِي كَانَتِ الْخَنَازِيرُ تَأْكُلُهُ، فَلَمْ يُعْطِهِ أَحَدٌ.","25":"وَكَانَ ابْنُهُ الأَكْبَرُ فِي الْحَقْلِ. فَلَمَّا جَاءَ وَقَرُبَ مِنَ الْبَيْتِ، سَمِعَ صَوْتَ آلاَتِ طَرَبٍ وَرَقْصًا.","26":"فَدَعَا وَاحِدًا مِنَ الْغِلْمَانِ وَسَأَلَهُ: مَا عَسَى أَنْ يَكُونَ هذَا؟","27":"فَقَالَ لَهُ: أَخُوكَ جَاءَ فَذَبَحَ أَبُوكَ الْعِجْلَ الْمُسَمَّنَ، لأَنَّهُ قَبِلَهُ سَالِمًا.","28":"فَغَضِبَ وَلَمْ يُرِدْ أَنْ يَدْخُلَ. فَخَرَجَ أَبُوهُ يَطْلُبُ إِلَيْهِ.","29":"فَأَجَابَ وَقَالَ لأَبِيهِ: هَا أَنَا أَخْدِمُكَ سِنِينَ هذَا عَدَدُهَا، وَقَطُّ لَمْ أَتَجَاوَزْ وَصِيَّتَكَ، وَجَدْيًا لَمْ تُعْطِنِي قَطُّ لأَفْرَحَ مَعَ أَصْدِقَائِي.","30":"وَلكِنْ لَمَّا جَاءَ ابْنُكَ هذَا الَّذِي أَكَلَ مَعِيشَتَكَ مَعَ الزَّوَانِي، ذَبَحْتَ لَهُ الْعِجْلَ الْمُسَمَّنَ!","31":"فَقَالَ لَهُ: يَا بُنَيَّ أَنْتَ مَعِي فِي كُلِّ حِينٍ، وَكُلُّ مَا لِي فَهُوَ لَكَ.","32":"وَلكِنْ كَانَ يَنْبَغِي أَنْ نَفْرَحَ وَنُسَرَّ، لأَنَّ أَخَاكَ هذَا كَانَ مَيِّتًا فَعَاشَ، وَكَانَ ضَالُا فَوُجِدَ».","3":"فَكَلَّمَهُمْ بِهذَا الْمَثَلِ قِائِلاً:","4":"«أَيُّ إِنْسَانٍ مِنْكُمْ لَهُ مِئَةُ خَرُوفٍ، وَأَضَاعَ وَاحِدًا مِنْهَا، أَلاَ يَتْرُكُ التِّسْعَةَ وَالتِّسْعِينَ فِي الْبَرِّيَّةِ، وَيَذْهَبَ لأَجْلِ الضَّالِّ حَتَّى يَجِدَهُ؟","5":"وَإِذَا وَجَدَهُ يَضَعُهُ عَلَى مَنْكِبَيْهِ فَرِحًا،","6":"وَيَأْتِي إِلَى بَيْتِهِ وَيَدْعُو الأَصْدِقَاءَ وَالْجِيرَانَ قَائِلاً لَهُمُ: افْرَحُوا مَعِي، لأَنِّي وَجَدْتُ خَرُوفِي الضَّالَّ!.","7":"أَقُولُ لَكُمْ: إِنَّهُ هكَذَا يَكُونُ فَرَحٌ فِي السَّمَاءِ بِخَاطِئٍ وَاحِدٍ يَتُوبُ أَكْثَرَ مِنْ تِسْعَةٍ وَتِسْعِينَ بَارًّا لاَ يَحْتَاجُونَ إِلَى تَوْبَةٍ.","8":"«أَوْ أَيَّةُ امْرَأَةٍ لَهَا عَشْرَةُ دَرَاهِمَ، إِنْ أَضَاعَتْ دِرْهَمًا وَاحِدًا، أَلاَ تُوقِدُ سِرَاجًا وَتَكْنُسُ الْبَيْتَ وَتُفَتِّشُ بِاجْتِهَادٍ حَتَّى تَجِدَهُ؟","9":"وَإِذَا وَجَدَتْهُ تَدْعُو الصَّدِيقَاتِ وَالْجَارَاتِ قَائِلَةً: افْرَحْنَ مَعِي لأَنِّي وَجَدْتُ الدِّرْهَمَ الَّذِي أَضَعْتُهُ.","10":"هكَذَا، أَقُولُ لَكُمْ: يَكُونُ فَرَحٌ قُدَّامَ مَلاَئِكَةِ اللهِ بِخَاطِئٍ وَاحِدٍ يَتُوبُ."},"18.32":{"8":"«أُعَلِّمُكَ وَأُرْشِدُكَ الطَّرِيقَ الَّتِي تَسْلُكُهَا. أَنْصَحُكَ. عَيْنِي عَلَيْكَ.","1":"طُوبَى لِلَّذِي غُفِرَ إِثْمُهُ وَسُتِرَتْ خَطِيَّتُهُ.","2":"طُوبَى لِرَجُل لاَ يَحْسِبُ لَهُ الرَّبُّ خَطِيَّةً، وَلاَ فِي رُوحِهِ غِشٌّ.","7":"أَنْتَ سِتْرٌ لِي. مِنَ الضِّيقِ تَحْفَظُنِي. بِتَرَنُّمِ النَّجَاةِ تَكْتَنِفُنِي. سِلاَهْ.","11":"افْرَحُوا بِالرَّبِّ وَابْتَهِجُوا يَا أَيُّهَا الصِّدِّيقُونَ، وَاهْتِفُوا يَا جَمِيعَ الْمُسْتَقِيمِي الْقُلُوبِ."},"19.2":{"6":"لأَنَّ الرَّبَّ يُعْطِي حِكْمَةً. مِنْ فَمِهِ الْمَعْرِفَةُ وَالْفَهْمُ.","1":"يَا ابْنِي، إِنْ قَبِلْتَ كَلاَمِي وَخَبَّأْتَ وَصَايَايَ عِنْدَكَ،","2":"حَتَّى تُمِيلَ أُذْنَكَ إِلَى الْحِكْمَةِ، وَتُعَطِّفَ قَلْبَكَ عَلَى الْفَهْمِ،","3":"إِنْ دَعَوْتَ الْمَعْرِفَةَ، وَرَفَعْتَ صَوْتَكَ إِلَى الْفَهْمِ،","4":"إِنْ طَلَبْتَهَا كَالْفِضَّةِ، وَبَحَثْتَ عَنْهَا كَالْكُنُوزِ،","5":"فَحِينَئِذٍ تَفْهَمُ مَخَافَةَ الرَّبِّ، وَتَجِدُ مَعْرِفَةَ اللهِ."},"18.143":{"8":"أَسْمِعْنِي رَحْمَتَكَ فِي الْغَدَاةِ، لأَنِّي عَلَيْكَ تَوَكَّلْتُ. عَرِّفْنِي الطَّرِيقَ الَّتِي أَسْلُكُ فِيهَا، لأَنِّي إِلَيْكَ رَفَعْتُ نَفْسِي.","6":"بَسَطْتُ إِلَيْكَ يَدَيَّ، نَفْسِي نَحْوَكَ كَأَرْضٍ يَابِسَةٍ. سِلاَهْ."},"22.42":{"16":"وَأُسَيِّرُ الْعُمْيَ فِي طَرِيق لَمْ يَعْرِفُوهَا. فِي مَسَالِكَ لَمْ يَدْرُوهَا أُمَشِّيهِمْ. أَجْعَلُ الظُّلْمَةَ أَمَامَهُمْ نُورًا، وَالْمُعْوَجَّاتِ مُسْتَقِيمَةً. هذِهِ الأُمُورُ أَفْعَلُهَا وَلاَ أَتْرُكُهُمْ."},"42.8":{"12":"ثُمَّ كَلَّمَهُمْ يَسُوعُ أَيْضًا قَائِلاً:«أَنَا هُوَ نُورُ الْعَالَمِ. مَنْ يَتْبَعْنِي فَلاَ يَمْشِي فِي الظُّلْمَةِ بَلْ يَكُونُ لَهُ نُورُ الْحَيَاةِ».","3":"وَقَدَّمَإِلَيْهِ الْكَتَبَةُ وَالْفَرِّيسِيُّونَ امْرَأَةً أُمْسِكَتْ فِي زِنًا. وَلَمَّا أَقَامُوهَا فِي الْوَسْطِ","4":"قَالُوا لَهُ:«يَا مُعَلِّمُ، هذِهِ الْمَرْأَةُ أُمْسِكَتْ وَهِيَ تَزْنِي فِي ذَاتِ الْفِعْلِ،","5":"وَمُوسَى فِي النَّامُوسِ أَوْصَانَا أَنَّ مِثْلَ هذِهِ تُرْجَمُ. فَمَاذَا تَقُولُ أَنْتَ؟»","6":"قَالُوا هذَا لِيُجَرِّبُوهُ، لِكَيْ يَكُونَ لَهُمْ مَا يَشْتَكُونَ بِهِ عَلَيْهِ. وَأَمَّا يَسُوعُ فَانْحَنَى إِلَى أَسْفَلُ وَكَانَ يَكْتُبُ بِإِصْبِعِهِ عَلَى الأَرْضِ.","7":"وَلَمَّا اسْتَمَرُّوا يَسْأَلُونَهُ، انْتَصَبَ وَقَالَ لَهُمْ:«مَنْ كَانَ مِنْكُمْ بِلاَ خَطِيَّةٍ فَلْيَرْمِهَا أَوَّلاً بِحَجَرٍ!»","8":"ثُمَّ انْحَنَى أَيْضًا إِلَى أَسْفَلُ وَكَانَ يَكْتُبُ عَلَى الأَرْضِ.","9":"وَأَمَّا هُمْ فَلَمَّا سَمِعُوا وَكَانَتْ ضَمَائِرُهُمْ تُبَكِّتُهُمْ، خَرَجُوا وَاحِدًا فَوَاحِدًا، مُبْتَدِئِينَ مِنَ الشُّيُوخِ إِلَى الآخِرِينَ. وَبَقِيَ يَسُوعُ وَحْدَهُ وَالْمَرْأَةُ وَاقِفَةٌ فِي الْوَسْطِ.","10":"فَلَمَّا انْتَصَبَ يَسُوعُ وَلَمْ يَنْظُرْ أَحَدًا سِوَى الْمَرْأَةِ، قَالَ لَهَا:«يَاامْرَأَةُ، أَيْنَ هُمْ أُولئِكَ الْمُشْتَكُونَ عَلَيْكِ؟ أَمَا دَانَكِ أَحَدٌ؟»","11":"فَقَالَتْ: «لاَ أَحَدَ، يَا سَيِّدُ!». فَقَالَ لَهَا يَسُوعُ:«وَلاَ أَنَا أَدِينُكِ. اذْهَبِي وَلاَ تُخْطِئِي أَيْضًا»."},"18.48":{"14":"لأَنَّ اللهَ هذَا هُوَ إِلهُنَا إِلَى الدَّهْرِ وَالأَبَدِ. هُوَ يَهْدِينَا حَتَّى إِلَى الْمَوْتِ."},"22.58":{"11":"وَيَقُودُكَ الرَّبُّ عَلَى الدَّوَامِ، وَيُشْبعُ فِي الْجَدُوبِ نَفْسَكَ، وَيُنَشِّطُ عِظَامَكَ فَتَصِيرُ كَجَنَّةٍ رَيَّا وَكَنَبْعِ مِيَاهٍ لاَ تَنْقَطِعُ مِيَاهُهُ."},"10.3":{"5":"فِي جِبْعُونَ تَرَاءَى الرَّبُّ لِسُلَيْمَانَ فِي حُلْمٍ لَيْلاً، وَقَالَ اللهُ: «اسْأَلْ مَاذَا أُعْطِيكَ».","6":"فَقَالَ سُلَيْمَانُ: «إِنَّكَ قَدْ فَعَلْتَ مَعَ عَبْدِكَ دَاوُدَ أَبِي رَحْمَةً عَظِيمَةً حَسْبَمَا سَارَ أَمَامَكَ بِأَمَانَةٍ وَبِرّ وَاسْتِقَامَةِ قَلْبٍ مَعَكَ، فَحَفِظْتَ لَهُ هذِهِ الرَّحْمَةَ الْعَظِيمَةَ وَأَعْطَيْتَهُ ابْنًا يَجْلِسُ عَلَى كُرْسِيِّهِ كَهذَا الْيَوْمِ.","7":"وَالآنَ أَيُّهَا الرَّبُّ إِلهِي، أَنْتَ مَلَّكْتَ عَبْدَكَ مَكَانَ دَاوُدَ أَبِي، وَأَنَا فَتىً صَغِيرٌ لاَ أَعْلَمُ الْخُرُوجَ وَالدُّخُولَ.","8":"وَعَبْدُكَ فِي وَسَطِ شَعْبِكَ الَّذِي اخْتَرْتَهُ، شَعْبٌ كَثِيرٌ لاَ يُحْصَى وَلاَ يُعَدُّ مِنَ الْكَثْرَةِ.","9":"فَأَعْطِ عَبْدَكَ قَلْبًا فَهِيمًا لأَحْكُمَ عَلَى شَعْبِكَ وَأُمَيِّزَ بَيْنَ الْخَيْرِ وَالشَّرِّ، لأَنَّهُ مَنْ يَقْدُِرُ أَنْ يَحْكُمَ عَلَى شَعْبِكَ الْعَظِيمِ هذَا؟»","10":"فَحَسُنَ الْكَلاَمُ فِي عَيْنَيِ الرَّبِّ، لأَنَّ سُلَيْمَانَ سَأَلَ هذَا الأَمْرَ.","11":"فَقَالَ لَهُ اللهُ: «مِنْ أَجْلِ أَنَّكَ قَدْ سَأَلْتَ هذَا الأَمْرَ، وَلَمْ تَسْأَلْ لِنَفْسِكَ أَيَّامًا كَثِيرَةً وَلاَ سَأَلْتَ لِنَفْسِكَ غِنًى، وَلاَ سَأَلْتَ أَنْفُسَ أَعْدَائِكَ، بَلْ سَأَلْتَ لِنَفْسِكَ تَمْيِيزًا لِتَفْهَمَ الْحُكْمَ،","12":"هُوَذَا قَدْ فَعَلْتُ حَسَبَ كَلاَمِكَ. هُوَذَا أَعْطَيْتُكَ قَلْبًا حَكِيمًا وَمُمَيِّزًا حَتَّى إِنَّهُ لَمْ يَكُنْ مِثْلُكَ قَبْلَكَ وَلاَ يَقُومُ بَعْدَكَ نَظِيرُكَ.","13":"وَقَدْ أَعْطَيْتُكَ أَيْضًا مَا لَمْ تَسْأَلْهُ، غِنًى وَكَرَامَةً حَتَّى إِنَّهُ لاَ يَكُونُ رَجُلٌ مِثْلَكَ فِي الْمُلُوكِ كُلَّ أَيَّامِكَ.","14":"فَإِنْ سَلَكْتَ فِي طَرِيقِي وَحَفِظْتَ فَرَائِضِي وَوَصَايَايَ، كَمَا سَلَكَ دَاوُدُ أَبُوكَ، فَإِنِّي أُطِيلُ أَيَّامَكَ».","15":"فَاسْتَيْقَظَ سُلَيْمَانُ وَإِذَا هُوَ حُلْمٌ. وَجَاءَ إِلَى أُورُشَلِيمَ وَوَقَفَ أَمَامَ تَابُوتِ عَهْدِ الرَّبِّ وَأَصْعَدَ مُحْرَقَاتٍ وَقَرَّبَ ذَبَائِحَ سَلاَمَةٍ، وَعَمِلَ وَلِيمَةً لِكُلِّ عَبِيدِهِ.","16":"حِينَئِذٍ أَتَتِ امْرَأَتَانِ زَانِيَتَانِ إِلَى الْمَلِكِ وَوَقَفَتَا بَيْنَ يَدَيْهِ.","17":"فَقَالَتِ الْمَرْأَةُ الْوَاحِدَةُ: «اسْتَمِعْ يَا سَيِّدِي. إِنِّي أَنَا وَهذِهِ الْمَرْأَةُ سَاكِنَتَانِ فِي بَيْتٍ وَاحِدٍ، وَقَدْ وَلَدْتُ مَعَهَا فِي الْبَيْتِ.","18":"وَفِي الْيَوْمِ الثَّالِثِ بَعْدَ وِلاَدَتِي وَلَدَتْ هذِهِ الْمَرْأَةُ أَيْضًا، وَكُنَّا مَعًا، وَلَمْ يَكُنْ مَعَنَا غَرِيبٌ فِي الْبَيْتِ غَيْرَنَا نَحْنُ كِلْتَيْنَا فِي الْبَيْتِ.","19":"فَمَاتَ ابْنُ هذِهِ فِي اللَّيْلِ، لأَنَّهَا اضْطَجَعَتْ عَلَيْهِ.","20":"فَقَامَتْ فِي وَسَطِ اللَّيْلِ وَأَخَذَتِ ابْنِي مِنْ جَانِبِي وَأَمَتُكَ نَائِمَةٌ، وَأَضْجَعَتْهُ فِي حِضْنِهَا، وَأَضْجَعَتِ ابْنَهَا الْمَيْتَ فِي حِضْنِي.","21":"فَلَمَّا قُمْتُ صَبَاحًا لأُرَضِّعَ ابْنِي، إِذَا هُوَ مَيْتٌ. وَلَمَّا تَأَمَّلْتُ فِيهِ فِي الصَّبَاحِ، إِذَا هُوَ لَيْسَ ابْنِيَ الَّذِي وَلَدْتُهُ».","22":"وَكَانَتِ الْمَرْأَةُ الأُخْرَى تَقُولُ: «كَلاَّ، بَلِ ابْنِيَ الْحَيُّ وَابْنُكِ الْمَيْتُ». وَهذِهِ تَقُولُ: «لاَ، بَلِ ابْنُكِ الْمَيْتُ وَابْنِيَ الْحَيُّ». وَتَكَلَّمَتَا أَمَامَ الْمَلِكِ.","23":"فَقَالَ الْمَلِكُ: «هذِهِ تَقُولُ: هذَا ابْنِيَ الْحَيُّ وَابْنُكِ الْمَيْتُ، وَتِلْكَ تَقُولُ: لاَ، بَلِ ابْنُكِ الْمَيْتُ وَابْنِيَ الْحَيُّ».","24":"فَقَالَ الْمَلِكُ: «اِيتُونِي بِسَيْفٍ». فَأَتَوْا بِسَيْفٍ بَيْنَ يَدَيِ الْمَلِكِ.","25":"فَقَالَ الْمَلِكُ: «اشْطُرُوا الْوَلَدَ الْحَيَّ اثْنَيْنِ، وَأَعْطُوا نِصْفًا لِلْوَاحِدَةِ وَنِصْفًا لِلأُخْرَى».","26":"فَتَكَلَّمَتِ الْمَرْأَةُ الَّتِي ابْنُهَا الْحَيُّ لِلْمَلِكِ، لأَنَّ أَحْشَاءَهَا اضْطَرَمَتْ عَلَى ابْنِهَا، وَقَالَتِ: «اسْتَمِعْ يَا سَيِّدِي. أَعْطُوهَا الْوَلَدَ الْحَيَّ وَلاَ تُمِيتُوهُ». وَأَمَّا تِلْكَ فَقَالَتْ: «لاَ يَكُونُ لِي وَلاَ لَكِ. اُشْطُرُوهُ».","27":"فَأَجَابَ الْمَلِكُ وَقَالَ: «أَعْطُوهَا الْوَلَدَ الْحَيَّ وَلاَ تُمِيتُوهُ فَإِنَّهَا أُمُّهُ».","28":"وَلَمَّا سَمِعَ جَمِيعُ إِسْرَائِيلَ بِالْحُكْمِ الَّذِي حَكَمَ بِهِ الْمَلِكُ خَافُوا الْمَلِكَ، لأَنَّهُمْ رَأَوْا حِكْمَةَ اللهِ فِيهِ لإِجْرَاءِ الْحُكْمِ."},"0.12":{"1":"وَقَالَ الرَّبُّ لأَبْرَامَ: «اذْهَبْ مِنْ أَرْضِكَ وَمِنْ عَشِيرَتِكَ وَمِنْ بَيْتِ أَبِيكَ إِلَى الأَرْضِ الَّتِي أُرِيكَ.","2":"فَأَجْعَلَكَ أُمَّةً عَظِيمَةً وَأُبَارِكَكَ وَأُعَظِّمَ اسْمَكَ، وَتَكُونَ بَرَكَةً.","3":"وَأُبَارِكُ مُبَارِكِيكَ، وَلاَعِنَكَ أَلْعَنُهُ. وَتَتَبَارَكُ فِيكَ جَمِيعُ قَبَائِلِ الأَرْضِ».","4":"فَذَهَبَ أَبْرَامُ كَمَا قَالَ لَهُ الرَّبُّ وَذَهَبَ مَعَهُ لُوطٌ. وَكَانَ أَبْرَامُ ابْنَ خَمْسٍ وَسَبْعِينَ سَنَةً لَمَّا خَرَجَ مِنْ حَارَانَ."},"43.8":{"26":"ثُمَّ إِنَّ مَلاَكَ الرَّبِّ كَلَّمَ فِيلُبُّسَ قِائِلاً:«قُمْ وَاذْهَبْ نَحْوَ الْجَنُوبِ، عَلَى الطَّرِيقِ الْمُنْحَدِرَةِ مِنْ أُورُشَلِيمَ إِلَى غَزَّةَ الَّتِي هِيَ بَرِّيَّةٌ».","27":"فَقَامَ وَذَهَبَ. وَإِذَا رَجُلٌ حَبَشِيٌّ خَصِيٌّ، وَزِيرٌ لِكَنْدَاكَةَ مَلِكَةِ الْحَبَشَةِ، كَانَ عَلَى جَمِيعِ خَزَائِنِهَا. فَهذَا كَانَ قَدْ جَاءَ إِلَى أُورُشَلِيمَ لِيَسْجُدَ.","28":"وَكَانَ رَاجِعًا وَجَالِسًا عَلَى مَرْكَبَتِهِ وَهُوَ يَقْرَأُ النَّبِيَّ إِشَعْيَاءَ.","29":"فَقَالَ الرُّوحُ لِفِيلُبُّسَ:«تَقَدَّمْ وَرَافِقْ هذِهِ الْمَرْكَبَةَ».","30":"فَبَادَرَ إِلَيْهِ فِيلُبُّسُ، وَسَمِعَهُ يَقْرَأُ النَّبِيَّ إِشَعْيَاءَ، فَقَالَ:«أَلَعَلَّكَ تَفْهَمُ مَا أَنْتَ تَقْرَأُ؟»","31":"فَقَالَ:«كَيْفَ يُمْكِنُنِي إِنْ لَمْ يُرْشِدْنِي أَحَدٌ؟». وَطَلَبَ إِلَى فِيلُبُّسَ أَنْ يَصْعَدَ وَيَجْلِسَ مَعَهُ.","32":"وَأَمَّا فَصْلُ الْكِتَابِ الَّذِي كَانَ يَقْرَأُهُ فَكَانَ هذَا:«مِثْلَ شَاةٍ سِيقَ إِلَى الذَّبْحِ، وَمِثْلَ خَرُوفٍ صَامِتٍ أَمَامَ الَّذِي يَجُزُّهُ هكَذَا لَمْ يَفْتَحْ فَاهُ.","33":"فِي تَوَاضُعِهِ انْتُزِعَ قَضَاؤُهُ، وَجِيلُهُ مَنْ يُخْبِرُ بِهِ؟ لأَنَّ حَيَاتَهُ تُنْتَزَعُ مِنَ الأَرْضِ»","34":"فَأَجَابَ الْخَصِيُّ فِيلُبُّسَ وَقَالَ:«أَطْلُبُ إِلَيْكَ: عَنْ مَنْ يَقُولُ النَّبِيُّ هذَا؟ عَنْ نَفْسِهِ أَمْ عَنْ وَاحِدٍ آخَرَ؟»","35":"فَفَتَحَ فِيلُبُّسُ فَاهُ وابْتَدَأَ مِنْ هذَا الْكِتَابِ فَبَشِّرَهُ بِيَسُوعَ.","36":"وَفِيمَا هُمَا سَائِرَانِ فِي الطَّرِيقِ أَقْبَلاَ عَلَى مَاءٍ، فَقَالَ الْخَصِيُّ:«هُوَذَا مَاءٌ. مَاذَا يَمْنَعُ أَنْ أَعْتَمِدَ؟»","37":"فَقَالَ فِيلُبُّسُ:«إِنْ كُنْتَ تُؤْمِنُ مِنْ كُلِّ قَلْبِكَ يَجُوزُ». فَأَجَابَ وَقَالَ:«أَنَا أُومِنُ أَنَّ يَسُوعَ الْمَسِيحَ هُوَ ابْنُ اللهِ».","38":"فَأَمَرَ أَنْ تَقِفَ الْمَرْكَبَةُ، فَنَزَلاَ كِلاَهُمَا إِلَى الْمَاءِ، فِيلُبُّسُ وَالْخَصِيُّ، فَعَمَّدَهُ.","39":"وَلَمَّا صَعِدَا مِنَ الْمَاءِ، خَطِفَ رُوحُ الرَّبِّ فِيلُبُّسَ، فَلَمْ يُبْصِرْهُ الْخَصِيُّ أَيْضًا، وَذَهَبَ فِي طَرِيقِهِ فَرِحًا."},"1.3":{"1":"وَأَمَّا مُوسَى فَكَانَ يَرْعَى غَنَمَ يَثْرُونَ حَمِيهِ كَاهِنِ مِدْيَانَ، فَسَاقَ الْغَنَمَ إِلَى وَرَاءِ الْبَرِّيَّةِ وَجَاءَ إِلَى جَبَلِ اللهِ حُورِيبَ.","2":"وَظَهَرَ لَهُ مَلاَكُ الرَّبِّ بِلَهِيبِ نَارٍ مِنْ وَسَطِ عُلَّيْقَةٍ. فَنَظَرَ وَإِذَا الْعُلَّيْقَةُ تَتَوَقَّدُ بِالنَّارِ، وَالْعُلَّيْقَةُ لَمْ تَكُنْ تَحْتَرِقُ.","3":"فَقَالَ مُوسَى: «أَمِيلُ الآنَ لأَنْظُرَ هذَا الْمَنْظَرَ الْعَظِيمَ. لِمَاذَا لاَ تَحْتَرِقُ الْعُلَّيْقَةُ؟».","4":"فَلَمَّا رَأَى الرَّبُّ أَنَّهُ مَالَ لِيَنْظُرَ، نَادَاهُ اللهُ مِنْ وَسَطِ الْعُلَّيْقَةِ وَقَالَ: «مُوسَى، مُوسَى!». فَقَالَ: «هأَنَذَا».","5":"فَقَالَ: «لاَ تَقْتَرِبْ إِلَى ههُنَا. اخْلَعْ حِذَاءَكَ مِنْ رِجْلَيْكَ، لأَنَّ الْمَوْضِعَ الَّذِي أَنْتَ وَاقِفٌ عَلَيْهِ أَرْضٌ مُقَدَّسَةٌ».","6":"ثُمَّ قَالَ: «أَنَا إِلهُ أَبِيكَ، إِلهُ إِبْرَاهِيمَ وَإِلهُ إِسْحَاقَ وَإِلهُ يَعْقُوبَ». فَغَطَّى مُوسَى وَجْهَهُ لأَنَّهُ خَافَ أَنْ يَنْظُرَ إِلَى اللهِ.","7":"فَقَالَ الرَّبُّ: «إِنِّي قَدْ رَأَيْتُ مَذَلَّةَ شَعْبِي الَّذِي فِي مِصْرَ وَسَمِعْتُ صُرَاخَهُمْ مِنْ أَجْلِ مُسَخِّرِيهِمْ. إِنِّي عَلِمْتُ أَوْجَاعَهُمْ،","8":"فَنَزَلْتُ لأُنْقِذَهُمْ مِنْ أَيْدِي الْمِصْرِيِّينَ، وَأُصْعِدَهُمْ مِنْ تِلْكَ الأَرْضِ إِلَى أَرْضٍ جَيِّدَةٍ وَوَاسِعَةٍ، إِلَى أَرْضٍ تَفِيضُ لَبَنًا وَعَسَلاً، إِلَى مَكَانِ الْكَنْعَانِيِّينَ وَالْحِثِّيِّينَ وَالأَمُورِيِّينَ وَالْفِرِزَّيِّينَ وَالْحِوِّيِّينَ وَالْيَبُوسِيِّينَ.","9":"وَالآنَ هُوَذَا صُرَاخُ بَنِي إِسْرَائِيلَ قَدْ أَتَى إِلَيَّ، وَرَأَيْتُ أَيْضًا الضِّيقَةَ الَّتِي يُضَايِقُهُمْ بِهَا الْمِصْرِيُّونَ،","10":"فَالآنَ هَلُمَّ فَأُرْسِلُكَ إِلَى فِرْعَوْنَ، وَتُخْرِجُ شَعْبِي بَنِي إِسْرَائِيلَ مِنْ مِصْرَ».","11":"فَقَالَ مُوسَى للهِِ: «مَنْ أَنَا حَتَّى أَذْهَبَ إِلَى فِرْعَوْنَ، وَحَتَّى أُخْرِجَ بَنِي إِسْرَائِيلَ مِنْ مِصْرَ؟»","12":"فَقَالَ: «إِنِّي أَكُونُ مَعَكَ، وَهذِهِ تَكُونُ لَكَ الْعَلاَمَةُ أَنِّي أَرْسَلْتُكَ: حِينَمَا تُخْرِجُ الشَّعْبَ مِنْ مِصْرَ، تَعْبُدُونَ اللهَ عَلَى هذَا الْجَبَلِ»."},"61.1":{"9":"إِنِ اعْتَرَفْنَا بِخَطَايَانَا فَهُوَ أَمِينٌ وَعَادِلٌ، حَتَّى يَغْفِرَ لَنَا خَطَايَانَا وَيُطَهِّرَنَا مِنْ كُلِّ إِثْمٍ."},"18.103":{"12":"كَبُعْدِ الْمَشْرِقِ مِنَ الْمَغْرِبِ أَبْعَدَ عَنَّا مَعَاصِيَنَا.","8":"الرَّبُّ رَحِيمٌ وَرَؤُوفٌ، طَوِيلُ الرُّوحِ وَكَثِيرُ الرَّحْمَةِ.","9":"لاَ يُحَاكِمُ إِلَى الأَبَدِ، وَلاَ يَحْقِدُ إِلَى الدَّهْرِ.","10":"لَمْ يَصْنَعْ مَعَنَا حَسَبَ خَطَايَانَا، وَلَمْ يُجَازِنَا حَسَبَ آثامِنَا.","2":"بَارِكِي يَا نَفْسِي الرَّبَّ، وَلاَ تَنْسَيْ كُلَّ حَسَنَاتِهِ.","3":"الَّذِي يَغْفِرُ جَمِيعَ ذُنُوبِكِ. الَّذِي يَشْفِي كُلَّ أَمْرَاضِكِ.","6":"اَلرَّبُّ مُجْرِي الْعَدْلِ وَالْقَضَاءِ لِجَمِيعِ الْمَظْلُومِينَ.","1":"بَارِكِي يَا نَفْسِي الرَّبَّ، وَكُلُّ مَا فِي بَاطِنِي لِيُبَارِكِ اسْمَهُ الْقُدُّوسَ.","4":"الَّذِي يَفْدِي مِنَ الْحُفْرَةِ حَيَاتَكِ. الَّذِي يُكَلِّلُكِ بِالرَّحْمَةِ وَالرَّأْفَةِ.","5":"الَّذِي يُشْبعُ بِالْخَيْرِ عُمْرَكِ، فَيَتَجَدَّدُ مِثْلَ النَّسْرِ شَبَابُكِ.","11":"لأَنَّهُ مِثْلُ ارْتِفَاعِ السَّمَاوَاتِ فَوْقَ الأَرْضِ قَوِيَتْ رَحْمَتُهُ عَلَى خَائِفِيهِ.","17":"أَمَّا رَحْمَةُ الرَّبِّ فَإِلَى الدَّهْرِ وَالأَبَدِ عَلَى خَائِفِيهِ، وَعَدْلُهُ عَلَى بَنِي الْبَنِينَ،"},"22.1":{"18":"هَلُمَّ نَتَحَاجَجْ، يَقُولُ الرَّبُّ. إِنْ كَانَتْ خَطَايَاكُمْ كَالْقِرْمِزِ تَبْيَضُّ كَالثَّلْجِ. إِنْ كَانَتْ حَمْرَاءَ كَالدُّودِيِّ تَصِيرُ كَالصُّوفِ."},"18.86":{"5":"لأَنَّكَ أَنْتَ يَا رَبُّ صَالِحٌ وَغَفُورٌ، وَكَثِيرُ الرَّحْمَةِ لِكُلِّ الدَّاعِينَ إِلَيْكَ."},"19.28":{"13":"مَنْ يَكْتُمُ خَطَايَاهُ لاَ يَنْجَحُ، وَمَنْ يُقِرُّ بِهَا وَيَتْرُكُهَا يُرْحَمُ."},"48.1":{"7":"الَّذِي فِيهِ لَنَا الْفِدَاءُ بِدَمِهِ، غُفْرَانُ الْخَطَايَا، حَسَبَ غِنَى نِعْمَتِهِ،","4":"كَمَا اخْتَارَنَا فِيهِ قَبْلَ تَأْسِيسِ الْعَالَمِ، لِنَكُونَ قِدِّيسِينَ وَبِلاَ لَوْمٍ قُدَّامَهُ فِي الْمَحَبَّةِ،","5":"إِذْ سَبَقَ فَعَيَّنَنَا لِلتَّبَنِّي بِيَسُوعَ الْمَسِيحِ لِنَفْسِهِ، حَسَبَ مَسَرَّةِ مَشِيئَتِهِ،","6":"لِمَدْحِ مَجْدِ نِعْمَتِهِ الَّتِي أَنْعَمَ بِهَا عَلَيْنَا فِي الْمَحْبُوبِ،","17":"كَيْ يُعْطِيَكُمْ إِلهُ رَبِّنَا يَسُوعَ الْمَسِيحِ، أَبُو الْمَجْدِ، رُوحَ الْحِكْمَةِ وَالإِعْلاَنِ فِي مَعْرِفَتِهِ،","11":"الَّذِي فِيهِ أَيْضًا نِلْنَا نَصِيبًا، مُعَيَّنِينَ سَابِقًا حَسَبَ قَصْدِ الَّذِي يَعْمَلُ كُلَّ شَيْءٍ حَسَبَ رَأْيِ مَشِيئَتِهِ،","12":"لِنَكُونَ لِمَدْحِ مَجْدِهِ، نَحْنُ الَّذِينَ قَدْ سَبَقَ رَجَاؤُنَا فِي الْمَسِيحِ."},"57.10":{"17":"وَلَنْ أَذْكُرَ خَطَايَاهُمْ وَتَعَدِّيَاتِهِمْ فِي مَا بَعْدُ».","36":"لأَنَّكُمْ تَحْتَاجُونَ إِلَى الصَّبْرِ، حَتَّى إِذَا صَنَعْتُمْ مَشِيئَةَ اللهِ تَنَالُونَ الْمَوْعِدَ."},"43.3":{"19":"فَتُوبُوا وَارْجِعُوا لِتُمْحَى خَطَايَاكُمْ، لِكَيْ تَأْتِيَ أَوْقَاتُ الْفَرَجِ مِنْ وَجْهِ الرَّبِّ.","1":"وَصَعِدَ بُطْرُسُ وَيُوحَنَّا مَعًا إِلَى الْهَيْكَلِ فِي سَاعَةِ الصَّلاَةِ التَّاسِعَةِ.","2":"وَكَانَ رَجُلٌ أَعْرَجُ مِنْ بَطْنِ أُمِّهِ يُحْمَلُ، كَانُوا يَضَعُونَهُ كُلَّ يَوْمٍ عِنْدَ بَابِ الْهَيْكَلِ الَّذِي يُقَالُ لَهُ «الْجَمِيلُ» لِيَسْأَلَ صَدَقَةً مِنَ الَّذِينَ يَدْخُلُونَ الْهَيْكَلَ.","3":"فَهذَا لَمَّا رَأَى بُطْرُسَ وَيُوحَنَّا مُزْمِعَيْنِ أَنْ يَدْخُلاَ الْهَيْكَلَ، سَأَلَ لِيَأْخُذَ صَدَقَةً.","4":"فَتَفَرَّسَ فِيهِ بُطْرُسُ مَعَ يُوحَنَّا، وَقَالَ:«انْظُرْ إِلَيْنَا!»","5":"فَلاَحَظَهُمَا مُنْتَظِرًا أَنْ يَأْخُذَ مِنْهُمَا شَيْئًا.","6":"فَقَالَ بُطْرُسُ:«لَيْسَ لِي فِضَّةٌ وَلاَ ذَهَبٌ، وَلكِنِ الَّذِي لِي فَإِيَّاهُ أُعْطِيكَ: بِاسْمِ يَسُوعَ الْمَسِيحِ النَّاصِرِيِّ قُمْ وَامْشِ!».","7":"وَأَمْسَكَهُ بِيَدِهِ الْيُمْنَى وَأَقَامَهُ، فَفِي الْحَالِ تَشَدَّدَتْ رِجْلاَهُ وَكَعْبَاهُ،","8":"فَوَثَبَ وَوَقَفَ وَصَارَ يَمْشِي، وَدَخَلَ مَعَهُمَا إِلَى الْهَيْكَلِ وَهُوَ يَمْشِي وَيَطْفُرُ وَيُسَبِّحُ اللهَ.","9":"وَأَبْصَرَهُ جَمِيعُ الشَّعْبِ وَهُوَ يَمْشِي وَيُسَبِّحُ اللهَ.","10":"وَعَرَفُوهُ أَنَّهُ هُوَ الَّذِي كَانَ يَجْلِسُ لأَجْلِ الصَّدَقَةِ عَلَى بَابِ الْهَيْكَلِ الْجَمِيلِ، فَامْتَلأُوا دَهْشَةً وَحَيْرَةً مِمَّا حَدَثَ لَهُ."},"22.55":{"7":"لِيَتْرُكِ الشِّرِّيرُ طَرِيقَهُ، وَرَجُلُ الإِثْمِ أَفْكَارَهُ، وَلْيَتُبْ إِلَى الرَّبِّ فَيَرْحَمَهُ، وَإِلَى إِلهِنَا لأَنَّهُ يُكْثِرُ الْغُفْرَانَ.","8":"«لأَنَّ أَفْكَارِي لَيْسَتْ أَفْكَارَكُمْ، وَلاَ طُرُقُكُمْ طُرُقِي، يَقُولُ الرَّبُّ.","9":"لأَنَّهُ كَمَا عَلَتِ السَّمَاوَاتُ عَنِ الأَرْضِ، هكَذَا عَلَتْ طُرُقِي عَنْ طُرُقِكُمْ وَأَفْكَارِي عَنْ أَفْكَارِكُمْ.","1":"«أَيُّهَا الْعِطَاشُ جَمِيعًا هَلُمُّوا إِلَى الْمِيَاهِ، وَالَّذِي لَيْسَ لَهُ فِضَّةٌ تَعَالَوْا اشْتَرُوا وَكُلُوا. هَلُمُّوا اشْتَرُوا بِلاَ فِضَّةٍ وَبِلاَ ثَمَنٍ خَمْرًا وَلَبَنًا.","2":"لِمَاذَا تَزِنُونَ فِضَّةً لِغَيْرِ خُبْزٍ، وَتَعَبَكُمْ لِغَيْرِ شَبَعٍ؟ اسْتَمِعُوا لِي اسْتِمَاعًا وَكُلُوا الطَّيِّبَ، وَلْتَتَلَذَّذْ بِالدَّسَمِ أَنْفُسُكُمْ.","3":"أَمِيلُوا آذَانَكُمْ وَهَلُمُّوا إِلَيَّ. اسْمَعُوا فَتَحْيَا أَنْفُسُكُمْ. وَأَقْطَعَ لَكُمْ عَهْدًا أَبَدِيًّا، مَرَاحِمَ دَاوُدَ الصَّادِقَةَ."},"50.2":{"13":"وَإِذْ كُنْتُمْ أَمْوَاتًا فِي الْخَطَايَا وَغَلَفِ جَسَدِكُمْ، أَحْيَاكُمْ مَعَهُ، مُسَامِحًا لَكُمْ بِجَمِيعِ الْخَطَايَا،","14":"إِذْ مَحَا الصَّكَّ الَّذِي عَلَيْنَا فِي الْفَرَائِضِ، الَّذِي كَانَ ضِدًّا لَنَا، وَقَدْ رَفَعَهُ مِنَ الْوَسَطِ مُسَمِّرًا إِيَّاهُ بِالصَّلِيبِ،","2":"لِكَيْ تَتَعَزَّى قُلُوبُهُمْ مُقْتَرِنَةً فِي الْمَحَبَّةِ لِكُلِّ غِنَى يَقِينِ الْفَهْمِ، لِمَعْرِفَةِ سِرِّ اللهِ الآبِ وَالْمَسِيحِ،","3":"الْمُذَّخَرِ فِيهِ جَمِيعُ كُنُوزِ الْحِكْمَةِ وَالْعِلْمِ."},"41.23":{"39":"وَكَانَ وَاحِدٌ مِنَ الْمُذْنِبَيْنِ الْمُعَلَّقَيْنِ يُجَدِّفُ عَلَيْهِ قَائِلاً:«إِنْ كُنْتَ أَنْتَ الْمَسِيحَ، فَخَلِّصْ نَفْسَكَ وَإِيَّانَا!»","40":"فَأجَابَ الآخَرُ وَانْتَهَرَهَُ قَائِلاً:«أَوَلاَ أَنْتَ تَخَافُ اللهَ، إِذْ أَنْتَ تَحْتَ هذَا الْحُكْمِ بِعَيْنِهِ؟","41":"أَمَّا نَحْنُ فَبِعَدْل، لأَنَّنَا نَنَالُ اسْتِحْقَاقَ مَا فَعَلْنَا، وَأَمَّا هذَا فَلَمْ يَفْعَلْ شَيْئًا لَيْسَ فِي مَحَلِّهِ».","42":"ثُمَّ قَالَ لِيَسُوعَ:«اذْكُرْنِي يَارَبُّ مَتَى جِئْتَ فِي مَلَكُوتِكَ».","43":"فَقَالَ لَهُ يَسُوعُ:«الْحَقَّ أَقُولُ لَكَ: إِنَّكَ الْيَوْمَ تَكُونُ مَعِي فِي الْفِرْدَوْسِ».","34":"فَقَالَ يَسُوعُ: «يَاأَبَتَاهُ، اغْفِرْ لَهُمْ، لأَنَّهُمْ لاَ يَعْلَمُونَ مَاذَا يَفْعَلُونَ». وَإِذِ اقْتَسَمُوا ثِيَابَهُ اقْتَرَعُوا عَلَيْهَا.","32":"وَجَاءُوا أَيْضًا بِاثْنَيْنِ آخَرَيْنِ مُذْنِبَيْنِ لِيُقْتَلاَ مَعَهُ.","33":"وَلَمَّا مَضَوْا بِهِ إِلَى الْمَوْضِعِ الَّذِي يُدْعَى «جُمْجُمَةَ» صَلَبُوهُ هُنَاكَ مَعَ الْمُذْنِبَيْنِ، وَاحِدًا عَنْ يَمِينِهِ وَالآخَرَ عَنْ يَسَارِهِ."},"41.18":{"9":"وَقَالَ لِقَوْمٍ وَاثِقِينَ بِأَنْفُسِهِمْ أَنَّهُمْ أَبْرَارٌ، وَيَحْتَقِرُونَ الآخَرِينَ هذَا الْمَثَلَ:","10":"«إِنْسَانَانِ صَعِدَا إِلَى الْهَيْكَلِ لِيُصَلِّيَا، وَاحِدٌ فَرِّيسِيٌّ وَالآخَرُ عَشَّارٌ.","11":"أَمَّا الْفَرِّيسِيُّ فَوَقَفَ يُصَلِّي فِي نَفْسِهِ هكَذَا: اَللّهُمَّ أَنَا أَشْكُرُكَ أَنِّي لَسْتُ مِثْلَ بَاقِي النَّاسِ الْخَاطِفِينَ الظَّالِمِينَ الزُّنَاةِ، وَلاَ مِثْلَ هذَا الْعَشَّارِ.","12":"أَصُومُ مَرَّتَيْنِ فِي الأُسْبُوعِ، وَأُعَشِّرُ كُلَّ مَا أَقْتَنِيهِ.","13":"وَأَمَّا الْعَشَّارُ فَوَقَفَ مِنْ بَعِيدٍ، لاَ يَشَاءُ أَنْ يَرْفَعَ عَيْنَيْهِ نَحْوَ السَّمَاءِ، بَلْ قَرَعَ عَلَى صَدْرِهِ قَائِلاً: اللّهُمَّ ارْحَمْنِي، أَنَا الْخَاطِئَ.","14":"أَقُولُ لَكُمْ: إِنَّ هذَا نَزَلَ إِلَى بَيْتِهِ مُبَرَّرًا دُونَ ذَاكَ، لأَنَّ كُلَّ مَنْ يَرْفَعُ نَفْسَهُ يَتَّضِعُ، وَمَنْ يَضَعُ نَفْسَهُ يَرْتَفِعُ»."},"9.12":{"1":"فَأَرْسَلَ الرَّبُّ نَاثَانَ إِلَى دَاوُدَ. فَجَاءَ إِلَيْهِ وَقَالَ لَهُ: «كَانَ رَجُلاَنِ فِي مَدِينَةٍ وَاحِدَةٍ، وَاحِدٌ مِنْهُمَا غَنِيٌّ وَالآخَرُ فَقِيرٌ.","2":"وَكَانَ لِلْغَنِيِّ غَنَمٌ وَبَقَرٌ كَثِيرَةٌ جِدًّا.","3":"وَأَمَّا الْفَقِيرُ فَلَمْ يَكُنْ لَهُ شَيْءٌ إِلاَّ نَعْجَةٌ وَاحِدَةٌ صَغِيرَةٌ قَدِ اقْتَنَاهَا وَرَبَّاهَا وَكَبِرَتْ مَعَهُ وَمَعَ بَنِيهِ جَمِيعًا. تَأْكُلُ مِنْ لُقْمَتِهِ وَتَشْرَبُ مِنْ كَأْسِهِ وَتَنَامُ فِي حِضْنِهِ، وَكَانَتْ لَهُ كَابْنَةٍ.","4":"فَجَاءَ ضَيْفٌ إِلَى الرَّجُلِ الْغَنِيِّ، فَعَفَا أَنْ يَأْخُذَ مِنْ غَنَمِهِ وَمِنْ بَقَرِهِ لِيُهَيِّئَ لِلضَّيْفِ الَّذِي جَاءَ إِلَيْهِ، فَأَخَذَ نَعْجَةَ الرَّجُلِ الْفَقِيرِ وَهَيَّأَ لِلرَّجُلِ الَّذِي جَاءَ إِلَيْهِ».","5":"فَحَمِيَ غَضَبُ دَاوُدَ عَلَى الرَّجُلِ جِدًّا، وَقَالَ لِنَاثَانَ: «حَيٌّ هُوَ الرَّبُّ، إِنَّهُ يُقْتَلُ الرَّجُلُ الْفَاعِلُ ذلِكَ،","6":"وَيَرُدُّ النَّعْجَةَ أَرْبَعَةَ أَضْعَافٍ لأَنَّهُ فَعَلَ هذَا الأَمْرَ وَلأَنَّهُ لَمْ يُشْفِقْ».","7":"فَقَالَ نَاثَانُ لِدَاوُدَ: «أَنْتَ هُوَ الرَّجُلُ! هكَذَا قَالَ الرَّبُّ إِلهُ إِسْرَائِيلَ: أَنَا مَسَحْتُكَ مَلِكًا عَلَى إِسْرَائِيلَ وَأَنْقَذْتُكَ مِنْ يَدِ شَاوُلَ،","8":"وَأَعْطَيْتُكَ بَيْتَ سَيِّدِكَ وَنِسَاءَ سَيِّدِكَ فِي حِضْنِكَ، وَأَعْطَيْتُكَ بَيْتَ إِسْرَائِيلَ وَيَهُوذَا. وَإِنْ كَانَ ذلِكَ قَلِيلاً، كُنْتُ أَزِيدُ لَكَ كَذَا وَكَذَا.","9":"لِمَاذَا احْتَقَرْتَ كَلاَمَ الرَّبِّ لِتَعْمَلَ الشَّرَّ فِي عَيْنَيْهِ؟ قَدْ قَتَلْتَ أُورِيَّا الْحِثِّيَّ بِالسَّيْفِ، وَأَخَذْتَ امْرَأَتَهُ لَكَ امْرَأَةً، وَإِيَّاهُ قَتَلْتَ بِسَيْفِ بَنِي عَمُّونَ.","10":"وَالآنَ لاَ يُفَارِقُ السَّيْفُ بَيْتَكَ إِلَى الأَبَدِ، لأَنَّكَ احْتَقَرْتَنِي وَأَخَذْتَ امْرَأَةَ أُورِيَّا الْحِثِّيِّ لِتَكُونَ لَكَ امْرَأَةً.","11":"هكَذَا قَالَ الرَّبُّ: هأَنَذَا أُقِيمُ عَلَيْكَ الشَّرَّ مِنْ بَيْتِكَ، وَآخُذُ نِسَاءَكَ أَمَامَ عَيْنَيْكَ وَأُعْطِيهِنَّ لِقَرِيبِكَ، فَيَضْطَجعُ مَعَ نِسَائِكَ فِي عَيْنِ هذِهِ الشَّمْسِ.","12":"ل
